<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表</title>

    <!-- 引入 markdown-it 和 DOMPurify（用于详情预览） -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 28px 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2632;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 i {
            color: #e74c3c;
        }

        .btn-primary {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary:hover {
            background: #c0392b;
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-outline {
            background: transparent;
            color: #2c3e50;
            border: 1px solid #dce3ea;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-outline:hover {
            background: #f0f2f5;
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #2c3e50;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #e2e6ea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8a9aa8;
        }

        .empty-state i {
            font-size: 48px;
            color: #dce3ea;
            margin-bottom: 16px;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .article-item {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid #e9ecef;
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .article-item:hover {
            border-color: #e74c3c;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.06);
        }

        .article-info {
            flex: 1;
            min-width: 180px;
            cursor: pointer;
        }

        .article-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a2632;
            margin-bottom: 4px;
        }

        .article-title:hover {
            color: #e74c3c;
        }

        .article-meta {
            font-size: 13px;
            color: #8a9aa8;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .article-meta i {
            margin-right: 4px;
        }

        .article-excerpt {
            font-size: 14px;
            color: #5a6a7a;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ===== 详情模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            max-width: 720px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 28px 32px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a2632;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8a9aa8;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #e74c3c;
        }

        .detail-content {
            padding: 4px 0;
            font-size: 15px;
            line-height: 1.8;
            color: #1a2632;
        }

        .detail-content .benben-text p {
            margin-bottom: 12px;
        }

        .detail-content code {
            background: #f0f2f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
        }

        .detail-content pre {
            background: #f0f2f5;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #e9ecef;
            padding-top: 16px;
            margin-top: 12px;
        }

        /* 加载状态 */
        .loading-spinner {
            text-align: center;
            padding: 40px 20px;
            color: #8a9aa8;
        }

        .loading-spinner i {
            font-size: 32px;
            margin-bottom: 12px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .article-item {
                flex-direction: column;
                align-items: stretch;
            }

            .article-actions {
                justify-content: flex-end;
            }

            .modal {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-blog"></i> 我的文章</h1>
            <a href="_new.html" class="btn-primary"><i class="fas fa-plus"></i> 新建文章</a>
        </div>

        <!-- 文章列表容器 -->
        <div id="articleListContainer">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>加载中…</p>
            </div>
        </div>
    </div>

    <!-- ===== 详情模态框 ===== -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="detailTitle">文章详情</h2>
                <button class="modal-close" id="closeDetailBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-content" id="detailContent">
                    <p style="color:#8a9aa8;">加载中……</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="closeDetailFooterBtn">关闭</button>
                <a href="#" class="btn-primary" id="detailEditBtn" style="text-decoration:none;"><i
                        class="fas fa-edit"></i> 编辑</a>
                <button class="btn-danger" id="detailDeleteBtn"><i class="fas fa-trash"></i> 删除</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // ================================================================
            // 1. Supabase 配置（与之前文章页面保持一致）
            // ================================================================
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            // ================================================================
            // 2. 数据操作（真实 Supabase）
            // ================================================================

            /**
             * 获取所有文章（按创建时间倒序），并关联作者信息
             */
            async function fetchArticles() {
                // 先查文章
                const { data: articles, error } = await supabase
                    .from('articles')
                    .select('short_id, title, content, author_id, created_at, updated_at')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                if (!articles || articles.length === 0) return [];

                // 收集所有 author_id，批量查询 profiles
                const authorIds = [...new Set(articles.map(a => a.author_id).filter(Boolean))];
                let profilesMap = {};
                if (authorIds.length > 0) {
                    const { data: profiles, error: profileError } = await supabase
                        .from('profiles')
                        .select('id, username, user_number')
                        .in('id', authorIds);
                    if (!profileError && profiles) {
                        profiles.forEach(p => { profilesMap[p.id] = p; });
                    }
                }

                // 组装数据，统一使用 id 作为唯一标识（short_id 作为 URL 友好 ID）
                return articles.map(article => ({
                    id: article.short_id,          // 用于列表和详情标识
                    short_id: article.short_id,
                    title: article.title,
                    content: article.content || '',
                    author_id: article.author_id,
                    author_name: profilesMap[article.author_id]?.username || '匿名',
                    created_at: article.created_at,
                    updated_at: article.updated_at,
                }));
            }

            /**
             * 根据 short_id 获取单篇文章
             */
            async function fetchArticleById(shortId) {
                const { data, error } = await supabase
                    .from('articles')
                    .select('short_id, title, content, author_id, created_at, updated_at')
                    .eq('short_id', shortId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) return null;

                // 获取作者信息
                let authorName = '匿名';
                if (data.author_id) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('username')
                        .eq('id', data.author_id)
                        .maybeSingle();
                    if (profile) authorName = profile.username;
                }

                return {
                    id: data.short_id,
                    short_id: data.short_id,
                    title: data.title,
                    content: data.content || '',
                    author_id: data.author_id,
                    author_name: authorName,
                    created_at: data.created_at,
                    updated_at: data.updated_at,
                };
            }

            /**
             * 删除文章
             */
            async function deleteArticle(shortId) {
                const { error } = await supabase
                    .from('articles')
                    .delete()
                    .eq('short_id', shortId);

                if (error) throw error;
                return true;
            }

            // ================================================================
            // 3. Markdown 渲染工具
            // ================================================================
            let md = null;

            function getMarkdownRenderer() {
                if (!md && typeof markdownit !== 'undefined') {
                    md = markdownit({ html: true, linkify: true, typographer: true, breaks: true });
                }
                return md;
            }

            function renderMarkdown(text) {
                if (!text) return '';
                const renderer = getMarkdownRenderer();
                if (!renderer) return text;
                const raw = renderer.render(text);
                if (typeof DOMPurify !== 'undefined') {
                    return DOMPurify.sanitize(raw);
                }
                return raw;
            }

            function getExcerpt(text, len = 80) {
                if (!text) return '';
                let plain = text.replace(/[#*`~_\[\]()>!]/g, '').replace(/\s+/g, ' ').trim();
                if (plain.length <= len) return plain;
                return plain.slice(0, len) + '…';
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatTime(ts) {
                if (!ts) return '未知时间';
                const d = new Date(ts);
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            // ================================================================
            // 4. 渲染列表
            // ================================================================
            async function renderList() {
                const container = document.getElementById('articleListContainer');

                try {
                    const articles = await fetchArticles();

                    if (articles.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="far fa-file-alt"></i>
                                <p>还没有文章，点击 “新建文章” 开始创作吧！</p>
                            </div>
                        `;
                        return;
                    }

                    let html = '<div class="article-list">';
                    articles.forEach(article => {
                        const date = formatTime(article.created_at);
                        const excerpt = getExcerpt(article.content);
                        const author = article.author_name || '匿名';
                        html += `
                            <div class="article-item" data-id="${article.id}">
                                <div class="article-info" data-id="${article.id}">
                                    <div class="article-title">${escapeHtml(article.title)}</div>
                                    <div class="article-meta">
                                        <span><i class="fas fa-user"></i> ${escapeHtml(author)}</span>
                                        <span><i class="far fa-calendar-alt"></i> ${date}</span>
                                        <span><i class="far fa-file-word"></i> ${article.content ? article.content.length : 0} 字符</span>
                                    </div>
                                    <div class="article-excerpt">${escapeHtml(excerpt)}</div>
                                </div>
                                <div class="article-actions">
                                    <button class="btn-outline view-detail-btn" data-id="${article.id}"><i class="fas fa-eye"></i> 查看</button>
                                    <button class="btn-danger delete-btn" data-id="${article.id}"><i class="fas fa-trash"></i> 删除</button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;

                    // 绑定事件
                    container.querySelectorAll('.view-detail-btn').forEach(btn => {
                        btn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            const id = this.dataset.id;
                            showDetail(id);
                        });
                    });

                    container.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            const id = this.dataset.id;
                            if (confirm('确定要删除这篇文章吗？')) {
                                handleDelete(id);
                            }
                        });
                    });

                    container.querySelectorAll('.article-info').forEach(el => {
                        el.addEventListener('click', function () {
                            const id = this.dataset.id;
                            showDetail(id);
                        });
                    });

                } catch (err) {
                    console.error('加载文章列表失败:', err);
                    container.innerHTML = `
                        <div class="empty-state" style="color:#e74c3c;">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>加载失败：${escapeHtml(err.message)}</p>
                            <button class="btn-secondary" onclick="location.reload()" style="margin-top:12px;">重试</button>
                        </div>
                    `;
                }
            }

            // ================================================================
            // 5. 删除处理（带自动关闭详情）
            // ================================================================
            async function handleDelete(shortId) {
                try {
                    await deleteArticle(shortId);
                    // 刷新列表
                    await renderList();
                    // 如果详情模态框打开且显示的是被删除的文章，则关闭
                    const modal = document.getElementById('detailModal');
                    if (modal.classList.contains('active')) {
                        const currentId = modal.dataset.currentId;
                        if (currentId === shortId) {
                            closeDetail();
                        }
                    }
                } catch (err) {
                    console.error('删除失败:', err);
                    alert('删除失败：' + err.message);
                }
            }

            // ================================================================
            // 6. 详情模态框
            // ================================================================
            let currentDetailId = null;

            async function showDetail(shortId) {
                const modal = document.getElementById('detailModal');
                const content = document.getElementById('detailContent');
                const titleEl = document.getElementById('detailTitle');
                const editBtn = document.getElementById('detailEditBtn');
                const deleteBtn = document.getElementById('detailDeleteBtn');

                // 显示加载状态
                content.innerHTML = '<p style="color:#8a9aa8;">加载中…</p>';
                modal.dataset.currentId = shortId;
                modal.classList.add('active');
                currentDetailId = shortId;

                try {
                    const article = await fetchArticleById(shortId);
                    if (!article) {
                        content.innerHTML = '<p style="color:#e74c3c;">文章不存在</p>';
                        titleEl.textContent = '文章不存在';
                        editBtn.href = '#';
                        deleteBtn.onclick = null;
                        return;
                    }

                    titleEl.textContent = article.title;
                    const html = renderMarkdown(article.content);
                    content.innerHTML = `<div class="benben-text">${html}</div>`;

                    // 编辑链接
                    editBtn.href = `_new.html?edit=${article.short_id}`;

                    // 删除按钮
                    deleteBtn.onclick = function () {
                        if (confirm('确定要删除这篇文章吗？')) {
                            handleDelete(article.short_id);
                        }
                    };

                } catch (err) {
                    console.error('加载详情失败:', err);
                    content.innerHTML = `<p style="color:#e74c3c;">加载失败：${escapeHtml(err.message)}</p>`;
                }
            }

            function closeDetail() {
                document.getElementById('detailModal').classList.remove('active');
                currentDetailId = null;
            }

            // ================================================================
            // 7. 初始化
            // ================================================================
            document.addEventListener('DOMContentLoaded', function () {
                // 加载文章列表
                renderList();

                // 关闭模态框
                document.getElementById('closeDetailBtn').addEventListener('click', closeDetail);
                document.getElementById('closeDetailFooterBtn').addEventListener('click', closeDetail);
                document.getElementById('detailModal').addEventListener('click', function (e) {
                    if (e.target === this) closeDetail();
                });

                // ESC 关闭
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        if (document.getElementById('detailModal').classList.contains('active')) {
                            closeDetail();
                        }
                    }
                });

                // 如果 URL 中有 ?detail=id，自动打开详情
                const params = new URLSearchParams(window.location.search);
                const detailId = params.get('detail');
                if (detailId) {
                    showDetail(detailId);
                    window.history.replaceState({}, '', window.location.pathname);
                }
            });

        })();
    </script>

</body>

</html>
