    <style>

        /* ========== 主布局 ========== */

        /* ========== 面包屑导航 ========== */

        /* ========== 工单头部 ========== */

        /* ========== 管理操作面板 ========== */
        .admin-panel {
            background: #fff9e6;
            border: 1px solid #ffd54f;

        /* ========== 历史记录 ========== */

    <script>
        (function () {
            // ================================================================
            // 1. Supabase 初始化
            // ================================================================
            const supabase = window.supabase.createClient(
                'https://nosikdfacxkuaxfrmoqn.supabase.co',
                'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
            );

            // ================================================================
            // 2. 状态与 DOM 引用
            // ================================================================
            let ticketId = null;
            let ticketData = null;
            let currentUser = null;
            let userCache = {};

            const authButtons = document.getElementById('authButtons');
            const adminPanel = document.getElementById('adminPanel');
            const statusSelect = document.getElementById('statusSelect');
            const prioritySelect = document.getElementById('prioritySelect');
            const assigneeSelect = document.getElementById('assigneeSelect');
            const saveAdminBtn = document.getElementById('saveAdminBtn');
            const internalReplyBtn = document.getElementById('internalReplyBtn');
            const replyContent = document.getElementById('replyContent');
            const submitReplyBtn = document.getElementById('submitReplyBtn');
            const previewBtn = document.getElementById('previewBtn');

            // ================================================================
            // 3. 工具函数
            // ================================================================
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function escapeHtmlAttr(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function letterAvatar(name) {
                const ch = (name || 'U').trim().charAt(0).toUpperCase() || 'U';
                return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 fill=%22%23e74c3c%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2216%22%3E' +
                    ch + '%3C/text%3E%3C/svg%3E';
            }

            function formatTime(iso) {
                if (!iso) return '未知时间';
                try {
                    const d = new Date(iso);
                    const pad = n => String(n).padStart(2, '0');
                    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
                        pad(d.getHours()) + ':' + pad(d.getMinutes());
                } catch {
                    return '未知时间';
                }
            }

            function formatRelativeTime(iso) {
                if (!iso) return '未知时间';
                try {
                    const d = new Date(iso);
                    const now = new Date();
                    const diff = Math.floor((now - d) / 1000);

                    if (diff < 60) return '刚刚';
                    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
                    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
                    if (diff < 604800) return Math.floor(diff / 86400) + '天前';
                    return formatTime(iso);
                } catch {
                    return '未知时间';
                }
            }

            // ================================================================
            // 4. 获取工单ID
            // ================================================================
            function getTicketId() {
                const pathParts = window.location.pathname.split('/');
                return pathParts[pathParts.length - 1];
            }

            // ================================================================
            // 5. 状态和类别显示
            // ================================================================
            function getStatusInfo(status) {
                const map = {
                    'pending': { label: '待处理', class: 'status-pending' },
                    'replied': { label: '已回复', class: 'status-replied' },
                    'processing': { label: '处理中', class: 'status-processing' },
                    'suspended': { label: '已挂起', class: 'status-suspended' },
                    'completed': { label: '已完成', class: 'status-completed' },
                    'closed': { label: '已关闭', class: 'status-closed' }
                };
                return map[status] || { label: status, class: 'status-badge' };
            }

            function getCategoryInfo(category) {
                const map = {
                    'general': '综合问题',
                    'problem': '题目工单',
                    'contest': '比赛工单',
                    'appeal': '账号申诉'
                };
                return map[category] || category;
            }

            function getPriorityInfo(priority) {
                const map = {
                    'low': '低优先级',
                    'normal': '中优先级',
                    'high': '高优先级',
                    'urgent': '紧急'
                };
                return map[priority] || '中优先级';
            }

            // ================================================================
            // 6. 简单的 Markdown 渲染
            // ================================================================
            function renderMarkdown(text) {
                if (!text) return '';
                // 简单的HTML转义
                let html = escapeHtml(text);
                // 处理换行
                html = html.replace(/\n/g, '<br>');
                return html;
            }

            // ================================================================
            // 7. 获取用户信息
            // ================================================================
            async function fetchUsers(userIds) {
                if (!userIds || userIds.length === 0) return {};
                const unique = [...new Set(userIds.filter(Boolean))];
                const result = {};
                const needFetch = [];

                unique.forEach(id => {
                    if (userCache[id]) {
                        result[id] = userCache[id];
                    } else {
                        needFetch.push(id);
                    }
                });

                if (needFetch.length === 0) return result;

                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('id, username, avatar_url, user_tag, is_admin, is_banned, user_number, username_color, can_manage_tickets')
                        .in('id', needFetch);

                    if (error) throw error;

                    if (data) {
                        data.forEach(u => {
                            userCache[u.id] = u;
                            result[u.id] = u;
                        });
                    }
                    return result;

                } catch (err) {
                    console.error('获取用户信息异常:', err);
                    return result;
                }
            }

            // ================================================================
            // 8. 加载工单详情
            // ================================================================
            async function loadTicket() {
                ticketId = getTicketId();
                if (!ticketId) {
                    alert('工单ID无效');
                    location.href = '/tickets';
                    return;
                }

                try {
                    const { data, error } = await supabase
                        .from('tickets')
                        .select('*')
                        .eq('id', ticketId)
                        .single();

                    if (error) throw error;

                    if (!data) {
                        alert('工单不存在');
                        location.href = '/tickets';
                        return;
                    }

                    ticketData = data;

                    // 获取作者信息
                    const userMap = await fetchUsers([data.author_id, data.assignee_id]);
                    const author = userMap[data.author_id] || {};
                    const assignee = data.assignee_id ? userMap[data.assignee_id] : null;

                    // 更新面包屑
                    document.getElementById('ticketBreadcrumb').textContent = data.title.substring(0, 30);

                    // 更新状态和类别
                    const statusInfo = getStatusInfo(data.status);
                    const category = getCategoryInfo(data.category);
                    const priority = getPriorityInfo(data.priority);

                    let metaHtml = `
                        <span class="ticket-badge status-badge ${statusInfo.class}">${statusInfo.label}</span>
                        <span class="ticket-badge category-badge">${category}</span>
                        <span class="ticket-badge priority-badge">${priority}</span>
                    `;
                    document.getElementById('ticketMeta').innerHTML = metaHtml;

                    // 更新标题
                    document.getElementById('ticketTitle').textContent = data.title;

                    // 更新作者信息
                    const avatar = author.avatar_url || letterAvatar(author.username);
                    const userLink = author.user_number ? `/user/${author.user_number}` : '#';
                    let infoHtml = `
                        <div class="ticket-author">
                            <img src="${avatar}" alt="${escapeHtmlAttr(author.username)}"
                                onerror="this.onerror=null;this.src='${letterAvatar(author.username)}'">
                            <span>由 <a href="${userLink}">${escapeHtml(author.username || '未知用户')}</a> 创建</span>
                        </div>
                        <span>📅 ${formatTime(data.created_at)}</span>
                    `;

                    if (data.updated_at !== data.created_at) {
                        infoHtml += `<span>🔄 最后更新：${formatTime(data.updated_at)}</span>`;
                    }

                    if (assignee) {
                        infoHtml += `<span>👤 分配给：${escapeHtml(assignee.username)}</span>`;
                    }

                    if (data.reply_count > 0) {
                        infoHtml += `<span>💬 ${data.reply_count} 条回复</span>`;
                    }

                    document.getElementById('ticketInfo').innerHTML = infoHtml;

                    // 更新内容
                    document.getElementById('ticketContent').innerHTML = renderMarkdown(data.content);

                    // 更新管理面板
                    if (currentUser && (currentUser.is_admin === true || currentUser.can_manage_tickets === true)) {
                        adminPanel.style.display = 'block';
                        statusSelect.value = data.status;
                        prioritySelect.value = data.priority;

                        // 加载管理员列表
                        loadAdminList(data.assignee_id);
                    }

                } catch (err) {
                    console.error('加载工单失败:', err);
                    alert('加载工单失败：' + err.message);
                    location.href = '/tickets';
                }
            }

            // ================================================================
            // 9. 加载管理员列表
            // ================================================================
            async function loadAdminList(currentAssignee) {
                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('id, username, is_admin, can_manage_tickets')
                        .or('is_admin.eq.true,can_manage_tickets.eq.true');

                    if (error) throw error;

                    let html = '<option value="">未分配</option>';
                    if (data) {
                        data.forEach(user => {
                            const selected = user.id === currentAssignee ? ' selected' : '';
                            html += `<option value="${user.id}"${selected}>${escapeHtml(user.username)}</option>`;
                        });
                    }

                    assigneeSelect.innerHTML = html;

                } catch (err) {
                    console.error('加载管理员列表失败:', err);
                }
            }

            // ================================================================
            // 10. 加载回复列表
            // ================================================================
            async function loadReplies() {
                try {
                    const { data, error } = await supabase
                        .from('ticket_replies')
                        .select('*')
                        .eq('ticket_id', ticketId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;

                    if (!data || data.length === 0) {
                        document.getElementById('replyList').innerHTML = `
                            <div class="empty-state">
                                <div class="icon">💬</div>
                                <p>暂无回复</p>
                            </div>
                        `;
                        return;
                    }

                    // 获取用户信息
                    const userIds = data.map(r => r.author_id);
                    const userMap = await fetchUsers(userIds);

                    let html = '';
                    data.forEach(reply => {
                        const author = userMap[reply.author_id] || {};
                        const avatar = author.avatar_url || letterAvatar(author.username);
                        const userLink = author.user_number ? `/user/${author.user_number}` : '#';

                        // 检查是否为管理员回复
                        const isAdmin = author.is_admin === true || author.can_manage_tickets === true;
                        const adminBadge = isAdmin ? '<span class="admin-badge">管理员</span>' : '';

                        html += `
                            <div class="reply-item">
                                <div class="reply-meta">
                                    <div class="reply-author">
                                        <img src="${avatar}" alt="${escapeHtmlAttr(author.username)}"
                                            onerror="this.onerror=null;this.src='${letterAvatar(author.username)}'">
                                        <div class="reply-author-name">
                                            <a href="${userLink}">${escapeHtml(author.username || '未知用户')}</a>
                                            ${adminBadge}
                                        </div>
                                    </div>
                                    <div class="reply-time">${formatTime(reply.created_at)}</div>
                                </div>
                                <div class="reply-content">${renderMarkdown(reply.content)}</div>
                            </div>
                        `;
                    });

                    document.getElementById('replyList').innerHTML = html;

                } catch (err) {
                    console.error('加载回复失败:', err);
                }
            }

            // ================================================================
            // 11. 加载历史记录
            // ================================================================
            async function loadHistory() {
                try {
                    const { data, error } = await supabase
                        .from('ticket_history')
                        .select('*')
                        .eq('ticket_id', ticketId)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    if (!data || data.length === 0) {
                        document.getElementById('historyList').innerHTML = `
                            <div class="empty-state">
                                <div class="icon">📜</div>
                                <p>暂无历史记录</p>
                            </div>
                        `;
                        return;
                    }

                    // 获取用户信息
                    const userIds = data.map(h => h.changed_by);
                    const userMap = await fetchUsers(userIds);

                    const fieldNames = {
                        'status': '状态',
                        'assignee': '分配给',
                        'priority': '优先级'
                    };

                    let html = '';
                    data.forEach(record => {
                        const user = userMap[record.changed_by] || {};
                        const fieldName = fieldNames[record.field_name] || record.field_name;
                        const oldValue = record.old_value || '无';
                        const newValue = record.new_value;

                        html += `
                            <div class="history-item">
                                <div class="history-time">${formatTime(record.created_at)}</div>
                                <div class="history-content">
                                    ${escapeHtml(user.username || '系统')} 将 <span class="history-field">${fieldName}</span> 从 <strong>${escapeHtml(oldValue)}</strong> 更改为 <strong>${escapeHtml(newValue)}</strong>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('historyList').innerHTML = html;

                } catch (err) {
                    console.error('加载历史记录失败:', err);
                }
            }

            // ================================================================
            // 12. 提交回复
            // ================================================================
            async function submitReply(isInternal = false) {
                if (!currentUser) {
                    alert('请先登录');
                    location.href = '/auth/login?redirect=' + encodeURIComponent(window.location.pathname);
                    return;
                }

                const content = replyContent.value.trim();
                if (!content) {
                    alert('请输入回复内容');
                    return;
                }

                submitReplyBtn.disabled = true;

                try {
                    const { error } = await supabase
                        .from('ticket_replies')
                        .insert({
                            ticket_id: ticketId,
                            author_id: currentUser.id,
                            content: content,
                            is_internal: isInternal
                        });

                    if (error) throw error;

                    replyContent.value = '';
                    alert('回复成功！');

                    // 重新加载回复列表
                    await loadReplies();

                    // 如果是用户回复，更新工单状态为已回复
                    if (!isInternal && currentUser.id !== ticketData.author_id) {
                        await supabase
                            .from('tickets')
                            .update({ status: 'replied' })
                            .eq('id', ticketId);
                        await loadTicket();
                    }

                } catch (err) {
                    console.error('提交回复失败:', err);
                    alert('提交回复失败：' + err.message);
                } finally {
                    submitReplyBtn.disabled = false;
                }
            }

            // ================================================================
            // 13. 保存管理更改
            // ================================================================
            async function saveAdminChanges() {
                if (!currentUser) return;

                const newStatus = statusSelect.value;
                const newPriority = prioritySelect.value;
                const newAssignee = assigneeSelect.value || null;

                saveAdminBtn.disabled = true;

                try {
                    const { error } = await supabase
                        .from('tickets')
                        .update({
                            status: newStatus,
                            priority: newPriority,
                            assignee_id: newAssignee
                        })
                        .eq('id', ticketId);

                    if (error) throw error;

                    alert('保存成功！');
                    await loadTicket();
                    await loadHistory();

                } catch (err) {
                    console.error('保存失败:', err);
                    alert('保存失败：' + err.message);
                } finally {
                    saveAdminBtn.disabled = false;
                }
            }

            // ================================================================
            // 14. 用户认证 UI
            // ================================================================
            async function updateAuthUI() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();

                    if (session?.user) {
                        const { data: profile } = await supabase
                            .from('profiles')
                            .select('username, avatar_url, is_admin, user_number, can_manage_users, can_manage_tickets')
                            .eq('id', session.user.id)
                            .maybeSingle();

                        const displayName = profile?.username || session.user.email || '用户';
                        const userNumber = profile?.user_number || '';

                        let html = `<a href="/user/${userNumber}" class="user-email">${escapeHtml(displayName)}</a>`;
                        html += `<a href="/user/notification" class="bell-icon"><svg viewBox="0 0 448 512" width="20" height="20"><path fill="currentColor" d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56,200l0,14.5c0,37.7-10,74.7-29,107.3L5.1,359.2C1.8,365 0,371.5 0,378.2c0,20.9 16.9,37.8 37.8,37.8l372.4,0c20.9,0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421,321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4,368l-336.9,0 12.9-22.1C91.7,306 104,260.6 104,214.5l0-14.5c0-66.3 53.7-120 120-120s120,53.7 120,120l0,14.5c0,46.2 12.3,91.5 35.5,131.4L392.4,368zM156.1,464c9.9,28 36.6,48 67.9,48s58-20 67.9-48l-135.8,0z"></path></svg><sup id="bell-badge" style="background-color:#e74c3c; display:none;">0</sup></a>`;

                        if (profile?.is_admin === true) {
                            html += `<a href="/admin/user" title="进入管理后台" style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;color:#666;text-decoration:none;font-size:18px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.color='#e74c3c'" onmouseout="this.style.color='#666'">⚙️</a>`;
                        }

                        html += `<button id="logoutBtn" class="auth-btn logout">登出</button>`;
                        authButtons.innerHTML = html;

                        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                            await supabase.auth.signOut();
                            location.reload();
                        });

                        // 保存当前用户信息
                        currentUser = profile;
                        currentUser.id = session.user.id;

                    } else {
                        authButtons.innerHTML = `<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>`;
                    }
                } catch (err) {
                    console.error('认证失败:', err);
                    authButtons.innerHTML = `<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>`;
                }
            }

            // ================================================================
            // 15. 事件绑定
            // ================================================================
            submitReplyBtn.addEventListener('click', () => submitReply(false));
            internalReplyBtn?.addEventListener('click', () => submitReply(true));
            saveAdminBtn?.addEventListener('click', saveAdminChanges);
            previewBtn?.addEventListener('click', () => {
                alert('预览功能（Markdown渲染）待实现');
            });

            // ================================================================
            // 16. 初始化
            // ================================================================
            document.addEventListener('DOMContentLoaded', async () => {
                await updateAuthUI();
                await loadTicket();
                await loadReplies();
                await loadHistory();
            });
        })();
    </script>
</body>

</html>
