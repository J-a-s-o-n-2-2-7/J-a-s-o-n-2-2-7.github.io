<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-card {
            background: white;
            width: 480px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input,
        .verification-row input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .input-group input:focus,
        .verification-row input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
            background: white;
        }

        .verification-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .verification-row button {
            width: auto;
            padding: 12px 16px;
            background: #e74c3c;
            font-size: 14px;
            white-space: nowrap;
            border: none;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        .verification-row button:hover {
            background: #c0392b;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #e74c3c;
            text-decoration: none;
        }

        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .captcha-row input {
            flex: 1;
        }

        .captcha-row canvas {
            cursor: pointer;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            width: 120px;
            height: 44px;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .turnstile-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h1>✨ Jason227</h1>
        <div class="sub">注册账号</div>

        <div class="tabs">
            <div class="tab active" data-type="email">邮箱</div>
            <div class="tab" data-type="phone">手机号</div>
        </div>

        <div class="input-group">
            <input type="text" id="regUsername" placeholder="用户名 (6至16位，建议大小写字母、数字)" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="regPassword" placeholder="密码" autocomplete="new-password">
        </div>
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="off">
        </div>

        <div id="emailPanel" class="form-panel active">
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="邮箱" autocomplete="email">
            </div>
        </div>

        <div id="phonePanel" class="form-panel">
            <div class="input-group">
                <input type="tel" id="regPhone" placeholder="手机号" autocomplete="tel">
            </div>
        </div>

        <div class="input-group">
            <div class="captcha-row">
                <input type="text" id="captchaInput" placeholder="请输入图形验证码" autocomplete="off" maxlength="6">
                <canvas id="captchaCanvas" width="120" height="44"></canvas>
            </div>
        </div>

        <div id="turnstileContainer" class="turnstile-wrapper" style="display: none;">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADcNcP2JrYuEkEhx"></div>
        </div>

        <div id="emailVerification" class="verification-row">
            <input type="text" id="emailCode" placeholder="6位数字验证码" autocomplete="off" maxlength="6">
            <button type="button" id="sendEmailCodeBtn">发送验证码</button>
        </div>

        <button id="registerBtn">注册</button>
        <div id="regMsg" class="message"></div>
        <div class="footer-links">
            <a href="/auth/login">已有账号？</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const EDGE_SEND_CODE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/send-email-code';
        const EDGE_VERIFY_CODE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-email-code';
        const EDGE_VERIFY_TURNSTILE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-phone-turnstile';

        // 已登录自动跳转首页
        (async function redirectIfLoggedIn() {
            try {
                const { data: { session } } = await sb.auth.getSession();
                if (session) window.location.href = '/';
            } catch (err) { console.error(err); }
        })();

        // 图形验证码
        let currentCaptcha = '';
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) captcha += chars[Math.floor(Math.random() * chars.length)];
            currentCaptcha = captcha.toUpperCase();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(100,100,100,${0.2 + Math.random() * 0.5})`;
                ctx.stroke();
            }
            for (let i = 0; i < 100; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }
            for (let i = 0; i < currentCaptcha.length; i++) {
                ctx.font = `${24 + Math.floor(Math.random() * 6)}px "Courier New", monospace`;
                ctx.fillStyle = `rgb(${50 + Math.random() * 100}, ${30 + Math.random() * 80}, ${20 + Math.random() * 70})`;
                const x = 12 + i * 20 + Math.random() * 6;
                const y = 30 + Math.random() * 8;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(currentCaptcha[i], 0, 0);
                ctx.restore();
            }
        }

        canvas.addEventListener('click', () => {
            generateCaptcha();
            document.getElementById('captchaInput').value = '';
        });
        generateCaptcha();

        // 选项卡切换
        const emailPanel = document.getElementById('emailPanel');
        const phonePanel = document.getElementById('phonePanel');
        const emailVerification = document.getElementById('emailVerification');
        const turnstileContainer = document.getElementById('turnstileContainer');
        const tabs = document.querySelectorAll('.tab');

        let activeTab = 'email';
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const type = tab.getAttribute('data-type');
                if (type === activeTab) return;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (type === 'email') {
                    emailPanel.classList.add('active');
                    phonePanel.classList.remove('active');
                    emailVerification.style.display = 'flex';
                    turnstileContainer.style.display = 'none';
                    activeTab = 'email';
                } else {
                    phonePanel.classList.add('active');
                    emailPanel.classList.remove('active');
                    emailVerification.style.display = 'none';
                    turnstileContainer.style.display = 'flex';
                    activeTab = 'phone';
                }
                document.getElementById('regMsg').innerHTML = '';
            });
        });

        // 邮箱发送验证码（无网络错误提示）
        let emailTimer = null;
        let emailCountdown = 0;
        const sendEmailBtn = document.getElementById('sendEmailCodeBtn');

        async function sendEmailCode() {
            const email = document.getElementById('regEmail').value.trim();
            const userCaptcha = document.getElementById('captchaInput').value.trim();

            if (!email || !userCaptcha) {
                showMessage('请填写完整所有内容', 'error');
                return;
            }
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                showMessage('邮箱地址不合法', 'error');
                return;
            }
            if (userCaptcha.toUpperCase() !== currentCaptcha) {
                showMessage('图形验证码错误', 'error');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            sendEmailBtn.disabled = true;
            sendEmailBtn.textContent = '发送中...';
            try {
                const response = await fetch(EDGE_SEND_CODE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (response.ok) {
                    startEmailCountdown(60);
                } else {
                    sendEmailBtn.disabled = false;
                    sendEmailBtn.textContent = '发送验证码';
                    const result = await response.json();
                    showMessage(result.error || '发送失败', 'error');
                }
            } catch (err) {
                // 网络错误静默处理，不显示消息
                console.error('发送验证码网络错误:', err);
                sendEmailBtn.disabled = false;
                sendEmailBtn.textContent = '发送验证码';
            }
        }

        function startEmailCountdown(seconds) {
            emailCountdown = seconds;
            sendEmailBtn.disabled = true;
            if (emailTimer) clearInterval(emailTimer);
            emailTimer = setInterval(() => {
                if (emailCountdown <= 0) {
                    clearInterval(emailTimer);
                    sendEmailBtn.disabled = false;
                    sendEmailBtn.textContent = '发送验证码';
                } else {
                    sendEmailBtn.textContent = `${emailCountdown}s 后重试`;
                    emailCountdown--;
                }
            }, 1000);
        }

        sendEmailBtn.addEventListener('click', sendEmailCode);

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('regMsg');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { if (msgDiv) msgDiv.innerHTML = ''; }, 4000);
        }

        function isValidUsername(username) {
            return /^[a-zA-Z_][a-zA-Z0-9_]{3,19}$/.test(username);
        }

        async function isUsernameUnique(username) {
            const { data, error } = await sb
                .from('profiles')
                .select('username')
                .eq('username', username)
                .maybeSingle();
            return !data;
        }

        const registerBtn = document.getElementById('registerBtn');

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const userCaptcha = document.getElementById('captchaInput').value.trim();
            const type = document.querySelector('.tab.active').getAttribute('data-type');

            // 统一缺失检查
            if (!username || !password || !confirmPwd || !userCaptcha) {
                showMessage('请填写完整所有内容', 'error');
                return;
            }
            if (type === 'email') {
                const email = document.getElementById('regEmail').value.trim();
                const code = document.getElementById('emailCode').value.trim();
                if (!email || !code) {
                    showMessage('请填写完整所有内容', 'error');
                    return;
                }
            } else {
                const phone = document.getElementById('regPhone').value.trim();
                const turnstileToken = document.querySelector('#turnstileContainer .cf-turnstile [name="cf-turnstile-response"]')?.value;
                if (!phone || !turnstileToken) {
                    showMessage('请填写完整所有内容', 'error');
                    return;
                }
            }

            // 格式及业务校验
            if (password !== confirmPwd) {
                showMessage('两次输入的密码不匹配', 'error');
                return;
            }
            if (!isValidUsername(username)) {
                showMessage('用户名长度应在 4 到 20 字节之间 用户名不能为纯数字、或以数字开头', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('密码长度过短或过长', 'error');
                return;
            }
            if (userCaptcha.toUpperCase() !== currentCaptcha) {
                showMessage('图形验证码错误', 'error');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            let email, phone;

            if (type === 'email') {
                email = document.getElementById('regEmail').value.trim();
                const code = document.getElementById('emailCode').value.trim();
                if (!/^\S+@\S+\.\S+$/.test(email)) {
                    showMessage('邮箱地址不合法', 'error');
                    return;
                }
                // 验证邮箱验证码
                const verifyResp = await fetch(EDGE_VERIFY_CODE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const verifyResult = await verifyResp.json();
                if (!verifyResp.ok) {
                    showMessage(`验证码错误: ${verifyResult.error}`, 'error');
                    return;
                }
            } else {
                phone = document.getElementById('regPhone').value.trim();
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    showMessage('手机号格式不合法', 'error');
                    return;
                }
                const turnstileToken = document.querySelector('#turnstileContainer .cf-turnstile [name="cf-turnstile-response"]')?.value;
                const turnstileResp = await fetch(EDGE_VERIFY_TURNSTILE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: turnstileToken })
                });
                if (!turnstileResp.ok) {
                    const err = await turnstileResp.json();
                    showMessage(err.error || '安全验证失败', 'error');
                    return;
                }
                email = `phone+${phone}@temp.com`;
            }

            const unique = await isUsernameUnique(username);
            if (!unique) {
                showMessage('该用户名已被使用', 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = '注册中...';

            const { data: authData, error: signUpError } = await sb.auth.signUp({
                email,
                password,
                options: {}
            });

            if (signUpError) {
                showMessage(signUpError.message, 'error');
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
                return;
            }

            const userId = authData.user?.id;
            if (!userId) {
                showMessage('注册失败', 'error');
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
                return;
            }

            const profileData = { id: userId, username, email };
            if (phone) profileData.phone = phone;

            const { error: profileError } = await sb
                .from('profiles')
                .insert([profileData]);

            if (profileError) {
                console.error(profileError);
                showMessage('注册失败', 'error');
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
                return;
            }

            showMessage('注册成功', 'success');
            setTimeout(() => {
                window.location.href = '/auth/login';
            }, 3000);
        }

        registerBtn.addEventListener('click', handleRegister);
    </script>
</body>

</html>
