<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>通知中心 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
        }

        .auth-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .user-email {
            margin-right: 8px;
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
            border-left: 4px solid #e74c3c;
            padding-left: 12px;
        }

        .mark-all-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }

        /* 左右两栏布局 */
        .notifications-wrapper {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        /* 左侧标签栏 - 垂直排列 */
        .tabs {
            width: 120px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tab {
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            border-radius: 12px;
            transition: all 0.2s;
            text-align: left;
        }

        .tab:hover {
            background: #f0f2f5;
            color: #e74c3c;
        }

        .tab.active {
            background: #f0f2f5;
            color: #e74c3c;
            font-weight: 600;
        }

        /* 右侧通知列表 */
        .notification-list-container {
            flex: 1;
            min-width: 0;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
        }

        .notification-item {
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-item.unread {
            background-color: #fff5f5;
            margin: 0 -24px;
            padding: 16px 24px;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }

        .notification-username {
            font-weight: bold;
            color: #333;
            text-decoration: none;
            font-size: 15px;
        }

        .notification-username:hover {
            color: #e74c3c;
        }

        .notification-time {
            font-size: 12px;
            color: #999;
        }

        .notification-content {
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 14px;
        }

        .loading-sentinel {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .notifications-wrapper {
                flex-direction: column;
            }

            .tabs {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
            }

            .tab {
                text-align: center;
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="logo">✨ Jason227</div>
        <div class="auth-buttons" id="authButtons">
            <span style="font-size:14px; color:#aaa;">加载中...</span>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="page-header">
                <h1>通知中心</h1>
                <button id="markAllReadBtn" class="mark-all-btn">全部标记已读</button>
            </div>

            <div class="notifications-wrapper">
                <!-- 左侧标签栏 -->
                <div class="tabs" id="notificationTabs">
                    <div class="tab active" data-type="mention">@我的</div>
                    <div class="tab" data-type="reply">回复我的</div>
                    <div class="tab" data-type="system">系统通知</div>
                    <div class="tab" data-type="activity">活动通知</div>
                </div>

                <!-- 右侧通知列表 -->
                <div class="notification-list-container">
                    <div id="notificationList" class="notification-list"></div>
                    <div id="loadingSentinel" class="loading-sentinel" style="display: none;">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            if (!window._supabaseClient) {
                window._supabaseClient = window.supabase.createClient(
                    'https://nosikdfacxkuaxfrmoqn.supabase.co',
                    'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
                );
            }
            const supabase = window._supabaseClient;

            let currentUser = null;
            let currentProfile = null;
            let isLoading = false;
            let hasMore = true;
            let page = 1;           // 当前页码
            let currentType = 'mention'; // mention, reply, system, activity
            const pageSize = 20;

            const authButtons = document.getElementById('authButtons');
            const notificationList = document.getElementById('notificationList');
            const loadingSentinel = document.getElementById('loadingSentinel');
            const markAllBtn = document.getElementById('markAllReadBtn');
            const tabs = document.querySelectorAll('.tab');

            const typeMap = { mention: 1, reply: 2, system: 3, activity: 4 };
            const typeFromInt = { 1: 'mention', 2: 'reply', 3: 'system', 4: 'activity' };

            function parseURLParams() {
                const params = new URLSearchParams(window.location.search);
                const typeParam = params.get('type');
                const pageParam = params.get('page');
                if (typeParam && typeFromInt[typeParam]) {
                    currentType = typeFromInt[typeParam];
                } else {
                    currentType = 'mention';
                }
                if (pageParam && !isNaN(parseInt(pageParam))) {
                    page = parseInt(pageParam);
                } else {
                    page = 1;
                }
            }

            function updateURLParams() {
                const newURL = `${window.location.pathname}?type=${typeMap[currentType]}&page=${page}`;
                window.history.pushState({ type: currentType, page: page }, '', newURL);
            }

            function formatTime(timestamp) {
                const date = new Date(timestamp);
                const now = new Date();
                const diff = Math.floor((now - date) / 1000);
                if (diff < 60) return '刚刚';
                if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
                if (diff < 86400) return `${Math.floor(diff / 3600)}小时前`;
                if (diff < 604800) return `${Math.floor(diff / 86400)}天前`;
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}`;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            async function markNotificationRead(id) {
                try {
                    await supabase
                        .from('notifications')
                        .update({ read: true })
                        .eq('id', id);
                } catch (err) {
                    console.error('标记已读失败:', err);
                }
            }

            async function markAllRead() {
                if (!currentProfile) return;
                try {
                    let query = supabase
                        .from('notifications')
                        .update({ read: true })
                        .eq('user_number', currentProfile.user_number)
                        .eq('read', false);
                    if (currentType === 'mention') query = query.eq('type', 'mention');
                    else if (currentType === 'reply') query = query.eq('type', 'reply');
                    else if (currentType === 'system') query = query.eq('type', 'system');
                    else if (currentType === 'activity') query = query.eq('type', 'activity');

                    const { error } = await query;
                    if (error) throw error;
                    page = 1;
                    hasMore = true;
                    loadNotifications(true);
                } catch (err) {
                    console.error('全部标记失败:', err);
                    alert('操作失败，请重试');
                }
            }

            function renderNotifications(notifications, append = false) {
                if (!notificationList) return;
                if (!append) notificationList.innerHTML = '';

                if (notifications.length === 0 && !append) {
                    let emptyText = '';
                    if (currentType === 'mention') emptyText = '暂无@我的通知';
                    else if (currentType === 'reply') emptyText = '暂无回复我的通知';
                    else if (currentType === 'system') emptyText = '暂无系统通知';
                    else emptyText = '暂无活动通知';
                    notificationList.innerHTML = `<div class="empty-message">${emptyText}</div>`;
                    return;
                }

                notifications.forEach(notif => {
                    const unreadClass = notif.read ? '' : 'unread';
                    const username = escapeHtml(notif.from_user?.username || '用户');
                    const userNumber = notif.from_user_number;
                    const timeStr = formatTime(notif.created_at);
                    const benbenId = notif.benben_id;
                    const type = notif.type;

                    let headerText = '';
                    let contentText = '';
                    if (type === 'mention') {
                        headerText = `${username} 提到了你`;
                        contentText = `${username} 在犇犇中提到了你，快去看看吧！`;
                    } else if (type === 'reply') {
                        headerText = `${username} 回复了你`;
                        contentText = `${username} 回复了你的犇犇，快去看看吧！`;
                    } else if (type === 'system') {
                        headerText = `系统通知`;
                        contentText = notif.content || '有一条系统通知';
                    } else if (type === 'activity') {
                        headerText = `活动通知`;
                        contentText = notif.content || '有一条活动通知';
                    } else {
                        headerText = `${username} 通知`;
                        contentText = notif.content || '有一条新通知';
                    }

                    const item = document.createElement('div');
                    item.className = `notification-item ${unreadClass}`;
                    item.dataset.id = notif.id;
                    item.dataset.read = notif.read;

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'notification-header';
                    headerDiv.innerHTML = `
                        <a href="/user/${userNumber}" class="notification-username">${username}</a>
                        <span class="notification-time">${timeStr}</span>
                    `;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'notification-content';
                    contentDiv.textContent = contentText;

                    item.appendChild(headerDiv);
                    item.appendChild(contentDiv);

                    item.addEventListener('click', async (e) => {
                        if (e.target.tagName === 'A') return;
                        if (!notif.read) {
                            await markNotificationRead(notif.id);
                            item.classList.remove('unread');
                            notif.read = true;
                        }
                        if (benbenId) {
                            window.location.href = `/benben/feed/${benbenId}`;
                        }
                    });

                    notificationList.appendChild(item);
                });
            }

            async function loadNotifications(reset = true) {
                if (isLoading) return;
                if (reset) {
                    hasMore = true;
                    if (notificationList) notificationList.innerHTML = '';
                }
                if (!hasMore) return;

                isLoading = true;
                if (loadingSentinel) loadingSentinel.style.display = 'block';

                try {
                    const from = (page - 1) * pageSize;
                    const to = from + pageSize - 1;

                    let query = supabase
                        .from('notifications')
                        .select('*')
                        .eq('user_number', currentProfile.user_number)
                        .order('created_at', { ascending: false })
                        .range(from, to);

                    if (currentType === 'mention') query = query.eq('type', 'mention');
                    else if (currentType === 'reply') query = query.eq('type', 'reply');
                    else if (currentType === 'system') query = query.eq('type', 'system');
                    else if (currentType === 'activity') query = query.eq('type', 'activity');

                    const { data, error } = await query;
                    if (error) throw error;

                    if (data && data.length > 0) {
                        const userIds = [...new Set(data.map(n => n.from_user_number))];
                        let userMap = {};
                        if (userIds.length > 0) {
                            const { data: profiles, error: profileError } = await supabase
                                .from('profiles')
                                .select('user_number, username')
                                .in('user_number', userIds);
                            if (!profileError && profiles) {
                                userMap = Object.fromEntries(profiles.map(p => [p.user_number, p.username]));
                            }
                        }
                        const formatted = data.map(item => ({
                            ...item,
                            from_user: { username: userMap[item.from_user_number] || '用户' }
                        }));
                        renderNotifications(formatted, !reset);
                        if (data.length < pageSize) {
                            hasMore = false;
                            if (loadingSentinel) loadingSentinel.style.display = 'none';
                        } else {
                            hasMore = true;
                            page++;
                            if (loadingSentinel) loadingSentinel.style.display = 'block';
                        }
                        updateURLParams();
                    } else {
                        hasMore = false;
                        if (loadingSentinel) loadingSentinel.style.display = 'none';
                        if (reset) renderNotifications([]);
                    }
                } catch (err) {
                    console.error('加载通知失败:', err);
                    if (reset && notificationList && notificationList.children.length === 0) {
                        notificationList.innerHTML = '<div class="empty-message">加载失败，请刷新重试</div>';
                    }
                } finally {
                    isLoading = false;
                    if (!hasMore && loadingSentinel) loadingSentinel.style.display = 'none';
                }
            }

            function setupInfiniteScroll() {
                if (!loadingSentinel) return;
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && !isLoading && hasMore && currentProfile) {
                        loadNotifications(false);
                    }
                }, { threshold: 0.1 });
                observer.observe(loadingSentinel);
            }

            function switchTab(type) {
                currentType = type;
                page = 1;
                hasMore = true;
                updateURLParams();
                loadNotifications(true);
                tabs.forEach(tab => {
                    if (tab.dataset.type === type) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
            }

            async function getProfile(userId) {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username')
                    .eq('id', userId)
                    .single();
                if (error) return null;
                return data;
            }

            async function init() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/auth/login';
                        return;
                    }
                    const profile = await getProfile(session.user.id);
                    if (!profile) {
                        window.location.href = '/auth/login';
                        return;
                    }
                    currentUser = session.user;
                    currentProfile = profile;

                    let displayName = currentUser.email;
                    if (profile.username) displayName = profile.username;
                    authButtons.innerHTML = `
                        <a href="/user/${profile.user_number}" class="user-email">${escapeHtml(displayName)}</a>
                        <button id="logoutBtn" class="auth-btn logout">登出</button>
                    `;
                    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                        await supabase.auth.signOut();
                        location.reload();
                    });

                    parseURLParams();
                    tabs.forEach(tab => {
                        if (tab.dataset.type === currentType) {
                            tab.classList.add('active');
                        } else {
                            tab.classList.remove('active');
                        }
                        tab.addEventListener('click', () => {
                            const type = tab.dataset.type;
                            if (type === 'mention' || type === 'reply' || type === 'system' || type === 'activity') {
                                switchTab(type);
                            }
                        });
                    });

                    await loadNotifications(true);
                    setupInfiniteScroll();
                    markAllBtn.addEventListener('click', markAllRead);
                } catch (err) {
                    console.error(err);
                    window.location.href = '/auth/login';
                }
            }

            init();
        })();
    </script>
</body>

</html>
