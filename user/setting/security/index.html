<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户设置 - ✨ Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2">
    </script>
    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        /* ========== 顶部栏 ========== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color 0.2s;
        }

        .bell-icon:hover {
            color: #e74c3c;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        /* ========== 主布局 ========== */
        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            position: relative;
            min-height: 100vh;
        }

        /* ========== 侧边栏 ========== */
        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: white;
            border-radius: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
            box-shadow: 0 rgba(0, 0, 0, 0.06);
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            cursor: default;
        }

        .nav-group .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        /* ========== 内容区域 ========== */
        .content-wrapper {
            margin-left: 64px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 20px;
        }

        .main-content {
            flex: 2;
            min-width: 260px;
            max-width: 1500px;
        }

        /* ===== 卡片通用样式（与用户设置页面完全一致） ===== */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 28px 32px 0 32px;
            margin-bottom: 24px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        /* 顶部卡片 - 标题 + 导航 */
        .card-top .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-top h1 {
            color: #e74c3c;
            font-size: 24px;
            margin: 0;
        }

        /* ===== 导航样式（与用户设置页面完全一致） ===== */
        .setting-nav {
            display: flex;
            gap: 40px;
            padding-bottom: 0;
        }

        .setting-nav .nav-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .setting-nav .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #d0d7de;
            transition: all 0.25s ease;
            transform: translateX(-50%);
        }

        .setting-nav .nav-btn:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            transform: translateX(0);
        }

        .setting-nav .nav-btn.active {
            color: #e74c3c;
            cursor: default;
        }

        .setting-nav .nav-btn.active::after {
            background: #e74c3c;
            width: 100%;
            left: 0;
            transform: translateX(0);
            height: 2px;
        }

        .setting-nav .nav-btn.active:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            height: 2px;
        }

        /* ===== 底部卡片 - 表单行样式（与用户设置页面完全一致） ===== */
        .card-bottom {
            padding-bottom: 0;
        }

        .form-row {
            display: flex;
            align-items: flex-start;
            gap: 32px;
            padding: 14px 0;
        }

        .form-row:last-of-type {
            border-bottom: none;
            padding-bottom: 40px;
        }

        .form-label {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 64px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .form-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .form-right .info-text {
            font-size: 14px;
            color: #5b6e8c;
            line-height: 1.6;
        }

        .form-right .warning-text {
            font-size: 14px;
            color: #5b6e8c;
            line-height: 1.6;
        }

        /* 删除 .btn-link 的定义，使用统一的 .avatar-upload-btn */
        .avatar-upload-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            width: auto;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            font-weight: 500;  /* 添加这一行使字体加粗，与个人信息页一致（个人信息页的按钮默认加粗？实际上个人信息页的按钮没有 font-weight，但看起来正常，我们可以保持一致不加） */
        }

        .btn-link:hover {
            background: #c0392b;
        }

        /* ===== 响应式（与用户设置页面一致） ===== */
        @media (max-width: 900px) {
            .main-layout {
                padding: 0 16px 16px 16px;
            }

            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                border-radius: 0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                margin-bottom: 20px;
                padding: 12px 0;
                transition: none;
                overflow: visible;
                white-space: normal;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .nav-item:hover,
            .group-title:hover {
                background: #f0f2f5;
                color: #e74c3c;
                text-decoration: none;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            }

            .nav-sidebar a:hover {
                text-decoration: none;
                background: #f0f2f5;
                color: #e74c3c;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            }

            .nav-icon {
                font-size: 16px;
                width: 20px;
            }

            .group-title {
                grid-column: 1 / -1;
                background: #e9ecef;
                margin-top: 0;
                border-top: none;
            }

            .divider {
                display: none;
            }

            .nav-sidebar::-webkit-scrollbar {
                width: 0;
            }

            .card {
                padding: 20px 18px;
            }

            .card-top .title-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .form-row {
                flex-direction: column;
                gap: 8px;
                padding: 12px 0;
            }

            .form-label {
                min-width: auto;
                padding-top: 0;
            }

            .setting-nav {
                gap: 20px;
                flex-wrap: wrap;
            }

            .setting-nav .nav-btn {
                font-size: 14px;
            }

            .auth-buttons .auth-btn {
                padding: 4px 14px;
                font-size: 12px;
            }

            .user-email {
                font-size: 12px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 8px;
            }

            .card {
                padding: 16px 14px;
            }

            .btn-link {
                padding: 6px 18px;
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 12px 10px;
            }

            .setting-nav {
                gap: 12px;
            }

            .setting-nav .nav-btn {
                font-size: 12px;
                padding: 6px 0;
            }

            .auth-buttons .auth-btn {
                padding: 4px 10px;
                font-size: 11px;
            }

            .user-email {
                font-size: 11px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 6px;
            }

            .nav-icon {
                font-size: 12px;
                width: 16px;
            }

            .btn-link {
                padding: 5px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>

                    <!-- 修改用户名 -->

                    <!-- 修改密码 -->

    <script>
        (function () {
            // ==============================================================
            // 1. Supabase 客户端
            // ==============================================================
            const supabase = window._supabaseClient || window.supabase.createClient(
                'https://nosikdfacxkuaxfrmoqn.supabase.co',
                'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
            );
            if (!window._supabaseClient) window._supabaseClient = supabase;

            let currentUser = null;
            let currentProfile = null;
            let unreadTimer = null;

            // ==============================================================
            // 2. 顶部栏 & 侧边栏
            // ==============================================================
            const authButtons = document.getElementById('authButtons');

            function escapeHtmlAttr(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            async function getProfile(userId) {
                var { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username, is_admin, special_privilege, can_speak, can_manage_users, avatar_url')
                    .eq('id', userId)
                    .single();
                if (error) return null;
                return data;
            }

            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    var { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        var badge = document.getElementById('bell-badge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count > 99 ? '99+' : count;
                                badge.style.display = 'inline-flex';
                            } else { badge.style.display = 'none'; }
                        }
                    }
                } catch (err) { console.error(err); }
            }

            function startUnreadPolling() {
                if (unreadTimer) clearInterval(unreadTimer);
                unreadTimer = setInterval(function () {
                    if (currentProfile && document.visibilityState === 'visible') {
                        fetchUnreadCount();
                    }
                }, 30000);
            }

            async function updateTopbar() {
                try {
                    var { data: { session } } = await supabase.auth.getSession();

                    if (session) {
                        currentUser = session.user;
                        currentProfile = await getProfile(session.user.id);

                        if (currentProfile) {
                            var { data: banData, error: banErr } = await supabase
                                .from('profiles')
                                .select('is_banned')
                                .eq('id', session.user.id)
                                .single();
                            if (!banErr && banData && banData.is_banned === true) {
                                await supabase.auth.signOut();
                                location.reload();
                                return;
                            }
                        }

                        var displayName = currentProfile?.username || session.user.email || '用户';
                        var html = '';
                        if (currentProfile?.user_number) {
                            html += '<a href="/user/' + currentProfile.user_number + '" class="user-email">' +
                                escapeHtmlAttr(displayName) + '</a>';
                        } else {
                            html += '<span class="user-email">' + escapeHtmlAttr(displayName) + '</span>';
                        }
                        html +=
                            '<a href="/user/notification" class="bell-icon" style="color:#666;"><svg class="svg-inline--fa fa-bell" viewBox="0 0 448 512" width="20" height="20"><path fill="currentColor" d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z"></path></svg><sup id="bell-badge" style="background-color:#e74c3c; display:none;">0</sup></a>';
                        html += '<button id="logoutBtn" class="auth-btn logout">登出</button>';
                        authButtons.innerHTML = html;
                        document.getElementById('logoutBtn')?.addEventListener('click', async function () {
                            await supabase.auth.signOut();
                            location.reload();
                        });

                        await fetchUnreadCount();
                        startUnreadPolling();

                        var userManageItem = document.getElementById('userManageItem');
                        if (userManageItem) {
                            if (currentProfile && currentProfile.can_manage_users === true) {
                                userManageItem.style.display = 'flex';
                            } else {
                                userManageItem.style.display = 'none';
                            }
                        }

                    } else {
                        window.location.href = '/login';
                        return;
                    }
                } catch (err) {
                    console.error(err);
                    authButtons.innerHTML =
                        '<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>';
                }
            }

            // ==============================================================
            // 3. 安全设置业务逻辑（功能保留）
            // ==============================================================
            const usernameActionArea = document.getElementById('usernameActionArea');

            async function loadSecurityData() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/login';
                        return;
                    }
                    const userId = session.user.id;
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('username, username_last_modified')
                        .eq('id', userId)
                        .single();
                    if (error) throw new Error(error.message);

                    const lastModified = data.username_last_modified ? new Date(data.username_last_modified) : null;
                    const now = new Date();
                    let canModify = false;
                    let lastModifiedStr = '';

                    if (!lastModified) {
                        canModify = true;
                    } else {
                        const nextAllowed = new Date(lastModified);
                        nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                        if (now >= nextAllowed) {
                            canModify = true;
                        } else {
                            canModify = false;
                            const year = lastModified.getFullYear();
                            const month = String(lastModified.getMonth() + 1).padStart(2, '0');
                            const day = String(lastModified.getDate()).padStart(2, '0');
                            const hours = String(lastModified.getHours()).padStart(2, '0');
                            const minutes = String(lastModified.getMinutes()).padStart(2, '0');
                            const seconds = String(lastModified.getSeconds()).padStart(2, '0');
                            lastModifiedStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                        }
                    }

                    if (canModify) {
                        usernameActionArea.innerHTML = `
                            <a href="/user/security/usernameUpdate" class="avatar-upload-btn">修改用户名</a>
                        `;
                    } else {
                        usernameActionArea.innerHTML = `
                            <span class="warning-text">上次修改时间：${lastModifiedStr}，禁止修改。</span>
                        `;
                    }
                } catch (err) {
                    usernameActionArea.innerHTML = `<span class="warning-text">加载失败: ${err.message}</span>`;
                }
            }

            // ==============================================================
            // 4. 启动
            // ==============================================================
            (async function init() {
                await updateTopbar();
                await loadSecurityData();

                // 新增：侧边栏滚动复位
                const sidebar = document.querySelector('.nav-sidebar');
                if (sidebar) {
                    sidebar.addEventListener('mouseleave', function () {
                        if (window.innerWidth > 900) {
                            this.scrollTop = 0;
                        }
                    });
                }
            })();

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible' && currentProfile) {
                    fetchUnreadCount();
                }
            });

        })();
    </script>
