<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全设置 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .button-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
        }

        .nav-btn.active {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            cursor: default;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
            border-left: 3px solid #e74c3c;
            padding-left: 12px;
        }

        .info-text {
            margin: 12px 0;
            font-size: 14px;
            color: #5b6e8c;
            line-height: 1.6;
        }

        /* 禁止修改提示框样式与 info-text 一致 */
        .warning-text {
            margin: 12px 0;
            font-size: 14px;
            color: #5b6e8c;
            line-height: 1.6;
        }

        .btn-link {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            margin-top: 8px;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .field-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
        }

        .password-section {
            margin-top: 30px;
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 安全设置</h1>
        <div class="sub">修改密码 / 修改用户名</div>

        <div class="button-bar">
            <a href="/user/setting" class="nav-btn">个人信息</a>
            <span class="nav-btn active">安全设置</span>
        </div>

        <!-- 修改用户名区块 -->
        <div class="section">
            <div class="section-title">修改用户名</div>
            <div class="info-text">一年（365天）内仅可修改一次用户名。</div>
            <div id="usernameActionArea"></div>
        </div>

        <!-- 修改密码区块 -->
        <div class="password-section">
            <div class="section-title">修改密码</div>
            <div class="field-group">
                <label>当前密码</label>
                <input type="password" id="oldPassword" placeholder="输入当前密码">
            </div>
            <div class="field-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="至少6位">
            </div>
            <div class="field-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码">
            </div>
            <button id="updatePasswordBtn">修改密码</button>
            <div id="passwordMsg" class="message"></div>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let currentUser = null;
            let profileData = null;

            const usernameActionArea = document.getElementById('usernameActionArea');

            async function loadUserData() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/login';
                        return;
                    }
                    currentUser = session.user;
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('username, username_last_modified')
                        .eq('id', currentUser.id)
                        .single();
                    if (error) throw new Error(error.message);
                    profileData = data;

                    const lastModified = data.username_last_modified ? new Date(data.username_last_modified) : null;
                    const now = new Date();
                    let canModify = false;
                    let lastModifiedStr = '';

                    if (!lastModified) {
                        canModify = true;
                    } else {
                        const nextAllowed = new Date(lastModified);
                        nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                        if (now >= nextAllowed) {
                            canModify = true;
                        } else {
                            canModify = false;
                            const year = lastModified.getFullYear();
                            const month = String(lastModified.getMonth() + 1).padStart(2, '0');
                            const day = String(lastModified.getDate()).padStart(2, '0');
                            const hours = String(lastModified.getHours()).padStart(2, '0');
                            const minutes = String(lastModified.getMinutes()).padStart(2, '0');
                            const seconds = String(lastModified.getSeconds()).padStart(2, '0');
                            lastModifiedStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                        }
                    }

                    if (canModify) {
                        usernameActionArea.innerHTML = `
                            <a href="/user/security/usernameUpdate" class="btn-link">修改用户名</a>
                        `;
                    } else {
                        usernameActionArea.innerHTML = `
                            <div class="warning-text">上次修改时间：${lastModifiedStr}，禁止修改。</div>
                        `;
                    }
                } catch (err) {
                    usernameActionArea.innerHTML = `<div class="warning-text">加载失败: ${err.message}</div>`;
                }
            }

            async function updatePassword() {
                const oldPwd = document.getElementById('oldPassword').value;
                const newPwd = document.getElementById('newPassword').value;
                const confirmPwd = document.getElementById('confirmPassword').value;
                const msgDiv = document.getElementById('passwordMsg');
                if (!oldPwd || !newPwd || !confirmPwd) {
                    msgDiv.innerHTML = '<div class="message error">请填写所有密码字段</div>';
                    return;
                }
                if (newPwd.length < 6) {
                    msgDiv.innerHTML = '<div class="message error">新密码至少6位</div>';
                    return;
                }
                if (newPwd !== confirmPwd) {
                    msgDiv.innerHTML = '<div class="message error">两次输入的新密码不一致</div>';
                    return;
                }
                const { error: signInError } = await supabase.auth.signInWithPassword({
                    email: currentUser.email,
                    password: oldPwd
                });
                if (signInError) {
                    msgDiv.innerHTML = '<div class="message error">当前密码错误</div>';
                    return;
                }
                const { error: updateError } = await supabase.auth.updateUser({ password: newPwd });
                if (updateError) {
                    msgDiv.innerHTML = `<div class="message error">修改失败: ${updateError.message}</div>`;
                } else {
                    msgDiv.innerHTML = '<div class="message success">密码修改成功！请重新登录</div>';
                    setTimeout(() => {
                        supabase.auth.signOut();
                        window.location.href = '/login';
                    }, 2000);
                }
            }

            document.getElementById('updatePasswordBtn').addEventListener('click', updatePassword);
            loadUserData();
        })();
    </script>
</body>

</html>
