<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* 样式与 login.html 相同，可复用，此处略写 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            text-align: center;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 16px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #667eea;
            text-decoration: none;
        }

        .turnstile-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h1>创建新账号</h1>
        <div class="sub">加入 Jason227 社区</div>
        <div class="input-group">
            <input type="email" id="regEmail" placeholder="邮箱" autocomplete="email">
        </div>
        <div class="input-group">
            <input type="password" id="regPassword" placeholder="密码（至少6位）" autocomplete="new-password">
        </div>
        <div class="turnstile-wrapper">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADcNcP2JrYuEkEhx" data-theme="light"></div>
        </div>
        <button id="registerBtn">注册</button>
        <div id="regMsg" class="message"></div>
        <div class="footer-links">
            已有账号？ <a href="login">立即登录</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const registerBtn = document.getElementById('registerBtn');
        const regMsg = document.getElementById('regMsg');

        async function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            if (!email || !password) {
                regMsg.innerHTML = '<div class="message error">请填写邮箱和密码</div>';
                return;
            }
            if (password.length < 6) {
                regMsg.innerHTML = '<div class="message error">密码长度至少6位</div>';
                return;
            }
            const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!captchaToken) {
                regMsg.innerHTML = '<div class="message error">请完成验证码验证</div>';
                return;
            }
            registerBtn.disabled = true;
            registerBtn.textContent = '注册中...';
            const { error } = await sb.auth.signUp({ email, password, options: { captchaToken } });
            registerBtn.disabled = false;
            registerBtn.textContent = '注册';
            if (error) {
                regMsg.innerHTML = `<div class="message error">${error.message}</div>`;
            } else {
                regMsg.innerHTML = '<div class="message success">注册成功！请前往登录</div>';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        }
        registerBtn.addEventListener('click', handleRegister);
    </script>
</body>

</html>
