<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页脚示例</title>
    <style>
        /* 页脚全局样式 */
        .footer {
            background-color: #2d2d2d;
            color: #ccc;
            padding: 30px 20px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            border-top: 3px solid #f0b90b;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        /* 左侧：版权 & 备案 */
        .footer-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
        }

        .footer-left .copyright {
            color: #aaa;
        }

        .footer-left .copyright a {
            color: #f0b90b;
            text-decoration: none;
        }

        .footer-left .copyright a:hover {
            text-decoration: underline;
        }

        .footer-left .icp {
            color: #888;
            font-size: 13px;
        }

        .footer-left .icp a {
            color: #888;
            text-decoration: none;
        }

        .footer-left .icp a:hover {
            color: #f0b90b;
        }

        /* 右侧：贡献者 & 运行时间 */
        .footer-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
            font-size: 13px;
            color: #888;
        }

        .footer-right .contributors {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-right .contributors .label {
            color: #999;
        }

        .footer-right .contributors .name {
            color: #ddd;
            font-weight: 500;
        }

        .footer-right .contributors .name a {
            color: #ddd;
            text-decoration: none;
        }

        .footer-right .contributors .name a:hover {
            color: #f0b90b;
            text-decoration: underline;
        }

        .footer-right .uptime {
            color: #888;
        }

        .footer-right .uptime .num {
            color: #f0b90b;
            font-weight: 600;
        }

        /* 底部小字（吉祥物/致谢行） */
        .footer-bottom {
            max-width: 1200px;
            margin: 15px auto 0;
            padding-top: 15px;
            border-top: 1px solid #444;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .footer-bottom .heart {
            color: #e74c3c;
        }

        .footer-bottom .thanks {
            color: #888;
        }

        .footer-bottom .thanks a {
            color: #f0b90b;
            text-decoration: none;
        }

        .footer-bottom .thanks a:hover {
            text-decoration: underline;
        }

        /* 响应式：小屏设备 */
        @media (max-width: 768px) {
            .footer-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .footer-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .footer-right {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .footer-bottom {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 页脚 HTML ========== -->
    <footer class="footer">
        <div class="footer-container">

            <!-- 左侧：版权 + 备案 -->
            <div class="footer-left">
                <div class="copyright">
                    &copy; 2026 <a href="#">Jason227</a>
                </div>
                <div class="icp">
                    <a href="#" target="_blank">萌ICP备20268322号</a>
                </div>
            </div>

            <!-- 右侧：贡献者 + 服务器时间 -->
            <div class="footer-right">
                <div class="contributors">
                    <span class="label">项目贡献者</span>
                    <span class="name"><a href="#">brian_zheng</a></span>
                    <span class="name"><a href="#">luogu_LiuShaRui</a></span>
                    <span class="name"><a href="#">for</a></span>
                    <span class="name"><a href="#">Jason227</a></span>
                </div>
                <div class="uptime">
                    服务器时间：<span id="serverTime">2026-07-24 14:37:24</span>
                    &nbsp;|&nbsp; 本网站已运行 <span class="num" id="uptimeSeconds">4,567,708</span> 秒
                </div>
            </div>

        </div>

        <!-- 底部致谢行（吉祥物） -->
        <div class="footer-bottom">
            <span class="thanks">
                By Jason227 吉祥物 
                <span class="heart">❤</span> 
                <a href="#">brian_zheng</a> · 
                <a href="#">luogu_LiuShaRui</a> · 
                <a href="#">for</a> · 
                <a href="#">Jason227</a>
            </span>
        </div>
    </footer>

    <!-- ========== JavaScript：更新服务器时间 ========== -->
    <script>
        // 页面加载时，把从后端传来的时间显示出来
        // 注意：这里的时间是从服务端渲染时传入的，我们模拟一下
        (function() {
            // 假设后端传入的启动时间（Unix时间戳，单位秒）
            // 这里用当前时间模拟，实际使用时替换为后端返回的启动时间戳
            const startTimestamp = Math.floor(Date.now() / 1000) - 4567708; // 倒推启动时间

            function updateUptime() {
                const now = Math.floor(Date.now() / 1000);
                const elapsed = now - startTimestamp;
                // 格式化显示
                const formatted = elapsed.toLocaleString(); // 加千位分隔符
                document.getElementById('uptimeSeconds').textContent = formatted;
            }

            // 每秒更新一次运行时间
            updateUptime();
            setInterval(updateUptime, 1000);

            // 实时更新时间（精确到秒）
            function updateServerTime() {
                const now = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                const str = now.getFullYear() + '-' +
                    pad(now.getMonth() + 1) + '-' +
                    pad(now.getDate()) + ' ' +
                    pad(now.getHours()) + ':' +
                    pad(now.getMinutes()) + ':' +
                    pad(now.getSeconds());
                document.getElementById('serverTime').textContent = str;
            }
            updateServerTime();
            setInterval(updateServerTime, 1000);
        })();
    </script>

</body>
</html>
