<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>页面跳转中...</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: system-ui;
            text-align: center;
            padding: 50px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        (function () {
            var path = window.location.pathname;

            // 1. 犇犇永久链接：/benben/feed/数字
            var benbenMatch = path.match(/^\/benben\/feed\/(\d+)/);
            if (benbenMatch) {
                var benbenId = benbenMatch[1];
                // 重定向到 /benben/feed/index.html?id=数字
                window.location.replace('/benben/feed/index.html?id=' + benbenId);
                return;
            }

            // 2. 用户主页：/user/数字
            var userMatch = path.match(/^\/user\/(\d+)/);
            if (userMatch) {
                var userId = userMatch[1];
                fetch('/user/index.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载用户主页模板');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/user/' + userId);
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法获取用户主页，请稍后再试。</p>';
                    });
                return;
            }

            // 3. 其他路径显示 404
            document.body.innerHTML = `
                <h1>404 - 页面未找到</h1>
                <p>您访问的页面不存在，请检查网址。</p>
                <p><a href="/">返回首页</a></p>
            `;
        })();
    </script>
</head>

<body>
    <div class="loader"></div>
    <p>正在加载...</p>
</body>

</html>
