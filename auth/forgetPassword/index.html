<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - Jason227</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 480px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .verification-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .verification-row input {
            flex: 1;
        }

        .verification-row button {
            width: auto;
            padding: 12px 16px;
            background: #3498db;
            font-size: 14px;
            white-space: nowrap;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .info {
            background: #e3f2fd;
            color: #0c5460;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #e74c3c;
            text-decoration: none;
        }

        .turnstile-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .captcha-row input {
            flex: 1;
        }

        .captcha-row canvas {
            cursor: pointer;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            width: 120px;
            height: 44px;
        }

        .captcha-hint {
            font-size: 12px;
            color: #6c7a8e;
            margin-top: 4px;
            text-align: right;
        }

        .info-note {
            font-size: 12px;
            color: #6c7a8e;
            margin-top: 4px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔐 忘记密码</h1>
        <div class="sub">通过邮箱或手机号重置密码</div>

        <div class="tabs">
            <div class="tab active" data-type="email">邮箱重置</div>
            <div class="tab" data-type="phone">手机号重置</div>
        </div>

        <!-- 邮箱重置面板 -->
        <div id="emailPanel" class="form-panel active">
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="注册邮箱" autocomplete="email">
            </div>
            <div class="input-group">
                <div class="verification-row">
                    <input type="text" id="emailCode" placeholder="6位验证码" autocomplete="off" maxlength="6">
                    <button id="sendEmailCodeBtn">发送验证码</button>
                </div>
            </div>
        </div>

        <!-- 手机号重置面板 -->
        <div id="phonePanel" class="form-panel">
            <div class="input-group">
                <input type="tel" id="phoneInput" placeholder="手机号" autocomplete="tel">
            </div>
            <div class="input-group">
                <div class="verification-row">
                    <input type="text" id="phoneCode" placeholder="6位验证码" autocomplete="off" maxlength="6">
                    <button id="sendPhoneCodeBtn">发送验证码</button>
                </div>
            </div>
            <div class="info-note">📱 手机号重置为演示模式，验证码固定为 123456，实际会向对应邮箱发送重置邮件。</div>
        </div>

        <!-- 公共字段：新密码和确认密码 -->
        <div class="input-group">
            <input type="password" id="newPassword" placeholder="新密码（至少6位）" autocomplete="new-password">
        </div>
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="off">
        </div>

        <!-- 图形验证码 -->
        <div class="input-group">
            <div class="captcha-row">
                <input type="text" id="captchaInput" placeholder="图形验证码" autocomplete="off" maxlength="6">
                <canvas id="captchaCanvas" width="120" height="44"></canvas>
            </div>
            <div class="captcha-hint">点击图片刷新验证码</div>
        </div>

        <!-- Turnstile -->
        <div class="turnstile-wrapper">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADcNcP2JrYuEkEhx" data-theme="light"></div>
        </div>

        <button id="resetBtn">重置密码</button>
        <div id="msg" class="message"></div>
        <div class="footer-links">
            <a href="/auth/login">返回登录</a> &nbsp;|&nbsp; <a href="/auth/register">注册账号</a>
        </div>
    </div>

    <script>
        // ========== 配置 ==========
        const EDGE_SEND_CODE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/send-reset-code';
        const EDGE_VERIFY_RESET = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-reset-code';
        const ADMIN_SECRET = 'supabasetiti0730';

        // ========== 图形验证码 ==========
        let currentCaptcha = '';
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) captcha += chars[Math.floor(Math.random() * chars.length)];
            currentCaptcha = captcha.toUpperCase();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(0,0,0,0.3)`;
                ctx.stroke();
            }
            for (let i = 0; i < 60; i++) {
                ctx.fillStyle = `rgba(0,0,0,0.3)`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }
            for (let i = 0; i < currentCaptcha.length; i++) {
                ctx.font = `24px "Courier New"`;
                ctx.fillStyle = `rgb(${30 + Math.random() * 80}, ${30 + Math.random() * 80}, ${30 + Math.random() * 80})`;
                const x = 12 + i * 22 + Math.random() * 4;
                const y = 32 + Math.random() * 6;
                ctx.fillText(currentCaptcha[i], x, y);
            }
        }
        canvas.addEventListener('click', generateCaptcha);
        generateCaptcha();

        // ========== 选项卡切换 ==========
        const emailPanel = document.getElementById('emailPanel');
        const phonePanel = document.getElementById('phonePanel');
        const tabs = document.querySelectorAll('.tab');
        let currentTab = 'email';

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const type = tab.getAttribute('data-type');
                if (type === currentTab) return;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (type === 'email') {
                    emailPanel.classList.add('active');
                    phonePanel.classList.remove('active');
                    currentTab = 'email';
                } else {
                    phonePanel.classList.add('active');
                    emailPanel.classList.remove('active');
                    currentTab = 'phone';
                }
                // 清空消息
                document.getElementById('msg').innerHTML = '';
                if (type === 'email') {
                    document.getElementById('emailCode').value = '';
                } else {
                    document.getElementById('phoneCode').value = '';
                }
            });
        });

        // ========== 辅助函数 ==========
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('msg');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { if (msgDiv) msgDiv.innerHTML = ''; }, 4000);
        }

        // 邮箱发送验证码
        let emailTimer = null;
        let emailCountdown = 0;
        const sendEmailBtn = document.getElementById('sendEmailCodeBtn');
        async function sendEmailCode() {
            const email = document.getElementById('emailInput').value.trim();
            if (!email) { showMessage('请输入邮箱', 'error'); return; }
            if (!/^\S+@\S+\.\S+$/.test(email)) { showMessage('邮箱格式不正确', 'error'); return; }
            const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!captchaToken) { showMessage('请完成安全验证', 'error'); return; }
            sendEmailBtn.disabled = true;
            sendEmailBtn.textContent = '发送中...';
            try {
                const response = await fetch(EDGE_SEND_CODE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_SECRET}` },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('验证码已发送至邮箱，有效期10分钟', 'success');
                    startEmailCountdown(60);
                } else {
                    showMessage(`发送失败: ${result.error}`, 'error');
                    sendEmailBtn.disabled = false;
                    sendEmailBtn.textContent = '发送验证码';
                }
            } catch (err) {
                showMessage('网络错误', 'error');
                sendEmailBtn.disabled = false;
                sendEmailBtn.textContent = '发送验证码';
            }
        }
        function startEmailCountdown(seconds) {
            emailCountdown = seconds;
            sendEmailBtn.disabled = true;
            if (emailTimer) clearInterval(emailTimer);
            emailTimer = setInterval(() => {
                if (emailCountdown <= 0) {
                    clearInterval(emailTimer);
                    sendEmailBtn.disabled = false;
                    sendEmailBtn.textContent = '发送验证码';
                } else {
                    sendEmailBtn.textContent = `${emailCountdown}秒后重试`;
                    emailCountdown--;
                }
            }, 1000);
        }

        // 手机号发送验证码（演示）
        let phoneTimer = null;
        let phoneCountdown = 0;
        const sendPhoneBtn = document.getElementById('sendPhoneCodeBtn');
        async function sendPhoneCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) { showMessage('请输入手机号', 'error'); return; }
            if (!/^1[3-9]\d{9}$/.test(phone)) { showMessage('手机号格式不正确', 'error'); return; }
            const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!captchaToken) { showMessage('请完成安全验证', 'error'); return; }
            // 演示模式：直接填充验证码123456
            showMessage('演示模式：验证码为 123456', 'info');
            document.getElementById('phoneCode').value = '123456';
            startPhoneCountdown(60);
        }
        function startPhoneCountdown(seconds) {
            phoneCountdown = seconds;
            sendPhoneBtn.disabled = true;
            if (phoneTimer) clearInterval(phoneTimer);
            phoneTimer = setInterval(() => {
                if (phoneCountdown <= 0) {
                    clearInterval(phoneTimer);
                    sendPhoneBtn.disabled = false;
                    sendPhoneBtn.textContent = '发送验证码';
                } else {
                    sendPhoneBtn.textContent = `${phoneCountdown}秒后重试`;
                    phoneCountdown--;
                }
            }, 1000);
        }

        sendEmailBtn.addEventListener('click', sendEmailCode);
        sendPhoneBtn.addEventListener('click', sendPhoneCode);

        // ========== 重置密码 ==========
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const userCaptcha = document.getElementById('captchaInput').value.trim();
            const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

            if (!newPassword || !confirmPwd) {
                showMessage('请填写新密码和确认密码', 'error');
                return;
            }
            if (newPassword.length < 6) {
                showMessage('新密码至少6位', 'error');
                return;
            }
            if (newPassword !== confirmPwd) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            if (!userCaptcha) {
                showMessage('请输入图形验证码', 'error');
                return;
            }
            if (userCaptcha.toUpperCase() !== currentCaptcha) {
                showMessage('图形验证码错误', 'error');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }
            if (!captchaToken) {
                showMessage('请完成安全验证', 'error');
                return;
            }

            let identifier, code;
            if (currentTab === 'email') {
                identifier = document.getElementById('emailInput').value.trim();
                code = document.getElementById('emailCode').value.trim();
                if (!identifier) { showMessage('请填写邮箱', 'error'); return; }
                if (!code) { showMessage('请输入邮箱验证码', 'error'); return; }
            } else {
                identifier = document.getElementById('phoneInput').value.trim();
                code = document.getElementById('phoneCode').value.trim();
                if (!identifier) { showMessage('请填写手机号', 'error'); return; }
                if (!code) { showMessage('请输入短信验证码', 'error'); return; }
                if (code !== '123456') { showMessage('短信验证码错误', 'error'); return; }
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = '重置中...';
            try {
                const response = await fetch(EDGE_VERIFY_RESET, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_SECRET}` },
                    body: JSON.stringify({
                        identifier,
                        code,
                        newPassword,
                        type: currentTab
                    })
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('密码重置成功！请使用新密码登录', 'success');
                    setTimeout(() => { window.location.href = '/auth/login'; }, 2000);
                } else {
                    showMessage(`重置失败: ${result.error}`, 'error');
                    btn.disabled = false;
                    btn.textContent = '重置密码';
                }
            } catch (err) {
                showMessage('网络错误', 'error');
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        }

        document.getElementById('resetBtn').addEventListener('click', resetPassword);
    </script>
</body>

</html>
