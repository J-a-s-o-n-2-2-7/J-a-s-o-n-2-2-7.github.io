<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏好设置 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .button-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-btn:hover {
            color: #e74c3c;
        }

        .nav-btn.active {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            cursor: default;
        }

        .nav-btn.active:hover {
            color: #e74c3c;
        }

        .field-group {
            margin-bottom: 24px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .field-group select,
        .field-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
            font-family: inherit;
            appearance: auto;
        }

        .field-group select:focus,
        .field-group input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        .field-group .hint {
            font-size: 13px;
            color: #6c7a8e;
            margin-top: 6px;
        }

        /* 字体预览框 */
        .font-preview {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.8;
            transition: font-family 0.2s;
        }

        .font-preview .label {
            color: #6c7a8e;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .font-preview .code-sample {
            margin-top: 6px;
            padding: 8px 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 6px;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .button-bar {
                gap: 12px;
                flex-wrap: wrap;
            }

            .nav-btn {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎨 偏好设置</h1>
        <div class="sub">自定义你的阅读体验</div>

        <div class="button-bar">
            <a href="/user/setting" class="nav-btn">个人信息</a>
            <span class="nav-btn active">偏好设置</span>
            <a href="/user/setting/security" class="nav-btn">安全设置</a>
        </div>

        <form id="preferenceForm">
            <div class="field-group">
                <label for="fontSelect">代码字体</label>
                <select id="fontSelect">
                    <option value="'Courier New', monospace">Courier New（系统自带）</option>
                    <option value="'Consolas', monospace">Consolas（Windows）</option>
                    <option value="'Menlo', monospace">Menlo（macOS）</option>
                    <option value="'Fira Code', monospace">Fira Code（网络字体）</option>
                    <option value="'JetBrains Mono', monospace">JetBrains Mono（网络字体）</option>
                    <option value="'Source Code Pro', monospace">Source Code Pro（网络字体）</option>
                </select>
                <div class="hint">选择你喜欢的代码字体，保存后所有代码块将立即更新。</div>
            </div>

            <!-- 实时预览 -->
            <div class="field-group">
                <label>预览效果</label>
                <div class="font-preview" id="fontPreview">
                    <div class="label">代码示例</div>
                    <div class="code-sample" id="previewSample" style="font-family: 'Courier New', monospace;">
                        #include &lt;bits/stdc++.h&gt;
                        using namespace std;

                        int main() {
                        cout &lt;&lt; "Hello, World!" &lt;&lt; endl;
                        return 0;
                        }
                    </div>
                </div>
            </div>

            <button type="submit" id="saveBtn">保存偏好</button>
        </form>

        <div id="preferenceMsg"></div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let currentUser = null;
            let currentProfile = null;

            const fontSelect = document.getElementById('fontSelect');
            const previewSample = document.getElementById('previewSample');
            const saveBtn = document.getElementById('saveBtn');
            const msgDiv = document.getElementById('preferenceMsg');

            // 字体预览实时更新
            fontSelect.addEventListener('change', function () {
                const font = this.value;
                previewSample.style.fontFamily = font;
            });

            async function loadUserData() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/login';
                        return;
                    }
                    currentUser = session.user;

                    const { data, error } = await supabase
                        .from('profiles')
                        .select('user_number, username, font_preference')
                        .eq('id', currentUser.id)
                        .single();

                    if (error) throw new Error(error.message);

                    currentProfile = data;

                    // 加载已保存的字体偏好
                    if (data.font_preference) {
                        fontSelect.value = data.font_preference;
                        previewSample.style.fontFamily = data.font_preference;
                    } else {
                        // 默认值
                        const defaultFont = "'Courier New', monospace";
                        fontSelect.value = defaultFont;
                        previewSample.style.fontFamily = defaultFont;
                    }
                } catch (err) {
                    console.error('加载用户数据失败:', err);
                    msgDiv.innerHTML = `<div class="message error">加载失败: ${err.message}</div>`;
                }
            }

            async function savePreference(e) {
                e.preventDefault();

                if (!currentUser) {
                    msgDiv.innerHTML = '<div class="message error">请先登录</div>';
                    return;
                }

                const font = fontSelect.value;
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中...';

                try {
                    const { error } = await supabase
                        .from('profiles')
                        .update({ font_preference: font })
                        .eq('id', currentUser.id);

                    if (error) throw new Error(error.message);

                    // 更新本地
                    if (currentProfile) {
                        currentProfile.font_preference = font;
                    }

                    msgDiv.innerHTML = '<div class="message success">偏好设置已保存！</div>';

                    // 3秒后清除消息
                    setTimeout(() => {
                        msgDiv.innerHTML = '';
                    }, 3000);
                } catch (err) {
                    console.error('保存失败:', err);
                    msgDiv.innerHTML = `<div class="message error">保存失败: ${err.message}</div>`;
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '保存偏好';
                }
            }

            // 绑定表单提交
            document.getElementById('preferenceForm').addEventListener('submit', savePreference);

            // 加载数据
            loadUserData();
        })();
    </script>
</body>

</html>
