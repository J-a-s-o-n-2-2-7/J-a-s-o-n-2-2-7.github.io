<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jason227 · 算法竞赛社区</title>
    <style>
        /* 所有样式与之前完全相同，此处省略以节省篇幅 */
        /* 你可以直接复制之前的完整样式，下面只保留关键改动 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        /* 其余样式（导航栏、卡片等）与之前完全相同，请自行复制，此处从略 */
        /* 为了代码完整，建议你从之前的 index.html 中复制样式部分过来 */
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="topbar">
        <div class="logo">✨ Jason227</div>
        <div>
            <span id="userStatus" style="margin-right: 12px;"></span>
            <a href="/login" id="authBtn" class="auth-btn">登录</a>
        </div>
    </div>
    <!-- 其余页面内容（左侧导航、主内容、右侧栏）与之前相同，此处省略 -->
    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const userStatusSpan = document.getElementById('userStatus');
        const authBtn = document.getElementById('authBtn');

        async function updateUI() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                userStatusSpan.innerHTML = `欢迎，${session.user.email} | `;
                authBtn.textContent = '登出';
                authBtn.href = 'javascript:void(0)';
                authBtn.onclick = async () => {
                    await sb.auth.signOut();
                    location.reload();
                };
            } else {
                userStatusSpan.innerHTML = '';
                authBtn.textContent = '登录';
                authBtn.href = '/login';
                authBtn.onclick = null;
            }
        }
        updateUI();
    </script>
</body>

</html>
