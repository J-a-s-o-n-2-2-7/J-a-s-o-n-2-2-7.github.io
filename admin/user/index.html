<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <style>
        /* ===== 样式重置 & 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center
        }

        .auth-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block
        }

        .auth-btn.logout {
            background: #7f8c8d
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none
        }

        .user-email:hover {
            text-decoration: underline
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color .2s
        }

        .bell-icon:hover {
            color: #e74c3c
        }

        .bell-icon svg {
            width: 20px;
            height: 20px
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 24px;
            margin-bottom: 24px
        }

        .card-header {
            font-size: 1.25rem;
            font-weight: 600;
            border-left: 4px solid #e74c3c;
            padding-left: 12px;
            margin-bottom: 20px
        }

        .search-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap
        }

        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border .2s
        }

        .search-bar input:focus {
            border-color: #e74c3c
        }

        .search-bar .result-count {
            font-size: 13px;
            color: #999;
            white-space: nowrap
        }

        .table-wrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle
        }

        th {
            background: #f8f9fc;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2
        }

        th:first-child,
        td:first-child {
            padding-left: 8px
        }

        th.check-col,
        td.check-col {
            width: 40px;
            text-align: center
        }

        th.check-col input,
        td.check-col input {
            cursor: pointer;
            width: 16px;
            height: 16px
        }

        .role-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer
        }

        .role-tag.user {
            background: #e9ecef;
            color: #333
        }

        .role-tag.admin {
            background: #8E44AD;
            color: #fff
        }

        .action-link {
            text-decoration: none;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer
        }

        .action-link.green {
            color: #2ECC71;
            font-weight: 500
        }

        .action-link.red {
            color: #E74C3C;
            font-weight: 500
        }

        .action-link.green:hover {
            background: #eafaf1
        }

        .action-link.red:hover {
            background: #fdedec
        }

        .action-link.disabled {
            cursor: default;
            opacity: 0.6
        }

        .action-link.disabled:hover {
            background: transparent
        }

        .editable-field {
            cursor: default;
            padding: 2px 4px;
            border-radius: 3px
        }

        .editable-field:hover {
            background: #f0f2f5
        }

        .editable-field-input {
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 14px;
            width: 100%;
            min-width: 80px;
            outline: none
        }

        .username-display {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500
        }

        .username-display:hover {
            background: #f0f2f5
        }

        /* 用户标签：背景色由内联 style 控制，文字白色 */
        .user-tag-display {
            display: inline-block;
            border-radius: 2px;
            padding: 2px 9px;
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            margin: 0 0 0 4px;
            cursor: default;
            transition: filter 0.15s;
            background-color: #8e44ad;
            /* fallback */
        }

        .user-tag-display:hover {
            filter: brightness(0.9)
        }

        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin: 2px
        }

        .btn-sm.grant {
            background: #2ECC71;
            color: #fff
        }

        .btn-sm.revoke {
            background: #E74C3C;
            color: #fff
        }

        .btn-sm:disabled {
            opacity: 0.5;
            cursor: not-allowed
        }

        .btn-sm.batch {
            background: #3498DB;
            color: #fff;
            padding: 6px 16px;
            font-size: 13px
        }

        .batch-bar {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f8f9fc;
            border-radius: 8px;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .batch-bar.show {
            display: flex
        }

        .batch-bar .info {
            font-size: 14px;
            color: #2c3e50;
            margin-right: 8px
        }

        .batch-bar .btn-sm {
            font-size: 12px;
            padding: 4px 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px
        }

        .back-link:hover {
            text-decoration: underline
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center
        }

        .error {
            background: #fee2e2;
            color: #b91c1c
        }

        .success {
            background: #dcfce7;
            color: #166534
        }

        .loading-text {
            color: #999;
            text-align: center;
            padding: 40px
        }

        @media (max-width:800px) {

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block
            }

            thead tr {
                display: none
            }

            tr {
                border: 1px solid #eee;
                margin-bottom: 10px;
                padding: 10px
            }

            td {
                border: none;
                padding: 6px 0;
                display: flex;
                justify-content: space-between;
                align-items: center
            }

            td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #333;
                margin-right: 10px;
                flex-shrink: 0
            }

            td.check-col {
                display: flex;
                justify-content: flex-start
            }

            td.check-col::before {
                content: '';
                display: none
            }

            .batch-bar {
                flex-direction: column;
                align-items: stretch
            }

            .editable-field-input {
                width: auto
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="logo">✨ Jason227</div>
        <div class="auth-buttons" id="authButtons">
            <a href="/user/notification" class="bell-icon" id="bellLink">
                <svg viewBox="0 0 448 512" width="20" height="20">
                    <path fill="currentColor"
                        d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z" />
                </svg>
                <sup id="bell-badge" style="display:none;">0</sup>
            </a>
            <span class="user-email" id="userDisplay">加载中...</span>
            <button id="logoutBtn" class="auth-btn logout">登出</button>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <div class="card-header">管理后台</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 搜索用户编号、用户名、备注名、用户类型、权限...">
                <span class="result-count" id="resultCount">共 0 位用户</span>
            </div>
            <div class="table-wrap">
                <div id="userList">
                    <div class="loading-text">加载用户列表...</div>
                </div>
            </div>
            <div class="batch-bar" id="batchBar">
                <span class="info" id="batchInfo">已选 0 位用户</span>
                <button class="btn-sm grant" id="batchGrantEnterSite">授予进入主站权限</button>
                <button class="btn-sm revoke" id="batchRevokeEnterSite">撤销进入主站权限</button>
                <button class="btn-sm grant" id="batchGrantSpeak">授予自由发言权限</button>
                <button class="btn-sm revoke" id="batchRevokeSpeak">撤销自由发言权限</button>
                <button class="btn-sm grant" id="batchGrantAdmin">授予进入后台权限</button>
                <button class="btn-sm revoke" id="batchRevokeAdmin">撤销进入后台权限</button>
                <button class="btn-sm grant" id="batchGrantUserMgmt">授予用户管理权限</button>
                <button class="btn-sm revoke" id="batchRevokeUserMgmt">撤销用户管理权限</button>
                <button class="btn-sm grant" id="batchGrantPostMgmt">授予秩序管理权限</button>
                <button class="btn-sm revoke" id="batchRevokePostMgmt">撤销秩序管理权限</button>
                <button class="btn-sm grant" id="batchGrantSpecial">授予特殊权益</button>
                <button class="btn-sm revoke" id="batchRevokeSpecial">撤销特殊权益</button>
            </div>
            <div id="msgDiv"></div>
        </div>
        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            let currentUser = null,
                currentProfile = null,
                allUsers = [],
                filteredUsers = [];
            const authButtons = document.getElementById('authButtons');
            const userList = document.getElementById('userList');
            const msgDiv = document.getElementById('msgDiv');
            const searchInput = document.getElementById('searchInput');
            const resultCount = document.getElementById('resultCount');
            const batchBar = document.getElementById('batchBar');
            const batchInfo = document.getElementById('batchInfo');
            const bellBadge = document.getElementById('bell-badge');
            const userDisplay = document.getElementById('userDisplay');

            // ---------- 工具函数 ----------
            function escapeHtmlAttr(s) { if (!s) return ''; return s.replace(/[&<>"]/g, m => { if (m === '&') return '&'; if (m === '<') return '<'; if (m === '>') return '>'; if (m === '"') return '"'; return m; }); }

            function formatTime(iso) { if (!iso) return '未知'; try { return new Date(iso).toLocaleString('zh-CN'); } catch { return iso; } }

            function showError(text) { msgDiv.innerHTML = `<div class="message error"><span class="katex-error" title="ParseError: KaTeX parse error: Expected &#x27;EOF&#x27;, got &#x27;}&#x27; at position 63: …L = &#x27;&#x27;, 5000); }̲

            f…" style="color:#cc0000">{text}&lt;/div&gt;`; setTimeout(() =&gt; msgDiv.innerHTML = &#x27;&#x27;, 5000); }

            function showSuccess(text) { msgDiv.innerHTML = `&lt;div class=&quot;message success&quot;&gt;</span>{text}</div>`; setTimeout(() => msgDiv.innerHTML = '', 5000); }

            // ---------- 日志相关 ----------
            async function getCurrentAdminId() {
                if (currentUser) return currentUser.id;
                const { data: { user } } = await supabase.auth.getUser();
                if (user) return user.id;
                return null;
            }

            async function insertJudgementLog(adminId, targetUserId, actionType, actionDetail, reason) {
                try {
                    const { error } = await supabase
                        .from('judgement_logs')
                        .insert({
                            admin_id: adminId,
                            target_user_id: targetUserId,
                            action_type: actionType,
                            action_detail: actionDetail,
                            reason: reason,
                        });
                    if (error) console.error('记录日志失败:', error);
                } catch (err) { console.error('记录日志异常:', err); }
            }

            async function promptReason(operationName) {
                const { value: reason } = await Swal.fire({
                    title: `请输入 <span class="katex-error" title="ParseError: KaTeX parse error: Expected &#x27;EOF&#x27;, got &#x27;}&#x27; at position 470: …               }̲);
            …" style="color:#cc0000">{operationName} 的原因`,
                    input: &#x27;textarea&#x27;,
                    inputPlaceholder: &#x27;详细说明操作原因...&#x27;,
                    showCancelButton: true,
                    confirmButtonText: &#x27;确认操作&#x27;,
                    cancelButtonText: &#x27;取消&#x27;,
                    inputValidator: (value) =&gt; {
                        if (!value || value.trim() === &#x27;&#x27;) {
                            return &#x27;原因不能为空！&#x27;;
                        }
                    }
                });
                return reason;
            }

            // ---------- 通用更新 ----------
            async function updateUserField(userNumber, updateData) {
                try {
                    const { data, error } = await supabase
                        .from(&#x27;profiles&#x27;)
                        .update(updateData)
                        .eq(&#x27;user_number&#x27;, userNumber)
                        .select();
                    if (error) throw error;
                    if (data &amp;&amp; data.length &gt; 0) {
                        const target = allUsers.find(u =&gt; u.user_number === userNumber);
                        if (target) Object.assign(target, data[0]);
                    }
                } catch (err) {
                    console.error(&#x27;更新失败:&#x27;, err);
                    showError(&#x27;操作失败：&#x27; + err.message);
                    throw err;
                }
            }

            // ================================================================
            //  1. 单个切换管理员（联动 user_tag + username_color）
            // ================================================================
            async function toggleAdmin(userNumber) {
                try {
                    const targetUser = allUsers.find(u =&gt; u.user_number === userNumber);
                    if (!targetUser) { showError(&#x27;用户不存在&#x27;); return; }

                    const { data: u, error: fetchErr } = await supabase
                        .from(&#x27;profiles&#x27;)
                        .select(&#x27;is_admin, user_tag&#x27;)
                        .eq(&#x27;user_number&#x27;, userNumber)
                        .single();
                    if (fetchErr) throw new Error(&#x27;查询失败: &#x27; + fetchErr.message);

                    const newAdmin = !u.is_admin;
                    const actionName = newAdmin ? &#x27;授予管理员权限&#x27; : &#x27;撤销管理员权限&#x27;;
                    const reason = await promptReason(actionName);
                    if (!reason) return;

                    let newTag = u.user_tag || &#x27;&#x27;;
                    if (newAdmin) {
                        if (!newTag) newTag = &#x27;管理员&#x27;;
                    } else {
                        if (newTag === &#x27;管理员&#x27;) newTag = null;
                    }
                    const color = newAdmin ? &#x27;#9b59b6&#x27; : &#x27;#333&#x27;;

                    await updateUserField(userNumber, {
                        is_admin: newAdmin,
                        user_tag: newTag,
                        username_color: color
                    });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertJudgementLog(
                            adminId,
                            targetUser.id,
                            newAdmin ? &#x27;grant_perm&#x27; : &#x27;revoke_perm&#x27;, { permission: &#x27;is_admin&#x27;, new_value: newAdmin },
                            reason
                        );
                    }
                    await loadUsers();
                } catch (err) {
                    showError(&#x27;操作失败：&#x27; + err.message);
                }
            }

            // ================================================================
            //  2. 切换其他权限（不涉及颜色）
            // ================================================================
            async function togglePermission(userNumber, field, currentValue) {
                try {
                    const targetUser = allUsers.find(u =&gt; u.user_number === userNumber);
                    if (!targetUser) { showError(&#x27;用户不存在&#x27;); return; }
                    const newValue = !currentValue;
                    const fieldMap = {
                        &#x27;can_manage_users&#x27;: &#x27;用户管理&#x27;,
                        &#x27;can_manage_posts&#x27;: &#x27;秩序管理&#x27;,
                        &#x27;can_speak&#x27;: &#x27;自由发言&#x27;,
                        &#x27;is_banned&#x27;: &#x27;进入主站&#x27;
                    };
                    const fieldName = fieldMap[field] || field;
                    const actionName = newValue ? `授予 </span>{fieldName} 权限` : `撤销 <span class="katex-error" title="ParseError: KaTeX parse error: Expected &#x27;EOF&#x27;, got &#x27;}&#x27; at position 686: …               }̲ catch (err) {
…" style="color:#cc0000">{fieldName} 权限`;
                    const reason = await promptReason(actionName);
                    if (!reason) return;

                    await updateUserField(userNumber, { [field]: newValue });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertJudgementLog(
                            adminId,
                            targetUser.id,
                            newValue ? &#x27;grant_perm&#x27; : &#x27;revoke_perm&#x27;, { permission: field, new_value: newValue },
                            reason
                        );
                    }
                    await loadUsers();
                } catch (err) {
                    showError(&#x27;权限更新失败：&#x27; + err.message);
                }
            }

            // ================================================================
            //  3. 切换封禁
            // ================================================================
            async function toggleBan(userNumber) {
                try {
                    const targetUser = allUsers.find(u =&gt; u.user_number === userNumber);
                    if (!targetUser) { showError(&#x27;用户不存在&#x27;); return; }
                    const current = targetUser.is_banned || false;
                    const newValue = !current;
                    const actionName = newValue ? &#x27;封禁用户&#x27; : &#x27;解封用户&#x27;;
                    const reason = await promptReason(actionName);
                    if (!reason) return;

                    await updateUserField(userNumber, { is_banned: newValue });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertJudgementLog(
                            adminId,
                            targetUser.id,
                            newValue ? &#x27;ban&#x27; : &#x27;unban&#x27;, { permission: &#x27;is_banned&#x27;, new_value: newValue },
                            reason
                        );
                    }
                    await loadUsers();
                } catch (err) {
                    showError(&#x27;操作失败：&#x27; + err.message);
                }
            }

            // ================================================================
            //  4. 切换特殊权益
            // ================================================================
            async function toggleSpecialPrivilege(userNumber, currentValue) {
                try {
                    const targetUser = allUsers.find(u =&gt; u.user_number === userNumber);
                    if (!targetUser) { showError(&#x27;用户不存在&#x27;); return; }
                    const newValue = !currentValue;
                    const actionName = newValue ? &#x27;授予特殊权益&#x27; : &#x27;撤销特殊权益&#x27;;
                    const reason = await promptReason(actionName);
                    if (!reason) return;

                    await updateUserField(userNumber, { special_privilege: newValue });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertJudgementLog(
                            adminId,
                            targetUser.id,
                            newValue ? &#x27;grant_perm&#x27; : &#x27;revoke_perm&#x27;, {
                                permission: &#x27;special_privilege&#x27;,
                            new_value: newValue
                        },
                            reason
                        );
                    }
                    await loadUsers();
                } catch (err) {
                    showError(&#x27;操作失败：&#x27; + err.message);
                }
            }

            // ================================================================
            //  5. 批量操作（通用，不涉及管理员颜色）
            // ================================================================
            async function batchAction(actionName, updateObj) {
                const ids = JSON.parse(batchBar.dataset.selected || &#x27;[]&#x27;);
                if (ids.length === 0) { showError(&#x27;请先选择用户&#x27;); return; }
                const reason = await promptReason(actionName);
                if (!reason) return;

                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from(&#x27;profiles&#x27;)
                        .select(&#x27;user_number, id&#x27;)
                        .in(&#x27;user_number&#x27;, ids);
                    if (fetchErr) throw fetchErr;

                    const { error } = await supabase.from(&#x27;profiles&#x27;).update(updateObj).in(&#x27;user_number&#x27;, ids);
                    if (error) throw error;

                    for (const uid of ids) {
                        const target = allUsers.find(u =&gt; u.user_number === uid);
                        if (target) Object.assign(target, updateObj);
                    }

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        let actionType = &#x27;grant_perm&#x27;;
                        let field = Object.keys(updateObj)[0];
                        let newValue = updateObj[field];
                        if (field === &#x27;is_banned&#x27;) {
                            actionType = newValue ? &#x27;ban&#x27; : &#x27;unban&#x27;;
                        } else {
                            actionType = newValue ? &#x27;grant_perm&#x27; : &#x27;revoke_perm&#x27;;
                        }
                        for (const user of users) {
                            await insertJudgementLog(
                                adminId,
                                user.id,
                                actionType, { permission: field, new_value: newValue },
                                reason
                            );
                        }
                    }

                    document.querySelectorAll(&#x27;.row-checkbox:checked&#x27;).forEach(cb =&gt; cb.checked = false);
                    await loadUsers();
                } catch (err) {
                    showError(`批量</span>{actionName}失败：` + err.message);
                }
            }

            // ================================================================
            //  6. 批量授予/撤销进入后台（联动 user_tag + username_color）
            // ================================================================
            async function batchGrantAdmin() {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptReason('批量授予进入后台权限');
                if (!reason) return;

                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id, user_tag')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;

                    for (const u of users) {
                        let tag = u.user_tag || '';
                        if (!tag) tag = '管理员';
                        await supabase.from('profiles')
                            .update({ is_admin: true, user_tag: tag, username_color: '#9b59b6' })
                            .eq('user_number', u.user_number);
                        const target = allUsers.find(t => t.user_number === u.user_number);
                        if (target) {
                            target.is_admin = true;
                            target.user_tag = tag;
                            target.username_color = '#9b59b6';
                        }
                    }

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        for (const u of users) {
                            await insertJudgementLog(
                                adminId,
                                u.id,
                                'grant_perm', { permission: 'is_admin', new_value: true },
                                reason
                            );
                        }
                    }

                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) {
                    showError('批量授予进入后台失败：' + err.message);
                }
            }

                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptReason('批量撤销进入后台权限');

            // ---------- 通知未读数 ----------
            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    const { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        if (count > 0) {
                            bellBadge.textContent = count > 99 ? '99+' : count;
                            bellBadge.style.display = 'inline-flex';
                        } else { bellBadge.style.display = 'none'; }
                    }
                } catch (err) { console.error(err); }
            }

            // ---------- 初始化 ----------
            async function init() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = '/login'; return; }
                    currentUser = session.user;
                    const { data: profile, error: profileError } = await supabase.from('profiles').select(
                        'user_number,username,can_manage_users').eq('id', currentUser.id).single();
                    if (profileError || !profile || !profile.can_manage_users) { window.location.href = '/'; return; }
                    currentProfile = profile;
                    const displayName = profile.username || currentUser.email;
                    userDisplay.textContent = displayName;
                    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                        await supabase.auth
                            .signOut();
                        window.location.href = '/';
                    });
                    await loadUsers();
                    searchInput.addEventListener('input', function () { filterUsers(this.value.trim()); });
                    await fetchUnreadCount();
                    setInterval(fetchUnreadCount, 30000);
                } catch (err) {
                    console.error(err);
                    window.location.href = '/';
                }
            }

            // ---------- 精确搜索 ----------
            function filterUsers(keyword) {
                if (!keyword) {
                    filteredUsers = [...allUsers];
                    renderUserList();
                    return;
                }
                const trimmed = keyword.trim();
                const lower = trimmed.toLowerCase();
                const isNumber = /^\d+</span>/.test(trimmed);

                filteredUsers = allUsers.filter(user => {
                    const isAdmin = user.is_admin;
                    const roleLabel = isAdmin ? '管理员' : '普通用户';
                    const remark = user.remark || '';
                    const tag = user.user_tag || '';
                    const username = user.username || '';
                    const userNumber = String(user.user_number);

                    if (isNumber && userNumber === trimmed) return true;
                    if (username.toLowerCase() === lower) return true;
                    if (remark.toLowerCase() === lower) return true;
                    if (roleLabel === trimmed) return true;
                    if (tag.toLowerCase() === lower) return true;
                    if (trimmed === '用户管理' && user.can_manage_users) return true;
                    if (trimmed === '秩序管理' && user.can_manage_posts) return true;

                    return false;
                });
                renderUserList();
            }

                        if (newRole === null) return;
                        const idx = parseInt(newRole) - 1;
                        if (isNaN(idx) || idx &lt; 0 || idx &gt; 1) { showError(&#x27;无效选项&#x27;); return; }
                        const target = options[idx];
                        if (target === currentRole) return;

                        const actionName = `切换用户角色为 </span>{target}`;
                        const reason = await promptReason(actionName);
                        if (!reason) return;

                        const targetUser = allUsers.find(u => u.user_number === uid);
                        if (!targetUser) { showError('用户不存在'); return; }

                        const { data: u, error: fetchErr } = await supabase.from('profiles')
                            .select('user_tag')
                            .eq('user_number', uid)
                            .single();
                        if (fetchErr) { showError('获取用户信息失败'); return; }

                        let tag = u.user_tag || '';
                        let update = {};
                        let newAdmin = false;
                        if (target === '管理员') {
                            update.is_admin = true;
                            newAdmin = true;
                            if (!tag) tag = '管理员';
                            update.username_color = '#9b59b6';
                        } else {
                            update.is_admin = false;
                            newAdmin = false;
                            if (tag === '管理员') tag = null;
                            update.username_color = '#333';
                        }
                        update.user_tag = tag;

                        try {
                            await updateUserField(uid, update);
                            const adminId = await getCurrentAdminId();
                            if (adminId) {
                                await insertJudgementLog(
                                    adminId,
                                    targetUser.id,
                                    newAdmin ? 'grant_perm' : 'revoke_perm', {
                                        permission: 'is_admin',
                                    new_value: newAdmin
                                },
                                    reason
                                );
                            }
                            await loadUsers();
                        } catch (err) { showError('操作失败：' + err.message); }
                    });
                });

                // ---- 全选 ----
                const selectAll = document.getElementById('selectAll');
                if (selectAll) {
                    selectAll.addEventListener('change', function () {
                        document.querySelectorAll('.row-checkbox:not(:disabled)').forEach(cb => cb.checked = this
                            .checked);
                        updateBatchBar();
                    });
                }
                document.querySelectorAll('.row-checkbox').forEach(cb => cb.addEventListener('change', updateBatchBar));
                updateBatchBar();
            }

            // ---------- 批量操作栏状态 ----------
            function updateBatchBar() {
                const checked = document.querySelectorAll('.row-checkbox:checked:not(:disabled)');
                const count = checked.length;
                if (count === 0) { batchBar.classList.remove('show'); return; }
                batchBar.classList.add('show');
                batchInfo.textContent = `已选 ${count} 位用户`;
                const ids = Array.from(checked).map(cb => parseInt(cb.dataset.user));
                batchBar.dataset.selected = JSON.stringify(ids);
            }

            // ---------- 批量按钮事件绑定 ----------
            document.getElementById('batchGrantEnterSite').addEventListener('click', () => batchAction('授予进入主站权限',
                { is_banned: false }));
            document.getElementById('batchRevokeEnterSite').addEventListener('click', () => batchAction('撤销进入主站权限',
                { is_banned: true }));
            document.getElementById('batchGrantSpeak').addEventListener('click', () => batchAction('授予自由发言权限',
                { can_speak: true }));
            document.getElementById('batchRevokeSpeak').addEventListener('click', () => batchAction('撤销自由发言权限',
                { can_speak: false }));
            document.getElementById('batchGrantAdmin').addEventListener('click', batchGrantAdmin);
            document.getElementById('batchRevokeAdmin').addEventListener('click', batchRevokeAdmin);
            document.getElementById('batchGrantUserMgmt').addEventListener('click', () => batchAction('授予用户管理权限',
                { can_manage_users: true }));
            document.getElementById('batchRevokeUserMgmt').addEventListener('click', () => batchAction('撤销用户管理权限',
                { can_manage_users: false }));
            document.getElementById('batchGrantPostMgmt').addEventListener('click', () => batchAction('授予秩序管理权限',
                { can_manage_posts: true }));
            document.getElementById('batchRevokePostMgmt').addEventListener('click', () => batchAction('撤销秩序管理权限',
                { can_manage_posts: false }));
            document.getElementById('batchGrantSpecial').addEventListener('click', () => batchAction('授予特殊权益',
                { special_privilege: true }));
            document.getElementById('batchRevokeSpecial').addEventListener('click', () => batchAction('撤销特殊权益',
                { special_privilege: false }));

            // ---------- 启动 ----------
            init();
        })();
    </script>
</body>

</html>
