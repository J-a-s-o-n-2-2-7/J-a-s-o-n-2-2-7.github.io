<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改用户名 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 450px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .field-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
        }

        .restriction {
            font-size: 12px;
            color: #6c7a8e;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>📝 修改用户名</h1>
        <div class="sub">一年（365天）内仅可修改一次用户名</div>
        <div class="field-group">
            <label>新用户名</label>
            <input type="text" id="newUsername" placeholder="6-16位字母/数字/下划线，不能以数字开头" autocomplete="off">
        </div>
        <div id="restrictionMsg" class="restriction"></div>
        <button id="submitBtn">提交</button>
        <div id="msg" class="message"></div>
        <a href="/user/setting/security" class="back-link">← 返回安全设置</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let profileData = null;

        async function loadData() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login';
                return;
            }
            currentUser = session.user;
            const { data, error } = await supabase
                .from('profiles')
                .select('username, username_last_modified, is_super_admin')
                .eq('id', currentUser.id)
                .single();
            if (error) return;
            profileData = data;

            const isSuperAdmin = data.is_super_admin === true;
            const lastModified = data.username_last_modified ? new Date(data.username_last_modified) : null;
            const restrictionDiv = document.getElementById('restrictionMsg');
            if (isSuperAdmin) {
                restrictionDiv.innerHTML = '👑 站长无修改时间限制';
            } else {
                if (!lastModified) {
                    restrictionDiv.innerHTML = '✅ 首次修改，无时间限制';
                } else {
                    const nextAllowed = new Date(lastModified);
                    nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                    const now = new Date();
                    if (now >= nextAllowed) {
                        restrictionDiv.innerHTML = '✅ 现在可以修改用户名';
                    } else {
                        const days = Math.ceil((nextAllowed - now) / (1000 * 60 * 60 * 24));
                        restrictionDiv.innerHTML = `⏰ 距离上次修改不足一年，还需等待 ${days} 天<br>暂不可修改。`;
                        document.getElementById('submitBtn').disabled = true;
                    }
                }
            }
        }

        async function updateUsername() {
            const newUsername = document.getElementById('newUsername').value.trim();
            const msgDiv = document.getElementById('msg');
            if (!newUsername) {
                msgDiv.innerHTML = '<div class="message error">请输入新用户名</div>';
                return;
            }
            const usernameRegex = /^[a-zA-Z_][a-zA-Z0-9_]{5,15}$/;
            if (!usernameRegex.test(newUsername)) {
                msgDiv.innerHTML = '<div class="message error">用户名格式错误（6-16位字母/数字/下划线，不能以数字开头）</div>';
                return;
            }
            if (newUsername === profileData.username) {
                msgDiv.innerHTML = '<div class="message error">新用户名与当前相同，无需修改</div>';
                return;
            }
            const { data: existing, error: checkError } = await supabase
                .from('profiles')
                .select('username')
                .eq('username', newUsername)
                .maybeSingle();
            if (existing) {
                msgDiv.innerHTML = '<div class="message error">用户名已被占用，请换一个</div>';
                return;
            }
            const isSuperAdmin = profileData.is_super_admin === true;
            if (!isSuperAdmin) {
                const lastModified = profileData.username_last_modified ? new Date(profileData.username_last_modified) : null;
                if (lastModified) {
                    const nextAllowed = new Date(lastModified);
                    nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                    if (new Date() < nextAllowed) {
                        const days = Math.ceil((nextAllowed - new Date()) / (1000 * 60 * 60 * 24));
                        msgDiv.innerHTML = `<div class="message error">距离上次修改不足一年，还需等待 ${days} 天</div>`;
                        return;
                    }
                }
            }
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';
            const { error } = await supabase
                .from('profiles')
                .update({
                    username: newUsername,
                    username_last_modified: new Date().toISOString()
                })
                .eq('id', currentUser.id);
            btn.disabled = false;
            btn.textContent = '提交';
            if (error) {
                msgDiv.innerHTML = `<div class="message error">修改失败: ${error.message}</div>`;
            } else {
                msgDiv.innerHTML = '<div class="message success">用户名修改成功！请重新登录</div>';
                setTimeout(() => {
                    supabase.auth.signOut();
                    window.location.href = '/login';
                }, 2000);
            }
        }

        document.getElementById('submitBtn').addEventListener('click', updateUsername);
        loadData();
    </script>
</body>

</html>
