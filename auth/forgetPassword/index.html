<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .forget-card {
            background: white;
            width: 480px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input,
        .verification-row input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .input-group input:focus,
        .verification-row input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
            background: white;
        }

        .verification-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .verification-row button {
            width: auto;
            padding: 12px 16px;
            background: #e74c3c;
            font-size: 14px;
            white-space: nowrap;
            border: none;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        .verification-row button:hover {
            background: #c0392b;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #e74c3c;
            text-decoration: none;
        }

        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .captcha-row input {
            flex: 1;
        }

        .captcha-row canvas {
            cursor: pointer;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            width: 120px;
            height: 44px;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .turnstile-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="forget-card">
        <h1>✨ Jason227</h1>
        <div class="sub">忘记密码</div>

        <div class="tabs">
            <div class="tab active" data-type="email">邮箱</div>
            <div class="tab" data-type="phone">手机号</div>
        </div>

        <!-- 邮箱重置面板 -->
        <div id="emailPanel" class="form-panel active">
            <div class="input-group">
                <input type="email" id="resetEmail" placeholder="邮箱" autocomplete="email">
            </div>
            <div class="input-group">
                <div class="captcha-row">
                    <input type="text" id="captchaInput" placeholder="请输入图形验证码" autocomplete="off" maxlength="6">
                    <canvas id="captchaCanvas" width="120" height="44"></canvas>
                </div>
            </div>
            <div class="verification-row" id="emailCodeRow">
                <input type="text" id="emailCode" placeholder="6位数字验证码" autocomplete="off" maxlength="6">
                <button type="button" id="sendEmailCodeBtn">发送验证码</button>
            </div>
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="新密码" autocomplete="new-password">
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="off">
            </div>
        </div>

        <!-- 手机号重置面板（保留图形验证码和 Turnstile） -->
        <div id="phonePanel" class="form-panel">
            <div class="input-group">
                <input type="tel" id="resetPhone" placeholder="手机号" autocomplete="tel">
            </div>
            <div class="input-group">
                <div class="captcha-row">
                    <input type="text" id="captchaInput2" placeholder="请输入图形验证码" autocomplete="off" maxlength="6">
                    <canvas id="captchaCanvas2" width="120" height="44"></canvas>
                </div>
            </div>
            <div class="input-group">
                <input type="password" id="newPasswordPhone" placeholder="新密码" autocomplete="new-password">
            </div>
            <div class="input-group">
                <input type="password" id="confirmPasswordPhone" placeholder="再次输入密码" autocomplete="off">
            </div>
            <div class="turnstile-wrapper">
                <div class="cf-turnstile" data-sitekey="0x4AAAAAADcNcP2JrYuEkEhx" data-theme="light"></div>
            </div>
        </div>

        <button id="resetBtn">重置密码</button>
        <div id="msg" class="message"></div>
        <div class="footer-links">
            <a href="/auth/login">已有账号？</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const EDGE_SEND_CODE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/send-email-code';
        const EDGE_VERIFY_CODE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-email-code';
        const EDGE_RESET_PASSWORD = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/reset-password';
        const EDGE_VERIFY_TURNSTILE = 'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-phone-turnstile';

        // 图形验证码（邮箱和手机各一套）
        let currentCaptchaEmail = '';
        let currentCaptchaPhone = '';
        const canvasEmail = document.getElementById('captchaCanvas');
        const ctxEmail = canvasEmail.getContext('2d');
        const canvasPhone = document.getElementById('captchaCanvas2');
        const ctxPhone = canvasPhone.getContext('2d');

        function generateCaptcha(ctx, canvas, setVar) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) captcha += chars[Math.floor(Math.random() * chars.length)];
            const code = captcha.toUpperCase();
            if (setVar === 'email') currentCaptchaEmail = code;
            else currentCaptchaPhone = code;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(100,100,100,${0.2 + Math.random() * 0.5})`;
                ctx.stroke();
            }
            for (let i = 0; i < 60; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }
            for (let i = 0; i < code.length; i++) {
                ctx.font = `${24 + Math.floor(Math.random() * 6)}px "Courier New", monospace`;
                ctx.fillStyle = `rgb(${50 + Math.random() * 100}, ${30 + Math.random() * 80}, ${20 + Math.random() * 70})`;
                const x = 12 + i * 20 + Math.random() * 6;
                const y = 30 + Math.random() * 8;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
        }

        canvasEmail.addEventListener('click', () => generateCaptcha(ctxEmail, canvasEmail, 'email'));
        canvasPhone.addEventListener('click', () => generateCaptcha(ctxPhone, canvasPhone, 'phone'));
        generateCaptcha(ctxEmail, canvasEmail, 'email');
        generateCaptcha(ctxPhone, canvasPhone, 'phone');

        // 选项卡切换
        const emailPanel = document.getElementById('emailPanel');
        const phonePanel = document.getElementById('phonePanel');
        const tabs = document.querySelectorAll('.tab');
        let activeTab = 'email';
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const type = tab.getAttribute('data-type');
                if (type === activeTab) return;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (type === 'email') {
                    emailPanel.classList.add('active');
                    phonePanel.classList.remove('active');
                    activeTab = 'email';
                } else {
                    phonePanel.classList.add('active');
                    emailPanel.classList.remove('active');
                    activeTab = 'phone';
                }
                document.getElementById('msg').innerHTML = '';
            });
        });

        // 邮箱发送验证码
        let emailTimer = null;
        let emailCountdown = 0;
        const sendEmailBtn = document.getElementById('sendEmailCodeBtn');
        async function sendEmailCode() {
            const email = document.getElementById('resetEmail').value.trim();
            const userCaptcha = document.getElementById('captchaInput').value.trim();
            if (!email || !userCaptcha) {
                showMessage('请填写完整所有内容', 'error');
                return;
            }
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                showMessage('邮箱地址不合法', 'error');
                return;
            }
            if (userCaptcha.toUpperCase() !== currentCaptchaEmail) {
                showMessage('图形验证码错误', 'error');
                generateCaptcha(ctxEmail, canvasEmail, 'email');
                document.getElementById('captchaInput').value = '';
                return;
            }

            sendEmailBtn.disabled = true;
            sendEmailBtn.textContent = '发送中...';
            try {
                const response = await fetch(EDGE_SEND_CODE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (response.ok) {
                    startEmailCountdown(60);
                } else {
                    sendEmailBtn.disabled = false;
                    sendEmailBtn.textContent = '发送验证码';
                    const result = await response.json();
                    showMessage(result.error || '发送失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误', 'error');
                sendEmailBtn.disabled = false;
                sendEmailBtn.textContent = '发送验证码';
            }
        }
        function startEmailCountdown(seconds) {
            emailCountdown = seconds;
            sendEmailBtn.disabled = true;
            if (emailTimer) clearInterval(emailTimer);
            emailTimer = setInterval(() => {
                if (emailCountdown <= 0) {
                    clearInterval(emailTimer);
                    sendEmailBtn.disabled = false;
                    sendEmailBtn.textContent = '发送验证码';
                } else {
                    sendEmailBtn.textContent = `${emailCountdown}s 后重试`;
                    emailCountdown--;
                }
            }, 1000);
        }
        sendEmailBtn.addEventListener('click', sendEmailCode);

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('msg');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { if (msgDiv) msgDiv.innerHTML = ''; }, 4000);
        }

        async function getEmailByPhone(phone) {
            const { data, error } = await sb
                .from('profiles')
                .select('email')
                .eq('phone', phone)
                .maybeSingle();
            if (error || !data) return null;
            return data.email;
        }

        async function resetPassword(userId, newPassword) {
            const response = await fetch(EDGE_RESET_PASSWORD, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, newPassword })
            });
            const result = await response.json();
            if (response.ok) {
                showMessage('重置成功', 'success');
                setTimeout(() => { window.location.href = '/auth/login'; }, 2000);
            } else {
                showMessage(`重置失败: ${result.error}`, 'error');
            }
        }

        const resetBtn = document.getElementById('resetBtn');
        resetBtn.addEventListener('click', async () => {
            if (activeTab === 'email') {
                const email = document.getElementById('resetEmail').value.trim();
                const code = document.getElementById('emailCode').value.trim();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPwd = document.getElementById('confirmPassword').value;
                const userCaptcha = document.getElementById('captchaInput').value.trim();

                if (!email || !code || !newPassword || !confirmPwd || !userCaptcha) {
                    showMessage('请填写完整所有内容', 'error');
                    return;
                }
                if (newPassword !== confirmPwd) { showMessage('两次输入的密码不匹配', 'error'); return; }
                if (newPassword.length < 6) { showMessage('密码长度过短或过长', 'error'); return; }
                if (userCaptcha.toUpperCase() !== currentCaptchaEmail) {
                    showMessage('图形验证码错误', 'error');
                    generateCaptcha(ctxEmail, canvasEmail, 'email');
                    document.getElementById('captchaInput').value = '';
                    return;
                }

                const verifyResp = await fetch(EDGE_VERIFY_CODE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const verifyResult = await verifyResp.json();
                if (!verifyResp.ok) { showMessage(`验证码错误: ${verifyResult.error}`, 'error'); return; }

                const { data: userData, error: userError } = await sb
                    .from('profiles')
                    .select('id')
                    .eq('email', email)
                    .single();
                if (userError || !userData) { showMessage('用户不存在', 'error'); return; }

                await resetPassword(userData.id, newPassword);
            }
            else { // 手机号重置
                const phone = document.getElementById('resetPhone').value.trim();
                const newPassword = document.getElementById('newPasswordPhone').value;
                const confirmPwd = document.getElementById('confirmPasswordPhone').value;
                const userCaptcha = document.getElementById('captchaInput2').value.trim();
                const turnstileToken = document.querySelector('#phonePanel .cf-turnstile [name="cf-turnstile-response"]')?.value;

                if (!phone || !newPassword || !confirmPwd || !userCaptcha || !turnstileToken) {
                    showMessage('请填写完整所有内容', 'error');
                    return;
                }
                if (newPassword !== confirmPwd) { showMessage('两次输入的密码不匹配', 'error'); return; }
                if (newPassword.length < 6) { showMessage('密码长度过短或过长', 'error'); return; }
                if (userCaptcha.toUpperCase() !== currentCaptchaPhone) {
                    showMessage('图形验证码错误', 'error');
                    generateCaptcha(ctxPhone, canvasPhone, 'phone');
                    document.getElementById('captchaInput2').value = '';
                    return;
                }

                const turnstileResp = await fetch(EDGE_VERIFY_TURNSTILE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: turnstileToken })
                });
                const turnstileResult = await turnstileResp.json();
                if (!turnstileResp.ok) { showMessage(turnstileResult.error || '安全验证失败', 'error'); return; }

                const email = await getEmailByPhone(phone);
                if (!email) { showMessage('用户不存在', 'error'); return; }
                const { data: userData, error: userError } = await sb
                    .from('profiles')
                    .select('id')
                    .eq('email', email)
                    .single();
                if (userError || !userData) { showMessage('用户不存在', 'error'); return; }

                await resetPassword(userData.id, newPassword);
            }
        });
    </script>
</body>

</html>
