<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解锁账户 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .unlock-card {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #e74c3c;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="unlock-card">
        <h1>🔒 解锁账户</h1>
        <div class="sub">您的账户正在进行敏感操作，请解锁您的账户以保证操作安全。</div>
        <div class="input-group">
            <input type="password" id="password" placeholder="请输入账号对应的密码">
        </div>
        <button id="unlockBtn">使用账户密码解锁</button>
        <div id="msg"></div>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/logout" class="back-link">登出</a> &nbsp;|&nbsp; <a href="#" class="back-link">需要帮助？</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || '/';

        async function unlock() {
            const password = document.getElementById('password').value.trim();
            const msgDiv = document.getElementById('msg');
            if (!password) {
                msgDiv.innerHTML = '<div class="message error">请输入密码</div>';
                return;
            }
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                msgDiv.innerHTML = '<div class="message error">请先登录</div>';
                setTimeout(() => { window.location.href = '/login'; }, 1500);
                return;
            }
            const email = session.user.email;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msgDiv.innerHTML = '<div class="message error">密码错误，解锁失败</div>';
            } else {
                window.location.href = redirectUrl;
            }
        }

        document.getElementById('unlockBtn').addEventListener('click', unlock);
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlock();
        });
    </script>
</body>

</html>
