    <script>
        (function () {
            // ================================================================
            // 1. Supabase 初始化
            // ================================================================
            const supabaseUrl = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const supabaseKey = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // ================================================================
            // 2. 状态与 DOM 引用
            // ================================================================
            let page = 0;
            const PAGE_SIZE = 30;
            let loading = false;
            let hasMore = true;
            let userCache = {};

            const logList = document.getElementById('logList');
            const loadMoreBtn = document.getElementById('load-more');
            const authButtons = document.getElementById('authButtons');

            // ================================================================
            // 3. 工具函数
            // ================================================================
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function escapeHtmlAttr(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function letterAvatar(name) {
                const ch = (name || 'U').trim().charAt(0).toUpperCase() || 'U';
                return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 fill=%22%23e74c3c%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2216%22%3E' +
                    ch + '%3C/text%3E%3C/svg%3E';
            }

            function formatTime(iso) {
                if (!iso) return '未知时间';
                try {
                    const d = new Date(iso);
                    const pad = n => String(n).padStart(2, '0');
                    const year = d.getFullYear();
                    const month = pad(d.getMonth() + 1);
                    const day = pad(d.getDate());
                    const hours = pad(d.getHours());
                    const minutes = pad(d.getMinutes());
                    const seconds = pad(d.getSeconds());
                    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                } catch {
                    return '未知时间';
                }
            }

            // ================================================================
            // 4. 获取用户信息（带缓存）
            // ================================================================
            async function fetchUsers(userIds) {
                if (!userIds || userIds.length === 0) return {};

                const unique = [...new Set(userIds.filter(Boolean))];
                const result = {};
                const needFetch = [];

                unique.forEach(id => {
                    if (userCache[id]) {
                        result[id] = userCache[id];
                    } else {
                        needFetch.push(id);
                    }
                });

                if (needFetch.length === 0) return result;

                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('id, username, avatar_url, user_tag, is_admin, is_banned, user_number, username_color')
                        .in('id', needFetch);

                    if (error) {
                        console.warn('批量查询用户失败，尝试逐个查询:', error.message);
                        for (const id of needFetch) {
                            try {
                                const { data: single } = await supabase
                                    .from('profiles')
                                    .select('id, username, avatar_url, user_tag, is_admin, is_banned, user_number, username_color')
                                    .eq('id', id)
                                    .maybeSingle();
                                if (single) {
                                    userCache[id] = single;
                                    result[id] = single;
                                }
                            } catch (e) { /* ignore */ }
                        }
                        return result;
                    }

                    if (data) {
                        data.forEach(u => {
                            userCache[u.id] = u;
                            result[u.id] = u;
                        });
                    }
                    return result;

                } catch (err) {
                    console.error('获取用户信息异常:', err);
                    return result;
                }
            }

            // ================================================================
            // 5. 动态判断操作类型（四种标识）
            // ================================================================
            function getDisplayType(log) {
                const action = log.action_type;
                const detail = log.action_detail || {};
                const perm = detail.permission;

                // 管理轮换：授予/撤销 进入后台、用户管理、秩序管理、特殊权益
                const managerPerms = ['is_admin', 'can_manage_users', 'can_manage_posts', 'special_privilege'];
                if ((action === 'grant_perm' || action === 'revoke_perm') && managerPerms.includes(perm)) {
                    return {
                        label: '管理轮换',
                        color: '#9d3dcf',
                        viewBox: '0 0 448 512',
                        path: 'M72 128l24 0 0 16c0 70.7 57.3 128 128 128s128-57.3 128-128l0-16 24 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-30.7 0c-10.4-53.7-31.9-112-68.3-112-9.6 0-19 3.9-27.5 8.2-8.2 4.1-18.4 7.8-25.5 7.8s-17.3-3.7-25.5-7.8c-8.5-4.3-17.9-8.2-27.5-8.2-36.4 0-57.8 58.3-68.3 112L72 80c-13.3 0-24 10.7-24 24s10.7 24 24 24zm152 0l80 0 0 16c0 44.2-35.8 80-80 80s-80-35.8-80-80l0-16 80 0zM193.5 304c-9.7 0-17.5 7.8-17.5 17.5 0 4.2 1.5 8.2 4.2 11.4l27.2 31.8-18.5 67.8-55.9-102C127 319.5 113.3 315 101.9 320.3 41.8 348.3 0 409.2 0 480l0 8c0 13.3 10.7 24 24 24s24-10.7 24-24l0-8c0-43.4 21.6-81.8 54.7-105L171 499.5c4.2 7.7 12.3 12.5 21 12.5l64 0c8.8 0 16.8-4.8 21-12.5L345.3 375c33.1 23.2 54.7 61.6 54.7 105l0 8c0 13.3 10.7 24 24 24s24-10.7 24-24l0-8c0-70.8-41.8-131.7-101.9-159.7-11.5-5.3-25.1-.9-31.2 10.2l-56.2 102.5-18.4-68.2 27.4-32c2.7-3.2 4.2-7.2 4.2-11.4 0-9.7-7.8-17.5-17.5-17.5l-61 0z'
                    };
                }

                // 用户封禁：撤销 进入主站 或 action_type === 'ban'
                if (action === 'ban' || (action === 'revoke_perm' && perm === 'is_banned')) {
                    return {
                        label: '用户封禁',
                        color: '#e53e3e',
                        viewBox: '0 0 512 512',
                        path: 'M385.1 419.1L92.9 126.9c-28.1 35.5-44.9 80.3-44.9 129.1 0 114.9 93.1 208 208 208 48.8 0 93.7-16.8 129.1-44.9zm33.9-33.9c28.1-35.5 44.9-80.3 44.9-129.1 0-114.9-93.1-208-208-208-48.8 0-93.7 16.8-129.1 44.9L419.1 385.1zM0 256a256 256 0 1 1 512 0 256 256 0 1 1 -512 0z'
                    };
                }

                // unban 视为授予权限（授予进入主站）
                if (action === 'unban') {
                    return {
                        label: '授予权限',
                        color: '#38a169',
                        viewBox: '0 0 640 512',
                        path: 'M304 304c97.2 0 176 78.8 176 176l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-70.7-57.3-128-128-128l-96 0c-70.7 0-128 57.3-128 128l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-97.2 78.8-176 176-176l96 0zM528 80c13.3 0 24 10.7 24 24l0 48 48 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-48 0 0 48c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-48-48 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l48 0 0-48c0-13.3 10.7-24 24-24zM256 256a128 128 0 1 1 0-256 128 128 0 1 1 0 256zm0-208a80 80 0 1 0 0 160 80 80 0 1 0 0-160z'
                    };
                }

                // 其他 grant_perm 操作（包括授予 is_banned）视为授予权限
                if (action === 'grant_perm') {
                    return {
                        label: '授予权限',
                        color: '#38a169',
                        viewBox: '0 0 640 512',
                        path: 'M304 304c97.2 0 176 78.8 176 176l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-70.7-57.3-128-128-128l-96 0c-70.7 0-128 57.3-128 128l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-97.2 78.8-176 176-176l96 0zM528 80c13.3 0 24 10.7 24 24l0 48 48 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-48 0 0 48c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-48-48 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l48 0 0-48c0-13.3 10.7-24 24-24zM256 256a128 128 0 1 1 0-256 128 128 0 1 1 0 256zm0-208a80 80 0 1 0 0 160 80 80 0 1 0 0-160z'
                    };
                }

                // 其他 revoke_perm 操作（非管理轮换、非进入主站）视为取消权限
                if (action === 'revoke_perm') {
                    return {
                        label: '取消权限',
                        color: '#e53e3e',
                        viewBox: '0 0 640 512',
                        path: 'M304 304c97.2 0 176 78.8 176 176l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-70.7-57.3-128-128-128l-96 0c-70.7 0-128 57.3-128 128l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-97.2 78.8-176 176-176l96 0zm-48-48a128 128 0 1 1 0-256 128 128 0 1 1 0 256zm0-208a80 80 0 1 0 0 160 80 80 0 1 0 0-160zM600 152c13.3 0 24 10.7 24 24s-10.7 24-24 24l-144 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l144 0z'
                    };
                }

                // 其他所有未匹配的（如 cheat、manager_rotate 等），默认归为取消权限
                // 但 manager_rotate 我们已经在上层处理了，这里作为兜底
                return {
                    label: '取消权限',
                    color: '#e53e3e',
                    viewBox: '0 0 640 512',
                    path: 'M304 304c97.2 0 176 78.8 176 176l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-70.7-57.3-128-128-128l-96 0c-70.7 0-128 57.3-128 128l0 8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8c0-97.2 78.8-176 176-176l96 0zm-48-48a128 128 0 1 1 0-256 128 128 0 1 1 0 256zm0-208a80 80 0 1 0 0 160 80 80 0 1 0 0-160zM600 152c13.3 0 24 10.7 24 24s-10.7 24-24 24l-144 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l144 0z'
                };
            }

            // ================================================================
            // 6. 渲染单条日志
            // ================================================================
            function renderLog(log, userMap) {
                const admin = userMap[log.admin_id] || {
                    username: '已删除',
                    avatar_url: '',
                    user_tag: '',
                    is_admin: false,
                    user_number: '',
                    username_color: ''
                };
                const target = userMap[log.target_user_id] || {
                    username: '已删除',
                    avatar_url: '',
                    user_tag: '',
                    is_admin: false,
                    is_banned: false,
                    user_number: '',
                    username_color: ''
                };

                // 动态获取显示类型
                const info = getDisplayType(log);

                // 构建权限变更详情（保留原有 detail 展示）
                let detailHtml = '';
                const d = log.action_detail;
                if (log.action_type === 'grant_perm' || log.action_type === 'revoke_perm') {
                    const permMap = {
                        'is_admin': '进入后台',
                        'can_manage_users': '用户管理',
                        'can_manage_posts': '秩序管理',
                        'can_speak': '自由发言',
                        'is_banned': '进入主站',
                        'special_privilege': '特殊权限',
                    };
                    const permName = permMap[d?.permission] || d?.permission || '未知权限';
                    const isGrant = log.action_type === 'grant_perm';
                    const cls = isGrant ? 'success' : 'danger';
                    const word = isGrant ? '授予' : '撤销';
                    detailHtml =
                        `<span class="highlight ${cls}">${word}</span> ${permName} 权限`;
                } else if (log.action_type === 'ban') {
                    detailHtml = `<span class="highlight danger">撤销</span> 进入主站 权限`;
                } else if (log.action_type === 'unban') {
                    detailHtml = `<span class="highlight success">授予</span> 进入主站 权限`;
                } else if (log.action_type === 'cheat') {
                    detailHtml = `学术不端惩罚`;
                } else if (log.action_type === 'manager_rotate') {
                    const permName = d?.permission || '管理权限';
                    detailHtml = `授予 ${permName} 权限（轮换）`;
                }

                const time = formatTime(log.created_at);
                const adminColor = admin.username_color || (admin.is_admin ? '#9b59b6' : '#2c3e50');
                const targetColor = target.username_color || (target.is_admin ? '#9b59b6' : '#2c3e50');

                const targetTag = target.user_tag ?
                    `<span class="user-tag-display" style="background-color: ${targetColor};">${escapeHtml(target.user_tag)}</span>` :
                    '';
                const adminTag = admin.user_tag ?
                    `<span class="user-tag-display" style="background-color: ${adminColor};">${escapeHtml(admin.user_tag)}</span>` :
                    (admin.is_admin ? `<span class="user-tag-display" style="background-color: ${adminColor};">管理员</span>` : '');
                const targetBannedTag = target.is_banned ?
                    `<span class="user-tag-display" style="background-color: #e53e3e;">已封禁</span>` :
                    '';

                const adminAvatar = admin.avatar_url || letterAvatar(admin.username);
                const targetAvatar = target.avatar_url || letterAvatar(target.username);

                const adminLink = admin.user_number ? `/user/${admin.user_number}` : '#';
                const targetLink = target.user_number ? `/user/${target.user_number}` : '#';

                const svgIcon = `<svg viewBox="${info.viewBox}" width="20" height="20" style="color:${info.color}; fill:currentColor;" class="log-icon"><path d="${info.path}"/></svg>`;

                return `
                    <div class="log-card">
                        <div class="log-meta">
                            <div class="log-action">
                                ${svgIcon}
                                <span style="color:${info.color}; font-weight:600;">${info.label}</span>
                            </div>
                            <span class="log-time">${time}</span>
                        </div>

                        <div class="log-users">
                            <a href="${targetLink}" class="log-user">
                                <img src="${targetAvatar}" alt="${escapeHtmlAttr(target.username)}" 
                                    onerror="this.onerror=null;this.src='${letterAvatar(target.username)}'">
                                <span class="uname" style="color:${targetColor}">${escapeHtml(target.username)}</span>
                                ${targetTag}
                                ${targetBannedTag}
                            </a>
                        </div>

                        ${detailHtml ? `<div class="log-detail">${detailHtml}</div>` : ''}

                        <div class="log-reason">
                            ${log.reason || '（无）'}
                        </div>
                    </div>
                `;
            }

            // ================================================================
            // 7. 加载日志（全量显示）
            // ================================================================
            async function loadLogs(append = false) {
                if (loading || !hasMore) return;
                loading = true;
                loadMoreBtn.disabled = true;
                loadMoreBtn.classList.add('loading');

                try {
                    const { data: logs, error } = await supabase
                        .from('judgement_logs')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .range(page * PAGE_SIZE, (page + 1) * PAGE_SIZE - 1);

                    if (error) {
                        console.error('查询日志失败:', error);
                        throw error;
                    }

                    if (!logs || logs.length === 0) {
                        hasMore = false;
                        if (!append) {
                            logList.innerHTML = `
                                <div class="empty-state">
                                    <div class="icon">📭</div>
                                    <p>暂无管理日志</p>
                                </div>
                            `;
                        }
                        loadMoreBtn.style.display = 'none';
                        return;
                    }

                    const userIds = [];
                    logs.forEach(log => {
                        if (log.admin_id) userIds.push(log.admin_id);
                        if (log.target_user_id) userIds.push(log.target_user_id);
                    });

                    const userMap = await fetchUsers(userIds);

                    const html = logs.map(log => renderLog(log, userMap)).join('');

                    if (append) {
                        logList.insertAdjacentHTML('beforeend', html);
                    } else {
                        logList.innerHTML = html;
                    }

                    page++;
                    hasMore = logs.length === PAGE_SIZE;
                    loadMoreBtn.style.display = hasMore ? 'inline-flex' : 'none';

                } catch (err) {
                    console.error('加载失败:', err);
                    if (!append) {
                        logList.innerHTML = `
                            <div class="empty-state">
                                <div class="icon">⚠️</div>
                                <p>加载失败，请刷新重试</p>
                                <p style="font-size:0.8rem;color:#ccc;margin-top:8px;">${escapeHtml(err.message || '')}</p>
                            </div>
                        `;
                    }
                } finally {
                    loading = false;
                    loadMoreBtn.disabled = false;
                    loadMoreBtn.classList.remove('loading');
                }
            }

            // ================================================================
            // 8. 用户认证 UI
            // ================================================================
            async function updateAuthUI() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();

                    if (session?.user) {
                        const { data: profile } = await supabase
                            .from('profiles')
                            .select('username, avatar_url, is_admin, user_number')
                            .eq('id', session.user.id)
                            .maybeSingle();

                        const displayName = profile?.username || session.user.email || '用户';
                        const userNumber = profile?.user_number || '';

                        let html = `
                            <a href="/user/${userNumber}" class="user-email">${escapeHtml(displayName)}</a>
                        `;
                        html += `
                            <button id="logoutBtn" class="auth-btn logout">登出</button>
                        `;
                        authButtons.innerHTML = html;

                        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                            await supabase.auth.signOut();
                            location.reload();
                        });

                    } else {
                        authButtons.innerHTML = `
                            <a href="/auth/login" class="auth-btn">登录</a>
                            <a href="/auth/register" class="auth-btn">注册</a>
                        `;
                    }
                } catch (err) {
                    console.error('认证失败:', err);
                    authButtons.innerHTML = `
                        <a href="/auth/login" class="auth-btn">登录</a>
                        <a href="/auth/register" class="auth-btn">注册</a>
                    `;
                }
            }

            // ================================================================
            // 9. 回到顶部按钮控制
            // ================================================================
            const backToTopBtn = document.getElementById('back-to-top');
            window.addEventListener('scroll', function () {
                if (window.pageYOffset > 300) {
                    backToTopBtn.style.display = 'block';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });
            backToTopBtn.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ================================================================
            // 10. 初始化
            // ================================================================
            document.addEventListener('DOMContentLoaded', async () => {
                await updateAuthUI();
                await loadLogs(false);

                loadMoreBtn.addEventListener('click', () => loadLogs(true));
            });
        })();
    </script>
