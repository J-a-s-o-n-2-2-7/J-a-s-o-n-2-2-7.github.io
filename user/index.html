<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        /* ===== 顶栏 ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn:hover {
            background: #c0392b;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        /* ===== 布局 ===== */
        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            position: relative;
            min-height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: #fff;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            font-weight: 600;
            margin-top: 8px;
            cursor: default;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        .nav-item.active {
            background: #f0f2f5;
            color: #e74c3c;
        }

        .content-wrapper {
            margin-left: 64px;
            padding-top: 20px;
        }

        /* ===== 响应式（侧边栏） ===== */
        @media (max-width: 900px) {
            .main-layout {
                padding: 0 16px 16px 16px;
            }

            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                margin-bottom: 20px;
                padding: 12px 0;
                transition: none;
                overflow: visible;
                white-space: normal;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .group-title {
                grid-column: 1 / -1;
                background: #e9ecef;
                margin-top: 0;
            }

            .divider {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }
        }

        /* ============================================================ */
        /* ===== 主体样式（用户信息区） ===== */
        /* ============================================================ */

        .main-content {
            max-width: 100%;
        }

        .loading-box {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        /* 用户头部（封面） */
        .user-header {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
            background: #1a1a2e;
            min-height: 280px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .user-header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.3s;
        }

        .user-header-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            padding: 20px 32px 24px;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }

        .user-header-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: none;
            box-shadow: none;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .user-header-avatar .avatar-fallback {
            font-size: 32px;
            color: #fff;
            font-weight: 700;
            user-select: none;
        }

        .user-header-info {
            flex: 1;
            min-width: 200px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .user-header-name {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .user-header-name .user-tag-display {
            margin-left: 0;   /* 取消标签自带的左边距，仅使用 flex gap */
        }

        /* ===== 用户名：大一倍（1.75rem ≈ 28px） ===== */
        .user-header-name h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .user-header-number {
            font-size: 1.4rem;
            opacity: 0.7;
            margin-top: 0;
            font-weight: 400;
        }

        /* ===== 个性签名：白色、无斜体，稍放大 ===== */
        .user-header-slogan {
            font-size: 1.1rem;
            opacity: 0.92;
            max-width: 600px;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 28px;
            margin-top: -2px;
            padding: 0 0 2px 0;
            border-radius: 0;
            display: block;
            transition: background 0.2s, color 0.3s;
            color: #fff;
            font-style: normal;
            text-align: left;
        }

        .user-header-slogan[data-editable="true"] {
            cursor: pointer;
        }

        /* 编辑输入框 */
        .slogan-editor-input {
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 16px;
            width: 100%;
            max-width: 500px;
            min-width: 100px;
            outline: none;
            background: #fff;
            color: #2c3e50;
            font-family: inherit;
            box-sizing: border-box;
        }

        .slogan-editor-input:focus {
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.2);
        }

        .user-header-actions {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            margin-left: auto;
            align-self: center;
            margin-top: 6px;
        }

        .user-header-actions .btn-action {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            backdrop-filter: blur(4px);
        }

        .user-header-actions .btn-action:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }

        .user-header-actions .btn-action svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ===== 右上角更换封面按钮 ===== */
        .btn-action-cover {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            color: #404040;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action-cover svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn-action-cover:hover {
            color: #4e4e4e;
        }

        /* 洛谷风格 · 个人设置按钮 */
        .btn-luogu-setting {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 20px;
            border-radius: 30px;                /* pill 形状 */
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.5);     /* 半透明毛玻璃 */
            color: #fff;
            font-size: 0.875em;                /* ≈14px */
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, border-color 0.25s, box-shadow 0.25s;
            user-select: none;
            font-family: inherit;
            line-height: 1.5;
            white-space: nowrap;
        }

        /* 齿轮图标 */
        .btn-luogu-setting i {
            font-size: 1em;
            transition: transform 0.35s ease;
        }

        /* 悬停效果 */
        .btn-luogu-setting:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.75);
        }

        .btn-luogu-setting:hover i {
            transform: rotate(60deg);          /* 趣味旋转 */
        }

        /* 点击反馈 */
        .btn-luogu-setting:active {
            transform: scale(0.96) translateY(0);
            background: rgba(255, 255, 255, 0.12);
        }

        /* 键盘焦点 */
        .btn-luogu-setting:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        /* ===== 洛谷风格信息卡片 ===== */
        .l-card {
            background: #fff;
            border-radius: 16px;
            padding: 18px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
        }

        .l-flex-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .l-flex-info-row:last-child {
            border-bottom: none;
        }

        .l-flex-info-row span {
            font-size: 14px;
            color: #404040;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .l-flex-info-row .right {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .l-flex-info-row .right time {
            color: #2c3e50;
        }

        /* 响应式：小屏可适当缩小 */
        @media (max-width: 600px) {
            .l-card {
                padding: 14px 16px;
            }
            .l-flex-info-row {
                padding: 8px 0;
            }
            .l-flex-info-row span,
            .l-flex-info-row .right {
                font-size: 13px;
            }
        }

        /* 封面更换浮层 */
        .cover-upload-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .cover-upload-overlay.active {
            display: flex;
        }

        .cover-upload-panel {
            background: #fff;
            border-radius: 20px;
            padding: 32px 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .cover-upload-panel h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            color: #2c3e50;
        }

        .cover-upload-panel .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }

        .cover-upload-panel .upload-area:hover {
            border-color: #e74c3c;
        }

        .cover-upload-panel .upload-area input {
            display: none;
        }

        .cover-upload-panel .upload-area .hint {
            font-size: 14px;
            color: #999;
        }

        .cover-upload-panel .upload-area .hint strong {
            color: #e74c3c;
        }

        .cover-upload-panel .lfe-caption {
            font-size: 13px;
            color: #888;
            line-height: 1.6;
            margin: 12px 0;
        }

        .cover-upload-panel .panel-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }

        .cover-upload-panel .panel-actions button {
            padding: 8px 24px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cover-upload-panel .panel-actions .btn-cancel-cover {
            background: #e9ecef;
            color: #555;
        }

        .cover-upload-panel .panel-actions .btn-cancel-cover:hover {
            background: #dde0e3;
        }

        .cover-upload-panel .panel-actions .btn-upload-cover {
            background: #e74c3c;
            color: #fff;
        }

        .cover-upload-panel .panel-actions .btn-upload-cover:hover {
            background: #c0392b;
        }

        .cover-upload-panel .panel-actions .btn-upload-cover:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 用户标签（与主页一致） ===== */
        .user-tag-display {
            display: inline-block;
            border-radius: 2px;
            padding: 2px 9px;
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            margin: 0 0 0 4px;
            cursor: default;
            transition: filter 0.15s;
            vertical-align: middle;
        }

        .user-tag-display:hover {
            filter: brightness(0.9);
        }

        /* 响应式（针对用户信息区） */
        @media (max-width: 900px) {
            .user-header {
                min-height: 220px;
            }

            .user-header-content {
                padding: 16px 24px 20px;
                gap: 6px;
            }

            .user-header-actions {
                margin-left: 0;
                align-self: stretch;
                justify-content: flex-start;
                flex-wrap: wrap;
                margin-top: 4px;
            }

            .user-header-name h1 {
                font-size: 1.5rem;
            }

            .user-header-avatar {
                width: 64px;
                height: 64px;
            }

            .user-header-avatar .avatar-fallback {
                font-size: 28px;
            }

            .info-grid {
                grid-template-columns: 1fr 1fr;
            }

            .slogan-editor-input {
                max-width: 100%;
                min-width: 120px;
            }
        }

        @media (max-width: 600px) {
            .user-header {
                min-height: 180px;
            }

            .user-header-content {
                padding: 12px 16px;
                gap: 4px;
            }

            .user-header-avatar {
                width: 56px;
                height: 56px;
            }

            .user-header-avatar .avatar-fallback {
                font-size: 24px;
            }

            .user-header-name h1 {
                font-size: 1.3rem;
            }

            .user-header-slogan {
                font-size: 0.95rem;
                padding: 4px 12px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .cover-upload-panel {
                padding: 24px 20px;
            }

            .slogan-editor-input {
                font-size: 14px;
                padding: 2px 4px;
                min-width: 100px;
            }

            .user-header-actions .btn-action {
                font-size: 0.8rem;
                padding: 6px 14px;
            }
        }

        :root {
            --lfe-color--green-3: #2ecc71;
            --lfe-color--blue-3: #3498db;
            --lfe-color--gold-3: #f1c40f;
        }

        @keyframes rainbow-fill {
            0%   { fill: #e74c3c; }  /* 柔和红 */
            14.28% { fill: #e67e22; } /* 橙 */
            28.57% { fill: #f1c40f; } /* 金（温和黄） */
            42.85% { fill: #2ecc71; } /* 翠绿（柔和绿） */
            57.14% { fill: #3498db; } /* 蓝 */
            71.42% { fill: #9b59b6; } /* 靛 */
            85.71% { fill: #8e44ad; } /* 紫 */
            100%  { fill: #e74c3c; }  /* 回到红，无缝循环 */
        }

        .rainbow-badge path {
            animation: rainbow-fill 5s linear infinite;
        }

        .rainbow-badge .fa-secondary {
            animation: rainbow-fill 3s linear infinite;
        }
        .rainbow-badge .fa-primary {
            fill: #ffffff !important; /* 保持白色 */
        }
    </style>
</head>

        <div class="auth-buttons" id="authButtons"><span style="font-size:14px;color:#aaa;">加载中...</span></div>
    </div>

    <!-- ===== 主体 ===== -->
    <div class="main-layout">
        <!-- 侧边栏 -->
        <div class="nav-sidebar">

                                </svg></span><span class="nav-text">主页</span></a></li>
                    <li><a class="nav-item" href="/problems"><span class="nav-icon"><svg viewBox="0 0 448 512"

                                </svg></span><span class="nav-text">题库</span></a></li>
                    <li><a class="nav-item" href="/courses"><span class="nav-icon"><svg viewBox="0 0 576 512" width="20"

    <script>
        // ===== 工具函数 =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        function letterAvatar(name) {
            const ch = (name || 'U').trim().charAt(0).toUpperCase() || 'U';
            return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e74c3c'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.3em' fill='white' font-size='16' font-family='Arial'%3E" +
                encodeURIComponent(ch) + "%3C/text%3E%3C/svg%3E";
        }

        function getDisplayText(bio) {
            const trimmed = (bio || '').trim();
            return trimmed || '这个家伙很懒，什么也没有留下';
        }

        // ===== 颜色和标签（与主页一致） =====
        const COLOR_RED = '#e74c3c';
        const COLOR_PURPLE = '#9C3DCF';
        const COLOR_BROWN = '#AD8B00';

        function getUserDisplayColor(user) {
            if (user && user.is_cheater) return COLOR_BROWN;
            if (user && user.is_admin) return COLOR_PURPLE;

        function getCcfBadgeHtml(ccfLevel) {
                // ★★★ 新增：ccfLevel >= 11 返回彩虹徽章 ★★★
                if (ccfLevel && ccfLevel >= 11) {
                    // 注意：移除了静态 fill 属性，由 CSS 动画控制

                    <g class="fa-duotone-group">
                        <path class="fa-secondary" d="M0 256C0 292.8 20.7 324.8 51.1 340.9 41 373.8 49 411 75 437s63.3 34 96.1 23.9C187.2 491.3 219.2 512 256 512s68.8-20.7 84.9-51.1C373.8 471 411 463 437 437s34-63.3 23.9-96.1C491.3 324.8 512 292.8 512 256s-20.7-68.8-51.1-84.9C471 138.2 463 101 437 75s-63.3-34-96.1-23.9C324.8 20.7 292.8 0 256 0s-68.8 20.7-84.9 51.1C138.2 41 101 49 75 75s-34 63.3-23.9 96.1C20.7 187.2 0 219.2 0 256zm152.3 41.6c-9.2-9.5-9-24.7 .6-33.9 9.5-9.2 24.7-8.9 33.9 .6l35.8 37 106.1-145.8c7.8-10.7 22.8-13.1 33.5-5.3 10.7 7.8 13.1 22.8 5.3 33.5L244.7 352.7c-4.2 5.7-10.7 9.4-17.8 9.8-7.1 .5-14-2.2-18.9-7.3l-55.7-57.6z"/>
                        <path class="fa-primary" d="M328.7 155.5c7.8-10.7 22.8-13.1 33.5-5.3 10.7 7.8 13.1 22.8 5.3 33.5L244.7 352.7c-4.2 5.7-10.7 9.4-17.8 9.8-7.1 .5-14-2.2-18.9-7.3l-55.7-57.6c-9.2-9.5-9-24.7 .6-33.9 9.5-9.2 24.7-8.9 33.9 .6l35.8 37 106.1-145.8z"/>

                }

                // ===== 以下为原有逻辑（ccfLevel 1~10 使用静态颜色） =====
                if (!ccfLevel || ccfLevel < 1 || ccfLevel > 10) return '';

                if (ccfLevel >= 1 && ccfLevel <= 5) {
                    color = '#52C41A';

                    color = '#3498DB';

                    color = '#FFC116';

                // 原 SVG 模板（带有静态 fill）
                return `<svg class="svg-inline--fa fa-badge-check" data-prefix="fad" data-icon="badge-check" role="img" viewBox="0 0 512 512" aria-hidden="true" style="width: 16px; height: 16px; vertical-align: middle;"><g class="fa-duotone-group"><path class="fa-secondary" fill="${color}" d="M0 256C0 292.8 20.7 324.8 51.1 340.9 41 373.8 49 411 75 437s63.3 34 96.1 23.9C187.2 491.3 219.2 512 256 512s68.8-20.7 84.9-51.1C373.8 471 411 463 437 437s34-63.3 23.9-96.1C491.3 324.8 512 292.8 512 256s-20.7-68.8-51.1-84.9C471 138.2 463 101 437 75s-63.3-34-96.1-23.9C324.8 20.7 292.8 0 256 0s-68.8 20.7-84.9 51.1C138.2 41 101 49 75 75s-34 63.3-23.9 96.1C20.7 187.2 0 219.2 0 256zm152.3 41.6c-9.2-9.5-9-24.7 .6-33.9 9.5-9.2 24.7-8.9 33.9 .6l35.8 37 106.1-145.8c7.8-10.7 22.8-13.1 33.5-5.3 10.7 7.8 13.1 22.8 5.3 33.5L244.7 352.7c-4.2 5.7-10.7 9.4-17.8 9.8-7.1 .5-14-2.2-18.9-7.3l-55.7-57.6z"></path><path class="fa-primary" fill="#ffffff" d="M328.7 155.5c7.8-10.7 22.8-13.1 33.5-5.3 10.7 7.8 13.1 22.8 5.3 33.5L244.7 352.7c-4.2 5.7-10.7 9.4-17.8 9.8-7.1 .5-14-2.2-18.9-7.3l-55.7-57.6c-9.2-9.5-9-24.7 .6-33.9 9.5-9.2 24.7-8.9 33.9 .6l35.8 37 106.1-145.8z"></path></g></svg>`;
            }

        function getUserTagDisplay(user) {
            if (!user) return '';
            if (user.is_cheater) {
                if (user.is_admin) {
                    return user.user_tag || '管理员';
                } else {
                    return '作弊者';

        // ===== 主逻辑 =====
        (async function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // 1. 优先从路径中提取（例如 /user/1）
            let userNumber = null;
            const pathMatch = window.location.pathname.match(/^\/user\/(\d+)/);
            if (pathMatch) {
                userNumber = pathMatch[1];
            }

            // 2. 如果路径中没有，再从查询参数中获取（兼容旧链接）
            if (!userNumber) {
                const params = new URLSearchParams(window.location.search);
                userNumber = params.get('id');
            }

            // 3. 如果都没有，显示错误
            if (!userNumber) {
                document.getElementById('loadingPlaceholder').textContent = '❌ 无效的用户编号，请使用 /user/数字 或 ?id=数字 访问';
                return;

            if (!userNumber) {
                loadingEl.textContent = '❌ 无效的用户编号，请使用 ?id=数字 访问';
                return;
            }

            let userData = null;
            let profileBio = '';
            let avatarUrl = '';
            let isOwner = false;
            let currentUserId = null;

            try {
                // 1. 获取当前登录用户
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw new Error(`获取登录状态失败: ${sessionError.message}`);
                currentUserId = session?.user?.id || null;

                // 顶栏认证 UI
                (async () => {
                    const c = document.getElementById('authButtons');
                    if (!session) {
                        c.innerHTML =
                            '<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>';
                        return;
                    }
                    const { data: p } = await supabase.from('profiles').select('username, can_manage_users').eq('id',
                        session.user.id).maybeSingle();
                    const name = p?.username || session.user.email || '用户';
                    c.innerHTML = '<span class="user-email">' + escapeHtml(name) +
                        '</span><button id="logoutBtn" class="auth-btn logout">登出</button>';
                    const lb = document.getElementById('logoutBtn');
                    if (lb) lb.addEventListener('click', async () => {
                        await supabase.auth.signOut();
                        location.reload();
                    });
                    const umi = document.getElementById('userManageItem');
                    if (umi) umi.style.display = (p?.can_manage_users === true) ? 'flex' : 'none';
                })();

                // 2. 直接用 user_number 查 profiles（添加角色字段）
                const { data: profileData, error: profileError } = await supabase
                    .from('profiles')
                    .select('id, username, user_number, avatar_url, bio, banned_until, created_at, is_admin, is_cheater, user_tag, username_color, cover_url, ccf_level')
                    .eq('user_number', parseInt(userNumber))
                    .maybeSingle();

                if (profileError) throw new Error(`查询用户失败: ${profileError.message}`);
                if (!profileData) throw new Error('用户不存在');

                const user = profileData;
                userData = user;
                avatarUrl = user.avatar_url || '';
                profileBio = user.bio || '';

                // 封面使用数据库中的 cover_url，如果没有则使用默认图
                const defaultCover = 'https://cdn.luogu.org/images/bg/fe/DSCF0530-shrink.jpg';
                const coverUrl = user.cover_url || '';  // 从数据库读取
                const coverStyle = coverUrl ? `background-image: url('${coverUrl}');` : `background-image: url('${defaultCover}');`;

                isOwner = currentUserId && user.id && currentUserId === user.id;

                document.title = `${user.username} 的个人主页 - Jason227`;
                const bannedUntil = user.banned_until ? new Date(user.banned_until) : null;
                const now = new Date();
                const isBanned = bannedUntil && bannedUntil > now;

                const avatarImg = `<img src="${avatarUrl || letterAvatar(user.username)}" alt="${escapeHtml(user.username)}" onerror="this.onerror=null;this.src='${letterAvatar(user.username)}'">`;
                const sigDisplayText = getDisplayText(profileBio);
                const sigEmpty = !profileBio.trim();

                // ===== 生成带颜色的用户名和标签 =====
                const color = getUserDisplayColor(user);
                const ccfBadge = getCcfBadgeHtml(user.ccf_level);
                const tagText = getUserTagDisplay(user);
                let tagHtml = '';
                if (tagText) {
                    tagHtml = `<span class="user-tag-display" style="background-color: ${color};">${escapeHtml(tagText)}</span>`;
                }

                let html = '';

                if (isBanned) {
                    html = `
                            <div class="user-header" style="min-height:160px;">
                                <div class="user-header-bg" style="${coverStyle}"></div>
                                <div class="user-header-content" style="justify-content:center;text-align:center;">
                                    <div style="color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.6);">
                                        <div style="font-size:48px;margin-bottom:8px;">⛔</div>
                                        <h1 style="font-size:1.75rem;margin:0;">该用户已被封禁</h1>
                                        <p style="opacity:0.9;margin-top:6px;font-size:1rem;">封禁至：${bannedUntil.toLocaleString()}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                } else {
                    html = `
                            <div class="user-header">
                                <div class="user-header-bg" style="${coverStyle}"></div>
                                ${isOwner ? `
                                    <span class="btn-action-cover" id="openCoverUpload">
                                        <svg viewBox="0 0 384 512" width="16" height="16">
                                            <path d="M162.4 6c-1.5-3.6-5-6-8.9-6l-19 0c-3.9 0-7.5 2.4-8.9 6L104.9 57.7c-3.2 8-14.6 8-17.8 0L66.4 6c-1.5-3.6-5-6-8.9-6L48 0C21.5 0 0 21.5 0 48l0 208 384 0 0-208c0-26.5-21.5-48-48-48L230.5 0c-3.9 0-7.5 2.4-8.9 6L200.9 57.7c-3.2 8-14.6 8-17.8 0L162.4 6zM0 304l0 16c0 35.3 28.7 64 64 64l64 0 0 64c0 35.3 28.7 64 64 64s64-28.7 64-64l0-64 64 0c35.3 0 64-28.7 64-64l0-16-384 0zM192 464c-8.8 0-16-7.2-16-16s7.2-16 16-16 16 7.2 16 16-7.2 16-16 16z"/>
                                        </svg>
                                    </span>
                                ` : ''}
                                <div class="user-header-content">
                                    <div class="user-header-avatar">${avatarImg}</div>
                                    <div class="user-header-info">
                                        <div class="user-header-name">
                                            <h1 style="color: ${color};">${escapeHtml(user.username)}</h1>
                                            ${ccfBadge}
                                            ${tagHtml}
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                            <div class="user-header-slogan ${sigEmpty ? 'empty' : ''}" 
                                                data-editable="${isOwner ? 'true' : 'false'}" 
                                                data-user="${user.user_number}"
                                                id="topSlogan">${escapeHtml(sigDisplayText)}</div>
                                            ${isOwner ? `
                                                <a href="/user/setting" class="btn-luogu-setting" style="flex-shrink: 0; margin-left: auto;">
                                                    <svg viewBox="0 0 640 512" width="16" height="16" fill="currentColor">
                                                        <path d="M256.5 8a120 120 0 1 1 0 240 120 120 0 1 1 0-240zM226.7 304l59.4 0 1.5 0c-12.9 26.8-7.8 58.2 11.5 79.5-20.2 22.3-24.8 55.8-9.4 83.4l22.5 40.4c.9 1.6 1.9 3.2 2.9 4.7l-237 0c-16.4 0-29.7-13.3-29.7-29.7 0-98.5 79.8-178.3 178.3-178.3zm205.9-56.4c0-13.3 10.7-24 24-24l48 0c13.3 0 24 10.7 24 24l0 6.1c0 18.9 24.1 32.8 40.5 23.4l5-2.9c11.6-6.7 26.5-2.6 33 9.1l22.4 40.2c6.2 11.2 2.6 25.2-8.2 32l-4.7 2.9c-16.2 10.1-16.2 39.9 0 50.1l4.6 2.9c10.8 6.8 14.5 20.8 8.3 32L607 483.8c-6.5 11.7-21.4 15.9-33 9.1l-4.9-2.9c-16.4-9.5-40.5 4.5-40.5 23.4l0 6.1c0 13.3-10.7 24-24 24l-48 0c-13.3 0-24-10.7-24-24l0-5.9c0-19-24.2-33-40.7-23.5l-4.8 2.8c-11.6 6.7-26.4 2.6-33-9.1l-22.6-40.4c-6.2-11.2-2.6-25.3 8.3-32.1l4.4-2.7c16.3-10.1 16.3-40.1 0-50.2l-4.5-2.8c-10.9-6.8-14.5-20.9-8.3-32.1l22.5-40.3c6.5-11.7 21.4-15.8 32.9-9.1l4.8 2.8c16.5 9.5 40.7-4.5 40.7-23.5l0-5.9zm99.9 136.2a52 52 0 1 0 -104 0 52 52 0 1 0 104 0z"/>
                                                    </svg>
                                                    个人设置
                                                </a>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 洛谷风格信息卡片 -->
                            <div class="l-card">
                                <div class="l-flex-info-row">
                                    <span>用户编号</span>
                                    <div class="right">${user.user_number}</div>
                                </div>
                                <div class="l-flex-info-row">
                                    <span>用户类型</span>
                                    <div class="right">${user.is_admin ? '管理员' : user.is_cheater ? '作弊者' : '普通用户'}</div>
                                </div>
                                <div class="l-flex-info-row">
                                    <span>注册时间</span>
                                    <div class="right"><time datetime="${user.created_at}">${user.created_at.split('T')[0]}</time></div>
                                </div>
                                ${user.ccf_level && user.ccf_level >= 1 ? `
                                    <div class="l-flex-info-row">
                                        <span>OI 程序设计能力</span>
                                        <div class="right">
                                            ${user.ccf_level} 级 ${getCcfBadgeHtml(user.ccf_level)}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                }

                profileContainer.innerHTML = html;
                profileContainer.style.display = 'block';
                loadingEl.style.display = 'none';

                // ===== 签名双击编辑 =====
                if (isOwner && !isBanned) {
                    const topSlogan = document.getElementById('topSlogan');
                    if (topSlogan) {
                        let originalText = topSlogan.textContent.trim();

                        topSlogan.addEventListener('dblclick', function (e) {
                            e.stopPropagation();
                            if (this.querySelector('input')) return;

                            const currentText = this.textContent.trim();
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'slogan-editor-input';
                            input.value = currentText === '这个家伙很懒，什么也没有留下' ? '' : currentText;
                            input.placeholder = '这个家伙很懒，什么也没有留下';
                            input.maxLength = 500;

                            this.textContent = '';
                            this.appendChild(input);
                            input.focus();
                            input.select();

                            const saveSlogan = async () => {
                                const val = input.value.trim();
                                if (val === originalText || (val === '' && originalText === '这个家伙很懒，什么也没有留下')) {
                                    restoreDisplay();
                                    return;
                                }

                                topSlogan.textContent = '⏳ 保存中...';
                                topSlogan.style.opacity = '0.7';

                                try {
                                    const { error: updateError } = await supabase
                                        .from('profiles')
                                        .update({ bio: val })
                                        .eq('user_number', parseInt(userNumber));

                                    if (updateError) {
                                        if (updateError.message && updateError.message.includes('column "bio" does not exist')) {
                                            throw new Error('❌ 数据库缺少 bio 字段，请为 profiles 表添加 bio (text) 列。');
                                        }
                                        throw new Error(`保存失败: ${updateError.message}`);
                                    }

                                    profileBio = val;
                                    const displayText = val || '这个家伙很懒，什么也没有留下';
                                    originalText = displayText;

                                    topSlogan.textContent = displayText;
                                    topSlogan.className = 'user-header-slogan' + (!val ? ' empty' : '');
                                    topSlogan.style.opacity = '1';

                                    topSlogan.style.transition = 'color 0.3s';
                                    topSlogan.style.color = '#2ecc71';
                                    setTimeout(() => {
                                        topSlogan.style.color = '';
                                    }, 800);

                                } catch (err) {
                                    topSlogan.textContent = '❌ ' + err.message;
                                    topSlogan.style.color = '#e74c3c';
                                    topSlogan.style.opacity = '1';
                                    setTimeout(() => {
                                        restoreDisplay();
                                    }, 2000);
                                }
                            };

                            const restoreDisplay = () => {
                                const displayText = originalText || '这个家伙很懒，什么也没有留下';
                                topSlogan.textContent = displayText;
                                topSlogan.className = 'user-header-slogan' + (!profileBio.trim() ? ' empty' : '');
                                topSlogan.style.opacity = '1';
                                topSlogan.style.color = '';
                            };

                            input.addEventListener('blur', saveSlogan);
                            input.addEventListener('keydown', function (e) {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    this.blur();
                                }
                                if (e.key === 'Escape') {
                                    restoreDisplay();
                                }
                            });
                        });
                    }
                }

                // ===== 封面更换逻辑（可选，但 cover_url 不存在，暂时保留但不会生效） =====
                const openBtn = document.getElementById('openCoverUpload');
                const overlay = document.getElementById('coverUploadOverlay');
                const cancelCoverBtn = document.getElementById('coverCancelBtn');
                const uploadBtn = document.getElementById('coverUploadBtn');
                const fileInput = document.getElementById('coverFileInput');
                const uploadArea = document.getElementById('uploadArea');
                const coverFeedback = document.getElementById('coverFeedback');
                let selectedFile = null;

                if (openBtn && overlay) {
                    openBtn.addEventListener('click', () => {
                        overlay.classList.add('active');
                        selectedFile = null;
                        fileInput.value = '';
                        uploadBtn.disabled = true;
                        coverFeedback.textContent = '';
                        coverFeedback.style.color = '#999';
                    });
                }

                function closeCoverUpload() {
                    overlay.classList.remove('active');
                    selectedFile = null;
                    fileInput.value = '';
                    uploadBtn.disabled = true;
                    coverFeedback.textContent = '';
                }

                if (cancelCoverBtn) {
                    cancelCoverBtn.addEventListener('click', closeCoverUpload);
                }

                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeCoverUpload();
                });

                if (uploadArea) {
                    uploadArea.addEventListener('click', () => fileInput.click());
                    uploadArea.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        uploadArea.style.borderColor = '#e74c3c';
                    });
                    uploadArea.addEventListener('dragleave', () => {
                        uploadArea.style.borderColor = '#ddd';
                    });
                    uploadArea.addEventListener('drop', (e) => {
                        e.preventDefault();
                        uploadArea.style.borderColor = '#ddd';
                        if (e.dataTransfer.files.length) {
                            const file = e.dataTransfer.files[0];
                            if (file.type.startsWith('image/')) {
                                selectedFile = file;
                                uploadBtn.disabled = false;
                                coverFeedback.textContent = `✅ 已选择: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                                coverFeedback.style.color = '#27ae60';
                            } else {
                                coverFeedback.textContent = '❌ 请选择图片文件';
                                coverFeedback.style.color = '#e74c3c';
                            }
                        }
                    });
                }

                if (fileInput) {
                    fileInput.addEventListener('change', () => {
                        if (fileInput.files.length) {
                            const file = fileInput.files[0];
                            if (file.type.startsWith('image/')) {
                                selectedFile = file;
                                uploadBtn.disabled = false;
                                coverFeedback.textContent = `✅ 已选择: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                                coverFeedback.style.color = '#27ae60';
                            } else {
                                coverFeedback.textContent = '❌ 请选择图片文件';
                                coverFeedback.style.color = '#e74c3c';
                                uploadBtn.disabled = true;
                            }
                        }
                    });
                }

                if (uploadBtn) {
                    uploadBtn.addEventListener('click', async () => {
                        if (!selectedFile) return;

                        uploadBtn.disabled = true;
                        uploadBtn.textContent = '⏳ 上传中…';
                        coverFeedback.textContent = '⏳ 正在上传到 Supabase Storage...';
                        coverFeedback.style.color = '#f39c12';

                        try {
                            const fileExt = selectedFile.name.split('.').pop();
                            const fileName = `cover_${userNumber}_${Date.now()}.${fileExt}`;
                            const filePath = `covers/${fileName}`;

                            const { data: uploadData, error: uploadError } = await supabase.storage
                                .from('avatars')
                                .upload(filePath, selectedFile, {
                                    cacheControl: '3600',
                                    upsert: true,
                                });

                            if (uploadError) throw new Error(`上传失败: ${uploadError.message}`);

                            const { data: urlData } = supabase.storage
                                .from('avatars')
                                .getPublicUrl(filePath);

                            const publicUrl = urlData?.publicUrl;
                            if (!publicUrl) throw new Error('获取图片链接失败');

                            const { error: updateError } = await supabase
                                .from('profiles')
                                .update({ cover_url: publicUrl })
                                .eq('user_number', parseInt(userNumber));

                            if (updateError) throw new Error(`更新数据库失败: ${updateError.message}`);

                            const bg = document.querySelector('.user-header-bg');
                            if (bg) {
                                bg.style.backgroundImage = `url('${publicUrl}')`;
                            }
                            coverUrl = publicUrl;

                            coverFeedback.textContent = '✅ 封面更新成功！';
                            coverFeedback.style.color = '#27ae60';
                            setTimeout(closeCoverUpload, 1200);

                        } catch (err) {
                            coverFeedback.textContent = '❌ ' + err.message;
                            coverFeedback.style.color = '#e74c3c';
                            uploadBtn.disabled = false;
                            uploadBtn.textContent = '上传';
                        }
                    });
                }

            } catch (err) {
                console.error('加载出错：', err);
                loadingEl.textContent = '❌ 加载失败: ' + escapeHtml(err.message);
                loadingEl.style.display = 'block';
                profileContainer.style.display = 'none';
            }
        })();
    </script>

</body>

</html>
