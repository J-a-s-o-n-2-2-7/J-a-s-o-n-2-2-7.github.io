<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改用户名 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .info-line {
            text-align: center;
            margin: 16px 0;
            font-size: 14px;
            color: #5b6e8c;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
            background: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #e74c3c;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 300px;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            margin: 16px 0;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons button {
            flex: 1;
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>✨ Jason227</h1>
        <div class="sub">修改用户名</div>

        <div id="dynamicContent"></div>

        <div class="footer-links">
            <a href="/user/setting/security">← 返回安全设置</a>
        </div>
    </div>

    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>验证当前密码</h3>
            <input type="password" id="modalPassword" placeholder="请输入密码">
            <div class="modal-buttons">
                <button id="confirmPwdBtn" style="background:#e74c3c;">确认</button>
                <button id="cancelModalBtn" style="background:#7f8c8d;">取消</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let currentUser = null;
            let profileData = null;
            let pendingNewUsername = null;

            const dynamicContent = document.getElementById('dynamicContent');
            const modal = document.getElementById('passwordModal');
            const modalPassword = document.getElementById('modalPassword');
            const confirmPwdBtn = document.getElementById('confirmPwdBtn');
            const cancelModalBtn = document.getElementById('cancelModalBtn');

            function showModal() {
                modal.style.display = 'flex';
                modalPassword.value = '';
            }
            function hideModal() {
                modal.style.display = 'none';
            }

            async function verifyPassword(password) {
                const { error } = await supabase.auth.signInWithPassword({
                    email: currentUser.email,
                    password: password
                });
                return !error;
            }

            async function loadUserData() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/auth/login';
                        return;
                    }
                    currentUser = session.user;

                    const { data, error } = await supabase
                        .from('profiles')
                        .select('username, username_last_modified')
                        .eq('id', currentUser.id)
                        .single();

                    if (error) throw new Error(error.message);
                    profileData = data;

                    const lastModified = data.username_last_modified ? new Date(data.username_last_modified) : null;
                    const now = new Date();
                    let canModify = false;
                    let lastModifiedStr = '';

                    if (!lastModified) {
                        canModify = true;
                        lastModifiedStr = '首次修改';
                    } else {
                        const nextAllowed = new Date(lastModified);
                        nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                        if (now >= nextAllowed) {
                            canModify = true;
                            const year = lastModified.getFullYear();
                            const month = String(lastModified.getMonth() + 1).padStart(2, '0');
                            const day = String(lastModified.getDate()).padStart(2, '0');
                            const hours = String(lastModified.getHours()).padStart(2, '0');
                            const minutes = String(lastModified.getMinutes()).padStart(2, '0');
                            lastModifiedStr = `${year}-${month}-${day} ${hours}:${minutes}`;
                        } else {
                            canModify = false;
                            const year = lastModified.getFullYear();
                            const month = String(lastModified.getMonth() + 1).padStart(2, '0');
                            const day = String(lastModified.getDate()).padStart(2, '0');
                            const hours = String(lastModified.getHours()).padStart(2, '0');
                            const minutes = String(lastModified.getMinutes()).padStart(2, '0');
                            lastModifiedStr = `${year}-${month}-${day} ${hours}:${minutes}`;
                        }
                    }

                    if (canModify) {
                        dynamicContent.innerHTML = `
                            <div class="info-line">上次修改时间<br>${lastModifiedStr}</div>
                            <div class="input-group">
                                <input type="text" id="newUsername" placeholder="新用户名" autocomplete="off">
                            </div>
                            <button id="submitBtn">确认修改</button>
                            <div id="msg" class="message"></div>
                        `;
                        const submitBtn = document.getElementById('submitBtn');
                        const newUsernameInput = document.getElementById('newUsername');
                        const msgDiv = document.getElementById('msg');

                        submitBtn.addEventListener('click', () => {
                            const newUsername = newUsernameInput.value.trim();
                            msgDiv.innerHTML = '';
                            const usernameRegex = /^[a-zA-Z_][a-zA-Z0-9_]{5,15}$/;
                            if (!newUsername) {
                                msgDiv.innerHTML = '<div class="message error">请输入用户名</div>';
                                return;
                            }
                            if (!usernameRegex.test(newUsername)) {
                                msgDiv.innerHTML = '<div class="message error">用户名长度应在 4 到 20 字节之间 用户名不能为纯数字、或以数字开头</div>';
                                return;
                            }
                            if (newUsername === profileData.username) {
                                msgDiv.innerHTML = '<div class="message error">新用户名不能与当前用户名相同</div>';
                                return;
                            }
                            pendingNewUsername = newUsername;
                            showModal();
                        });
                    } else {
                        // 不可修改：一行显示，灰色文字
                        dynamicContent.innerHTML = `
                            <div class="info-line">上次修改时间：${lastModifiedStr}，禁止修改。</div>
                        `;
                    }
                } catch (err) {
                    dynamicContent.innerHTML = `<div class="info-line">加载失败: ${err.message}</div>`;
                }
            }

            confirmPwdBtn.addEventListener('click', async () => {
                const password = modalPassword.value.trim();
                if (!password) {
                    alert('请输入密码');
                    return;
                }
                const isValid = await verifyPassword(password);
                if (!isValid) {
                    alert('密码错误');
                    return;
                }
                hideModal();

                const msgDiv = document.getElementById('msg');
                if (msgDiv) msgDiv.innerHTML = '<div class="message success">提交中...</div>';

                const { data: existing } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', pendingNewUsername)
                    .maybeSingle();
                if (existing) {
                    if (msgDiv) msgDiv.innerHTML = '<div class="message error">用户名已被占用，请换一个</div>';
                    return;
                }

                const lastModified = profileData.username_last_modified ? new Date(profileData.username_last_modified) : null;
                if (lastModified) {
                    const nextAllowed = new Date(lastModified);
                    nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                    if (new Date() < nextAllowed) {
                        const days = Math.ceil((nextAllowed - new Date()) / (1000 * 60 * 60 * 24));
                        if (msgDiv) msgDiv.innerHTML = `<div class="message error">距离上次修改不足一年，还需等待 ${days} 天</div>`;
                        return;
                    }
                }

                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = '提交中...';
                }
                const { error: updateError } = await supabase
                    .from('profiles')
                    .update({
                        username: pendingNewUsername,
                        username_last_modified: new Date().toISOString()
                    })
                    .eq('id', currentUser.id);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '确认修改';
                }
                if (updateError) {
                    if (msgDiv) msgDiv.innerHTML = `<div class="message error">修改失败: ${updateError.message}</div>`;
                } else {
                    if (msgDiv) msgDiv.innerHTML = '<div class="message success">用户名修改成功！请重新登录</div>';
                    setTimeout(async () => {
                        await supabase.auth.signOut();
                        window.location.href = '/auth/login';
                    }, 2000);
                }
            });

            cancelModalBtn.addEventListener('click', hideModal);
            window.addEventListener('click', (e) => {
                if (e.target === modal) hideModal();
            });

            loadUserData();
        })();
    </script>
</body>

</html>
