<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建文章</title>

    <!-- ===== 编辑器依赖 ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.0.2/dist/markdown-it-emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@1.0.4/dist/markdown-it-abbr.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="./markdown-renderer.css">
    <script src="./markdown-renderer.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* ===== 页面通用样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 28px 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2632;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 i {
            color: #e74c3c;
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #2c3e50;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #e2e6ea;
        }

        .btn-primary {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary:hover {
            background: #c0392b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #404040;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border 0.15s, box-shadow 0.15s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
            background: #ffffff;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding-top: 16px;
            margin-top: 20px;
        }

        .form-actions .btn-secondary,
        .form-actions .btn-primary {
            padding: 10px 24px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn-secondary,
            .form-actions .btn-primary {
                justify-content: center;
            }
        }

        /* ===== 编辑器样式 ===== */
        .reply-editor {
            background: #f8f9fc;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 4px;
        }

        .cs-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            padding: 8px 12px;
            background: #fff;
            border-bottom: 1px solid #e9ecef;
        }

        .cs-toolbar-group {
            display: flex;
            align-items: center;
            gap: 2px;
            padding-right: 8px;
            border-right: 1px solid #e9ecef;
        }

        .cs-toolbar-group:last-child {
            border-right: none;
            padding-right: 0;
        }

        .cs-toolbar-tool {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            color: #404040;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-size: 14px;
            position: relative;
            border: none;
            background: transparent;
        }

        .cs-toolbar-tool:hover {
            background: #D6D6D6;
        }

        .cs-toolbar-tool.active {
            background: #D6D6D6;
        }

        .cs-toolbar-tool svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .cs-toolbar-tool .cs-tooltip {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: #555555;
            color: #fff;
            font-size: 11px;
            padding: 8px 8px;
            border-radius: 4px;
            white-space: nowrap;
            font-weight: 400;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .cs-toolbar-tool:hover .cs-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .cs-content {
            display: flex;
            height: 321px;
            background: #fff;
        }

        .cs-zone-half {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 12px 16px;
        }

        .cs-zone-half:first-child {
            border-right: 1px solid #e9ecef;
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .cs-editor {
            font-family: 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.7;
            color: #6C6C6C;
            outline: none;
            resize: none;
            border: none;
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 12px 16px;
            tab-size: 4;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #fff;
        }

        .cs-editor:focus {
            outline: none;
        }

        .cs-editor::placeholder {
            color: #b0b8c4;
        }

        .cs-viewer {
            font-size: 15px;
            line-height: 1.7;
            color: #404040;
            padding: 12px 16px;
            overflow-y: auto;
        }

        .cs-viewer .benben-text {
            padding: 0;
        }

        .cs-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #ffffff;
            border-top: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cs-footer-left {
            font-size: 12px;
        }

        .cs-footer-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .cs-footer-button {
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
            background: none;
            border: none;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .cs-footer-button:hover {
            background-color: #FFEE66;
        }

        /* EasyMDE 自定义高亮 */
        .CodeMirror .cm-header {
            font-weight: 700 !important;
            text-decoration: underline !important;
            color: #404040 !important;
        }

        .CodeMirror .custom-math-inline {
            color: #994400 !important;
        }

        .CodeMirror .cm-link,
        .CodeMirror .cm-url,
        .CodeMirror .cm-formatting-link,
        .CodeMirror .cm-formatting-link-string {
            text-decoration: underline !important;
        }

        .CodeMirror .cm-url {
            color: #e74c3c !important;
        }

        .CodeMirror .cm-link,
        .CodeMirror .cm-formatting-link,
        .CodeMirror .cm-formatting-link-string {
            color: inherit !important;
        }

        /* 复制提示 */
        .swal2-toast-copy {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #fff;
            padding: 16px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 9999;
            pointer-events: none;
        }

        .swal2-toast-copy.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .swal2-toast-copy .success-icon {
            stroke: #a5dc86;
            stroke-width: 3;
            width: 28px;
            height: 28px;
        }

        .swal2-toast-copy .swal2-title-copy {
            font-size: 16px;
            font-weight: 600;
            color: #1a2632;
            margin: 0;
        }

        @media (max-width: 768px) {
            .cs-zone-half {
                padding: 8px 12px;
                min-height: 160px;
            }

            .cs-toolbar {
                padding: 4px 8px;
                gap: 2px 4px;
            }

            .cs-toolbar-tool {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }

            .cs-toolbar-tool svg {
                width: 14px;
                height: 14px;
            }

            .cs-toolbar-group {
                padding-right: 4px;
                gap: 1px;
            }
        }

        @media (max-width: 480px) {
            .cs-zone-half {
                padding: 6px 8px;
                min-height: 120px;
            }

            .cs-toolbar-tool .cs-tooltip {
                display: none !important;
            }
        }

        .cs-zone-half:first-child .CodeMirror {
            flex: 1 1 0%;
            height: auto !important;
            min-height: 0;
        }

        .cs-zone-half:first-child .CodeMirror-scroll {
            flex: 1 1 0%;
            height: auto !important;
            min-height: 0;
        }

        /* 编辑器伪全屏模式 */
        .reply-editor.fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            z-index: 9999;
            border-radius: 0;
            border: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .reply-editor.fullscreen-mode .cs-content {
            flex: 1;
            height: auto !important;
            min-height: 0;
        }

        body.fullscreen-body {
            overflow: hidden;
        }

        .reply-editor.fullscreen-mode .cs-footer {
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-pencil-alt"></i> <span id="pageTitle">新建文章</span></h1>
            <a href="index.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> 返回列表</a>
        </div>

                        <!-- 链接、图片、代码、表格 -->
                        <span class="cs-toolbar-group">

    <!-- ================================================================ -->
    <!-- 编辑器初始化脚本（包含完整的工具栏绑定和 Supabase 集成）     -->
    <!-- ================================================================ -->
    <script>
        (function () {
            'use strict';

            // ===== Supabase 配置 =====
            const supabaseUrl = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const supabaseKey = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            let currentUser = null;

            async function fetchCurrentUser() {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUser = session.user;
                }
            }

            // ===== 工具函数 =====
            let currentView = 'split';
            let lastSaveTime = null;

            function formatTime(date) {
                const pad = n => String(n).padStart(2, '0');
                return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
            }

            function updateFooter() {
                const text = easyMDE.value();
                const chars = text.replace(/\s/g, '').length;
                let footerText = `字数统计：${chars} 字符`;
                if (lastSaveTime) {
                    footerText += ` | 上次保存时间 ${formatTime(lastSaveTime)}`;
                }
                document.getElementById('wordCount').textContent = footerText;
            }

            // ===== 页面参数 =====
            const params = new URLSearchParams(window.location.search);
            const editId = params.get('edit');
            const isEdit = !!editId;

            const titleInput = document.getElementById('formTitle');
            const submitText = document.getElementById('submitText');
            const pageTitle = document.getElementById('pageTitle');

            // ===== 初始化 EasyMDE =====
            if (typeof MarkdownRenderer === 'undefined') {
                window.MarkdownRenderer = { render: function (text) { return ''; } };
            }

            const easyMDE = new EasyMDE({
                element: document.getElementById('replyInput'),
                spellChecker: false,
                autosave: { enabled: false },
                status: false,
                toolbar: false,
                renderingConfig: {
                    singleLineBreaks: false,
                    codeSyntaxHighlighting: true,
                },
                previewRender: function (plainText) {
                    return MarkdownRenderer.render(plainText, {
                        isAdmin: false,
                        username: '',
                        mentionMap: {},
                        uniqueId: 'preview-' + Date.now()
                    });
                }
            });

            setTimeout(() => {
                easyMDE.codemirror.refresh();
            }, 50);

            // ===== 数学公式高亮 =====
            function highlightMath() {
                const cm = easyMDE.codemirror;
                const doc = cm.getDoc();
                cm.getAllMarks().forEach(mark => mark.clear());
                for (let i = 0; i < doc.lineCount(); i++) {
                    const line = doc.getLine(i);
                    const regex = /\$\$[^$]*\$\$|\$[^$\n]*\$/g;
                    let match;
                    while ((match = regex.exec(line)) !== null) {
                        const from = { line: i, ch: match.index };
                        const to = { line: i, ch: match.index + match[0].length };
                        doc.markText(from, to, { className: 'custom-math-inline' });
                    }
                }
            }
            easyMDE.codemirror.on('change', function () {
                easyMDE.codemirror.getAllMarks().forEach(mark => mark.clear());
                highlightMath();
            });
            setTimeout(highlightMath, 100);

            // ===== 预览更新 =====
            function updatePreview() {
                const text = easyMDE.value();
                const rendered = MarkdownRenderer.render(text, {
                    isAdmin: false,
                    username: '',
                    mentionMap: {},
                    uniqueId: 'preview-' + Date.now()
                });
                document.getElementById('previewContent').innerHTML = rendered;

                if (typeof mermaid !== 'undefined') {
                    mermaid.initialize({
                        theme: 'default',
                        startOnLoad: false,
                        themeVariables: {
                            background: '#ffffff',
                            primaryColor: '#e74c3c',
                            primaryTextColor: '#333',
                            primaryBorderColor: '#ccc',
                            lineColor: '#666',
                            secondaryColor: '#f0f2f5',
                            tertiaryColor: '#f9f9f9'
                        }
                    });
                    requestAnimationFrame(() => {
                        mermaid.run({ nodes: document.querySelectorAll('.mermaid') })
                            .catch(err => console.warn('Mermaid 渲染失败:', err));
                    });
                }

                updateFooter();
            }

            easyMDE.codemirror.on('change', updatePreview);
            setTimeout(updatePreview, 200);

            // ===== 工具栏功能（完整版） =====
            const cm = easyMDE.codemirror;

            function wrapSelection(before, after) {
                const from = cm.getCursor('from');
                const to = cm.getCursor('to');
                const selectedText = cm.getRange(from, to);
                const newText = before + selectedText + after;
                cm.replaceRange(newText, from, to);
                const cursorPos = { line: from.line, ch: from.ch + before.length + selectedText.length };
                cm.setCursor(cursorPos);
                cm.focus();
                updatePreview();
            }

            function insertText(text) {
                const cursor = cm.getCursor();
                cm.replaceRange(text, cursor, cursor);
                const lines = text.split('\n');
                if (lines.length === 1) {
                    cm.setCursor({ line: cursor.line, ch: cursor.ch + text.length });
                } else {
                    const lastLine = lines[lines.length - 1];
                    cm.setCursor({ line: cursor.line + lines.length - 1, ch: lastLine.length });
                }
                cm.focus();
                updatePreview();
            }

            function headingUp() {
                const cursor = cm.getCursor();
                const line = cm.getLine(cursor.line);
                const match = line.match(/^(\s*)(#+)(.*)$/);
                if (match) {
                    let spaces = match[1],
                        hashes = match[2],
                        rest = match[3];
                    let count = hashes.length;
                    if (count > 1) {
                        let newHashes = '#'.repeat(count - 1);
                        let content = rest.replace(/^\s+/, '');
                        let newLine = spaces + newHashes + ' ' + content;
                        cm.replaceRange(newLine, { line: cursor.line, ch: 0 }, { line: cursor.line, ch: line.length });
                    }
                } else {
                    let content = line.replace(/^\s+/, '');
                    let newLine = '### ' + content;
                    cm.replaceRange(newLine, { line: cursor.line, ch: 0 }, { line: cursor.line, ch: line.length });
                }
                cm.focus();
                updatePreview();
            }

            function headingDown() {
                const cursor = cm.getCursor();
                const line = cm.getLine(cursor.line);
                const match = line.match(/^(\s*)(#+)(.*)$/);
                if (match) {
                    let spaces = match[1],
                        hashes = match[2],
                        rest = match[3];
                    let count = hashes.length;
                    let content = rest.replace(/^\s+/, '');
                    if (count < 6) {
                        let newHashes = '#'.repeat(count + 1);
                        let newLine = spaces + newHashes + ' ' + content;
                        cm.replaceRange(newLine, { line: cursor.line, ch: 0 }, { line: cursor.line, ch: line.length });
                    } else {
                        let newLine = spaces + content;
                        cm.replaceRange(newLine, { line: cursor.line, ch: 0 }, { line: cursor.line, ch: line.length });
                    }
                } else {
                    let content = line.replace(/^\s+/, '');
                    let newLine = '### ' + content;
                    cm.replaceRange(newLine, { line: cursor.line, ch: 0 }, { line: cursor.line, ch: line.length });
                }
                cm.focus();
                updatePreview();
            }

            // 绑定所有工具栏按钮
            document.querySelectorAll('.cs-toolbar-tool[data-action]').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    const action = this.dataset.action;
                    switch (action) {
                        case 'bold': wrapSelection('**', '**'); break;
                        case 'italic': wrapSelection('*', '*'); break;
                        case 'strike': wrapSelection('~~', '~~'); break;
                        case 'math': wrapSelection('$', '$'); break;
                        case 'quote': wrapSelection('> ', ''); break;
                        case 'ul': wrapSelection('- ', ''); break;
                        case 'ol': wrapSelection('1. ', ''); break;
                        case 'task': wrapSelection('- [ ] ', ''); break;
                        case 'heading-up': headingUp(); break;
                        case 'heading-down': headingDown(); break;
                        case 'hr': insertText('---\n\n'); break;
                        case 'link': {
                            const selectedText = cm.getSelection();
                            Swal.fire({
                                title: '插入链接',
                                html: `
                            <div style="text-align:left;margin-bottom:12px;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;">链接地址</label>
                                <input id="swal-url" class="swal2-input" type="text" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;">
                            </div>
                            <div style="text-align:left;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;">链接介绍</label>
                                <input id="swal-text" class="swal2-input" type="text" value="${selectedText.replace(/"/g, '&quot;')}" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;">
                            </div>
                        `,
                                confirmButtonText: '确认',
                                cancelButtonText: '取消',
                                showCancelButton: true,
                                confirmButtonColor: '#e74c3c',
                                cancelButtonColor: '#BFBFBF',
                                focusConfirm: false,
                                preConfirm: function () {
                                    const url = document.getElementById('swal-url').value.trim();
                                    const text = document.getElementById('swal-text').value.trim() || url;
                                    if (!url) { Swal.showValidationMessage('请输入链接地址'); return false; }
                                    return { url, text };
                                }
                            }).then(function (result) {
                                if (result.isConfirmed && result.value) {
                                    const { url, text } = result.value;
                                    cm.replaceRange(`[${text}](${url})`, cm.getCursor('from'), cm.getCursor('to'));
                                    cm.focus();
                                    updatePreview();
                                }
                            });
                            break;
                        }
                        case 'image': {
                            const selectedText = cm.getSelection();
                            Swal.fire({
                                title: '插入图片',
                                html: `
                            <div style="text-align:left;margin-bottom:12px;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;">图片地址</label>
                                <input id="swal-img-url" class="swal2-input" type="text" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;">
                            </div>
                            <div style="text-align:left;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;">图片介绍</label>
                                <input id="swal-img-alt" class="swal2-input" type="text" value="${selectedText.replace(/"/g, '&quot;')}" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;">
                            </div>
                        `,
                                confirmButtonText: '确认',
                                cancelButtonText: '取消',
                                showCancelButton: true,
                                confirmButtonColor: '#e74c3c',
                                cancelButtonColor: '#BFBFBF',
                                focusConfirm: false,
                                preConfirm: function () {
                                    const url = document.getElementById('swal-img-url').value.trim();
                                    const alt = document.getElementById('swal-img-alt').value.trim() || '图片';
                                    if (!url) { Swal.showValidationMessage('请输入图片地址'); return false; }
                                    return { url, alt };
                                }
                            }).then(function (result) {
                                if (result.isConfirmed && result.value) {
                                    const { url, alt } = result.value;
                                    cm.replaceRange(`![${alt}](${url})`, cm.getCursor('from'), cm.getCursor('to'));
                                    cm.focus();
                                    updatePreview();
                                }
                            });
                            break;
                        }
                        case 'code': {
                            Swal.fire({
                                title: '插入代码块',
                                html: `
                            <div style="text-align:left;margin-bottom:12px;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;vertical-align:middle;">选择语言</label>
                                <input id="swal-code-lang" class="swal2-input" type="text" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;vertical-align:middle;">
                            </div>
                            <div style="text-align:left;margin-bottom:12px;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;vertical-align:middle;">输入代码</label>
                                <textarea id="swal-code-content" class="swal2-textarea" style="display:inline-block;width:calc(100% - 95px);min-height:150px;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;font-family:Menlo,Consolas,monospace;resize:vertical;vertical-align:top;"></textarea>
                            </div>
                        `,
                                confirmButtonText: '确认',
                                cancelButtonText: '取消',
                                showCancelButton: true,
                                confirmButtonColor: '#e74c3c',
                                cancelButtonColor: '#BFBFBF',
                                focusConfirm: false,
                                width: '600px',
                                preConfirm: function () {
                                    const lang = document.getElementById('swal-code-lang').value.trim();
                                    const code = document.getElementById('swal-code-content').value;
                                    if (!code) { Swal.showValidationMessage('请输入代码内容'); return false; }
                                    return { lang, code };
                                }
                            }).then(function (result) {
                                if (result.isConfirmed && result.value) {
                                    const { lang, code } = result.value;
                                    const codeBlock = lang ? '```' + lang + '\n' + code + '\n```' : '```\n' + code + '\n```';
                                    if (cm.getSelection()) { cm.replaceSelection(codeBlock); } else {
                                        cm.replaceRange(codeBlock, cm
                                            .getCursor('from'), cm.getCursor('to'));
                                    }
                                    cm.focus();
                                    updatePreview();
                                }
                            });
                            break;
                        }
                        case 'table': {
                            Swal.fire({
                                title: '插入表格',
                                html: `
                            <div style="text-align:left;margin-bottom:12px;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;vertical-align:middle;">输入行数</label>
                                <input id="swal-table-rows" class="swal2-input" type="number" value="2" min="1" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;vertical-align:middle;">
                            </div>
                            <div style="text-align:left;">
                                <label style="display:inline-block;width:80px;font-weight:600;font-size:14px;text-align:right;margin-right:10px;vertical-align:middle;">输入列数</label>
                                <input id="swal-table-cols" class="swal2-input" type="number" value="2" min="1" style="display:inline-block;width:calc(100% - 95px);padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;vertical-align:middle;">
                            </div>
                        `,
                                confirmButtonText: '确认',
                                cancelButtonText: '取消',
                                showCancelButton: true,
                                confirmButtonColor: '#e74c3c',
                                cancelButtonColor: '#BFBFBF',
                                focusConfirm: false,
                                width: '600px',
                                preConfirm: function () {
                                    const rows = parseInt(document.getElementById('swal-table-rows').value) || 2;
                                    const cols = parseInt(document.getElementById('swal-table-cols').value) || 2;
                                    if (rows < 1 || cols < 1) { Swal.showValidationMessage('行列数至少为1'); return false; }
                                    return { rows, cols };
                                }
                            }).then(function (result) {
                                if (result.isConfirmed && result.value) {
                                    const { rows, cols } = result.value;
                                    const dataRows = rows - 1;
                                    let table = '';
                                    table += '|' + '   |'.repeat(cols) + '\n';
                                    table += '|' + ':---:|'.repeat(cols) + '\n';
                                    for (let i = 0; i < dataRows; i++) {
                                        table += '|' + '   |'.repeat(cols);
                                        if (i < dataRows - 1) table += '\n';
                                    }
                                    if (cm.getSelection()) { cm.replaceSelection(table); } else {
                                        cm.replaceRange(table, cm
                                            .getCursor('from'), cm.getCursor('to'));
                                    }
                                    cm.focus();
                                    updatePreview();
                                }
                            });
                            break;
                        }
                        case 'edit-only': {
                            const halves = document.querySelectorAll('.cs-zone-half');
                            const btn = this;
                            const previewBtn = document.querySelector('[data-action="preview-only"]');
                            if (currentView === 'edit') {
                                halves[0].style.display = 'flex';
                                halves[0].style.flex = '1';
                                halves[0].style.width = '';
                                halves[0].style.borderRight = '';
                                halves[1].style.display = 'block';
                                halves[1].style.flex = '1';
                                halves[1].style.width = '';
                                currentView = 'split';
                                btn.classList.remove('active');
                                previewBtn.classList.remove('active');
                                btn.querySelector('.cs-tooltip').textContent = '仅编辑';
                                setTimeout(() => easyMDE.codemirror.refresh(), 50);
                            } else {
                                halves[0].style.display = 'flex';
                                halves[0].style.flex = '1 1 100%';
                                halves[0].style.width = '100%';
                                halves[0].style.borderRight = 'none';
                                halves[1].style.display = 'none';
                                currentView = 'edit';
                                btn.classList.add('active');
                                previewBtn.classList.remove('active');
                                btn.querySelector('.cs-tooltip').textContent = '仅编辑';
                                setTimeout(() => easyMDE.codemirror.refresh(), 50);
                            }
                            break;
                        }
                        case 'preview-only': {
                            const halves = document.querySelectorAll('.cs-zone-half');
                            const btn = this;
                            const editBtn = document.querySelector('[data-action="edit-only"]');
                            if (currentView === 'preview') {
                                halves[0].style.display = 'flex';
                                halves[0].style.flex = '1';
                                halves[0].style.width = '';
                                halves[0].style.borderRight = '';
                                halves[1].style.display = 'block';
                                halves[1].style.flex = '1';
                                halves[1].style.width = '';
                                currentView = 'split';
                                btn.classList.remove('active');
                                editBtn.classList.remove('active');
                                btn.querySelector('.cs-tooltip').textContent = '仅预览';
                            } else {
                                halves[0].style.display = 'none';
                                halves[1].style.display = 'block';
                                halves[1].style.flex = '1 1 100%';
                                halves[1].style.width = '100%';
                                currentView = 'preview';
                                btn.classList.add('active');
                                editBtn.classList.remove('active');
                                btn.querySelector('.cs-tooltip').textContent = '仅预览';
                            }
                            break;
                        }
                        case 'fullscreen': {
                            const editor = document.querySelector('.reply-editor');
                            const btn = this;
                            const tip = btn.querySelector('.cs-tooltip');
                            editor.classList.toggle('fullscreen-mode');
                            document.body.classList.toggle('fullscreen-body');
                            btn.classList.toggle('active');
                            if (editor.classList.contains('fullscreen-mode')) {
                                tip.textContent = '退出全屏';
                                setTimeout(() => easyMDE.codemirror.refresh(), 100);
                            } else {
                                tip.textContent = '全屏';
                                setTimeout(() => easyMDE.codemirror.refresh(), 100);
                            }
                            break;
                        }
                        case 'help': {
                            window.open('https://www.markdownguide.org/basic-syntax/', '_blank');
                            break;
                        }
                        case 'autosave': {
                            localStorage.setItem('editor_draft', easyMDE.value());
                            lastSaveTime = new Date();
                            updateFooter();
                            Swal.fire({ icon: 'success', title: '保存成功', timer: 1000, showConfirmButton: false });
                            break;
                        }
                    }
                });
            });

            // ===== 滚动同步 =====
            let scrollSyncEnabled = true;
            document.getElementById('toggleScrollSync').addEventListener('click', function () {
                scrollSyncEnabled = !scrollSyncEnabled;
                this.textContent = scrollSyncEnabled ? '禁用滚动同步' : '启用滚动同步';
            });
            document.getElementById('scrollToTopEditor').addEventListener('click', function () {
                document.querySelector('.cs-content').scrollTop = 0;
            });

            const editorZone = document.querySelector('.cs-zone-half:first-child');
            const previewZone = document.querySelector('.cs-zone-half:last-child');
            if (editorZone && previewZone) {
                editorZone.addEventListener('scroll', function () {
                    if (scrollSyncEnabled) {
                        const ratio = this.scrollTop / (this.scrollHeight - this.clientHeight);
                        previewZone.scrollTop = ratio * (previewZone.scrollHeight - previewZone.clientHeight);
                    }
                });
                previewZone.addEventListener('scroll', function () {
                    if (scrollSyncEnabled) {
                        const ratio = this.scrollTop / (this.scrollHeight - this.clientHeight);
                        editorZone.scrollTop = ratio * (editorZone.scrollHeight - editorZone.clientHeight);
                    }
                });
            }

            // ===== 自动保存草稿（每30秒） =====
            setInterval(function () {
                localStorage.setItem('editor_draft', easyMDE.value());
                lastSaveTime = new Date();
                updateFooter();
            }, 30000);

            // 加载本地草稿（如果有）
            const draft = localStorage.getItem('editor_draft');
            if (draft) {
                easyMDE.value(draft);
                // 不设置 lastSaveTime，避免显示“上次保存时间”
                setTimeout(updatePreview, 300);
            }

            // ================================================================
            // 文章操作（使用 `articles` 表）
            // ================================================================

            async function loadArticleFromSupabase(shortId) {
                const { data, error } = await supabase
                    .from('articles')
                    .select('short_id, title, content, author_id')
                    .eq('short_id', shortId)
                    .maybeSingle();
                if (error) throw error;
                return data;
            }

            // ===== 如果是编辑模式，加载文章 =====
            if (isEdit) {
                (async function () {
                    try {
                        await fetchCurrentUser(); // 确保用户已加载
                        const article = await loadArticleFromSupabase(editId);
                        if (!article) {
                            alert('文章不存在');
                            window.location.href = 'index.html';
                            return;
                        }
                        if (currentUser && article.author_id !== currentUser.id) {
                            alert('你没有权限编辑此文章');
                            window.location.href = 'index.html';
                            return;
                        }
                        titleInput.value = article.title || '';
                        easyMDE.value(article.content || '');
                        submitText.textContent = '更新';
                        pageTitle.textContent = '编辑文章';
                        document.getElementById('articleForm').dataset.editId = editId;
                        setTimeout(updatePreview, 300);
                    } catch (err) {
                        alert('加载文章失败：' + err.message);
                    }
                })();
            }

            // ===== 表单提交 =====
            document.getElementById('articleForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                if (!currentUser) {
                    alert('请先登录后再发布文章');
                    return;
                }

                const title = titleInput.value.trim();
                const content = easyMDE.value().trim();

                if (!title) {
                    alert('请输入文章标题');
                    return;
                }

                function generateShortId() {
                    return Math.random().toString(36).substring(2, 10);
                }

                const editId = document.getElementById('articleForm').dataset.editId || null;
                let articleId = editId;

                try {
                    if (editId) {
                        // 更新
                        const { error } = await supabase
                            .from('articles')
                            .update({
                                title: title,
                                content: content,
                                updated_at: new Date().toISOString()
                            })
                            .eq('short_id', editId)
                            .eq('author_id', currentUser.id);

                        if (error) throw error;
                        window.location.href = `/article/${editId}`;
                    } else {
                        // 新建
                        let newId = generateShortId();
                        const { error } = await supabase
                            .from('articles')
                            .insert({
                                short_id: newId,
                                title: title,
                                content: content,
                                author_id: currentUser.id,
                                created_at: new Date().toISOString(),
                                updated_at: new Date().toISOString()
                            });

                        if (error) {
                            if (error.code === '23505') { // 唯一冲突
                                newId = generateShortId();
                                const { error: retryError } = await supabase
                                    .from('articles')
                                    .insert({
                                        short_id: newId,
                                        title: title,
                                        content: content,
                                        author_id: currentUser.id,
                                        created_at: new Date().toISOString(),
                                        updated_at: new Date().toISOString()
                                    });
                                if (retryError) throw retryError;
                            } else {
                                throw error;
                            }
                        }
                        articleId = newId;
                        window.location.href = `/article/${articleId}`;
                    }

                    lastSaveTime = new Date();
                    updateFooter();

                } catch (err) {
                    alert('保存失败：' + err.message);
                }
            });

            // ===== 取消 =====
            document.getElementById('cancelBtn').addEventListener('click', function () {
                if (confirm('确定要取消吗？未保存的内容将丢失。')) {
                    window.location.href = 'index.html';
                }
            });

            // ===== Ctrl+Enter =====
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    const active = document.activeElement;
                    if (active && active.closest('.reply-editor')) {
                        e.preventDefault();
                        document.getElementById('articleForm').dispatchEvent(new Event('submit'));
                    }
                }
            });

            // ===== ESC =====
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    document.getElementById('cancelBtn').click();
                }
            });

            // ===== 初始化 =====
            (async function init() {
                await fetchCurrentUser();
                if (!currentUser) {
                    console.warn('用户未登录，将无法保存文章');
                }
                titleInput.focus();
                console.log('✅ 文章编辑器已初始化（使用 articles 表）');
            })();

        })();
    </script>

</body>
