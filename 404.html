<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>页面跳转中...</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: system-ui;
            text-align: center;
            padding: 50px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        (function () {
            var path = window.location.pathname;

            // 2. 用户主页：/user/数字
            var userMatch = path.match(/^\/user\/(\d+)/);
            if (userMatch) {
                var userId = userMatch[1];
                fetch('/user/index.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载用户主页模板');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/user/' + userId);
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法获取用户主页，请稍后再试。</p>';
                    });
                return;
            }

            // ===== discuss 路由（模仿 team） =====

            // 1. 若路径为 /discuss 且无查询参数 → 加载帖子列表页（若暂无列表页，可返回提示或重定向）
            if (path === '/discuss' && !window.location.search) {
                // 如果您有帖子列表页（比如 /discuss.html），就 fetch 它
                // 如果没有，可以返回 404 或重定向到首页
                fetch('/discuss.html')
                    .then(res => {
                        if (!res.ok) throw new Error('无法加载帖子列表页');
                        return res.text();
                    })
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/discuss');
                    })
                    .catch(err => {
                        console.error(err);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载帖子列表页，请稍后再试。</p>';
                    });
                return;
            }

            // 2. 若路径为 /discuss 且有查询参数 id → 转换为路径参数形式并加载详情页
            if (path === '/discuss' && window.location.search) {
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                if (id && /^\d+$/.test(id)) {
                    fetch('/post.html?id=' + id)
                        .then(res => {
                            if (!res.ok) throw new Error('无法加载帖子详情页');
                            return res.text();
                        })
                        .then(html => {
                            document.open();
                            document.write(html);
                            document.close();
                            history.replaceState({}, '', '/discuss/' + id);
                        })
                        .catch(err => {
                            console.error(err);
                            document.body.innerHTML = '<h1>加载失败</h1><p>无法加载帖子详情页，请稍后再试。</p>';
                        });
                    return;
                }
                // 若 id 无效，则显示 404
            }

            // 3. 若路径为 /discuss/数字 → 加载详情页
            const discussMatch = path.match(/^\/discuss\/(\d+)$/);
            if (discussMatch) {
                const id = discussMatch[1];
                fetch('/post.html?id=' + id)
                    .then(res => {
                        if (!res.ok) throw new Error('无法加载帖子详情页');
                        return res.text();
                    })
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/discuss/' + id);
                    })
                    .catch(err => {
                        console.error(err);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载帖子详情页，请稍后再试。</p>';
                    });
                return;
            }

            // ===== 新增：帮助文档路由（管理后台） =====

            // 3. 编辑帮助文档：/admin/help/数字/edit
            var helpEditMatch = path.match(/^\/admin\/help\/(\d+)\/edit$/);
            if (helpEditMatch) {
                var helpId = helpEditMatch[1];
                fetch('/edit.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载编辑页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/admin/help/' + helpId + '/edit');
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载编辑页，请稍后再试。</p>';
                    });
                return;
            }

            // 4. 新建帮助文档：/admin/help/new
            if (path === '/admin/help/new') {
                fetch('/edit.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载编辑页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/admin/help/new');
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载编辑页，请稍后再试。</p>';
                    });
                return;
            }

            // 5. 帮助列表：/admin/help
            if (path === '/admin/help') {
                fetch('/index.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载列表页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/admin/help');
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载列表页，请稍后再试。</p>';
                    });
                return;
            }

            // ===== 团队路由 =====

            // 1. 若路径为 /team 且无查询参数 → 加载团队列表页
            if (path === '/team' && !window.location.search) {
                fetch('/team.html')
                    .then(res => {
                        if (!res.ok) throw new Error('无法加载团队列表页');
                        return res.text();
                    })
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/team');
                    })
                    .catch(err => {
                        console.error(err);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载团队列表页，请稍后再试。</p>';
                    });
                return;
            }

            // 2. 若路径为 /team 且有查询参数 id → 转换为路径参数形式并加载详情页
            if (path === '/team' && window.location.search) {
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                if (id && /^\d+$/.test(id)) {
                    fetch('/team-detail.html')
                        .then(res => {
                            if (!res.ok) throw new Error('无法加载团队详情页');
                            return res.text();
                        })
                        .then(html => {
                            document.open();
                            document.write(html);
                            document.close();
                            // 将 URL 替换为 /team/id，方便刷新
                            history.replaceState({}, '', '/team/' + id);
                        })
                        .catch(err => {
                            console.error(err);
                            document.body.innerHTML = '<h1>加载失败</h1><p>无法加载团队详情页，请稍后再试。</p>';
                        });
                    return;
                }
                // 若 id 无效，则显示 404
            }

            // 3. 若路径为 /team/数字 → 加载详情页
            const teamMatch = path.match(/^\/team\/(\d+)$/);
            if (teamMatch) {
                const id = teamMatch[1];
                fetch('/team-detail.html')
                    .then(res => {
                        if (!res.ok) throw new Error('无法加载团队详情页');
                        return res.text();
                    })
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/team/' + id);
                    })
                    .catch(err => {
                        console.error(err);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载团队详情页，请稍后再试。</p>';
                    });
                return;
            }

            // 6. 其他路径显示 404
            document.body.innerHTML = `
                <h1>404 - 页面未找到</h1>
                <p>您访问的页面不存在，请检查网址。</p>
                <p><a href="/">返回首页</a></p>
            `;
        })();
    </script>
</head>

<body>
    <div class="loader"></div>
    <p>正在加载...</p>
</body>

</html>
