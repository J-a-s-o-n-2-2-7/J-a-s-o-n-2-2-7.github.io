<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* 样式完全不变，省略 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
            background: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .captcha-row input {
            flex: 1;
        }

        .captcha-row canvas {
            cursor: pointer;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            width: 120px;
            height: 44px;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #e74c3c;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>✨ Jason227</h1>
        <div class="sub">登录账号</div>

        <div class="input-group">
            <input type="text" id="loginIdentifier" placeholder="用户名、UID、手机或电子邮箱" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password">
        </div>
        <div class="input-group">
            <div class="captcha-row">
                <input type="text" id="captchaInput" placeholder="请输入图形验证码" autocomplete="off" maxlength="6">
                <canvas id="captchaCanvas" width="120" height="44"></canvas>
            </div>
        </div>

        <button id="loginBtn">使用账户密码登录</button>
        <div id="loginMsg" class="message"></div>

        <div class="footer-links">
            <a href="/auth/register">没有账号？</a>
            <a href="/auth/forgetPassword">忘记密码？</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function redirectIfLoggedIn() {
            try {
                const { data: { session } } = await sb.auth.getSession();
                if (session) {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error('检查登录状态失败:', err);
            }
        }
        redirectIfLoggedIn();

        let currentCaptcha = '';
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) captcha += chars[Math.floor(Math.random() * chars.length)];
            currentCaptcha = captcha.toUpperCase();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(100,100,100,${0.2 + Math.random() * 0.5})`;
                ctx.stroke();
            }
            for (let i = 0; i < 100; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }
            for (let i = 0; i < currentCaptcha.length; i++) {
                ctx.font = `${24 + Math.floor(Math.random() * 6)}px "Courier New", monospace`;
                ctx.fillStyle = `rgb(${50 + Math.random() * 100}, ${30 + Math.random() * 80}, ${20 + Math.random() * 70})`;
                const x = 12 + i * 20 + Math.random() * 6;
                const y = 30 + Math.random() * 8;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(currentCaptcha[i], 0, 0);
                ctx.restore();
            }
        }

        canvas.addEventListener('click', () => {
            generateCaptcha();
            document.getElementById('captchaInput').value = '';
        });
        generateCaptcha();

        async function getEmailByIdentifier(identifier) {
            if (/^1[3-9]\d{9}$/.test(identifier)) {
                const { data, error } = await sb
                    .from('profiles')
                    .select('email')
                    .eq('phone', identifier)
                    .maybeSingle();
                if (error || !data) return null;
                return data.email;
            }
            if (/^-?\d{1,6}$/.test(identifier)) {
                const { data, error } = await sb
                    .from('profiles')
                    .select('email')
                    .eq('user_number', parseInt(identifier))
                    .maybeSingle();
                if (error || !data) return null;
                return data.email;
            }
            if (identifier.includes('@')) {
                return identifier;
            }
            const { data, error } = await sb
                .from('profiles')
                .select('email')
                .eq('username', identifier)
                .maybeSingle();
            if (error || !data) return null;
            return data.email;
        }

        const loginBtn = document.getElementById('loginBtn');
        const loginMsg = document.getElementById('loginMsg');
        let isSubmitting = false;

        async function handleLogin() {
            if (isSubmitting) return;
            isSubmitting = true;
            loginBtn.disabled = true;

            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const userCaptcha = document.getElementById('captchaInput').value.trim();

            try {
                if (!identifier) {
                    loginMsg.innerHTML = '<div class="message error">请输入用户名、UID、手机或电子邮箱</div>';
                    return;
                }
                if (!password) {
                    loginMsg.innerHTML = '<div class="message error">请输入密码</div>';
                    return;
                }
                if (!userCaptcha) {
                    loginMsg.innerHTML = '<div class="message error">请输入验证码</div>';
                    return;
                }
                if (userCaptcha.toUpperCase() !== currentCaptcha) {
                    loginMsg.innerHTML = '<div class="message error">图形验证码错误</div>';
                    generateCaptcha();
                    document.getElementById('captchaInput').value = '';
                    return;
                }

                const email = await getEmailByIdentifier(identifier);
                if (!email) {
                    loginMsg.innerHTML = '<div class="message error">用户不存在</div>';
                    return;
                }

                // ★★★ 修改点：登录时获取 data（用户信息）★★★
                const { data, error } = await sb.auth.signInWithPassword({ email, password });

                if (error) {
                    loginMsg.innerHTML = '<div class="message error">用户名或密码错误</div>';
                    generateCaptcha();
                    document.getElementById('captchaInput').value = '';
                } else {
                    // ★★★ 新增：封禁检查 ★★★
                    try {
                        const { data: profile, error: profileError } = await sb
                            .from('profiles')
                            .select('is_banned')
                            .eq('id', data.user.id)
                            .single();

                        if (profile && profile.is_banned === true) {
                            // 强制登出
                            await sb.auth.signOut();
                            loginMsg.innerHTML = '<div class="message error">账号已被封禁，请联系管理员</div>';
                            generateCaptcha();
                            document.getElementById('captchaInput').value = '';
                            return;
                        }
                    } catch (checkErr) {
                        // 查询失败，记录日志但放行（避免误封）
                        console.warn('封禁检查失败，放行登录:', checkErr);
                    }

                    loginMsg.innerHTML = '<div class="message success">登录成功</div>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                }
            } finally {
                isSubmitting = false;
                loginBtn.disabled = false;
            }
        }

        loginBtn.addEventListener('click', handleLogin);
    </script>
</body>

</html>
