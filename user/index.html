<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        .profile-card {
            background: white;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #e74c3c;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            overflow: hidden;
        }

        /* ===== 顶栏（logo 点击回主页） ===== */
        .topbar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 24px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); position: sticky; top: 0; z-index: 200; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #e74c3c; text-decoration: none; }
        .logo:hover { color: #c0392b; }
        .auth-buttons { display: flex; gap: 16px; align-items: center; }
        .auth-btn { background: #e74c3c; color: #fff; border: none; border-radius: 30px; padding: 6px 20px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
        .auth-btn:hover { background: #c0392b; }
        .auth-btn.logout { background: #7f8c8d; }
        .user-email { font-size: 14px; color: #2c3e50; text-decoration: none; }

        /* ===== 布局 / 侧边栏（与主页一致） ===== */
        .main-layout { max-width: 1400px; margin: 0 auto; padding: 0 20px 20px 20px; position: relative; min-height: 100vh; }
        .nav-sidebar { position: fixed; top: 50px; left: 0; height: calc(100vh - 50px); width: 64px; background: #fff; box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06); padding: 16px 0; transition: width 0.3s ease; overflow-y: auto; overflow-x: hidden; white-space: nowrap; z-index: 150; }
        .nav-sidebar::-webkit-scrollbar { width: 4px; }
        .nav-sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .nav-sidebar:hover { width: 260px; }
        .nav-item, .group-title { padding: 10px 16px; font-size: 14px; color: #2c3e50; cursor: pointer; transition: background 0.2s, color 0.2s; display: flex; align-items: center; text-decoration: none; }
        .nav-item:hover, .group-title:hover { background: #f0f2f5; color: #e74c3c; text-decoration: none; }
        .nav-icon { width: 24px; text-align: center; font-size: 18px; flex-shrink: 0; margin-right: 12px; }
        .nav-icon svg { width: 20px; height: 20px; fill: currentColor; }
        .nav-group ul { list-style: none; padding: 0; margin: 0; }
        .nav-group .group-title { font-weight: 600; margin-top: 8px; cursor: default; }
        .nav-text { opacity: 0; transition: opacity 0.2s ease; }
        .nav-sidebar:hover .nav-text { opacity: 1; }
        .divider { height: 1px; background: #e9ecef; margin: 8px 0; }
        .nav-item.active { background: #f0f2f5; color: #e74c3c; }
        .content-wrapper { margin-left: 64px; padding-top: 20px; }
        .main-content { max-width: 100%; }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .main-layout { padding: 0 16px 16px 16px; }
            .nav-sidebar { position: relative; top: auto; left: auto; height: auto; width: 100%; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); margin-bottom: 20px; padding: 12px 0; transition: none; overflow: visible; white-space: normal; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
            .nav-sidebar:hover { width: 100%; }
            .nav-text { opacity: 1; }
            .content-wrapper { margin-left: 0; padding-top: 0; }
            .group-title { grid-column: 1 / -1; background: #e9ecef; margin-top: 0; }
            .divider { display: none; }
        }
        @media (max-width: 600px) {
            .topbar { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
            .logo { font-size: 1.2rem; }
            .profile-card { padding: 20px; }
        }

        .banned {
            color: #e74c3c;
            margin-top: 20px;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .info {
            color: #5b6e8c;
            margin: 10px 0;
        }

        .button-group {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 24px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            background: #7f8c8d;
        }
    </style>
</head>

    <script>
        (async function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const path = window.location.pathname;
            const match = path.match(/^\/user\/(\d+)/);
            const userNumber = match ? match[1] : null;
            const profileDiv = document.getElementById('profile');

            if (!userNumber) {
                profileDiv.innerHTML = '<div class="error">❌ 无效的用户编号，正确格式: /user/数字</div>';
                return;
            }

            try {
                // 获取当前登录用户信息
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw new Error(`获取登录状态失败: ${sessionError.message}`);
                const currentUserId = session?.user?.id || null;

                // 顶栏认证 UI：登录态显示用户名+登出，未登录显示登录/注册；管理员显示「用户管理」入口
                (async () => {
                    const c = document.getElementById('authButtons');
                    if (!session) { c.innerHTML = '<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>'; return; }
                    const { data: p } = await supabase.from('profiles').select('username, can_manage_users').eq('id', session.user.id).maybeSingle();
                    const name = p?.username || session.user.email || '用户';
                    c.innerHTML = '<span class="user-email">' + escapeHtml(name) + '</span><button id="logoutBtn" class="auth-btn logout">登出</button>';
                    const lb = document.getElementById('logoutBtn');
                    if (lb) lb.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });
                    const umi = document.getElementById('userManageItem');
                    if (umi) umi.style.display = (p?.can_manage_users === true) ? 'flex' : 'none';
                })();

                // 调用 RPC 获取目标用户数据（现在包含 id）
                const { data: user, error: rpcError } = await supabase.rpc('get_user_by_number', { p_user_number: parseInt(userNumber) });
                if (rpcError) throw new Error(`RPC 调用失败: ${rpcError.message}`);
                if (!user) throw new Error('用户不存在');

                // 取头像（RPC 未返回 avatar_url，单独查一次）
                const { data: avRow } = await supabase.from('profiles').select('avatar_url').eq('user_number', parseInt(userNumber)).maybeSingle();
                const avatarUrl = avRow?.avatar_url || '';

                // 直接比较用户 id
                const isOwner = currentUserId && user.id && currentUserId === user.id;

                document.title = `${user.username} 的个人主页 - Jason227`;
                const bannedUntil = user.banned_until ? new Date(user.banned_until) : null;
                const now = new Date();

                let html = '';
                if (bannedUntil && bannedUntil > now) {
                    html = `
                    <div class="avatar">⛔</div>
                    <h1>该用户已被封禁</h1>
                    <p class="banned">封禁至：${bannedUntil.toLocaleString()}</p>
                    <p class="info">编号 #${user.user_number}</p>
                `;
                } else {
                    html = `
                    <div class="avatar"><img src="${avatarUrl || letterAvatar(user.username)}" alt="头像" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;" onerror="this.onerror=null;this.src='${letterAvatar(user.username)}'"></div>
                    <h1>${escapeHtml(user.username)}</h1>
                    <p class="info">编号 #${user.user_number}</p>
                    <p class="info">注册时间：${new Date(user.created_at).toLocaleDateString()}</p>
                    ${user.banned_until ? '<p class="info">⚠️ 曾封禁已解封</p>' : ''}
                `;
                    if (isOwner) {
                        html += `<div class="button-group">
                        <a href="/user/setting/security" class="btn">个人设置</a>
                    </div>`;
                    }
                }
                profileDiv.innerHTML = html;
            } catch (err) {
                console.error('加载出错：', err);
                profileDiv.innerHTML = `<div class="error">❌ 加载失败: ${err.message}<br>请确认编号 ${userNumber} 存在，且 RPC 函数已返回 id 字段。</div>`;
            }
        })();

        // 系统默认头像（首字母 SVG，任意尺寸清晰缩放）
        function letterAvatar(name) {
            const ch = (name || 'U').trim().charAt(0).toUpperCase() || 'U';
            return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e74c3c'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.3em' fill='white' font-size='16' font-family='Arial'%3E" + encodeURIComponent(ch) + "%3C/text%3E%3C/svg%3E";
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>

</html>
