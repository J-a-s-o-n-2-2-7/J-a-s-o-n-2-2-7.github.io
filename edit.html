<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑帮助文档</title>
    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Markdown 渲染 (与主站保持一致) -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.0.2/dist/markdown-it-emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@1.0.4/dist/markdown-it-abbr.min.js"></script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        /* ===== 全局重置 & 变量（模仿洛谷风格） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --border-color: #e1e6eb;
            --text-primary: #2c3e50;
            --text-secondary: #5b6e8c;
            --text-muted: #8a9aa8;
            --primary: #3498db;
            --primary-hover: #2980b9;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: var(--bg);
            font-family: var(--font);
            padding: 24px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header .badge-status {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-status.published {
            background: #eafaf1;
            color: #27ae60;
        }

        .badge-status.draft {
            background: #f0f2f5;
            color: #8a9aa8;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* ===== 按钮 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: #f0f2f5;
        }

        .btn-sm {
            padding: 3px 10px;
            font-size: 12px;
        }

        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.2s;
            background: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 140px;
        }

        /* ===== 编辑器（洛谷风格分栏） ===== */
        .editor-wrapper {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            background: #fff;
            margin-top: 4px;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 12px;
            background: #f8f9fc;
            border-bottom: 1px solid var(--border-color);
        }

        .editor-toolbar .tool-btn {
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .editor-toolbar .tool-btn:hover {
            background: #e9ecf0;
            color: var(--text-primary);
        }

        .editor-toolbar .tool-btn:active {
            background: #d0d5dd;
        }

        .editor-toolbar .separator {
            width: 1px;
            background: var(--border-color);
            margin: 0 4px;
        }

        .editor-panes {
            display: flex;
            flex-direction: row;
            height: 500px;
            min-height: 300px;
        }

        .editor-pane {
            flex: 1;
            padding: 12px 16px;
            overflow: auto;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.7;
            border: none;
            resize: none;
            outline: none;
            background: #fafbfc;
            color: var(--text-primary);
        }

        .editor-pane:focus {
            background: #fff;
        }

        .editor-pane.preview {
            background: #fff;
            font-family: var(--font);
            white-space: normal;
            word-break: break-word;
            border-left: 1px solid var(--border-color);
        }

        .editor-pane.preview .markdown-body {
            max-width: 100%;
        }

        .editor-pane.preview .markdown-body img {
            max-width: 100%;
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            background: #f8f9fc;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .editor-footer .save-status {
            color: var(--success);
            font-weight: 500;
        }

        .editor-footer .save-status.saving {
            color: var(--text-muted);
        }

        /* ===== 消息 ===== */
        .message {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .editor-panes {
                flex-direction: column;
                height: auto;
            }

            .editor-pane {
                min-height: 200px;
                border-left: none !important;
                border-bottom: 1px solid var(--border-color);
            }

            .card {
                padding: 16px;
            }

            .form-row {
                flex-direction: column;
            }

            .card-header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
        }

        /* ===== 预览区 Markdown 样式（简化，与主站保持一致） ===== */
        .markdown-body h1,
        .markdown-body h2 {
            border-bottom: 1px solid #d8d8d8;
            margin: 1em 0;
        }

        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            margin: 1em 0;
        }

        .markdown-body p {
            margin: 0 0 1em 0;
        }

        .markdown-body blockquote {
            margin: 1em 0;
            padding: 8px 16px;
            border-left: 4px solid #eee;
        }

        .markdown-body code {
            background: #f0f2f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: #f0f2f5;
            padding: 12px 16px;
            border-radius: 6px;
            overflow-x: auto;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 0.75em 0 0.75em 1.5em;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.75em 0;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: left;
        }

        .markdown-body th {
            background: #f7f7f7;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
        }

        .markdown-body .align-center {
            text-align: center;
        }

        .markdown-body .align-right {
            text-align: right;
        }

        .markdown-body details {
            margin: 1em 0;
            padding: 8px 16px;
            border-left: 4px solid #ccc;
        }

        .markdown-body details summary {
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 id="pageTitle">📝 编辑文档</h1>
                <div class="header-actions">
                    <span id="statusBadge" class="badge-status draft">草稿</span>
                    <button class="btn btn-success" id="saveBtn">💾 保存</button>
                    <button class="btn btn-danger" id="deleteBtn" style="display:none;">🗑️ 删除</button>
                </div>
            </div>

            <!-- 标题 -->
            <div class="form-group">
                <label for="titleInput">标题 *</label>
                <input type="text" id="titleInput" placeholder="输入标题..." />
            </div>

            <!-- 状态 & 排序 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="statusSelect">状态</label>
                    <select id="statusSelect">
                        <option value="true">已发布</option>
                        <option value="false" selected>草稿</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sortOrderInput">排序序号（数值越大越靠前）</label>
                    <input type="number" id="sortOrderInput" placeholder="0" step="1" />
                </div>
            </div>

            <!-- 编辑器 -->
            <div class="form-group">
                <label>内容 <span style="font-weight:normal;color:var(--text-muted);font-size:12px;">（Markdown · Ctrl+S
                        保存）</span></label>
                <div class="editor-wrapper">
                    <div class="editor-toolbar" id="toolbar">
                        <button class="tool-btn" data-action="bold" title="加粗">B</button>
                        <button class="tool-btn" data-action="italic" title="斜体"><i>I</i></button>
                        <button class="tool-btn" data-action="strike" title="删除线"><s>S</s></button>
                        <span class="separator"></span>
                        <button class="tool-btn" data-action="h1" title="一级标题">H1</button>
                        <button class="tool-btn" data-action="h2" title="二级标题">H2</button>
                        <button class="tool-btn" data-action="h3" title="三级标题">H3</button>
                        <span class="separator"></span>
                        <button class="tool-btn" data-action="ul" title="无序列表">• 列表</button>
                        <button class="tool-btn" data-action="ol" title="有序列表">1. 列表</button>
                        <button class="tool-btn" data-action="task" title="任务列表">✅ 任务</button>
                        <span class="separator"></span>
                        <button class="tool-btn" data-action="link" title="链接">🔗</button>
                        <button class="tool-btn" data-action="image" title="图片">🖼️</button>
                        <button class="tool-btn" data-action="code" title="代码">&lt;/&gt;</button>
                        <button class="tool-btn" data-action="blockquote" title="引用">“</button>
                        <button class="tool-btn" data-action="table" title="表格">▦</button>
                        <span class="separator"></span>
                        <button class="tool-btn" data-action="latex" title="行内公式">∑</button>
                        <button class="tool-btn" data-action="latex-block" title="块级公式">∫</button>
                    </div>
                    <div class="editor-panes">
                        <textarea id="contentTextarea" class="editor-pane" placeholder="在此编写 Markdown 内容..."></textarea>
                        <div id="previewPane" class="editor-pane preview">
                            <div class="markdown-body">✨ 预览将在此显示</div>
                        </div>
                    </div>
                    <div class="editor-footer">
                        <span>字数：<span id="wordCount">0</span> 字符</span>
                        <span id="saveStatus" class="save-status">✅ 已保存</span>
                    </div>
                </div>
            </div>

            <div id="msgDiv"></div>
            <a href="/admin/help" class="back-link">← 返回列表</a>
        </div>
    </div>

    <script>
        (function () {
            // ===== Supabase 配置 =====
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ===== DOM 引用 =====
            const pageTitle = document.getElementById('pageTitle');
            const titleInput = document.getElementById('titleInput');
            const statusSelect = document.getElementById('statusSelect');
            const sortOrderInput = document.getElementById('sortOrderInput');
            const contentTextarea = document.getElementById('contentTextarea');
            const previewPane = document.getElementById('previewPane');
            const saveBtn = document.getElementById('saveBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const statusBadge = document.getElementById('statusBadge');
            const msgDiv = document.getElementById('msgDiv');
            const wordCount = document.getElementById('wordCount');
            const saveStatus = document.getElementById('saveStatus');

            // ===== 路由解析 =====
            const path = window.location.pathname;
            let isNew = false;
            let docId = null;

            if (path === '/admin/help/new') {
                isNew = true;
                pageTitle.textContent = '✨ 新建文档';
                deleteBtn.style.display = 'none';
            } else {
                const match = path.match(/^\/admin\/help\/(\d+)\/edit$/);
                if (match) {
                    docId = parseInt(match[1]);
                    pageTitle.textContent = `✏️ 编辑文档 #${docId}`;
                    deleteBtn.style.display = 'inline-flex';
                } else {
                    window.location.href = '/admin/help';
                    return;
                }
            }

            // ===== Markdown 渲染器 =====
            // 初始化 markdown-it（启用常用插件）
            const md = window.markdownit({
                html: true,
                linkify: true,
                typographer: true
            });
            if (window.markdownitTaskLists) md.use(window.markdownitTaskLists);
            if (window.markdownitEmoji) md.use(window.markdownitEmoji);
            if (window.markdownitFootnote) md.use(window.markdownitFootnote);
            if (window.markdownitDeflist) md.use(window.markdownitDeflist);
            if (window.markdownitAbbr) md.use(window.markdownitAbbr);

            // 自定义 LaTeX 渲染（简单处理）
            function renderLatex(text) {
                if (!text) return '';
                // 块级公式
                text = text.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
                    try {
                        return `<div style="text-align:center;margin:8px 0;">${katex.renderToString(math, { displayMode: true, throwOnError: false })}</div>`;
                    } catch (e) { return match; }
                });
                // 行内公式
                text = text.replace(/\$([^$]+?)\$/g, (match, math) => {
                    try {
                        return katex.renderToString(math, { throwOnError: false });
                    } catch (e) { return match; }
                });
                return text;
            }

            function renderMarkdown(raw) {
                if (!raw) return '<p>✨ 预览将在此显示</p>';
                // 先处理 LaTeX
                let processed = renderLatex(raw);
                // 渲染 Markdown
                let html = md.render(processed);
                // 安全过滤
                html = DOMPurify.sanitize(html, {
                    ADD_TAGS: ['iframe', 'details', 'summary', 'kbd', 'mark', 'ins', 'del', 'sub', 'sup'],
                    ADD_ATTR: ['src', 'width', 'height', 'frameborder', 'allowfullscreen', 'style', 'class']
                });
                return html;
            }

            // ===== 更新预览 =====
            function updatePreview() {
                const raw = contentTextarea.value;
                previewPane.innerHTML = `<div class="markdown-body">${renderMarkdown(raw)}</div>`;
                // 更新字数
                const count = raw.length;
                wordCount.textContent = count;
            }

            // ===== 工具函数 =====
            function showError(msg) {
                msgDiv.innerHTML = `<div class="message error">${msg}</div>`;
                setTimeout(() => msgDiv.innerHTML = '', 5000);
            }
            function showSuccess(msg) {
                msgDiv.innerHTML = `<div class="message success">${msg}</div>`;
                setTimeout(() => msgDiv.innerHTML = '', 3000);
            }
            function updateStatusBadge(published) {
                if (published) {
                    statusBadge.textContent = '已发布';
                    statusBadge.className = 'badge-status published';
                } else {
                    statusBadge.textContent = '草稿';
                    statusBadge.className = 'badge-status draft';
                }
            }
            function setSaveStatus(text, isSuccess = true) {
                saveStatus.textContent = text;
                saveStatus.className = 'save-status' + (isSuccess ? '' : ' saving');
            }

            // ===== 加载已有文档 =====
            async function loadDocument(id) {
                try {
                    const { data, error } = await supabase
                        .from('help')
                        .select('*')
                        .eq('id', id)
                        .single();
                    if (error) throw error;
                    if (!data) {
                        showError('文档不存在');
                        return;
                    }
                    titleInput.value = data.title || '';
                    statusSelect.value = data.is_published ? 'true' : 'false';
                    sortOrderInput.value = data.sort_order !== null && data.sort_order !== undefined ? data.sort_order : 0;
                    contentTextarea.value = data.content || '';
                    updateStatusBadge(data.is_published);
                    updatePreview();
                    setSaveStatus('✅ 已加载', true);
                } catch (err) {
                    showError('加载失败：' + err.message);
                    console.error(err);
                }
            }

            // ===== 保存 =====
            let isSaving = false;
            async function saveDocument() {
                if (isSaving) return;
                const title = titleInput.value.trim();
                if (!title) {
                    showError('标题不能为空');
                    titleInput.focus();
                    return;
                }
                const isPublished = statusSelect.value === 'true';
                const sortOrder = parseInt(sortOrderInput.value) || 0;
                const content = contentTextarea.value;

                const payload = {
                    title,
                    content,
                    is_published: isPublished,
                    sort_order: sortOrder,
                    updated_at: new Date().toISOString(),
                };

                isSaving = true;
                setSaveStatus('⏳ 保存中...', false);
                try {
                    if (isNew) {
                        const { data, error } = await supabase
                            .from('help')
                            .insert([{
                                ...payload,
                                created_at: new Date().toISOString(),
                            }])
                            .select()
                            .single();
                        if (error) throw error;
                        showSuccess('✅ 文档创建成功！');
                        // 转为编辑模式
                        const newId = data.id;
                        window.history.replaceState({}, '', `/admin/help/${newId}/edit`);
                        isNew = false;
                        docId = newId;
                        pageTitle.textContent = `✏️ 编辑文档 #${newId}`;
                        deleteBtn.style.display = 'inline-flex';
                        updateStatusBadge(isPublished);
                    } else {
                        const { error } = await supabase
                            .from('help')
                            .update(payload)
                            .eq('id', docId);
                        if (error) throw error;
                        showSuccess('✅ 保存成功！');
                        updateStatusBadge(isPublished);
                    }
                    setSaveStatus('✅ 已保存', true);
                } catch (err) {
                    showError('保存失败：' + err.message);
                    setSaveStatus('❌ 保存失败', false);
                    console.error(err);
                } finally {
                    isSaving = false;
                }
            }

            // ===== 删除 =====
            async function deleteDocument() {
                if (!docId) return;
                const result = await Swal.fire({
                    title: '确定删除此文档？',
                    text: '此操作不可撤销！',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: '删除',
                    cancelButtonText: '取消',
                    confirmButtonColor: '#e74c3c'
                });
                if (!result.isConfirmed) return;
                try {
                    const { error } = await supabase
                        .from('help')
                        .delete()
                        .eq('id', docId);
                    if (error) throw error;
                    showSuccess('🗑️ 已删除');
                    setTimeout(() => window.location.href = '/admin/help', 800);
                } catch (err) {
                    showError('删除失败：' + err.message);
                }
            }

            // ===== 工具栏插入 =====
            function insertText(before, after = '') {
                const ta = contentTextarea;
                const start = ta.selectionStart;
                const end = ta.selectionEnd;
                const selected = ta.value.substring(start, end);
                const newText = before + selected + after;
                ta.value = ta.value.substring(0, start) + newText + ta.value.substring(end);
                const newPos = start + before.length + selected.length;
                ta.selectionStart = ta.selectionEnd = newPos;
                ta.focus();
                updatePreview();
            }

            function wrapSelection(before, after) {
                insertText(before, after);
            }

            // 绑定工具栏按钮
            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    const action = this.dataset.action;
                    switch (action) {
                        case 'bold': wrapSelection('**', '**'); break;
                        case 'italic': wrapSelection('*', '*'); break;
                        case 'strike': wrapSelection('~~', '~~'); break;
                        case 'h1': insertText('# '); break;
                        case 'h2': insertText('## '); break;
                        case 'h3': insertText('### '); break;
                        case 'ul': insertText('- '); break;
                        case 'ol': insertText('1. '); break;
                        case 'task': insertText('- [ ] '); break;
                        case 'link': wrapSelection('[', '](url)'); break;
                        case 'image': wrapSelection('![alt](', 'image-url)'); break;
                        case 'code': wrapSelection('`', '`'); break;
                        case 'blockquote': insertText('> '); break;
                        case 'table': insertText('| 列1 | 列2 |\n| --- | --- |\n| 内容 | 内容 |'); break;
                        case 'latex': wrapSelection('$', '$'); break;
                        case 'latex-block': wrapSelection('$$', '$$'); break;
                        default: break;
                    }
                    // 触发预览更新（已由 insertText 调用）
                });
            });

            // ===== 键盘快捷键 =====
            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveDocument();
                }
            });

            // ===== 监听输入变化 =====
            contentTextarea.addEventListener('input', updatePreview);
            statusSelect.addEventListener('change', function () {
                updateStatusBadge(this.value === 'true');
            });

            // ===== 绑定按钮 =====
            saveBtn.addEventListener('click', saveDocument);
            deleteBtn.addEventListener('click', deleteDocument);

            // ===== 初始化 =====
            if (isNew) {
                sortOrderInput.value = 0;
                statusSelect.value = 'false';
                updateStatusBadge(false);
                updatePreview();
                setSaveStatus('📝 新文档', true);
            } else if (docId) {
                loadDocument(docId);
            }

            // ===== 自动保存（每30秒） =====
            let autoSaveTimer = setInterval(() => {
                if (!isNew && docId && contentTextarea.value.trim() !== '') {
                    // 只保存已加载的文档（非新建）
                    saveDocument();
                }
            }, 30000);

            // 清理定时器（页面关闭时）
            window.addEventListener('beforeunload', function () {
                clearInterval(autoSaveTimer);
            });

            // 如果用户修改内容，改变保存状态
            contentTextarea.addEventListener('input', function () {
                if (!isSaving) {
                    setSaveStatus('✏️ 未保存', false);
                }
            });
            titleInput.addEventListener('input', function () {
                if (!isSaving) {
                    setSaveStatus('✏️ 未保存', false);
                }
            });
        })();
    </script>
</body>

</html>
