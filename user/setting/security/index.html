<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全设置 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .button-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
        }

        .nav-btn.active {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            cursor: default;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
            border-left: 3px solid #e74c3c;
            padding-left: 12px;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .field-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
        }

        .restriction-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            text-align: center;
            font-size: 14px;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
        }

        .info {
            background: #e3f2fd;
            color: #0c5460;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 300px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            margin: 12px 0;
            padding: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 安全设置</h1>
        <div class="sub">修改密码 / 修改用户名</div>

        <div class="button-bar">
            <a href="/user/setting" class="nav-btn">个人信息</a>
            <span class="nav-btn active">安全设置</span>
        </div>

        <!-- 修改用户名区块 -->
        <div class="section">
            <div class="section-title">修改用户名</div>
            <div class="field-group">
                <label>当前用户名</label>
                <input type="text" id="currentUsername" disabled style="background:#f0f0f0;">
            </div>
            <div id="usernameRestriction" class="restriction-box">加载中...</div>
            <button id="verifyPasswordBtn">验证密码并修改用户名</button>
            <div id="usernameEditArea" style="display:none; margin-top:20px;">
                <div class="field-group">
                    <label>新用户名（6-16位字母/数字/下划线，不能以数字开头）</label>
                    <input type="text" id="newUsername" placeholder="输入新用户名">
                </div>
                <button id="submitUsernameBtn">提交修改</button>
            </div>
            <div id="usernameMsg" class="message"></div>
        </div>

        <!-- 修改密码区块 -->
        <div class="section">
            <div class="section-title">修改密码</div>
            <div class="field-group">
                <label>当前密码</label>
                <input type="password" id="oldPassword" placeholder="输入当前密码">
            </div>
            <div class="field-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="至少6位">
            </div>
            <div class="field-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码">
            </div>
            <button id="updatePasswordBtn">修改密码</button>
            <div id="passwordMsg" class="message"></div>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <!-- 密码验证模态框 -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>验证当前密码</h3>
            <input type="password" id="modalPassword" placeholder="请输入密码">
            <button id="confirmPasswordBtn">确认</button>
            <button id="cancelModalBtn" style="background:#7f8c8d; margin-top:8px;">取消</button>
        </div>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let currentUser = null;
            let profileData = null;
            let passwordVerified = false; // 标记密码已验证

            const modal = document.getElementById('passwordModal');
            const verifyBtn = document.getElementById('verifyPasswordBtn');
            const usernameEditArea = document.getElementById('usernameEditArea');
            const usernameMsgDiv = document.getElementById('usernameMsg');

            async function loadUserData() {
                const restrictionDiv = document.getElementById('usernameRestriction');
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/login';
                        return;
                    }
                    currentUser = session.user;
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('username, username_last_modified, is_super_admin')
                        .eq('id', currentUser.id)
                        .single();
                    if (error) throw new Error(error.message);
                    profileData = data;
                    document.getElementById('currentUsername').value = data.username;

                    const isSuperAdmin = data.is_super_admin === true;
                    const lastModified = data.username_last_modified ? new Date(data.username_last_modified) : null;
                    const now = new Date();
                    let canModify = false;
                    let restrictionHtml = '';
                    let remainingDays = 0;

                    if (isSuperAdmin) {
                        canModify = true;
                        restrictionHtml = '<div class="info">👑 站长无修改时间限制</div>';
                    } else {
                        if (!lastModified) {
                            canModify = true;
                            restrictionHtml = '<div class="info">✅ 首次修改，无时间限制</div>';
                        } else {
                            const nextAllowed = new Date(lastModified);
                            nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                            if (now >= nextAllowed) {
                                canModify = true;
                                restrictionHtml = '<div class="info">✅ 现在可以修改用户名</div>';
                            } else {
                                canModify = false;
                                remainingDays = Math.ceil((nextAllowed - now) / (1000 * 60 * 60 * 24));
                                restrictionHtml = `<div class="warning">上次修改时间：${lastModified.toLocaleDateString('zh-CN')}<br>一年（365天）内仅可修改一次用户名。<br>⚠️ 还需等待 ${remainingDays} 天</div>`;
                            }
                        }
                    }
                    restrictionDiv.innerHTML = restrictionHtml;
                    if (!canModify) {
                        verifyBtn.disabled = true;
                        verifyBtn.title = `${remainingDays}天后可修改`;
                    } else {
                        verifyBtn.disabled = false;
                    }
                } catch (err) {
                    restrictionDiv.innerHTML = `<div class="error">加载失败: ${err.message}</div>`;
                }
            }

            // 显示模态框
            function showModal() {
                modal.style.display = 'flex';
                document.getElementById('modalPassword').value = '';
            }

            function hideModal() {
                modal.style.display = 'none';
            }

            // 验证密码
            async function verifyPassword(password) {
                const { error } = await supabase.auth.signInWithPassword({
                    email: currentUser.email,
                    password: password
                });
                return !error;
            }

            // 处理密码确认
            async function onConfirmPassword() {
                const password = document.getElementById('modalPassword').value;
                if (!password) {
                    alert('请输入密码');
                    return;
                }
                const isValid = await verifyPassword(password);
                if (!isValid) {
                    alert('密码错误');
                    return;
                }
                passwordVerified = true;
                hideModal();
                // 显示用户名修改区域
                usernameEditArea.style.display = 'block';
                verifyBtn.disabled = true;
                verifyBtn.textContent = '已验证';
            }

            // 提交用户名修改
            async function submitUsername() {
                if (!passwordVerified) {
                    alert('请先验证密码');
                    return;
                }
                const newUsername = document.getElementById('newUsername').value.trim();
                if (!newUsername) {
                    usernameMsgDiv.innerHTML = '<div class="message error">请输入新用户名</div>';
                    return;
                }
                const usernameRegex = /^[a-zA-Z_][a-zA-Z0-9_]{5,15}$/;
                if (!usernameRegex.test(newUsername)) {
                    usernameMsgDiv.innerHTML = '<div class="message error">用户名格式错误（6-16位字母/数字/下划线，不能以数字开头）</div>';
                    return;
                }
                if (newUsername === profileData.username) {
                    usernameMsgDiv.innerHTML = '<div class="message error">新用户名与当前相同，无需修改</div>';
                    return;
                }
                // 唯一性检查
                const { data: existing, error: checkError } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', newUsername)
                    .maybeSingle();
                if (existing) {
                    usernameMsgDiv.innerHTML = '<div class="message error">用户名已被占用，请换一个</div>';
                    return;
                }
                // 再次检查时间限制
                const isSuperAdmin = profileData.is_super_admin === true;
                if (!isSuperAdmin) {
                    const lastModified = profileData.username_last_modified ? new Date(profileData.username_last_modified) : null;
                    if (lastModified) {
                        const nextAllowed = new Date(lastModified);
                        nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                        if (new Date() < nextAllowed) {
                            const days = Math.ceil((nextAllowed - new Date()) / (1000 * 60 * 60 * 24));
                            usernameMsgDiv.innerHTML = `<div class="message error">距离上次修改不足一年，还需等待 ${days} 天</div>`;
                            return;
                        }
                    }
                }
                const submitBtn = document.getElementById('submitUsernameBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                const { error } = await supabase
                    .from('profiles')
                    .update({
                        username: newUsername,
                        username_last_modified: new Date().toISOString()
                    })
                    .eq('id', currentUser.id);
                submitBtn.disabled = false;
                submitBtn.textContent = '提交修改';
                if (error) {
                    usernameMsgDiv.innerHTML = `<div class="message error">修改失败: ${error.message}</div>`;
                } else {
                    usernameMsgDiv.innerHTML = '<div class="message success">用户名修改成功！请重新登录</div>';
                    setTimeout(() => {
                        supabase.auth.signOut();
                        window.location.href = '/login';
                    }, 2000);
                }
            }

            // 修改密码
            async function updatePassword() {
                const oldPwd = document.getElementById('oldPassword').value;
                const newPwd = document.getElementById('newPassword').value;
                const confirmPwd = document.getElementById('confirmPassword').value;
                const msgDiv = document.getElementById('passwordMsg');
                if (!oldPwd || !newPwd || !confirmPwd) {
                    msgDiv.innerHTML = '<div class="message error">请填写所有密码字段</div>';
                    return;
                }
                if (newPwd.length < 6) {
                    msgDiv.innerHTML = '<div class="message error">新密码至少6位</div>';
                    return;
                }
                if (newPwd !== confirmPwd) {
                    msgDiv.innerHTML = '<div class="message error">两次输入的新密码不一致</div>';
                    return;
                }
                const { error: signInError } = await supabase.auth.signInWithPassword({
                    email: currentUser.email,
                    password: oldPwd
                });
                if (signInError) {
                    msgDiv.innerHTML = '<div class="message error">当前密码错误</div>';
                    return;
                }
                const { error: updateError } = await supabase.auth.updateUser({ password: newPwd });
                if (updateError) {
                    msgDiv.innerHTML = `<div class="message error">修改失败: ${updateError.message}</div>`;
                } else {
                    msgDiv.innerHTML = '<div class="message success">密码修改成功！请重新登录</div>';
                    setTimeout(() => {
                        supabase.auth.signOut();
                        window.location.href = '/login';
                    }, 2000);
                }
            }

            verifyBtn.addEventListener('click', showModal);
            document.getElementById('confirmPasswordBtn').addEventListener('click', onConfirmPassword);
            document.getElementById('cancelModalBtn').addEventListener('click', hideModal);
            document.getElementById('submitUsernameBtn').addEventListener('click', submitUsername);
            document.getElementById('updatePasswordBtn').addEventListener('click', updatePassword);

            loadUserData();
        })();
    </script>
</body>

</html>
