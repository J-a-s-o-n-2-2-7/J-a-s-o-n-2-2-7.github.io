<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Markdown 实时渲染器</title>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- 第三方依赖（同步加载） -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.0.2/dist/markdown-it-emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@1.0.4/dist/markdown-it-abbr.min.js"></script>

    <!-- DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <!-- KaTeX JS（使用 defer，确保在 DOM 解析后执行） -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- 自定义渲染器（也使用 defer，并放在 KaTeX 之后，保证执行顺序） -->
    <link rel="stylesheet" href="./markdown-renderer.css">
    <script defer src="./markdown-renderer.js"></script>

    <!-- ===== 页面布局样式 ===== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
        }

        .app-header {
            max-width: 1400px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e74c3c;
        }

        .app-header .actions {
            display: flex;
            gap: 12px;
        }

        .app-header .actions button {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .app-header .actions button:hover {
            background: #c0392b;
        }

        .app-header .actions button.secondary {
            background: #7f8c8d;
        }

        .app-header .actions button.secondary:hover {
            background: #5d6d7e;
        }

        .app-body {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .editor-pane,
        .preview-pane {
            flex: 1 1 45%;
            min-width: 320px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pane-header {
            padding: 12px 20px;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 1px solid #edf2f7;
            background: #fafbfc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-header .info {
            font-size: 13px;
            color: #7f8c8d;
            font-weight: 400;
        }

        .editor-pane textarea {
            width: 100%;
            height: 70vh;
            padding: 20px;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            background: #fff;
            color: #2c3e50;
            tab-size: 4;
        }

        .preview-pane .preview-content {
            padding: 20px 24px;
            overflow-y: auto;
            height: 70vh;
            background: #fff;
        }

        .preview-pane .preview-content .benben-text {
            min-height: 100%;
        }

        .footer {
            max-width: 1400px;
            margin: 20px auto 0;
            color: #bbb;
            font-size: 13px;
            text-align: center;
            border-top: 1px solid #e9ecef;
            padding-top: 16px;
        }

        @media (max-width: 700px) {

            .editor-pane,
            .preview-pane {
                flex: 1 1 100%;
                min-width: auto;
            }

            .editor-pane textarea,
            .preview-pane .preview-content {
                height: 50vh;
            }
        }
    </style>
</head>

<body>

    <div class="app-header">
        <h1>📝 Markdown 实时渲染</h1>
        <div class="actions">
            <button id="loadSampleBtn">加载示例</button>
            <button id="clearBtn" class="secondary">清空</button>
        </div>
    </div>

    <div class="app-body">
        <!-- 编辑器 -->
        <div class="editor-pane">
            <div class="pane-header">
                <span>✏️ Markdown 源码</span>
                <span class="info" id="charCount">0 字符</span>
            </div>
            <textarea id="mdEditor" placeholder="在此输入 Markdown 内容..."></textarea>
        </div>
        <!-- 预览 -->
        <div class="preview-pane">
            <div class="pane-header">
                <span>👁️ 实时预览</span>
                <span class="info" id="wordCount">0 词</span>
            </div>
            <div class="preview-content" id="previewContainer">
                <div class="benben-text" id="renderedContent">
                    <p style="color:#999;text-align:center;padding:40px 0;">输入 Markdown 后自动渲染</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        ✨ 支持 KaTeX、Mermaid、任务列表、脚注、折叠框、代码复制等扩展语法
    </div>

    <script>
        (function () {
            function init() {
                const editor = document.getElementById('mdEditor');
                const preview = document.getElementById('renderedContent');
                const charCount = document.getElementById('charCount');
                const wordCount = document.getElementById('wordCount');
                const loadSampleBtn = document.getElementById('loadSampleBtn');
                const clearBtn = document.getElementById('clearBtn');

                // 检查 MarkdownRenderer 是否可用
                if (typeof MarkdownRenderer === 'undefined') {
                    preview.innerHTML = `
                        <div style="color:#e74c3c;padding:20px;">
                            ❌ MarkdownRenderer 未加载<br>
                            请确保 <code>markdown-renderer.js</code> 文件存在且路径正确。
                        </div>
                    `;
                    return;
                }

                // 示例文本
                const sampleText = `# 欢迎使用 Markdown 实时渲染器

## 功能演示

### 1. 基础语法

- **加粗** 和 *斜体*
- 有序列表：
  1. 第一项
  2. 第二项
- 链接：[GitHub](https://github.com)
- 图片：![示例图片](https://via.placeholder.com/150)

### 2. 代码块

\`\`\`javascript:hello.js
console.log('Hello, Markdown!');
\`\`\`

支持行号 \`line-numbers\` 和高亮行 \`lines=2-3\`：

\`\`\`python line-numbers lines=2-3
def greet(name):
    print(f"Hello, {name}!")
    return True
\`\`\`

### 3. LaTeX 公式

行内公式：$E = mc^2$

块级公式：
$$ \int_{0}^{1} x^2 dx = \frac{1}{3} $$

### 4. 任务列表

- [x] 已完成任务
- [ ] 待办任务
- [ ] 另一个待办

### 5. 脚注

这是带脚注的文字[^1]。

[^1]: 这是脚注内容。

### 6. 折叠框

:::info [点击展开详情]
这里是折叠框的内容，支持 **Markdown** 语法。
:::

:::success {open}
这个默认展开。
:::

### 7. 表格

| 列1 | 列2 |
|-----|-----|
| A   | B   |
| C   | D   |

### 8. Mermaid 图表

\`\`\`mermaid
graph TD;
    A-->B;
    A-->C;
    B-->D;
    C-->D;
\`\`\`

### 9. 其他扩展

- 删除线：~~删除~~
- 高亮：==高亮==
- 插入：++插入++
- 上标：^上标^，下标：~下标~
- 键盘按键：[[Ctrl]] + [[C]]

### 10. @提及（需传入映射，此处仅演示）

@jason

---

**尽情体验吧！**`;

                // 渲染函数
                function render() {
                    const text = editor.value;
                    const options = {
                        isAdmin: true,
                        username: '当前用户',
                        mentionMap: { 'jason': 1, 'admin': 2 },
                        uniqueId: 'preview'
                    };
                    try {
                        const html = MarkdownRenderer.render(text, options);
                        preview.innerHTML = html;
                        // 触发 Mermaid 渲染
                        if (typeof mermaid !== 'undefined') {
                            try {
                                mermaid.run({ nodes: preview.querySelectorAll('.mermaid') });
                            } catch (e) { /* 忽略 */ }
                        }
                        // 更新统计
                        const chars = text.length;
                        charCount.textContent = chars + ' 字符';
                        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                        wordCount.textContent = words + ' 词';
                    } catch (e) {
                        preview.innerHTML = `<p style="color:red;">渲染出错: ${e.message}</p>`;
                    }
                }

                // 绑定事件
                editor.addEventListener('input', render);
                loadSampleBtn.addEventListener('click', function () {
                    editor.value = sampleText;
                    render();
                });
                clearBtn.addEventListener('click', function () {
                    editor.value = '';
                    render();
                });

                // 初始加载示例
                editor.value = sampleText;
                render();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>

</html>
