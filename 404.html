<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>页面跳转中...</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: system-ui;
            text-align: center;
            padding: 50px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        (function () {
            // ----- 通用页面加载函数 -----
            function loadPage(fetchUrl, displayUrl, errorMsg) {
                fetch(fetchUrl)
                    .then(function (response) {
                        if (!response.ok) throw new Error(errorMsg || '加载失败');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', displayUrl);
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>' + (errorMsg || '请稍后再试。') + '</p>';
                    });
            }

            var path = window.location.pathname;

            // ===== 1. 用户主页：/user/数字 =====
            var userMatch = path.match(/^\/user\/(\d+)/);
            if (userMatch) {
                var userId = userMatch[1];
                var subPath = path.replace(/^\/user\/\d+/, '');
                if (subPath === '/activity') {
                    loadPage('/activity.html', '/user/' + userId + '/activity', '无法加载活动页面');
                    return;
                }
                loadPage('/user/index.html', '/user/' + userId, '无法加载用户主页模板');
                return;
            }

            // ===== 2. 帖子详情：/discuss/数字 =====
            var discussMatch = path.match(/^\/discuss\/(\d+)$/);
            if (discussMatch) {
                var id = discussMatch[1];
                loadPage('/post.html', '/discuss/' + id, '无法加载帖子详情页');
                return;
            }

            // ===== 3. 文章路由：/article 或 /article/xxxxxx（新增） =====
            var articleMatch = path.match(/^\/article(?:\/([a-zA-Z0-9]+))?$/);
            if (articleMatch) {
                // 无论是 /article 还是 /article/xxxxxx，都加载同一个 article.html，由它自己根据路径识别
                loadPage('/article/index.html', path, '无法加载文章页面');
                return;
            }

            // ===== 4. 帮助文档管理路由（/admin/help） =====
            var helpEditMatch = path.match(/^\/admin\/help\/(\d+)\/edit$/);
            if (helpEditMatch) {
                var helpId = helpEditMatch[1];
                loadPage('/edit.html', '/admin/help/' + helpId + '/edit', '无法加载编辑页');
                return;
            }
            if (path === '/admin/help/new') {
                loadPage('/edit.html', '/admin/help/new', '无法加载编辑页');
                return;
            }
            if (path === '/admin/help') {
                loadPage('/index.html', '/admin/help', '无法加载列表页');
                return;
            }

            // ===== 5. 团队路由 =====
            var teamMatch = path.match(/^\/team\/(\d+)$/);
            if (teamMatch) {
                var id = teamMatch[1];
                loadPage('/team.html', '/team/' + id, '无法加载团队详情页');
                return;
            }

            // ===== 6. 其他路径 → 404 =====
            document.body.innerHTML = `
                <h1>404 - 页面未找到</h1>
                <p>您访问的页面不存在，请检查网址。</p>
                <p><a href="/">返回首页</a></p>
            `;
        })();
    </script>
</head>

<body>
    <div class="loader"></div>
    <p>正在加载...</p>
</body>

</html>
