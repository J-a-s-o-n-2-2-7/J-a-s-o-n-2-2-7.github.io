<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>页面跳转中...</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: system-ui;
            text-align: center;
            padding: 50px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        (function () {
            // ----- 通用页面加载函数 -----
            function loadPage(fetchUrl, displayUrl, errorMsg) {
                fetch(fetchUrl)
                    .then(function (response) {
                        if (!response.ok) throw new Error(errorMsg || '加载失败');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', displayUrl);
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>' + (errorMsg || '请稍后再试。') + '</p>';
                    });
            }

            var path = window.location.pathname;

            // ===== 1. 用户主页：/user/数字 =====
            var userMatch = path.match(/^\/user\/(\d+)/);
            if (userMatch) {
                var userId = userMatch[1];
                loadPage('/user/index.html', '/user/' + userId, '无法加载用户主页模板');
                return;
            }

            // ===== 2. discuss 路由 =====
            // 2.1 列表页：/discuss（无参数）
            if (path === '/discuss' && !window.location.search) {
                loadPage('/discuss.html', '/discuss', '无法加载帖子列表页');
                return;
            }
            // 2.2 带查询参数 id → 转换为路径参数
            if (path === '/discuss' && window.location.search) {
                var params = new URLSearchParams(window.location.search);
                var id = params.get('id');
                if (id && /^\d+$/.test(id)) {
                    loadPage('/post.html?id=' + id, '/discuss/' + id, '无法加载帖子详情页');
                    return;
                }
                // id 无效则继续往下走，最后会 404
            }
            // 2.3 路径参数：/discuss/数字
            var discussMatch = path.match(/^\/discuss\/(\d+)$/);
            if (discussMatch) {
                var id = discussMatch[1];
                loadPage('/post.html?id=' + id, '/discuss/' + id, '无法加载帖子详情页');
                return;
            }

            // ===== 3. 帮助文档管理路由（/admin/help） =====
            // 3.1 编辑：/admin/help/数字/edit
            var helpEditMatch = path.match(/^\/admin\/help\/(\d+)\/edit$/);
            if (helpEditMatch) {
                var helpId = helpEditMatch[1];
                loadPage('/edit.html', '/admin/help/' + helpId + '/edit', '无法加载编辑页');
                return;
            }
            // 3.2 新建：/admin/help/new
            if (path === '/admin/help/new') {
                loadPage('/edit.html', '/admin/help/new', '无法加载编辑页');
                return;
            }
            // 3.3 列表：/admin/help
            if (path === '/admin/help') {
                loadPage('/index.html', '/admin/help', '无法加载列表页');
                return;
            }

            // ===== 4. 团队路由（/team） =====
            // 4.1 列表页：/team（无参数）
            if (path === '/team' && !window.location.search) {
                loadPage('/team.html', '/team', '无法加载团队列表页');
                return;
            }
            // 4.2 带查询参数 id → 转换为路径参数
            if (path === '/team' && window.location.search) {
                var params = new URLSearchParams(window.location.search);
                var id = params.get('id');
                if (id && /^\d+$/.test(id)) {
                    loadPage('/team-detail.html', '/team/' + id, '无法加载团队详情页');
                    return;
                }
            }
            // 4.3 路径参数：/team/数字
            var teamMatch = path.match(/^\/team\/(\d+)$/);
            if (teamMatch) {
                var id = teamMatch[1];
                loadPage('/team-detail.html', '/team/' + id, '无法加载团队详情页');
                return;
            }

            // ===== 5. 其他路径 → 404 =====
            document.body.innerHTML = `
                <h1>404 - 页面未找到</h1>
                <p>您访问的页面不存在，请检查网址。</p>
                <p><a href="/">返回首页</a></p>
            `;
        })();
    </script>
</head>

<body>
    <div class="loader"></div>
    <p>正在加载...</p>
</body>

</html>
