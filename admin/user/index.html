<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户管理 - ✨ Jason227</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.0.2/dist/markdown-it-emoji.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@1.0.4/dist/markdown-it-abbr.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <style>
        /* ========== 基础样式（与原样式完全一致） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
            cursor: pointer;
        }

        .logo:hover {
            color: #c0392b;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #c0392b;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .auth-btn.logout:hover {
            background: #5a6268;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color 0.2s;
        }

        .bell-icon:hover {
            color: #e74c3c;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            position: relative;
            min-height: 100vh;
        }

        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: white;
            border-radius: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            cursor: default;
        }

        .nav-group .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .group-title {
            font-weight: 600;
            margin-top: 8px;
        }

        .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        .nav-item.active {
            background: #f0f2f5;
            color: #e74c3c;
        }

        .content-wrapper {
            margin-left: 64px;
            padding-top: 20px;
        }

        .main-content {
            max-width: 100%;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .card-header {
            font-size: 1.25rem;
            font-weight: 600;
            border-left: 4px solid #e74c3c;
            padding-left: 12px;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border .2s;
        }

        .search-bar input:focus {
            border-color: #e74c3c;
        }

        .search-bar .result-count {
            font-size: 13px;
            color: #999;
            white-space: nowrap;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        th {
            background: #f8f9fc;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th:first-child,
        td:first-child {
            padding-left: 8px;
        }

        th.check-col,
        td.check-col {
            width: 40px;
            text-align: center;
        }

        th.check-col input,
        td.check-col input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .role-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .role-tag.user {
            background: #e9ecef;
            color: #333;
        }

        .role-tag.admin {
            background: #8E44AD;
            color: #fff;
        }

        .action-link {
            text-decoration: none;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-link.green {
            color: #2ECC71;
            font-weight: 500;
        }

        .action-link.red {
            color: #E74C3C;
            font-weight: 500;
        }

        .action-link.green:hover {
            background: #eafaf1;
        }

        .action-link.red:hover {
            background: #fdedec;
        }

        .action-link.disabled {
            cursor: default;
            opacity: 0.6;
        }

        .action-link.disabled:hover {
            background: transparent;
        }

        /* ===== 权限列：状态药丸 + 编辑入口 ===== */
        .perm-group-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin-bottom: 3px;
        }

        .perm-group-line:last-child {
            margin-bottom: 0;
        }

        .perm-cat {
            font-size: 11px;
            color: #888;
            margin-right: 2px;
        }

        .perm-pill {
            font-size: 11.5px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 500;
            line-height: 1.6;
        }

        .perm-pill.on {
            background: #eafaf1;
            color: #2ECC71;
        }

        .perm-pill.off {
            background: #f0f2f5;
            color: #b0b0b0;
        }

        .perm-edit-btn {
            margin-left: 4px;
            font-size: 12px;
            color: #9b59b6;
            cursor: pointer;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .perm-edit-btn:hover {
            background: #f4ecf7;
        }

        /* SweetAlert 内的权限批量编辑器 */
        .perm-editor label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 3px 14px 3px 0;
            font-size: 14px;
            cursor: pointer;
        }

        .perm-editor .perm-hint {
            color: #999;
            font-size: 12px;
        }

        .perm-editor textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            border-radius: 6px;
            padding: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        .editable-field {
            cursor: default;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .editable-field:hover {
            background: #f0f2f5;
        }

        .editable-field-input {
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 14px;
            width: 100%;
            min-width: 80px;
            outline: none;
        }

        /* ===== 修改点1：用户名加粗 ===== */
        .username-display {
            font-weight: bold;
            /* 新增：加粗 */
            cursor: pointer;
            transition: background 0.15s;
        }

        .username-display:hover {
            background: #f0f2f5;
        }

        /* ===== 修改点2：标签左间距改为 8px（与犇犇一致） ===== */
        .user-tag-display {
            display: inline-block;
            border-radius: 2px;
            padding: 2px 9px;
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            margin: 0 0 0 8px;
            /* 原来是 5px，现改为 8px */
            cursor: default;
            transition: filter 0.15s;
            background-color: #8e44ad;
        }

        .user-tag-display:hover {
            filter: brightness(0.9);
        }

        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin: 2px;
        }

        .btn-sm.grant {
            background: #2ECC71;
            color: #fff;
        }

        .btn-sm.revoke {
            background: #E74C3C;
            color: #fff;
        }

        .btn-sm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-sm.batch {
            background: #3498DB;
            color: #fff;
            padding: 6px 16px;
            font-size: 13px;
        }

        .batch-bar {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f8f9fc;
            border-radius: 8px;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .batch-bar.show {
            display: flex;
        }

        .batch-bar .info {
            font-size: 14px;
            color: #2c3e50;
            margin-right: 8px;
        }

        .batch-bar .btn-sm {
            font-size: 12px;
            padding: 4px 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .loading-text {
            color: #999;
            text-align: center;
            padding: 40px;
        }

        @media (max-width:800px) {

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead tr {
                display: none;
            }

            tr {
                border: 1px solid #eee;
                margin-bottom: 10px;
                padding: 10px;
            }

            td {
                border: none;
                padding: 6px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #333;
                margin-right: 10px;
                flex-shrink: 0;
            }

            td.check-col {
                display: flex;
                justify-content: flex-start;
            }

            td.check-col::before {
                content: '';
                display: none;
            }

            .batch-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .editable-field-input {
                width: auto;
            }
        }

        @media (max-width: 900px) {
            .main-layout {
                padding: 0 16px 16px 16px;
            }

            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                border-radius: 0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                margin-bottom: 20px;
                padding: 12px 0;
                transition: none;
                overflow: visible;
                white-space: normal;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .nav-item,
            .group-title {
                padding: 8px 14px;
                font-size: 13px;
                gap: 8px;
                border-radius: 6px;
                background: #f8f9fc;
            }

            .nav-item:hover,
            .group-title:hover {
                background: #f0f2f5;
                color: #e74c3c;
                text-decoration: none;
            }

            .nav-sidebar a:hover {
                text-decoration: none;
                background: #f0f2f5;
                color: #e74c3c;
            }

            .nav-icon {
                font-size: 16px;
                width: 20px;
            }

            .group-title {
                grid-column: 1 / -1;
                background: #e9ecef;
                margin-top: 0;
                border-top: none;
            }

            .divider {
                display: none;
            }

            .nav-sidebar::-webkit-scrollbar {
                width: 0;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .card {
                padding: 16px 18px;
            }

            .auth-buttons .auth-btn {
                padding: 4px 14px;
                font-size: 12px;
            }

            .user-email {
                font-size: 12px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 8px;
            }

            .nav-item,
            .group-title {
                padding: 6px 10px;
                font-size: 12px;
            }

            .nav-icon {
                font-size: 14px;
                width: 18px;
            }
        }

        @media (max-width: 400px) {
            .auth-buttons .auth-btn {
                padding: 4px 10px;
                font-size: 11px;
            }

            .user-email {
                font-size: 11px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 6px;
            }

            .nav-item,
            .group-title {
                padding: 4px 8px;
                font-size: 11px;
            }

            .nav-icon {
                font-size: 12px;
                width: 16px;
            }
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2">
    </script>
</head>

<body>
    <!-- ===== 顶栏 ===== -->
    <div class="topbar">
        <a href="/" class="logo">✨ Jason227</a>
        <div class="auth-buttons" id="authButtons">
            <a href="/user/notification" class="bell-icon" id="bellLink">
                <svg viewBox="0 0 448 512" width="20" height="20">
                    <path fill="currentColor"
                        d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z" />
                </svg>
                <sup id="bell-badge" style="display:none;">0</sup>
            </a>
            <span class="user-email" id="userDisplay">加载中...</span>
            <button id="logoutBtn" class="auth-btn logout">登出</button>
        </div>
    </div>

    <!-- ===== 主布局 ===== -->
    <div class="main-layout">
        <!-- ===== 侧边栏 ===== -->
        <div class="nav-sidebar">
            <div class="nav-group">
                <ul>
                    <li><a class="nav-item" href="/"><span class="nav-icon"><svg viewBox="0 0 576 512" width="20"
                                    height="20" fill="currentColor">
                                    <path
                                        d="M240 6.1c9.1-8.2 22.9-8.2 32 0l232 208c9.9 8.8 10.7 24 1.8 33.9s-24 10.7-33.9 1.8l-8-7.2 0 205.3c0 35.3-28.7 64-64 64l-288 0c-35.3 0-64-28.7-64-64l0-205.3-8 7.2c-9.9 8.8-25 8-33.9-1.8s-8-25 1.8-33.9L240 6.1zm16 50.1L96 199.7 96 448c0 8.8 7.2 16 16 16l48 0 0-104c0-39.8 32.2-72 72-72l48 0c39.8 0 72 32.2 72 72l0 104 48 0c8.8 0 16-7.2 16-16l0-248.3-160-143.4zM208 464l96 0 0-104c0-13.3-10.7-24-24-24l-48 0c-13.3 0-24 10.7-24 24l0 104z" />
                                </svg></span><span class="nav-text">主页</span></a></li>
                    <li><a class="nav-item" href="/problems"><span class="nav-icon"><svg viewBox="0 0 448 512"
                                    width="20" height="20" fill="currentColor">
                                    <path
                                        d="M88 0C39.4 0 0 39.4 0 88L0 432c0 44.2 35.8 80 80 80l344 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-8 0 0-76.1C435.3 375 448 353 448 328l0-256c0-39.8-32.2-72-72-72L88 0zM368 400l0 64-288 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l288 0zM80 352c-11.4 0-22.2 2.4-32 6.7L48 88c0-22.1 17.9-40 40-40l288 0c13.3 0 24 10.7 24 24l0 256c0 13.3-10.7 24-24 24L80 352zm48-200c0 13.3 10.7 24 24 24l176 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-176 0c-13.3 0-24 10.7-24 24zm24 72c-13.3 0-24 10.7-24 24s10.7 24 24 24l176 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-176 0z" />
                                </svg></span><span class="nav-text">题库</span></a></li>
                    <li><a class="nav-item" href="/courses"><span class="nav-icon"><svg viewBox="0 0 576 512" width="20"

    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ================================================================
            //  权限门禁
            // ================================================================
            async function checkAccess() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = '/login'; return false; }
                    const { data: profile, error } = await supabase
                        .from('profiles')
                        .select('can_manage_users, user_number')
                        .eq('id', session.user.id)
                        .single();
                    if (error || !profile) {
                        console.error('获取用户信息失败', error);
                        window.location.href = '/';
                        return false;
                    }
                    if (profile.can_manage_users === true || profile.user_number === 4) return true;
                    else { window.location.href = '/'; return false; }
                } catch (err) {
                    console.error('权限检查异常', err);
                    window.location.href = '/';
                    return false;
                }
            }

            // ---------- 颜色常量（仅三种） ----------
            const COLOR_RED = '#e74c3c';
            const COLOR_PURPLE = '#9b59b6';
            const COLOR_BROWN = '#AD8B00';

            let currentUser = null,
                currentProfile = null,
                allUsers = [],
                filteredUsers = [];
            const userList = document.getElementById('userList');
            const msgDiv = document.getElementById('msgDiv');
            const searchInput = document.getElementById('searchInput');
            const resultCount = document.getElementById('resultCount');
            const batchBar = document.getElementById('batchBar');
            const batchInfo = document.getElementById('batchInfo');
            const bellBadge = document.getElementById('bell-badge');
            const userDisplay = document.getElementById('userDisplay');

            // ---------- 工具函数 ----------
            function escapeHtmlAttr(s) { if (!s) return ''; return s.replace(/[&<>"]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m; }); }
            function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
            function formatTime(iso) { if (!iso) return '未知'; try { return new Date(iso).toLocaleString('zh-CN'); } catch { return iso; } }
            function showError(text) { msgDiv.innerHTML = `<div class="message error">${text}</div>`; setTimeout(() => msgDiv.innerHTML = '', 5000); }
            function showSuccess(text) { msgDiv.innerHTML = `<div class="message success">${text}</div>`; setTimeout(() => msgDiv.innerHTML = '', 5000); }

            function isBrownColor(hex) {
                if (!hex) return false;
                return hex.toLowerCase() === COLOR_BROWN.toLowerCase();
            }
            function isPurpleColor(hex) {
                if (!hex) return false;
                return hex.toLowerCase() === COLOR_PURPLE.toLowerCase();
            }

            // 根据用户状态决定显示颜色（红/紫/棕）
            function getUserDisplayColor(user) {
                if (user.is_cheater) return COLOR_BROWN;      // 作弊者棕名优先
                if (user.is_admin) return COLOR_PURPLE;       // 管理员紫色
                return COLOR_RED;                             // 普通用户红色
            }

            // ================================================================
            //  日志：所有按钮操作记录陶片
            // ================================================================
            async function insertOstrakonLog(adminId, targetUserId, actionType, actionDetail, reason) {
                if (!reason || reason.trim() === '') {
                    console.error('原因不能为空，跳过记录');
                    return;
                }
                try {
                    const { error } = await supabase
                        .from('judgement_logs')
                        .insert({
                            admin_id: adminId,
                            target_user_id: targetUserId,
                            action_type: actionType,
                            action_detail: actionDetail,
                            reason: reason,
                        });
                    if (error) console.error('记录陶片日志失败:', error);
                    else console.log('陶片放逐记录成功');
                } catch (err) { console.error('陶片日志异常:', err); }
            }

            async function getCurrentAdminId() {
                if (currentUser) return currentUser.id;
                const { data: { user } } = await supabase.auth.getUser();
                if (user) return user.id;
                return null;
            }

            // ---------- 原因输入（仅按钮操作使用） ----------
            async function promptReason(operationName) {
                const { value: reason } = await Swal.fire({
                    title: `请输入 ${operationName} 的原因`,
                    input: 'textarea',
                    inputPlaceholder: '详细说明操作原因...',
                    showCancelButton: true,
                    confirmButtonText: '确认操作',
                    cancelButtonText: '取消',
                    inputValidator: (value) => {
                        if (!value || value.trim() === '') return '原因不能为空！';
                    }
                });
                return reason;
            }

            // ---------- 通用更新 ----------
            async function updateUserField(userNumber, updateData) {
                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .update(updateData)
                        .eq('user_number', userNumber)
                        .select();
                    if (error) throw error;
                    if (data && data.length > 0) {
                        const target = allUsers.find(u => u.user_number === userNumber);
                        if (target) Object.assign(target, data[0]);
                    }
                } catch (err) {
                    console.error('更新失败:', err);
                    showError('操作失败：' + err.message);
                    throw err;
                }
            }

            // ================================================================
            //  学术不端切换（设置/取消棕名）
            //  设置棕名时备份原标签到 remark，取消时恢复
            // ================================================================
            async function toggleAcademicMisconduct(userNumber) {
                const targetUser = allUsers.find(u => u.user_number === userNumber);
                if (!targetUser) { showError('用户不存在'); return; }

                const newCheater = !targetUser.is_cheater;
                const actionName = newCheater ? '学术不端（设为棕名）' : '取消棕名';
                const reason = await promptReason(actionName);
                if (!reason) return;

                // 设为作弊者：备份原 user_tag 和原颜色，强制 user_tag='作弊者'、username_color=棕色
                // 取消作弊者：恢复原标签和原颜色（无备份时：管理员→「管理员」/紫色，其余→空/红色）
                if (newCheater) {
                    await updateUserField(userNumber, {
                        is_cheater: true,
                        user_tag: '作弊者',
                        cheater_prev_tag: targetUser.user_tag ?? null,
                        username_color: COLOR_BROWN,
                        cheater_prev_color: targetUser.username_color ?? null
                    });
                } else {
                    const restoredTag = targetUser.cheater_prev_tag ?? (targetUser.is_admin ? '管理员' : null);
                    const restoredColor = targetUser.cheater_prev_color ?? (targetUser.is_admin ? COLOR_PURPLE : COLOR_RED);
                    await updateUserField(userNumber, {
                        is_cheater: false,
                        user_tag: restoredTag,
                        cheater_prev_tag: null,
                        username_color: restoredColor,
                        cheater_prev_color: null
                    });
                }

                const adminId = await getCurrentAdminId();
                if (adminId) {
                    await insertOstrakonLog(
                        adminId,
                        targetUser.id,
                        newCheater ? 'brown_penalty' : 'unbrown_penalty',
                        { action: newCheater ? 'set_cheater' : 'unset_cheater' },
                        reason
                    );
                }
                await loadUsers();
            }

            // ================================================================
            //  权限操作（按钮操作，均需输入原因并记录陶片）
            // ================================================================
            // 自由发言：单开关（授予/撤销），单独一条 grant_perm/revoke_perm 陶片
            async function toggleCanSpeak(userNumber) {
                try {
                    const targetUser = allUsers.find(u => u.user_number === userNumber);
                    if (!targetUser) { showError('用户不存在'); return; }
                    const current = targetUser.can_speak !== false;
                    const newValue = !current;
                    const actionName = newValue ? '授予自由发言权限' : '撤销自由发言权限';
                    const reason = await promptReason(actionName);
                    if (!reason) return;

                    await updateUserField(userNumber, { can_speak: newValue });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertOstrakonLog(
                            adminId,
                            targetUser.id,
                            newValue ? 'grant_perm' : 'revoke_perm',
                            { permission: 'can_speak', new_value: newValue },
                            reason
                        );
                    }
                    await loadUsers();
                } catch (err) {
                    showError('操作失败：' + err.message);
                }
            }

            // 批量编辑"管理权限"类（进入后台/用户管理/秩序管理/特殊权益）：
            // 弹窗勾选目标状态 + 一条理由，可一次调整多个，合并成一条 perm_update（→管理轮换）陶片。
            async function editPermissions(userNumber) {
                try {
                    const targetUser = allUsers.find(u => u.user_number === userNumber);
                    if (!targetUser) { showError('用户不存在'); return; }

                    // 复查最新值（含 user_tag/颜色，用于 is_admin 的标签逻辑）
                    const { data: u, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('is_admin, can_manage_users, can_manage_posts, can_speak, special_privilege, user_tag, username_color')
                        .eq('user_number', userNumber)
                        .single();
                    if (fetchErr) throw new Error('查询失败: ' + fetchErr.message);

                    // 仅管理权限类（→管理轮换）；自由发言/进入主站属其它类，单独操作
                    const FIELDS = [
                        { field: 'is_admin', name: '进入后台' },
                        { field: 'can_manage_users', name: '用户管理' },
                        { field: 'can_manage_posts', name: '秩序管理' },
                        { field: 'special_privilege', name: '特殊权益' },
                    ];
                    const current = {
                        is_admin: !!u.is_admin,
                        can_manage_users: !!u.can_manage_users,
                        can_manage_posts: !!u.can_manage_posts,
                        special_privilege: !!u.special_privilege,
                    };

                    const checkboxHtml = FIELDS.map(f => {
                        const on = current[f.field];
                        return `<label><input type="checkbox" id="perm-${f.field}" ${on ? 'checked' : ''}> ${f.name} <span class="perm-hint">(${on ? '已授予' : '已撤销'})</span></label>`;
                    }).join('');

                    const { value } = await Swal.fire({
                        title: `编辑管理权限 — ${escapeHtmlAttr(targetUser.username || '未命名')}`,
                        html: `
                            <div class="perm-editor">
                                <div style="margin-bottom:6px;color:#666;font-size:13px;text-align:left;">勾选目标状态（勾=授予 / 不勾=撤销），可一次调整多个管理权限，合并成一条"管理轮换"陶片。</div>
                                <div style="text-align:left;">${checkboxHtml}</div>
                                <textarea id="perm-reason" placeholder="请输入操作原因（必填）..."></textarea>
                            </div>`,
                        showCancelButton: true,
                        confirmButtonText: '保存更改',
                        cancelButtonText: '取消',
                        width: 480,
                        focusConfirm: false,
                        preConfirm: () => {
                            const reason = (document.getElementById('perm-reason').value || '').trim();
                            if (!reason) { Swal.showValidationMessage('原因不能为空'); return false; }
                            const desired = {};
                            FIELDS.forEach(f => { desired[f.field] = document.getElementById('perm-' + f.field).checked; });
                            return { desired, reason };
                        }
                    });
                    if (!value) return;   // 取消

                    // 计算 diff（只含实际变化的字段）
                    const changes = FIELDS
                        .filter(f => value.desired[f.field] !== current[f.field])
                        .map(f => ({ permission: f.field, new_value: value.desired[f.field] }));

                    if (changes.length === 0) {
                        Swal.fire({ icon: 'info', title: '没有任何变更', timer: 1200, showConfirmButton: false });
                        return;
                    }

                    // 构造更新对象
                    const updateObj = {};
                    changes.forEach(c => { updateObj[c.permission] = c.new_value; });

                    // is_admin 变化：复用原 toggleAdmin 的标签/颜色逻辑（不碰 is_cheater）
                    if ('is_admin' in updateObj) {
                        const newAdmin = updateObj.is_admin;
                        const currentTag = u.user_tag || '';
                        if (newAdmin) {
                            updateObj.user_tag = (currentTag === '' || currentTag === '管理员') ? '管理员' : currentTag;
                            updateObj.username_color = COLOR_PURPLE;
                        } else {
                            updateObj.user_tag = (currentTag === '管理员') ? null : currentTag;
                            updateObj.username_color = COLOR_RED;
                        }
                    }

                    await updateUserField(userNumber, updateObj);

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertOstrakonLog(
                            adminId,
                            targetUser.id,
                            'perm_update',
                            { changes },
                            value.reason
                        );
                    }
                    await loadUsers();
                    showSuccess(`已更新 ${changes.length} 项权限`);
                } catch (err) {
                    showError('操作失败：' + err.message);
                }
            }

            async function toggleBan(userNumber) {
                try {
                    const targetUser = allUsers.find(u => u.user_number === userNumber);
                    if (!targetUser) { showError('用户不存在'); return; }
                    const current = targetUser.is_banned || false;
                    const newValue = !current;
                    const actionName = newValue ? '封禁用户' : '解封用户';
                    const reason = await promptReason(actionName);
                    if (!reason) return;

                    await updateUserField(userNumber, { is_banned: newValue });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        await insertOstrakonLog(
                            adminId,
                            targetUser.id,
                            newValue ? 'ban' : 'unban',
                            { permission: 'is_banned', new_value: newValue },
                            reason
                        );
                    }
                    await loadUsers();
                } catch (err) {
                    showError('操作失败：' + err.message);
                }
            }

            // ================================================================
            //  批量操作（按钮操作，记录陶片）
            // ================================================================
            async function batchAction(actionName, updateObj) {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptReason(actionName);
                if (!reason) return;

                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;

                    const { error } = await supabase.from('profiles').update(updateObj).in('user_number', ids);
                    if (error) throw error;

                    for (const uid of ids) {
                        const target = allUsers.find(u => u.user_number === uid);
                        if (target) Object.assign(target, updateObj);
                    }

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        let actionType = 'grant_perm';
                        let field = Object.keys(updateObj)[0];
                        let newValue = updateObj[field];
                        if (field === 'is_banned') {
                            actionType = newValue ? 'ban' : 'unban';
                        } else {
                            actionType = newValue ? 'grant_perm' : 'revoke_perm';
                        }
                        for (const user of users) {
                            await insertOstrakonLog(
                                adminId,
                                user.id,
                                actionType,
                                { permission: field, new_value: newValue },
                                reason
                            );
                        }
                    }

                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) {
                    showError(`批量${actionName}失败：` + err.message);
                }
            }

            // ---------- 通知未读数 ----------
            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    const { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        if (count > 0) {
                            bellBadge.textContent = count > 99 ? '99+' : count;
                            bellBadge.style.display = 'inline-flex';
                        } else { bellBadge.style.display = 'none'; }
                    }
                } catch (err) { console.error(err); }
            }

            // ---------- 初始化 ----------
            async function init() {
                const hasAccess = await checkAccess();
                if (!hasAccess) return;

                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = '/login'; return; }
                    currentUser = session.user;
                    const { data: profile, error: profileError } = await supabase.from('profiles')
                        .select('user_number,username,can_manage_users')
                        .eq('id', currentUser.id)
                        .single();
                    if (profileError || !profile) { window.location.href = '/'; return; }
                    currentProfile = profile;
                    userDisplay.textContent = profile.username || currentUser.email;
                    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                        await supabase.auth.signOut();
                        window.location.href = '/';
                    });
                    await loadUsers();
                    searchInput.addEventListener('input', function () { filterUsers(this.value.trim()); });
                    await fetchUnreadCount();
                    setInterval(fetchUnreadCount, 30000);
                } catch (err) {
                    console.error(err);
                    window.location.href = '/';
                }
            }

            // ---------- 加载用户 ----------
            async function loadUsers() {
                try {
                    const { data, error } = await supabase.from('profiles')
                        .select(
                            'id, user_number, username, is_admin, created_at, can_speak, is_banned, remark, can_manage_users, can_manage_posts, username_color, user_tag, special_privilege, is_cheater, cheater_prev_tag, cheater_prev_color'
                        )
                        .order('user_number');
                    if (error) throw error;
                    allUsers = data;
                    filterUsers(searchInput.value.trim());
                } catch (err) { userList.innerHTML = `<div class="error">加载用户失败：${err.message}</div>`; }
            }

            // ---------- 精确搜索 ----------
            function filterUsers(keyword) {
                if (!keyword) {
                    filteredUsers = [...allUsers];
                    renderUserList();
                    return;
                }
                const trimmed = keyword.trim();
                const lower = trimmed.toLowerCase();
                const isNumber = /^\d+$/.test(trimmed);

                filteredUsers = allUsers.filter(user => {
                    const isAdmin = user.is_admin;
                    const roleLabel = isAdmin ? '管理员' : '普通用户';
                    const remark = user.remark || '';
                    const tag = user.user_tag || '';
                    const username = user.username || '';
                    const userNumber = String(user.user_number);

                    if (isNumber && userNumber === trimmed) return true;
                    if (username.toLowerCase() === lower) return true;
                    if (remark.toLowerCase() === lower) return true;
                    if (roleLabel === trimmed) return true;
                    if (tag.toLowerCase() === lower) return true;
                    if (trimmed === '用户管理' && user.can_manage_users) return true;
                    if (trimmed === '秩序管理' && user.can_manage_posts) return true;

                    return false;
                });
                renderUserList();
            }

            // ================================================================
            //  渲染用户列表（仅红/紫/棕，移除颜色选择器，添加学术不端按钮）
            // ================================================================
            function renderUserList() {
                if (!filteredUsers || filteredUsers.length === 0) {
                    userList.innerHTML = '<div class="loading-text">没有找到匹配的用户</div>';
                    resultCount.textContent = '共 0 位用户';
                    batchBar.classList.remove('show');
                    return;
                }
                resultCount.textContent = `共 ${filteredUsers.length} 位用户`;
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th class="check-col"><input type="checkbox" id="selectAll" title="全选"></th>
                                <th>注册时间</th>
                                <th>用户编号</th>
                                <th>用户名</th>
                                <th>备注名</th>
                                <th>用户类型</th>
                                <th>权限</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                for (const user of filteredUsers) {
                    const isSelf = currentProfile.user_number === user.user_number;
                    const isAdmin = user.is_admin;
                    const roleLabel = isAdmin ? '管理员' : '普通用户';

                    // 根据状态决定显示颜色
                    const userNameColor = getUserDisplayColor(user);
                    const isBrown = isBrownColor(userNameColor);

                    // tag 显示逻辑：
                    // - 作弊者（is_cheater=true）一律显示"作弊者"（含管理员）；
                    //   user_tag 本身不被修改，原标签保留，解除棕名(is_cheater=false)后自动恢复。
                    // - 否则显示 user.user_tag（可能为空）
                    let tagDisplay = '';
                    if (user.is_cheater) {
                        tagDisplay = '作弊者';
                    } else {
                        tagDisplay = user.user_tag || '';
                    }
                    // 如果 tagDisplay 为空，则不生成标签
                    // 如果既不是管理员也不是作弊者，但user_tag有值，显示它
                    let tagHtml = '';
                    if (tagDisplay) {
                        tagHtml =
                            `<span class="user-tag-display" data-user="${user.user_number}" data-current="${escapeHtmlAttr(tagDisplay)}" style="background-color:${userNameColor};">${escapeHtmlAttr(tagDisplay)}</span>`;
                    }

                    const remarkDisplay = user.remark || '';

                    // ---- 权限列：按陶片分类分组 ----
                    // 管理权限类（→管理轮换·紫）：可批量编辑；自由发言（→授予/撤销）单独开关。
                    const mgmtPerms = [
                        { name: '进入后台', on: !!user.is_admin },
                        { name: '用户管理', on: !!user.can_manage_users },
                        { name: '秩序管理', on: !!user.can_manage_posts },
                        { name: '特殊权益', on: !!user.special_privilege },
                    ];
                    const mgmtPillsHtml = mgmtPerms
                        .map(p => `<span class="perm-pill ${p.on ? 'on' : 'off'}">${p.name}</span>`)
                        .join('');
                    const mgmtEditHtml = isSelf
                        ? ''
                        : `<span class="perm-edit-btn" data-action="edit-perms" data-user="${user.user_number}">✎</span>`;
                    const mgmtHtml = `<div class="perm-group-line"><span class="perm-cat">管理权限</span>${mgmtPillsHtml}${mgmtEditHtml}</div>`;

                    // 自由发言：单开关（绿=已授予，点撤销；红=已撤销，点授予）
                    const canSpeak = user.can_speak !== false;
                    const speakHtml = isSelf
                        ? `<span class="action-link ${canSpeak ? 'green' : 'red'} disabled" style="cursor:default;">自由发言</span>`
                        : `<span class="action-link ${canSpeak ? 'green' : 'red'}" style="cursor:pointer;" data-action="toggle-speak" data-user="${user.user_number}">自由发言</span>`;
                    const speakLineHtml = `<div class="perm-group-line"><span class="perm-cat">普通权限</span>${speakHtml}</div>`;

                    const permSummaryHtml = `${mgmtHtml}${speakLineHtml}`;

                    // 操作列：仅保留处罚类（进入主站=封禁 toggle、学术不端=棕名 toggle）
                    const isBanned = user.is_banned || false;
                    const banColor = isBanned ? 'red' : 'green';
                    const banAction =
                        `<span class="action-link ${banColor} ${isSelf ? 'disabled' : ''}" style="${isSelf ? 'cursor:default;' : 'cursor:pointer;'}" data-action="${isSelf ? '' : 'toggle-ban'}" data-user="${user.user_number}">进入主站</span>`;

                    const academicLabel = isBrown ? '取消棕名' : '学术不端';
                    const academicColor = isBrown ? 'green' : 'red';
                    const academicAction =
                        `<span class="action-link ${academicColor} ${isSelf ? 'disabled' : ''}" style="${isSelf ? 'cursor:default;' : 'cursor:pointer;'}" data-action="toggle-misconduct" data-user="${user.user_number}">${academicLabel}</span>`;

                    // 标签按钮：仅作弊者不显示（管理员也可设置）；置于用户名后
                    const canSetTag = !user.is_cheater;
                    const tagAction = canSetTag
                        ? `<span class="action-link" style="color:#9b59b6;cursor:pointer;margin-left:6px;" data-action="set-tag" data-user="${user.user_number}">🏷️标签</span>`
                        : '';

                    // 操作列：进入主站 | 学术不端
                    const actionHtml = `${banAction} | ${academicAction}`;

                    const userNameHtml = `
                        <span class="username-display" data-user="${user.user_number}" data-current="${escapeHtmlAttr(user.username || '未命名')}" style="color:${userNameColor};">${escapeHtmlAttr(user.username || '未命名')}</span>
                        ${tagHtml}${tagAction}
                    `;

                    html += `
                        <tr>
                            <td class="check-col" data-label="选择"><input type="checkbox" class="row-checkbox" data-user="${user.user_number}" ${isSelf ? 'disabled' : ''}></td>
                            <td data-label="注册时间">${formatTime(user.created_at)}</td>
                            <td data-label="用户编号">${user.user_number}</td>
                            <td data-label="用户名">${userNameHtml}</td>
                            <td data-label="备注名"><span class="editable-field" data-field="remark" data-user="${user.user_number}" data-value="${escapeHtmlAttr(remarkDisplay)}">${escapeHtmlAttr(remarkDisplay) || '-'}</span></td>
                            <td data-label="用户类型">${roleLabel}</td>
                            <td data-label="权限">${permSummaryHtml}</td>
                            <td data-label="操作">${actionHtml}</td>
                        </tr>
                    `;
                }
                html += `</tbody></table>`;
                userList.innerHTML = html;

                // ---- 用户名双击编辑（无原因，不记录） ----
                document.querySelectorAll('.username-display').forEach(el => {
                    let clickCount = 0,
                        timer = null;
                    el.addEventListener('click', function (e) {
                        e.stopPropagation();
                        clickCount++;
                        if (timer) clearTimeout(timer);
                        timer = setTimeout(() => {
                            if (clickCount === 2) enterEditMode(this);
                            else if (clickCount >= 3) {
                                const uid = parseInt(this.dataset.user);
                                window.open('/user/' + uid, '_blank');
                            }
                            clickCount = 0;
                            timer = null;
                        }, 300);
                    });

                    async function enterEditMode(el) {
                        const uid = parseInt(el.dataset.user);
                        const current = el.dataset.current || el.textContent.trim();
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'editable-field-input';
                        input.value = current;
                        input.placeholder = '输入新用户名';
                        el.innerHTML = '';
                        el.appendChild(input);
                        input.focus();
                        input.select();
                        const save = async () => {
                            const val = input.value.trim();
                            if (val === current) {
                                el.textContent = current;
                                el.dataset.current = current;
                                return;
                            }
                            if (!val) {
                                showError('用户名不能为空');
                                el.textContent = current;
                                el.dataset.current = current;
                                return;
                            }
                            try {
                                // 直接更新，不记录日志
                                await updateUserField(uid, { username: val });
                                await loadUsers();
                            } catch (err) {
                                showError('更新失败：' + err.message);
                                el.textContent = current;
                                el.dataset.current = current;
                            }
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                input.blur();
                            }
                            if (e.key === 'Escape') {
                                el.textContent = current;
                                el.dataset.current = current;
                            }
                        });
                    }
                });

                // ---- 备注名双击编辑（无原因，不记录） ----
                document.querySelectorAll('.editable-field[data-field="remark"]').forEach(el => {
                    el.addEventListener('dblclick', function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const cur = this.dataset.value || '';
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'editable-field-input';
                        input.value = cur;
                        input.placeholder = '输入备注名';
                        this.innerHTML = '';
                        this.appendChild(input);
                        input.focus();
                        input.select();
                        const save = async () => {
                            const val = input.value.trim();
                            if (val === cur) {
                                this.textContent = cur || '-';
                                this.dataset.value = cur;
                                return;
                            }
                            try {
                                await updateUserField(uid, { remark: val });
                                await loadUsers();
                            } catch (err) {
                                showError('更新失败：' + err.message);
                                this.textContent = cur || '-';
                                this.dataset.value = cur;
                            }
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                input.blur();
                            }
                            if (e.key === 'Escape') {
                                const p = this.parentNode;
                                p.textContent = cur || '-';
                                p.dataset.value = cur;
                            }
                        });
                    });
                });

                // ---- 标签双击编辑（仅作弊者不可修改） ----
                document.querySelectorAll('.user-tag-display').forEach(el => {
                    el.addEventListener('dblclick', function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const user = allUsers.find(u => u.user_number === uid);
                        if (!user) return;
                        // 仅作弊者（is_cheater）不可修改标签
                        if (user.is_cheater) {
                            showError('作弊者标签已锁定为"作弊者"，不可修改');
                            return;
                        }
                        // 管理员和普通用户均可编辑
                        const cur = this.dataset.current || this.textContent.trim();
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'editable-field-input';
                        input.value = cur;
                        input.placeholder = '输入用户标签（留空恢复默认）';
                        this.innerHTML = '';
                        this.appendChild(input);
                        input.focus();
                        input.select();
                        const save = async () => {
                            const val = input.value.trim();
                            let final = val || null;
                            if (final === cur) {
                                this.textContent = cur;
                                this.dataset.current = cur;
                                return;
                            }
                            try {
                                await updateUserField(uid, { user_tag: final });
                                await loadUsers();
                            } catch (err) {
                                showError('更新失败：' + err.message);
                                this.textContent = cur;
                                this.dataset.current = cur;
                            }
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                input.blur();
                            }
                            if (e.key === 'Escape') {
                                const p = this.parentNode;
                                p.textContent = cur;
                                p.dataset.current = cur;
                            }
                        });
                    });
                });

                // ---- 设置标签（仅作弊者不可修改，管理员可设置） ----
                async function setTag(userNumber) {
                    const targetUser = allUsers.find(u => u.user_number === userNumber);
                    if (!targetUser) return;
                    if (targetUser.is_cheater) { showError('作弊者标签已锁定为"作弊者"，不可修改'); return; }
                    const cur = targetUser.user_tag || '';
                    const { value: val } = await Swal.fire({
                        title: '设置用户标签',
                        input: 'text',
                        inputValue: cur,
                        inputPlaceholder: '输入标签（留空清除标签）',
                        showCancelButton: true,
                        confirmButtonText: '保存',
                        cancelButtonText: '取消'
                    });
                    if (val === undefined || val === null) return;   // 用户取消
                    const final = val.trim() || null;
                    if ((final || null) === (cur || null)) return;   // 无变化
                    try {
                        await updateUserField(userNumber, { user_tag: final });
                        await loadUsers();
                        showSuccess('标签已更新');
                    } catch (err) {
                        showError('更新失败：' + err.message);
                    }
                }

                // ---- 按钮事件绑定 ----
                document.querySelectorAll('[data-action="edit-perms"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await editPermissions(uid);
                    });
                });
                document.querySelectorAll('[data-action="toggle-speak"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await toggleCanSpeak(uid);
                    });
                });
                document.querySelectorAll('[data-action="toggle-ban"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await toggleBan(uid);
                    });
                });
                document.querySelectorAll('[data-action="toggle-misconduct"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await toggleAcademicMisconduct(uid);
                    });
                });
                document.querySelectorAll('[data-action="set-tag"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await setTag(uid);
                    });
                });

                // ---- 全选 ----
                const selectAll = document.getElementById('selectAll');
                if (selectAll) {
                    selectAll.addEventListener('change', function () {
                        document.querySelectorAll('.row-checkbox:not(:disabled)').forEach(cb => cb.checked = this
                            .checked);
                        updateBatchBar();
                    });
                }
                document.querySelectorAll('.row-checkbox').forEach(cb => cb.addEventListener('change', updateBatchBar));
                updateBatchBar();
            }

            // ---------- 批量操作栏状态 ----------
            function updateBatchBar() {
                const checked = document.querySelectorAll('.row-checkbox:checked:not(:disabled)');
                const count = checked.length;
                if (count === 0) { batchBar.classList.remove('show'); return; }
                batchBar.classList.add('show');
                batchInfo.textContent = `已选 ${count} 位用户`;
                const ids = Array.from(checked).map(cb => parseInt(cb.dataset.user));
                batchBar.dataset.selected = JSON.stringify(ids);
            }

            // ---------- 批量按钮事件 ----------
            document.getElementById('batchGrantEnterSite').addEventListener('click', () => batchAction('授予进入主站权限',
                { is_banned: false }));
            document.getElementById('batchRevokeEnterSite').addEventListener('click', () => batchAction('撤销进入主站权限',
                { is_banned: true }));
            document.getElementById('batchGrantSpeak').addEventListener('click', () => batchAction('授予自由发言权限',
                { can_speak: true }));
            document.getElementById('batchRevokeSpeak').addEventListener('click', () => batchAction('撤销自由发言权限',
                { can_speak: false }));

            document.getElementById('batchGrantAdmin').addEventListener('click', async () => {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptReason('批量授予进入后台权限');
                if (!reason) return;
                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id, user_tag')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;

                    for (const u of users) {
                        const currentTag = u.user_tag || '';
                        const newTag = (currentTag === '' || currentTag === '管理员') ? '管理员' : currentTag;
                        await supabase.from('profiles')
                            .update({ is_admin: true, user_tag: newTag, username_color: COLOR_PURPLE })
                            .eq('user_number', u.user_number);
                        const target = allUsers.find(t => t.user_number === u.user_number);
                        if (target) {
                            target.is_admin = true;
                            target.user_tag = newTag;
                            target.username_color = COLOR_PURPLE;
                        }
                    }

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        for (const u of users) {
                            await insertOstrakonLog(
                                adminId,
                                u.id,
                                'grant_perm',
                                { permission: 'is_admin', new_value: true },
                                reason
                            );
                        }
                    }
                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) { showError('批量授予进入后台失败：' + err.message); }
            });

            document.getElementById('batchRevokeAdmin').addEventListener('click', async () => {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptReason('批量撤销进入后台权限');
                if (!reason) return;
                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id, user_tag')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;

                    for (const u of users) {
                        const currentTag = u.user_tag || '';
                        const newTag = (currentTag === '管理员') ? null : currentTag;
                        await supabase.from('profiles')
                            .update({ is_admin: false, user_tag: newTag, username_color: COLOR_RED })
                            .eq('user_number', u.user_number);
                        const target = allUsers.find(t => t.user_number === u.user_number);
                        if (target) {
                            target.is_admin = false;
                            target.user_tag = newTag;
                            target.username_color = COLOR_RED;
                        }
                    }

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        for (const u of users) {
                            await insertOstrakonLog(
                                adminId,
                                u.id,
                                'revoke_perm',
                                { permission: 'is_admin', new_value: false },
                                reason
                            );
                        }
                    }
                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) { showError('批量撤销进入后台失败：' + err.message); }
            });

            document.getElementById('batchGrantUserMgmt').addEventListener('click', () => batchAction('授予用户管理权限',
                { can_manage_users: true }));
            document.getElementById('batchRevokeUserMgmt').addEventListener('click', () => batchAction('撤销用户管理权限',
                { can_manage_users: false }));
            document.getElementById('batchGrantPostMgmt').addEventListener('click', () => batchAction('授予秩序管理权限',
                { can_manage_posts: true }));
            document.getElementById('batchRevokePostMgmt').addEventListener('click', () => batchAction('撤销秩序管理权限',
                { can_manage_posts: false }));
            document.getElementById('batchGrantSpecial').addEventListener('click', () => batchAction('授予特殊权益',
                { special_privilege: true }));
            document.getElementById('batchRevokeSpecial').addEventListener('click', () => batchAction('撤销特殊权益',
                { special_privilege: false }));

            // ---------- 启动 ----------
            init();
        })();
    </script>
<script>
/* 顶栏右上角：用户名→头像；hover 头像在下方弹出登出；顺序 [管理⚙️][铃铛][头像]（齿轮仅管理员） */
(function () {
    if (!window.supabase || document.getElementById('topAvatarWrap')) return;
    var sb = window.supabase.createClient('https://nosikdfacxkuaxfrmoqn.supabase.co', 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-');
    var authBtns = document.querySelector('.topbar .auth-buttons');
    if (!authBtns) return;
    if (!document.getElementById('topAvatarStyle')) {
        var st = document.createElement('style');
        st.id = 'topAvatarStyle';
        st.textContent = '.top-avatar-wrap{position:relative;display:inline-flex;align-items:center} .top-avatar-menu{position:absolute;top:100%;right:0;min-width:104px;background:#fff;border:1px solid #eee;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:6px;display:none;z-index:300} .top-avatar-wrap:hover .top-avatar-menu{display:block} .top-avatar-menu .auth-btn.logout{display:block;width:100%;text-align:center;border-radius:6px;padding:8px 0;box-sizing:border-box}';
        document.head.appendChild(st);
    }
    function letterAvatar(name) {
        var ch = (name || 'U').trim().charAt(0).toUpperCase() || 'U';
        return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e74c3c'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.3em' fill='white' font-size='16' font-family='Arial'%3E" + encodeURIComponent(ch) + "%3C/text%3E%3C/svg%3E";
    }
    var me = null;
    var mo = new MutationObserver(ensure);
    mo.observe(authBtns, { childList: true });
    function ensure() {
        if (!me || !authBtns.querySelector('.auth-btn.logout')) return;
        mo.disconnect();
        try {
            var ue = authBtns.querySelector('.user-email');
            if (ue && ue.parentNode) ue.parentNode.removeChild(ue);
            var wrap = document.getElementById('topAvatarWrap');
            if (!wrap) {
                wrap = document.createElement('div');
                wrap.id = 'topAvatarWrap';
                wrap.className = 'top-avatar-wrap';
                var av = document.createElement('a');
                av.id = 'topAvatar';
                av.href = '/user/' + (me.user_number || '');
                av.title = me.username || '';
                av.style.cssText = 'display:inline-flex;width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;';
                var img = document.createElement('img');
                img.alt = '头像';
                img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
                img.onerror = function () { this.onerror = null; this.src = letterAvatar(me.username); };
                img.src = me.avatar_url || letterAvatar(me.username);
                av.appendChild(img);
                wrap.appendChild(av);
                var menu = document.createElement('div');
                menu.id = 'topAvatarMenu';
                menu.className = 'top-avatar-menu';
                wrap.appendChild(menu);
                authBtns.appendChild(wrap);
            }
            // 把页面渲染的"登出"按钮移进头像下拉菜单（保留原点击事件）
            var menu = document.getElementById('topAvatarMenu');
            var logoutEl = authBtns.querySelector('.auth-btn.logout');
            if (menu && logoutEl && logoutEl.parentNode !== menu) menu.appendChild(logoutEl);
            if (me.can_manage_users && !document.getElementById('adminEntry')) {
                var gear = document.createElement('a');
                gear.id = 'adminEntry'; gear.href = '/admin/user'; gear.title = '管理后台';
                gear.style.cssText = 'display:inline-flex;align-items:center;font-size:18px;line-height:1;text-decoration:none;cursor:pointer;';
                gear.textContent = '⚙️';
                authBtns.appendChild(gear);
            }
            ['#adminEntry', '.bell-icon', '#topAvatarWrap'].forEach(function (sel) {
                var el = authBtns.querySelector(sel);
                if (el) authBtns.appendChild(el);
            });
        } finally { mo.observe(authBtns, { childList: true }); }
    }
    sb.auth.getSession().then(function (r) {
        var s = r.data && r.data.session;
        if (!s) return;
        return sb.from('profiles').select('username, avatar_url, user_number, can_manage_users').eq('id', s.user.id).maybeSingle();
    }).then(function (rr) { if (rr && rr.data) { me = rr.data; ensure(); } }).catch(function () {});
})();
</script>
