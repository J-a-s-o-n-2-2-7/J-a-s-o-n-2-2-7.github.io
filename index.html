<!DOCTYPE html>
<html class="no-js" lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>我的个人主页 · Jason227</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="renderer" content="webkit">
    <!-- 洛谷样式 -->
    <link rel="stylesheet" href="https://cdn.luogu.com.cn/css/amazeui.min.css"/>
    <link rel="stylesheet" href="https://cdn.luogu.com.cn/css/katex.min.css"/>
    <link rel="stylesheet" href="https://cdn.luogu.com.cn/css/luogu3.css?ver=20190102">
    <link rel="stylesheet" href="https://cdn.luogu.com.cn/css/highlight_tomorrow.css">
    <link rel="stylesheet" href="https://cdn.luogu.com.cn/markdown-palettes/markdown-palettes.css?ver=20190219">
    <script src="https://cdn.luogu.com.cn/js/jquery-2.1.1.min.js"></script>
    <script src="https://cdn.luogu.com.cn/js/luogu3_pre.js?ver=20190101"></script>
    <!-- Supabase SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* 模态框样式 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-container {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-container .tabs {
            display: flex;
            gap: 16px;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 24px;
        }
        .modal-container .tab {
            flex:1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #6b7280;
            border-bottom: 2px solid transparent;
        }
        .modal-container .tab.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }
        .modal-container .form-panel { display: none; }
        .modal-container .form-panel.active { display: block; }
        .modal-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .modal-container button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-container .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }
        .error { background: #fee2e2; color: #b91c1c; }
        .success { background: #dcfce7; color: #166534; }
        /* 登录按钮 */
        .login-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            cursor: pointer;
            z-index: 100;
        }
        .logout-btn {
            background: #7f8c8d;
        }
    </style>
</head>
<body>

<!-- 悬浮登录/登出按钮 -->
<div style="position: absolute; right: 20px; top: 20px; z-index: 100;">
    <button id="authBtn" class="login-btn">登录</button>
</div>

<!-- 模态框（登录/注册） -->
<div id="authModal" class="modal-mask">
    <div class="modal-container">
        <div class="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        <div id="loginPanel" class="form-panel active">
            <input type="email" id="loginEmail" placeholder="邮箱" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password">
            <button id="doLoginBtn">立即登录</button>
            <div id="loginMsg" class="message"></div>
        </div>
        <div id="registerPanel" class="form-panel">
            <input type="email" id="regEmail" placeholder="邮箱" autocomplete="email">
            <input type="password" id="regPassword" placeholder="密码（至少6位）" autocomplete="new-password">
            <button id="doRegisterBtn">注册新账号</button>
            <div id="regMsg" class="message"></div>
        </div>
        <p style="text-align:center; margin-top:24px; color:#7f8c8d; font-size:12px;">&copy; 2026 Jason227</p>
    </div>
</div>

<!-- 洛谷风格主页（始终显示） -->
<div id="app-old">
    <div class="lg-index-content am-center ">
        <!-- 顶部欢迎区（根据登录状态显示不同内容） -->
        <div class="am-g">
            <div class="am-u-md-12">
                <div class="lg-article" id="welcomeBanner" style="background:#fef3e8; border-left: 5px solid #e74c3c;">
                    <!-- 动态内容：未登录显示默认提示，登录后显示用户邮箱 -->
                </div>
            </div>
        </div>

        <div class="am-g">
            <div class="am-u-md-12 ">
                <div class="lg-article">
                    <div class="am-g">
                        <div class="am-u-md-8">
                            <div class="am-slider am-slider-default" data-am-flexslider id="lg-slider">
                                <ul class="am-slides">
                                    <li><a href="#"><img src='https://ipic.luogu.com.cn/yugu26n/pic/yugu26nbanner.png'/></a></li>
                                    <li><a href="#"><img src='https://ipic.luogu.com.cn/yugu24n/ap/cs-banner.png'/></a></li>
                                </ul>
                            </div>
                        </div>
                        <div class="am-u-md-4 lg-punch am-text-center" id="fortuneCard">
                            <!-- 运势卡片（根据登录状态调整内容） -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="am-g">
            <div class="am-u-md-3">
                <div class="lg-article lg-index-stat">
                    <h2>问题跳转</h2>
                    <div class="am-input-group am-input-group-primary am-input-group-sm">
                        <input type="text" class="am-form-field" placeholder="例：P1001" name="toproblem">
                    </div>
                    <p>
                        <button class="am-btn am-btn-danger am-btn-sm" name="goto">跳转</button>
                        <button class="am-btn am-btn-primary am-btn-sm" name="gotorandom">随机跳题</button>
                    </p>
                </div>
            </div>
            <div class="am-u-md-9">
                <div class="lg-article lg-index-stat" style="padding: 0">
                    <div class="am-g" style="padding: 15px">
                        <div class="am-u-md-4 am-text-center"><img src="/images/index/step1.png" width="250" alt="step1"></div>
                        <div class="am-u-md-4 am-text-center"><img src="/images/index/step2.png" width="250" alt="step2"></div>
                        <div class="am-u-md-4 am-text-center"><img src="/images/index/step3.png" width="250" alt="step3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="am-g">
            <div class="am-u-lg-3 am-u-md-4 lg-right">
                <div class="lg-article"><h2>本站公告</h2>
                    <p><a href="#">📢 个人网站全新改版</a></p>
                    <p><a href="#">🔧 做题计划使用指南</a></p>
                    <p><a href="#">🤝 友链交换须知</a></p>
                </div>
                <div class="lg-article am-hide-sm"><h2>友情链接</h2>
                    <p><strong>推荐题库</strong><br><a href="#">LibreOJ</a> | <a href="#">Vijos</a> | <a href="#">HydroOJ</a></p>
                </div>
            </div>
            <div class="am-u-lg-9 am-u-md-8 lg-index-benben lg-right">
                <div class="lg-article"><h2>近期比赛</h2>
                    <section class="am-panel lg-index-contest am-panel-success">
                        <header class="am-panel-hd"><h3 class="am-panel-title">[团队公开赛] 暑假算法挑战赛</h3></header>
                        <div class="am-panel-bd"><span class="lg-small"><strong class="lg-fg-green">未开始</strong> 3天后开始</span></div>
                    </section>
                    <section class="am-panel lg-index-contest am-panel-danger">
                        <header class="am-panel-hd"><h3 class="am-panel-title">[官方比赛] 蓝桥杯校内模拟赛</h3></header>
                        <div class="am-panel-bd"><span class="lg-small"><strong class="lg-fg-red">已结束</strong></span></div>
                    </section>
                </div>
                <div class="lg-article"><h2>最近讨论</h2>
                    <section class="am-panel lg-index-contest am-panel-primary">
                        <div class="am-panel-bd"><a href="#">如何快速入门动态规划？</a><br><span class="lg-small">@某用户 回复 10小时前</span></div>
                    </section>
                    <section class="am-panel lg-index-contest am-panel-primary">
                        <div class="am-panel-bd"><a href="#">洛谷主题库题目推荐</a><br><span class="lg-small">@某用户 回复 昨天</span></div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== Supabase 配置 ==========
    const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM 元素
    const authModal = document.getElementById('authModal');
    const authBtn = document.getElementById('authBtn');
    const welcomeBanner = document.getElementById('welcomeBanner');
    const fortuneCard = document.getElementById('fortuneCard');

    // 辅助：显示模态框消息
    function showModalMessage(container, msg, isError = true) {
        if (!container) return;
        container.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${msg}</div>`;
        setTimeout(() => { container.innerHTML = ''; }, 4000);
    }

    // 更新页面 UI（根据登录状态）
    async function updateUI() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            // 已登录：显示用户邮箱，运势卡片显示用户信息
            authBtn.textContent = '登出';
            authBtn.classList.add('logout-btn');
            welcomeBanner.innerHTML = `<h3>👋 欢迎回来，${session.user.email}！</h3><p>你已经成功登录，可以开始探索以下内容了。</p>`;
            fortuneCard.innerHTML = `
                <h2><span class="lg-fg-red">${session.user.email.split('@')[0]}</span> 的运势</h2>
                <span class="lg-punch-result lg-fg-red">§ 中吉 §</span>
                <div class="am-g">
                    <div class="am-u-sm-6 lg-fg-red">
                        <span class="lg-bold">宜：</span>点外卖<br>
                        <span class="lg-small">及时送到</span><br>
                        <span class="lg-bold">宜：</span>纳财<br>
                        <span class="lg-small">要到好多 Money</span>
                    </div>
                    <div class="am-u-sm-6">
                        <span class="lg-bold">忌：</span>摸鱼<br>
                        <span class="lg-small">被教练制裁</span><br>
                        <span class="lg-bold">忌：</span>放假<br>
                        <span class="lg-small">就放一天，全是作业</span>
                    </div>
                    <div class="am-u-sm-12 lg-small"><br>连续打卡 <strong>228</strong> 天</div>
                </div>
            `;
        } else {
            // 未登录：显示默认文案，运势卡片显示提示登录
            authBtn.textContent = '登录';
            authBtn.classList.remove('logout-btn');
            welcomeBanner.innerHTML = `<h3>✨ 欢迎来到 Jason227 的个人空间</h3><p>请点击右上角“登录”按钮，解锁更多个性化功能～</p>`;
            fortuneCard.innerHTML = `
                <h2>🚪 游客模式</h2>
                <div class="lg-punch-padding am-show-lg"></div>
                <div class="lg-index-calendar lg-fg-greendark">
                    <span class="lg-punch-small ">五月大</span>
                    <span class="lg-punch-big">31</span>
                    <span class="lg-punch-small ">星期日</span>
                </div>
                <div class="am-g">
                    <div class="am-u-sm-12 lg-small">
                        距 <strong>CSP-J/S 2026 第一轮</strong> 还剩 <strong>110 天</strong><br>
                        距 <strong>CSP-J/S 2026 第二轮</strong> 还剩 <strong>152 天</strong>
                    </div>
                </div>
                <div class="am-g" style="margin-top:12px;">
                    <div class="am-u-sm-12"><small>👉 <a href="#" id="openLoginFromCard" style="color:#e74c3c;">登录</a> 后查看专属运势</small></div>
                </div>
            `;
            // 绑定卡片内登录按钮
            const openLoginLink = document.getElementById('openLoginFromCard');
            if (openLoginLink) openLoginLink.addEventListener('click', (e) => { e.preventDefault(); authModal.style.display = 'flex'; });
        }
    }

    // 注册
    async function handleRegister() {
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const msgDiv = document.getElementById('regMsg');
        if (!email || !password) return showModalMessage(msgDiv, '请填写邮箱和密码');
        if (password.length < 6) return showModalMessage(msgDiv, '密码至少6位');
        const btn = document.getElementById('doRegisterBtn');
        btn.disabled = true; btn.textContent = '注册中...';
        const { error } = await supabase.auth.signUp({ email, password });
        btn.disabled = false; btn.textContent = '注册新账号';
        if (error) showModalMessage(msgDiv, error.message);
        else {
            showModalMessage(msgDiv, '注册成功！请登录', false);
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            // 切换到登录标签
            document.querySelector('.tab[data-tab="login"]').click();
        }
    }

    // 登录
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('loginMsg');
        if (!email || !password) return showModalMessage(msgDiv, '请填写邮箱和密码');
        const btn = document.getElementById('doLoginBtn');
        btn.disabled = true; btn.textContent = '登录中...';
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        btn.disabled = false; btn.textContent = '立即登录';
        if (error) showModalMessage(msgDiv, error.message);
        else {
            showModalMessage(msgDiv, '登录成功！', false);
            setTimeout(() => {
                authModal.style.display = 'none';
                updateUI();
                // 清空密码框
                document.getElementById('loginPassword').value = '';
            }, 1000);
        }
    }

    // 登出
    async function handleAuthClick() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            await supabase.auth.signOut();
            updateUI();
        } else {
            authModal.style.display = 'flex';
        }
    }

    // 模态框标签切换
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            if (target === 'login') {
                document.getElementById('loginPanel').classList.add('active');
                document.getElementById('registerPanel').classList.remove('active');
            } else {
                document.getElementById('registerPanel').classList.add('active');
                document.getElementById('loginPanel').classList.remove('active');
            }
            document.getElementById('loginMsg').innerHTML = '';
            document.getElementById('regMsg').innerHTML = '';
        });
    });

    // 关闭模态框（点击背景关闭）
    authModal.addEventListener('click', (e) => {
        if (e.target === authModal) authModal.style.display = 'none';
    });

    // 绑定事件
    authBtn.addEventListener('click', handleAuthClick);
    document.getElementById('doLoginBtn').addEventListener('click', handleLogin);
    document.getElementById('doRegisterBtn').addEventListener('click', handleRegister);

    // 问题跳转演示（保留）
    $("[name=goto]").click(function() {
        let pid = $("[name=toproblem]").val();
        if(!pid) return alert("请输入题号");
        if(!isNaN(pid)) pid = 'P'+pid;
        alert("跳转至题目 "+pid+" (演示)");
    });
    $("[name=gotorandom]").click(() => alert("随机跳题（演示）"));

    // 初始化
    updateUI();
</script>
</body>
</html>
