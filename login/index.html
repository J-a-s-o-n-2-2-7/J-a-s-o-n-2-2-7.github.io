<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #5b6e8c;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
            background: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #e74c3c;
            text-decoration: none;
        }

        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .captcha-row input {
            flex: 1;
        }

        .captcha-row canvas {
            cursor: pointer;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            width: 120px;
            height: 44px;
        }

        .captcha-hint {
            font-size: 12px;
            color: #6c7a8e;
            margin-top: 4px;
            text-align: right;
        }

        .turnstile-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        /* 新增忘记密码链接样式 */
        .forgot-password {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 16px;
        }

        .forgot-password a {
            font-size: 13px;
            color: #3498db;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>欢迎回来</h1>
        <div class="sub">使用手机号 / 用户名 / 邮箱登录</div>
        <div class="input-group">
            <input type="text" id="loginIdentifier" placeholder="手机号 / 用户名 / 邮箱" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password">
        </div>
        <!-- 新增忘记密码链接 -->
        <div class="forgot-password">
            <a href="#" id="forgotPwdLink">忘记密码？</a>
        </div>
        <div class="input-group">
            <div class="captcha-row">
                <input type="text" id="captchaInput" placeholder="验证码" autocomplete="off" maxlength="6">
                <canvas id="captchaCanvas" width="120" height="44"></canvas>
            </div>
            <div class="captcha-hint">点击图片刷新验证码</div>
        </div>
        <div class="turnstile-wrapper">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADcNcP2JrYuEkEhx" data-theme="light"></div>
        </div>
        <button id="loginBtn">登录</button>
        <div id="loginMsg" class="message"></div>
        <div class="footer-links">
            还没有账号？ <a href="/register">立即注册</a>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 图形验证码（大小写不敏感） ==========
        let currentCaptcha = '';
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) captcha += chars[Math.floor(Math.random() * chars.length)];
            currentCaptcha = captcha.toUpperCase();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(100,100,100,${0.2 + Math.random() * 0.5})`;
                ctx.stroke();
            }
            for (let i = 0; i < 60; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }
            for (let i = 0; i < currentCaptcha.length; i++) {
                ctx.font = `${24 + Math.floor(Math.random() * 6)}px "Courier New", monospace`;
                ctx.fillStyle = `rgb(${50 + Math.random() * 100}, ${30 + Math.random() * 80}, ${20 + Math.random() * 70})`;
                const x = 12 + i * 20 + Math.random() * 6;
                const y = 30 + Math.random() * 8;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(currentCaptcha[i], 0, 0);
                ctx.restore();
            }
        }
        canvas.addEventListener('click', generateCaptcha);
        generateCaptcha();

        // ========== 辅助函数：根据手机号/用户名/邮箱 获取邮箱 ==========
        async function getEmailByIdentifier(identifier) {
            // 手机号（11位数字，以1开头）
            if (/^1[3-9]\d{9}$/.test(identifier)) {
                const { data, error } = await sb
                    .from('profiles')
                    .select('email')
                    .eq('phone', identifier)
                    .maybeSingle();
                if (error || !data) return null;
                return data.email;
            }
            // 邮箱
            if (identifier.includes('@')) {
                return identifier;
            }
            // 用户名
            const { data, error } = await sb
                .from('profiles')
                .select('email')
                .eq('username', identifier)
                .maybeSingle();
            if (error || !data) return null;
            return data.email;
        }

        // 刷新 Turnstile 验证码
        function resetTurnstile() {
            if (window.turnstile) {
                const widget = document.querySelector('.cf-turnstile');
                if (widget) window.turnstile.reset(widget);
            }
        }

        // ========== 忘记密码功能 ==========
        async function forgotPassword() {
            const identifier = document.getElementById('loginIdentifier').value.trim();
            if (!identifier) {
                alert('请输入注册时使用的手机号/用户名/邮箱');
                return;
            }
            const email = await getEmailByIdentifier(identifier);
            if (!email) {
                alert('未找到对应的账号');
                return;
            }
            const { error } = await sb.auth.resetPasswordForEmail(email, {
                redirectTo: `${window.location.origin}/login` // 重置后跳转回登录页
            });
            if (error) {
                alert('发送失败: ' + error.message);
            } else {
                alert('密码重置邮件已发送，请查收邮箱（注意垃圾箱）');
            }
        }

        const loginBtn = document.getElementById('loginBtn');
        const loginMsg = document.getElementById('loginMsg');
        let isSubmitting = false;

        async function handleLogin() {
            if (isSubmitting) return;
            isSubmitting = true;
            loginBtn.disabled = true;

            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const userCaptcha = document.getElementById('captchaInput').value.trim();

            try {
                if (!identifier || !password) {
                    loginMsg.innerHTML = '<div class="message error">请填写账号和密码</div>';
                    return;
                }
                if (!userCaptcha) {
                    loginMsg.innerHTML = '<div class="message error">请输入图形验证码</div>';
                    return;
                }
                if (userCaptcha.toUpperCase() !== currentCaptcha) {
                    loginMsg.innerHTML = '<div class="message error">图形验证码错误</div>';
                    generateCaptcha();
                    document.getElementById('captchaInput').value = '';
                    resetTurnstile();
                    return;
                }

                // 获取 Turnstile token（确保是最新的）
                let captchaToken = null;
                try {
                    const tokenInput = document.querySelector('[name="cf-turnstile-response"]');
                    if (tokenInput && tokenInput.value) {
                        captchaToken = tokenInput.value;
                    } else {
                        // 等待一小段时间，可能 Turnstile 还未完成
                        await new Promise(r => setTimeout(r, 500));
                        const tokenInputRetry = document.querySelector('[name="cf-turnstile-response"]');
                        if (tokenInputRetry && tokenInputRetry.value) captchaToken = tokenInputRetry.value;
                    }
                } catch (e) { }
                if (!captchaToken) {
                    loginMsg.innerHTML = '<div class="message error">请完成安全验证</div>';
                    resetTurnstile();
                    return;
                }

                const email = await getEmailByIdentifier(identifier);
                if (!email) {
                    loginMsg.innerHTML = '<div class="message error">用户不存在</div>';
                    resetTurnstile();
                    return;
                }

                const { error } = await sb.auth.signInWithPassword({
                    email,
                    password,
                    options: { captchaToken }
                });

                if (error) {
                    if (error.message && error.message.includes('timeout-or-duplicate')) {
                        loginMsg.innerHTML = '<div class="message error">安全验证已过期，请重新验证</div>';
                        resetTurnstile();
                    } else if (error.message && error.message.includes('Email not confirmed')) {
                        loginMsg.innerHTML = '<div class="message error">邮箱未确认，请先查收确认邮件并激活账号</div>';
                    } else {
                        loginMsg.innerHTML = `<div class="message error">${error.message}</div>`;
                    }
                    generateCaptcha();
                    document.getElementById('captchaInput').value = '';
                } else {
                    loginMsg.innerHTML = '<div class="message success">登录成功！正在跳转...</div>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                }
            } finally {
                isSubmitting = false;
                loginBtn.disabled = false;
            }
        }

        // 绑定忘记密码事件
        document.getElementById('forgotPwdLink').addEventListener('click', (e) => {
            e.preventDefault();
            forgotPassword();
        });

        loginBtn.addEventListener('click', handleLogin);
    </script>
</body>

</html>
