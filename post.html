    <script>
        (function () {
            'use strict';

            const supabaseUrl = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const supabaseKey = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            let currentUser = null;
            let currentProfile = null;
            let currentPost = null;
            let currentComments = [];
            let currentPage = 1;
            const PAGE_SIZE = 10;
            let totalComments = 0;
            let totalPages = 1;

            captchaCanvas?.addEventListener('click', () => { generateCaptcha(); document.getElementById('captchaInput').value = ''; });

            function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }
            function formatTime(ts) { /* 保持原逻辑 */ }
            function letterAvatar(name) { const ch = (name || 'U').trim().charAt(0).toUpperCase() || 'U'; return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e74c3c'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.3em' fill='white' font-size='16' font-family='Arial'%3E" + encodeURIComponent(ch) + "%3C/text%3E%3C/svg%3E"; }

            async function getProfile(userId) {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username, is_admin, can_speak, can_manage_users, can_manage_posts, username_color, user_tag, is_cheater, avatar_url')
                    .eq('id', userId)
                    .single();
                return error ? null : data;
            }

            async function updateNav() { /* 保持原有认证逻辑 */ }

            // ========== 核心修复1：删除帖子 ==========
            async function deletePost(postId) {
                if (!currentUser) {
                    await Swal.fire({ icon: 'error', title: '请先登录', confirmButtonColor: '#e74c3c' });
                    return false;
                }

                const result = await Swal.fire({
                    title: '⚠️ 确定要删除此帖子吗？',
                    text: '此操作不可恢复！',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#e74c3c',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: '是的，删除！',
                    cancelButtonText: '取消'
                });

                if (!result.isConfirmed) return false;

                try {
                    // 实际执行删除，如果RLS不允许，这里会抛出错误
                    const { error } = await supabase
                        .from('posts')
                        .delete()
                        .eq('id', postId);

                    if (error) throw error;

                    await Swal.fire({
                        icon: 'success',
                        title: '✅ 删除成功！',
                        text: '帖子已永久删除，即将返回讨论区',
                        confirmButtonColor: '#e74c3c',
                        timer: 1500,
                        willClose: () => {
                            window.location.href = '/discuss';
                        }
                    });
                    return true;

                } catch (err) {
                    console.error('删除失败:', err);
                    await Swal.fire({
                        icon: 'error',
                        title: '❌ 删除失败',
                        text: err.message || '权限不足或网络错误',
                        confirmButtonColor: '#e74c3c'
                    });
                    return false;
                }
            }

            // ========== 核心修复2：获取评论（避免联查失败） ==========
            async function fetchComments(postId, page = 1) {
                const from = (page - 1) * PAGE_SIZE;
                const to = from + PAGE_SIZE - 1;

                // 第一步：获取当前页评论
                const { data: commentsData, error: commentsError, count } = await supabase
                    .from('comments')
                    .select('id, content, author_id, created_at', { count: 'exact' })
                    .eq('post_id', postId)
                    .order('created_at', { ascending: true })
                    .range(from, to);

                if (commentsError) throw commentsError;
                if (!commentsData || commentsData.length === 0) {
                    return { comments: [], count: count || 0 };
                }

                // 第二步：收集所有 author_id 并批量查询 profiles
                const authorIds = [...new Set(commentsData.map(c => c.author_id))];
                const { data: profilesData } = await supabase
                    .from('profiles')
                    .select('id, username, user_number, username_color, user_tag, is_admin, is_cheater, avatar_url')
                    .in('id', authorIds);

                const profileMap = {};
                if (profilesData) {
                    profilesData.forEach(p => { profileMap[p.id] = p; });
                }

                // 组装最终数据
                const comments = commentsData.map(c => {
                    const prof = profileMap[c.author_id] || {};
                    return {
                        id: c.id,
                        content: c.content,
                        author_id: c.author_id,
                        created_at: c.created_at,
                        authorName: prof.username || '匿名用户',
                        authorId: prof.user_number || '',
                        usernameColor: prof.is_cheater ? '#AD8B00' : (prof.username_color || (prof.is_admin ? '#9b59b6' : '#2c3e50')),
                        userTag: prof.user_tag || '',
                        isAdmin: prof.is_admin || false,
                        avatarUrl: prof.avatar_url || null,
                    };
                });

                return { comments, count: count || 0 };
            }

            // 其余渲染、编辑器等函数保持不变（与原始文件完全相同，此处不重复展示）
            // 但需要确保 renderComments 中使用 MarkdownRenderer 渲染内容，并处理异常

            function renderComments(comments) {
                const container = document.getElementById('commentList');
                if (!comments || comments.length === 0) {
                    container.innerHTML = '<div class="empty-comments"><i class="far fa-comment-dots"></i><p>还没有评论，来说点什么吧！</p></div>';
                    return;
                }
                let html = '';
                comments.forEach(c => {
                    const timeStr = formatTime(c.created_at);
                    const avatarImg = c.avatarUrl || letterAvatar(c.authorName);
                    const usernameColor = c.usernameColor || '#2c3e50';
                    const userTag = c.userTag || '';
                    let tagHtml = userTag ? `<span class="comment-user-tag" style="background-color: ${usernameColor};">${escapeHtml(userTag)}</span>` : '';

                    let renderedContent = '';
                    try {
                        renderedContent = MarkdownRenderer.render(c.content || '', {
                            isAdmin: currentProfile?.is_admin || false,
                            username: currentProfile?.username || '',
                            mentionMap: {},
                            uniqueId: 'comment-' + c.id
                        });
                    } catch (e) {
                        renderedContent = escapeHtml(c.content);
                    }

                    html += `
                        <div class="comment-item">
                            <div class="comment-header">
                                <div class="comment-header-left">
                                    <div class="comment-avatar"><a href="/user/${c.authorId}"><img src="${avatarImg}" alt="${escapeHtml(c.authorName)}" onerror="this.src='${letterAvatar(c.authorName)}'"></a></div>
                                    <a class="comment-username" href="/user/${c.authorId}" style="color: ${usernameColor};">${escapeHtml(c.authorName)}</a>
                                    ${tagHtml}
                                    <span class="comment-time">回复于 ${timeStr}</span>
                                </div>
                                <div class="comment-header-actions">
                                    <a href="javascript:void(0)" class="comment-report-btn">举报</a>
                                    <a href="javascript:void(0)" class="comment-reply-btn" data-author="${escapeHtml(c.authorName)}">回复</a>
                                </div>
                            </div>
                            <div class="comment-body"><div class="comment-text">${renderedContent}</div></div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                // 绑定回复/举报事件...
                renderMermaid();
            }

            // 初始化等其余代码（必须完整保留原文件中的编辑器逻辑、工具栏、发布评论等）
            // 由于篇幅限制，此处仅展示关键修复函数，实际使用时请确保包含全部原有功能代码

            async function init() {
                await updateNav();
                // ... 其余初始化逻辑
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
