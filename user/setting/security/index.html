<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全设置 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .button-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
        }

        .nav-btn.active {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            cursor: default;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
            border-left: 3px solid #e74c3c;
            padding-left: 12px;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .field-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
        }

        .restriction-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            text-align: center;
            font-size: 14px;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
        }

        .info {
            background: #e3f2fd;
            color: #0c5460;
        }

        .loading {
            text-align: center;
            color: #6c7a8e;
            padding: 20px;
        }

        .error-box {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 安全设置</h1>
        <div class="sub">修改密码 / 修改用户名</div>

        <div class="button-bar">
            <a href="/user/setting" class="nav-btn">个人信息</a>
            <span class="nav-btn active">安全设置</span>
        </div>

        <div id="loadingIndicator" class="loading">⏳ 加载中...</div>
        <div id="errorMessage" class="error-box" style="display: none;"></div>

        <div id="mainContent" style="display: none;">
            <!-- 修改用户名区块 -->
            <div class="section">
                <div class="section-title">修改用户名</div>
                <div class="field-group">
                    <label>当前用户名</label>
                    <input type="text" id="currentUsername" disabled style="background:#f0f0f0;">
                </div>
                <div id="usernameRestriction" class="restriction-box"></div>
                <button id="gotoUnlockBtn">修改用户名</button>
            </div>

            <!-- 修改密码区块 -->
            <div class="section">
                <div class="section-title">修改密码</div>
                <div class="field-group">
                    <label>当前密码</label>
                    <input type="password" id="oldPassword" placeholder="输入当前密码">
                </div>
                <div class="field-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword" placeholder="至少6位">
                </div>
                <div class="field-group">
                    <label>确认新密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入新密码">
                </div>
                <button id="updatePasswordBtn">修改密码</button>
                <div id="passwordMsg" class="message"></div>
            </div>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let profileData = null;

        function showError(msg) {
            const loadingDiv = document.getElementById('loadingIndicator');
            const errorDiv = document.getElementById('errorMessage');
            loadingDiv.style.display = 'none';
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `❌ 错误：${msg}`;
            console.error(msg);
        }

        async function loadUserData() {
            const loadingDiv = document.getElementById('loadingIndicator');
            const mainDiv = document.getElementById('mainContent');
            const errorDiv = document.getElementById('errorMessage');

            try {
                // 1. 获取 session
                console.log('获取 session...');
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw new Error(`会话错误: ${sessionError.message}`);
                if (!session) {
                    window.location.href = '/login';
                    return;
                }
                currentUser = session.user;

                // 2. 查询 profiles
                console.log('查询 profiles...');
                const { data, error } = await supabase
                    .from('profiles')
                    .select('username, username_last_modified, is_super_admin')
                    .eq('id', currentUser.id)
                    .single();
                if (error) throw new Error(`查询 profiles 失败: ${error.message} (code: ${error.code})`);
                if (!data) throw new Error('未找到用户资料，请确认您已注册并完成初始化');
                profileData = data;
                console.log('profile 数据:', data);

                // 3. 填充界面
                document.getElementById('currentUsername').value = data.username;

                const isSuperAdmin = data.is_super_admin === true;
                const lastModified = data.username_last_modified ? new Date(data.username_last_modified) : null;
                const now = new Date();
                let canModify = false;
                let restrictionHtml = '';
                let remainingDays = 0;

                if (isSuperAdmin) {
                    canModify = true;
                    restrictionHtml = '<div class="info">👑 站长无修改时间限制</div>';
                } else {
                    if (!lastModified) {
                        canModify = true;
                        restrictionHtml = '<div class="info">✅ 首次修改，无时间限制</div>';
                    } else {
                        const nextAllowed = new Date(lastModified);
                        nextAllowed.setFullYear(nextAllowed.getFullYear() + 1);
                        if (now >= nextAllowed) {
                            canModify = true;
                            restrictionHtml = '<div class="info">✅ 现在可以修改用户名</div>';
                        } else {
                            canModify = false;
                            remainingDays = Math.ceil((nextAllowed - now) / (1000 * 60 * 60 * 24));
                            const lastModifiedStr = lastModified.toLocaleDateString('zh-CN');
                            restrictionHtml = `<div class="warning">上次修改时间：${lastModifiedStr}<br>一年（365天）内仅可修改一次用户名。<br>⚠️ 距离下次可修改还有 ${remainingDays} 天，暂不可修改。</div>`;
                        }
                    }
                }

                document.getElementById('usernameRestriction').innerHTML = restrictionHtml;
                const modifyBtn = document.getElementById('gotoUnlockBtn');
                if (!canModify) {
                    modifyBtn.disabled = true;
                    modifyBtn.title = `${remainingDays}天后可再次修改用户名`;
                } else {
                    modifyBtn.disabled = false;
                    modifyBtn.onclick = () => {
                        window.location.href = '/unlock?redirect=/user/security/usernameUpdate';
                    };
                }

                // 显示主要内容
                loadingDiv.style.display = 'none';
                mainDiv.style.display = 'block';
            } catch (err) {
                showError(err.message);
            }
        }

        // 修改密码
        async function updatePassword() {
            if (!currentUser) {
                document.getElementById('passwordMsg').innerHTML = '<div class="message error">请先登录</div>';
                return;
            }
            const oldPwd = document.getElementById('oldPassword').value;
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const msgDiv = document.getElementById('passwordMsg');
            if (!oldPwd || !newPwd || !confirmPwd) {
                msgDiv.innerHTML = '<div class="message error">请填写所有密码字段</div>';
                return;
            }
            if (newPwd.length < 6) {
                msgDiv.innerHTML = '<div class="message error">新密码至少6位</div>';
                return;
            }
            if (newPwd !== confirmPwd) {
                msgDiv.innerHTML = '<div class="message error">两次输入的新密码不一致</div>';
                return;
            }
            // 验证旧密码
            const { error: signInError } = await supabase.auth.signInWithPassword({
                email: currentUser.email,
                password: oldPwd
            });
            if (signInError) {
                msgDiv.innerHTML = '<div class="message error">当前密码错误</div>';
                return;
            }
            const { error: updateError } = await supabase.auth.updateUser({ password: newPwd });
            if (updateError) {
                msgDiv.innerHTML = `<div class="message error">修改失败: ${updateError.message}</div>`;
            } else {
                msgDiv.innerHTML = '<div class="message success">密码修改成功！请重新登录</div>';
                setTimeout(() => {
                    supabase.auth.signOut();
                    window.location.href = '/login';
                }, 2000);
            }
        }

        document.getElementById('updatePasswordBtn').addEventListener('click', updatePassword);
        loadUserData();
    </script>
</body>

</html>
