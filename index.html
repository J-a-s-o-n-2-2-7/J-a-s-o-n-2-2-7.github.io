<script>
    (function() {
        if (window.__MY_SUPABASE_CLIENT) return;
        window.__MY_SUPABASE_CLIENT = window.supabase.createClient(
            'https://nosikdfacxkuaxfrmoqn.supabase.co',
            'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
        );
    })();
    const supabase = window.__MY_SUPABASE_CLIENT;

    const authButtons = document.getElementById('authButtons');
    const welcomeTitle = document.getElementById('welcomeTitle');
    const welcomeDesc = document.getElementById('welcomeDesc');
    const fortuneCard = document.getElementById('fortuneCard');

    async function updateUI() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            // 查询用户名和用户编号
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('username, user_number')
                .eq('id', session.user.id)
                .single();
            
            let displayName = session.user.email; // 降级使用邮箱
            let userNumber = null;
            if (!error && profile) {
                displayName = profile.username;
                userNumber = profile.user_number;
            }

            // 构建右上角：用户名（可点击） + 登出按钮
            let html = '';
            if (userNumber) {
                html += `<a href="/user/index.html?uid=${userNumber}" class="user-email" style="text-decoration:none;">${escapeHtml(displayName)}</a>`;
            } else {
                html += `<span class="user-email">${escapeHtml(displayName)}</span>`;
            }
            html += `<button id="logoutBtn" class="auth-btn logout">登出</button>`;
            authButtons.innerHTML = html;

            document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                await supabase.auth.signOut();
                location.reload();
            });

            welcomeTitle.innerHTML = `👋 欢迎回来，${escapeHtml(displayName)}`;
            welcomeDesc.innerHTML = '你已经成功登录，可以查看个性化内容。';
            fortuneCard.innerHTML = `
                <div class="card-header">🧧 你的运势</div>
                <div style="text-align:center">
                    <span style="font-size:2rem;">中吉</span>
                    <p>宜：点外卖 · 纳财 &nbsp;|&nbsp; 忌：摸鱼 · 摆烂</p>
                    <p>连续打卡 <strong>228</strong> 天</p>
                </div>
            `;
        } else {
            authButtons.innerHTML = `
                <a href="/login" class="auth-btn">登录</a>
                <a href="/register" class="auth-btn">注册</a>
            `;
            welcomeTitle.innerHTML = '✨ 欢迎来到 Jason227 的个人空间';
            welcomeDesc.innerHTML = '请点击右上角登录或注册，解锁更多个性化功能～';
            fortuneCard.innerHTML = `
                <div class="card-header">📅 今日日历</div>
                <div style="text-align:center">
                    <span style="font-size:1.8rem;">6月2日</span>
                    <p>星期一</p>
                    <p>距 CSP-J/S 2026 第一轮还剩 109 天</p>
                    <p><a href="/login">👉 登录后查看专属运势</a></p>
                </div>
            `;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    updateUI();
</script>
