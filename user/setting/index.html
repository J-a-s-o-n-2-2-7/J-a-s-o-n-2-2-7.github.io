<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改头像 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* ===== 顶部导航（保留原样） ===== */
        .button-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
        }

        .nav-btn.active {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            cursor: default;
        }

        /* ===== ★★★ 洛谷风格表单行 ★★★ ===== */
        .form-row {
            display: flex;
            align-items: flex-start;
            gap: 32px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f2f5;
        }

        .form-row:last-of-type {
            border-bottom: none;
        }

        .form-label {
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
            min-width: 64px;
            padding-top: 6px;
            flex-shrink: 0;
        }

        .form-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* ===== 头像专用：垂直居中 ===== */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            width: 100%;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #e9ecef;
            display: block;
        }

        .avatar-upload-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            width: auto;
        }

        .avatar-upload-btn:hover {
            background: #c0392b;
        }

        .avatar-upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .avatar-caption {
            font-size: 13px;
            color: #8a9aa8;
            margin-top: 12px;
            text-align: center;
        }

        .avatar-caption strong {
            color: #2c3e50;
            font-weight: 600;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            width: 100%;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 8px;
                padding: 12px 0;
            }

            .form-label {
                min-width: auto;
                padding-top: 0;
            }

            .avatar-preview {
                width: 96px;
                height: 96px;
            }

            .button-bar {
                gap: 12px;
                flex-wrap: wrap;
            }

            .nav-btn {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .avatar-preview {
                width: 80px;
                height: 80px;
            }

            .avatar-upload-btn {
                padding: 6px 24px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>用户设置</h1>

        <!-- 顶部导航 -->
        <div class="button-bar">
            <span class="nav-btn active">个人信息</span>
            <a href="/user/setting/security" class="nav-btn">安全设置</a>
        </div>

        <!-- ===== 头像（垂直居中） ===== -->
        <div class="form-row">
            <span class="form-label">头像</span>
            <div class="form-right">
                <div class="avatar-container">
                    <img id="avatarImg" class="avatar-preview" src="https://placehold.co/120" alt="头像">
                    <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                    <button id="uploadAvatarBtn" class="avatar-upload-btn">选择头像</button>
                </div>
                <p class="avatar-caption">由于缓存问题，需要<strong>强制刷新并清空缓存</strong>才能看到新头像。</p>
                <div id="profileMsg"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const supabase = window._supabaseClient || window.supabase.createClient(
                'https://nosikdfacxkuaxfrmoqn.supabase.co',
                'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
            );
            if (!window._supabaseClient) window._supabaseClient = supabase;

            let currentUser = null;

            const avatarImg = document.getElementById('avatarImg');
            const avatarInput = document.getElementById('avatarInput');
            const uploadBtn = document.getElementById('uploadAvatarBtn');
            const msgDiv = document.getElementById('profileMsg');

            function showMessage(text, type = 'success') {
                msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            }
            function clearMessage() { msgDiv.innerHTML = ''; }

            async function loadUserData() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = '/login';
                    return;
                }
                currentUser = session.user;
                const { data, error } = await supabase
                    .from('profiles')
                    .select('avatar_url')
                    .eq('id', currentUser.id)
                    .single();

                if (!error && data && data.avatar_url) {
                    avatarImg.src = data.avatar_url;
                }
            }

            async function uploadAvatar(file) {
                const fileExt = file.name.split('.').pop();
                const filePath = `${currentUser.id}/avatar_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage
                    .from('avatars')
                    .upload(filePath, file, { upsert: true });
                if (uploadError) throw new Error(`上传失败: ${uploadError.message}`);
                const { data: { publicUrl } } = supabase.storage
                    .from('avatars')
                    .getPublicUrl(filePath);
                const { error: updateError } = await supabase
                    .from('profiles')
                    .update({ avatar_url: publicUrl })
                    .eq('id', currentUser.id);
                if (updateError) throw new Error(`更新头像URL失败: ${updateError.message}`);
                return publicUrl;
            }

            uploadBtn.addEventListener('click', () => avatarInput.click());
            avatarInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件');
                    return;
                }
                uploadBtn.disabled = true;
                uploadBtn.textContent = '上传中…';
                try {
                    const url = await uploadAvatar(file);
                    avatarImg.src = url;
                    showMessage('头像更新成功！请强制刷新查看。', 'success');
                    setTimeout(clearMessage, 4000);
                } catch (err) {
                    showMessage(err.message, 'error');
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '选择头像';
                    avatarInput.value = '';
                }
            });

            loadUserData();
        })();
    </script>
</body>

</html>
