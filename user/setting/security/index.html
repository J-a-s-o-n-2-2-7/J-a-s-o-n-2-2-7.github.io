<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全设置 - 测试版</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
    <div id="content">加载中...</div>
    <script>
        (function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const content = document.getElementById('content');

            supabase.auth.getSession().then(({ data: { session }, error }) => {
                if (error) {
                    content.innerHTML = `<div style="color:red;">错误: ${error.message}</div>`;
                } else if (session) {
                    content.innerHTML = `<div style="color:green;">登录成功！用户: ${session.user.email}</div>`;
                } else {
                    content.innerHTML = `<div>未登录，请 <a href="/login">登录</a></div>`;
                }
            }).catch(err => {
                content.innerHTML = `<div style="color:red;">异常: ${err.message}</div>`;
            });
        })();
    </script>
</body>

</html>
