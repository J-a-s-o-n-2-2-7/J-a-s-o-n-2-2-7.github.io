            height: 20px;

        .main-layout {

            margin: 20px auto;
            padding: 0 20px;
            position: relative;
        }

        .nav-sidebar {
            position: absolute;
            left: 0;
            top: 0;
            width: 64px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

        .nav-sidebar:hover {

        }

        .nav-item,

            padding: 10px 16px;

        }

        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .group-title {
            font-weight: 600;
            color: #5b6e8c;
            background: #f8f9fc;
            border-top: 1px solid #e9ecef;

        }

        .group-title:first-of-type {

        }

        .divider {

        }

        .content-wrapper {
            margin-left: 64px;

        }

        .main-content {
            flex: 2;

        }

        .right-sidebar {
            width: 280px;
            align-self: start;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

        .card-header {

        .contest-item,

        }

        .badge {

            border-radius: 20px;
            font-size: 12px;
            color: #2c3e50;
        }

        #back-to-top {

            background: #c0392b;

        }

            text-decoration: none;
            color: #e74c3c;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ========== 犇犇样式（与主页完全一致） ========== */
        .benben-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            position: relative;
        }

        .benben-avatar {
            flex-shrink: 0;
            width: 40px;
            margin-top: 8px;
        }

        .benben-avatar a {
            display: block;
        }

        .benben-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #f0f2f5;
        }

        .benben-content {
            flex: 1;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 8px 16px;
            position: relative;
        }

        .benben-content::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 16px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 8px 0;
            border-color: transparent #f0f2f5 transparent transparent;
            z-index: 1;
        }

        .benben-content::after {
            content: '';
            position: absolute;
            left: -9px;
            top: 16px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 8px 0;
            border-color: transparent #e9ecef transparent transparent;
            z-index: 0;
        }

        .benben-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: #f0f2f5;
            padding: 6px 12px;
            margin: -12px -16px 12px -16px;
            border-radius: 16px 16px 0 0;
        }

        .benben-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .benben-username {
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }

        .benben-username:hover {
            color: #e74c3c;
        }

        .benben-time {
            font-size: 12px;
            color: #999;
        }

        .benben-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .benben-report-btn,
        .benben-reply-btn,
        .benben-delete {
            background: none;
            border: none;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }

        .benben-report-btn:hover,
        .benben-reply-btn:hover,
        .benben-delete:hover {
            color: #e74c3c;
        }

        .user-tag-display {
            display: inline-block;
            border-radius: 2px;
            padding: 2px 9px;
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            margin: 0;
            cursor: default;
            transition: filter 0.15s;
        }

        .user-tag-display:hover {
            filter: brightness(0.9);
        }

        /* ========== Markdown 内容样式（与主页一致） ========== */
        .benben-text {
            line-height: 1.6;
            word-break: break-word;
            white-space: normal;
        }

        html {
            scroll-behavior: smooth;
        }

        .benben-text h1,
        .benben-text h2,
        .benben-text h3,
        .benben-text h4,
        .benben-text h5,
        .benben-text h6,
        .benben-text .footnote-ref,
        .benben-text .footnotes li,
        .benben-text .footnote-backref {
            scroll-margin-top: 60px;
        }

        .benben-text blockquote.admin-public-comment {
            margin: 1em 0;
            padding: 8px 16px;
            border-left: 4px solid #e74c3c;
            background: #fef9f9;
            border-radius: 0 6px 6px 0;
        }

        .benben-text blockquote.admin-public-comment>p {
            color: #e74c3c;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .benben-text blockquote.admin-public-comment .lfe-marked {
            color: #333;
            line-height: 1.7;
        }

        .benben-text blockquote.admin-public-comment .lfe-marked p:last-child {
            margin-bottom: 0;
        }

        .benben-text blockquote.admin-public-comment .lfe-marked code {
            background: rgba(231, 76, 60, 0.06);
        }

        .benben-text .signature-block {
            border-left: 4px solid #e74c3c;
            padding-left: 16px;
            margin: 0.75em 0;
            font-style: italic;
        }

        .benben-text .signature-name {
            text-align: right;
            color: #e74c3c;
            font-weight: bold;
            font-style: normal;
            margin-top: 4px;
        }

        .benben-text .mermaid {
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 16px;
            margin: 0.75em 0;
            overflow-x: auto;
        }

        .benben-text .toc {
            margin: 1em 0;
            padding: 8px 16px;
            background: #f8f9fa;
            border-left: 4px solid #e74c3c;
        }

        .benben-text .toc ul {
            list-style: none;
            padding-left: 1.5em;
            margin: 0.3em 0;
        }

        .benben-text .toc li {
            margin: 0.2em 0;
        }

        .benben-text .toc a {
            color: #333;
            text-decoration: none;
        }

        .benben-text .toc a:hover {
            color: #e74c3c;
            text-decoration: underline;
        }

        .benben-text ul,
        .benben-text ol {
            margin: 0.75em 0 0.75em 1.5em;
            padding-left: 0.5em;
        }

        .benben-text ul.contains-task-list {
            list-style-type: none;
            padding-left: 0;
            margin-left: 0;
        }

        .benben-text ul.contains-task-list li.task-list-item {
            list-style-type: none;
            display: flex;
            align-items: flex-start;
            gap: 0.5em;
        }

        .benben-text ul.contains-task-list input[type="checkbox"] {
            margin-top: 0.6em;
            flex-shrink: 0;
        }

        .benben-text dl {
            margin: 0.75em 0;
            padding-left: 0.5em;
        }

        .benben-text dt {
            font-weight: bold;
            margin-top: 0.5em;
        }

        .benben-text dd {
            margin-left: 1.5em;
            color: #555;
        }

        .benben-text kbd {
            display: inline-block;
            padding: 2px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f7f7f7;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
            font-size: 0.9em;
            font-family: inherit;
        }

        .benben-text li {
            margin-bottom: 0.5em;
            line-height: 1.6;
        }

        .benben-text h1,
        .benben-text h2 {
            border-bottom: 1px solid #D8D8D8;
            margin: 1em 0;
        }

        .benben-text h3,
        .benben-text h4,
        .benben-text h5,
        .benben-text h6 {
            margin: 1em 0;
        }

        .benben-text p {
            margin: 0 0 1em 0;
        }

        .benben-text blockquote p {
            margin: 0 0 1em 0;
        }

        .benben-text blockquote {
            margin: 1em 0;
            padding: 8px 16px;
            border-left: 4px solid #EEEEEE;
            white-space: normal;
        }

        .benben-text blockquote blockquote {
            margin-right: -0.01em;
        }

        .benben-text code {
            background: #FAFAFA;
            padding: 5px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .benben-text pre {
            background: #FAFAFA;
            padding: 12px 0;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75em 0;
        }

        .benben-text pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 14px;
            white-space: pre-wrap;
            display: block;
        }

        .code-line {
            display: flex;
            align-items: stretch;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
            padding: 0 12px;
        }

        .code-line .line-number {
            display: inline-block;
            min-width: 3ch;
            text-align: right;
            margin-right: 8px;
            white-space: nowrap;
            border-right: 1px solid #D3D4D5;
            padding-right: 8px;
            padding: 0 8px 0 0;
            color: #9D9D9F;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            position: relative;
            z-index: 1;
        }

        .code-line .code-text {
            flex: 1;
            display: inline;
            white-space: pre-wrap;
        }

        .code-highlight-line {
            background-color: #f0f0f0;
        }

        .code-block-wrapper {
            position: relative;
            margin: 0.75em 0;
        }

        .code-filename {
            font-size: 13px;
            color: #555;
            background: #f0f2f5;
            padding: 4px 12px;
            border-radius: 6px 6px 0 0;
            border: 1px solid #e8e8e8;
            border-bottom: none;
            font-family: 'Courier New', monospace;
            display: inline-block;
            margin-top: 0.75em;
            margin-bottom: -1px;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, border-color 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
        }

        .code-block-wrapper:hover .copy-code-btn {
            opacity: 1;
        }

        .copy-code-btn:hover {
            background: #DDD;
            border-color: #ccc;
        }

        .copy-code-btn .svg-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .swal2-toast-copy {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 9999;
            opacity: 0;
            transform: scale(0.8) translateY(-20px);
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-width: 200px;
            box-sizing: border-box;
        }

        .swal2-toast-copy.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .swal2-title-copy {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            line-height: 1.4;
        }

        .benben-text img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0.5em 0;
        }

        .benben-text hr {
            margin: 1em 0;
        }

        .benben-text pre .code-text::-moz-selection,
        .benben-text pre .line-number::-moz-selection {
            background: #E5E5E6;
            color: inherit;
        }

        .benben-text pre .code-text::selection,
        .benben-text pre .line-number::selection {
            background: #E5E5E6;
            color: inherit;
        }

        .benben-text pre .code-highlight-line .code-text::-moz-selection {
            background: #DCDCDD;
            color: inherit;
        }

        .benben-text pre .code-highlight-line .code-text::selection {
            background: #DCDCDD;
            color: inherit;
        }

        .benben-text table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.75em 0;
        }

        .benben-text th,
        .benben-text td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: left;
        }

        .benben-text th {
            background: #F7F7F7;
            font-weight: bold;
        }

        .benben-text .align-center {
            text-align: center;
        }

        .benben-text .align-right {
            text-align: right;
        }

        .benben-text .align-center img {
            display: block;
            margin: 0.5em auto;
        }

        .benben-text .align-right img {
            display: block;
            margin: 0.5em 0 0.5em auto;
        }

        .benben-text details {
            margin: 1em 0;
            padding: 8px 16px;
            border: none;
            border-left: 4px solid #cccccc;
            background: transparent;
        }

        .benben-text details.info {
            border-left-color: #3498DB;
        }

        .benben-text details.success {
            border-left-color: #52C41A;
        }

        .benben-text details.warning {
            border-left-color: #FFC116;
        }

        .benben-text details.error {
            border-left-color: #E74C3C;
        }

        .benben-text summary {
            font-weight: bold;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
        }

        .benben-text summary::-webkit-details-marker {
            display: none;
        }

        .benben-text summary::after {
            content: "▶";
            font-size: 12px;
            color: #888;
            transition: transform 0.2s ease;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .benben-text details[open] summary::after {
            transform: rotate(90deg);
        }

        .benben-text details[open] summary {
            margin-bottom: 0.5em;
        }

        .benben-text details.info summary,
        .benben-text details.info summary::after {
            color: #3498DB;
        }

        .benben-text details.success summary,
        .benben-text details.success summary::after {
            color: #52C41A;
        }

        .benben-text details.warning summary,
        .benben-text details.warning summary::after {
            color: #FFC116;
        }

        .benben-text details.error summary,
        .benben-text details.error summary::after {
            color: #E74C3C;
        }

        /* ========== 详情页特有：回复列表 ========== */
        .reply-section {
            margin-top: 20px;
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }

        .reply-title {
            font-weight: 600;
            font-size: 15px;
            color: #1e293b;
            margin-bottom: 14px;
        }

        /* 回复项：与主页犇犇风格一致，但更紧凑 */
        .reply-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .reply-item:last-child {
            border-bottom: none;
        }

        .reply-avatar {

    <script>
        (function () {

            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';

            // ================================================================

            const md = window.markdownit({

            md.use(window.markdownitDeflist);

            // ================================================================
            // 3. 辅助函数
            // ================================================================
            function escapeHtmlAttr(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            // ================================================================
            // 4. 洛谷扩展预处理（与主页完全一致）
            // ================================================================
            function preprocessLuoguSyntax(text) {
                text = text.replace(/!\[\]\(bilibili:([^)]+)\)/g, function (match, param) {
                    let bvid = '',
                        aid = '',
                        extraParams = '';
                    const queryIndex = param.indexOf('?');
                    let base = param;
                    if (queryIndex !== -1) {
                        base = param.substring(0, queryIndex);
                        extraParams = param.substring(queryIndex);
                        extraParams = extraParams.replace(/^\?/, '&');
                    }
                    const lowerBase = base.toLowerCase();
                    if (lowerBase.startsWith('bv')) {
                        bvid = base;
                    } else if (lowerBase.startsWith('av')) {
                        aid = base.substring(2);
                    } else if (/^\d+$/.test(base)) {
                        aid = base;
                    } else {
                        return match;
                    }
                    let embedUrl = 'https://player.bilibili.com/player.html?';
                    if (bvid) embedUrl += 'bvid=' + bvid;
                    else if (aid) embedUrl += 'aid=' + aid;
                    if (extraParams) embedUrl += extraParams;
                    if (!extraParams.includes('page=')) embedUrl += '&page=1';
                    return '<iframe src="' + embedUrl + '" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="width:100%; height:360px;"></iframe>';
                });
                text = text.replace(/!\[\]\(embed:([^)]+)\)/g, function (match, url) {
                    return '<iframe src="' + url + '" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="width:100%; height:360px;"></iframe>';
                });
                text = text.replace(/\[bilibili\](BV[a-zA-Z0-9]+)\[\/bilibili\]/g, function (m, bvid) {
                    return '<iframe src="https://player.bilibili.com/player.html?bvid=' + bvid +
                        '&page=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="width:100%; height:360px;"></iframe>';
                });
                text = text.replace(/:::align\{center\}\s*([\s\S]*?)\n:::/gm, '%%ALIGN_CENTER%%$1%%ALIGN_END%%');
                text = text.replace(/:::align\{right\}\s*([\s\S]*?)\n:::/gm, '%%ALIGN_RIGHT%%$1%%ALIGN_END%%');
                return text;
            }

            // ================================================================
            // 5. 嵌套折叠框解析（与主页完全一致）
            // ================================================================
            function parseNestedDetails(text) {
                const lines = text.split('\n');
                const output = [];
                const stack = [];
                const roots = [];
                let i = 0;
                while (i < lines.length) {
                    const rawLine = lines[i];
                    const trimmed = rawLine.trim();
                    let startMatch = null;
                    if (trimmed.startsWith(':::')) {
                        let colonsCount = 0;
                        while (colonsCount < trimmed.length && trimmed[colonsCount] === ':') colonsCount++;
                        if (colonsCount >= 3) {
                            const rest = trimmed.slice(colonsCount).trim();
                            const typeMatch = rest.match(/^([a-zA-Z0-9]+)/);
                            if (typeMatch) {
                                const type = typeMatch[1];
                                let title = '',
                                    openAttr = '';
                                let remaining = rest.slice(type.length).trim();
                                const titleMatch = remaining.match(/^\[([^\]]*)\]/);
                                if (titleMatch) {
                                    title = titleMatch[1];
                                    remaining = remaining.slice(titleMatch[0].length).trim();
                                }
                                if (remaining.startsWith('{open}')) {
                                    openAttr = ' open';
                                }
                                if (!remaining || remaining === '{open}') {
                                    startMatch = { colonsCount, type, title, openAttr };
                                }
                            }
                        }
                    }
                    if (startMatch) {
                        if (!['info', 'success', 'warning', 'error'].includes(startMatch.type)) {
                            if (stack.length === 0) {
                                output.push(rawLine);
                            } else {
                                stack[stack.length - 1].contentLines.push(rawLine);
                            }
                            i++;
                            continue;
                        }
                        const node = {
                            type: startMatch.type,
                            title: startMatch.title,
                            openAttr: startMatch.openAttr,
                            colonsCount: startMatch.colonsCount,
                            contentLines: [],
                            children: []
                        };
                        stack.push(node);
                        i++;
                        continue;
                    }
                    let endMatch = null;
                    if (trimmed.startsWith(':::')) {
                        let colonsCount = 0;
                        while (colonsCount < trimmed.length && trimmed[colonsCount] === ':') colonsCount++;
                        if (colonsCount >= 3 && trimmed.slice(colonsCount).trim() === '') {
                            endMatch = { colonsCount };
                        }
                    }
                    if (endMatch && stack.length > 0) {
                        const top = stack[stack.length - 1];
                        if (endMatch.colonsCount === top.colonsCount) {
                            const node = stack.pop();
                            if (stack.length === 0) {
                                const idx = roots.length;
                                roots.push(node);
                                output.push('%%DETAILS_ROOT_' + idx + '%%');
                            } else {
                                stack[stack.length - 1].children.push(node);
                            }
                            i++;
                            continue;
                        }
                    }
                    if (stack.length === 0) {
                        output.push(rawLine);
                    } else {
                        stack[stack.length - 1].contentLines.push(rawLine);
                    }
                    i++;
                }
                while (stack.length > 0) {
                    const node = stack.pop();
                    if (stack.length === 0) {
                        const idx = roots.length;
                        roots.push(node);
                        output.push('%%DETAILS_ROOT_' + idx + '%%');
                    } else {
                        stack[stack.length - 1].children.push(node);
                    }
                }
                return { roots, output: output.join('\n') };
            }

            // ================================================================
            // 6. 核心渲染函数 renderContent（与主页完全一致）
            // ================================================================
            function renderContent(rawText, mentionMap, hasSpecialPrivilege, username) {
                if (!rawText) return '';
                rawText = rawText
                    .replace(/&gt;/g, '>')
                    .replace(/&lt;/g, '<')
                    .replace(/&quot;/g, '"')
                    .replace(/&#39;/g, "'")
                    .replace(/&amp;/g, '&');

                const { roots, output } = parseNestedDetails(rawText);
                rawText = output;
                const detailRoots = roots;

                const mermaidBlocks = [];
                rawText = rawText.replace(/```mermaid\s*([\s\S]*?)```/g, function (match, code) {
                    const idx = mermaidBlocks.length;
                    mermaidBlocks.push(code.trim());
                    return '%%MERMAID_' + idx + '%%';
                });

                const lines = rawText.split('\n');
                const blocks = [];
                let processedLines = [];
                let inFence = false;
                let fenceContent = [];
                let blockIdx = 0;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const prefixMatch = line.match(/^(>\s*)+/);
                    const prefix = prefixMatch ? prefixMatch[0] : '';
                    const cleanLine = line.replace(/^(>\s?)+/, '');
                    if (!inFence && cleanLine.startsWith('```')) {
                        inFence = true;
                        fenceContent = [cleanLine];
                        processedLines.push(prefix + '%%BLOCK' + blockIdx + '%%');
                    } else if (inFence) {
                        fenceContent.push(cleanLine);
                        if (cleanLine.trim() === '```') {
                            inFence = false;
                            const content = fenceContent.join('\n');
                            const firstLine = fenceContent[0] || '';
                            let lang = '',
                                filename = '';
                            if (firstLine.startsWith('```')) {
                                const params = firstLine.slice(3).trim();
                                const parts = params.split(/\s+/);
                                const firstPart = parts[0] || '';
                                if (firstPart.includes(':')) {
                                    const split = firstPart.split(':');
                                    lang = split[0];
                                    filename = split.slice(1).join(':');
                                } else {
                                    lang = firstPart;
                                }
                            }
                            blocks.push({ type: 'fence', content, filename, lang });
                            blockIdx++;
                        }
                    } else {
                        processedLines.push(line);
                    }
                }
                if (inFence && fenceContent.length > 0) {
                    const content = fenceContent.join('\n');
                    const firstLine = fenceContent[0] || '';
                    let lang = '',
                        filename = '';
                    if (firstLine.startsWith('```')) {
                        const params = firstLine.slice(3).trim();
                        const parts = params.split(/\s+/);
                        const firstPart = parts[0] || '';
                        if (firstPart.includes(':')) {
                            const split = firstPart.split(':');
                            lang = split[0];
                            filename = split.slice(1).join(':');
                        } else {
                            lang = firstPart;
                        }
                    }
                    blocks.push({ type: 'fence', content, filename, lang });
                    blockIdx++;
                }
                let processed = processedLines.join('\n');

                processed = processed.replace(/`([^`]+)`/g, function (match, code) {
                    if (/^%%BLOCK\d+%%$/.test(match)) return match;
                    const idx = blocks.length;
                    const safeCode = code.replace(/\n/g, '&#10;');
                    blocks.push({ type: 'inline', content: safeCode });
                    return '%%BLOCK' + idx + '%%';
                });

                processed = preprocessLuoguSyntax(processed);

                processed = processed.replace(/\$\$([\s\S]+?)\$\$/g, function (match, math) {
                    let realMath = math.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                    try {
                        return '<div style="text-align:center;margin:8px 0;">' + katex.renderToString(realMath, {
                            displayMode: true,
                            throwOnError: false
                        }) + '</div>';
                    } catch (e) { return match; }
                });
                processed = processed.replace(/\$([^$]+?)\$/g, function (match, math) {
                    let realMath = math.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                    try {
                        return katex.renderToString(realMath, { throwOnError: false });
                    } catch (e) { return match; }
                });

                processed = processed.replace(/!\[([^\]]*)\]\(([^)]+?)\s*=\s*(\d+)x(\d*)\)/g, function (match, alt, url, width,
                    height) {
                    var style = 'width:' + width + 'px;' + (height ? ' height:' + height + 'px;' : '');
                    return '<img alt="' + escapeHtmlAttr(alt) + '" src="' + escapeHtmlAttr(url) + '" style="' + style + '">';
                });
                processed = processed.replace(/!\[([^\]]*)\]\(([^)]+?)\s*=\s*(\d+)x\)/g, function (match, alt, url, width) {
                    return '<img alt="' + escapeHtmlAttr(alt) + '" src="' + escapeHtmlAttr(url) +
                        '" style="width:' + width + 'px; height:auto;">';
                });
                processed = processed.replace(/!\[([^\]]*)\]\(([^)]+?)\s*=\s*x(\d+)\)/g, function (match, alt, url, height) {
                    return '<img alt="' + escapeHtmlAttr(alt) + '" src="' + escapeHtmlAttr(url) +
                        '" style="height:' + height + 'px; width:auto;">';
                });

                processed = processed.replace(/~~([^~]+)~~/g, '<del>$1</del>');
                processed = processed.replace(/==([^=]+)==/g, '<mark>$1</mark>');
                processed = processed.replace(/\+\+([^+]+)\+\+/g, '<ins>$1</ins>');
                processed = processed.replace(/(?<![:\-])--([^-]+)--(?![:\-])/g, '<small>$1</small>');
                processed = processed.replace(/(?<![\[\^])\^([^^]+)\^(?![\]])/g, '<sup>$1</sup>');
                processed = processed.replace(/~([^~]+)~/g, '<sub>$1</sub>');

                processed = processed.replace(/\[\[TOC\]\]/g, '%%TOC_PLACEHOLDER%%');
                processed = processed.replace(/\[\[([^\]]+)\]\]/g, '<kbd>$1</kbd>');
                processed = processed.replace(/%%TOC_PLACEHOLDER%%/g, '[[TOC]]');

                if (hasSpecialPrivilege) {
                    processed = processed.replace(/\[admin\]([\s\S]*?)\[\/admin\]/g, function (match, content) {
                        return '<blockquote class="admin-public-comment"><p>管理组提示：</p><div class="lfe-marked-wrap"><div class="lfe-marked">' +
                            content + '</div></div></blockquote>';
                    });
                    processed = processed.replace(/\{rainbow\}([\s\S]*?)\{rainbow\}/g, function (match, content) {
                        var chars = content.split('');
                        var len = chars.length;
                        if (len === 0) return '';
                        var startHue = 0,
                            endHue = 300;
                        var result = '';
                        for (var i = 0; i < len; i++) {
                            var hue = startHue + (endHue - startHue) * (i / (len - 1));
                            result += '<span style="color:hsl(' + hue + ', 100%, 50%);">' + chars[i] + '</span>';
                        }
                        return '<span style="font-weight:bold;">' + result + '</span>';
                    });
                    processed = processed.replace(/\[sign\]([\s\S]*?)\[\/sign\]/g, function (match, content) {
                        var uname = username || '用户';
                        return '<div class="signature-block">' + content +
                            '<div class="signature-name">—— ✨ Jason227 高贵的用户：' + escapeHtmlAttr(uname) +
                            '</div></div>';
                    });
                }

                var html = md.render(processed);

                function generateTOC(htmlText) {
                    var headerRegex = /<h([1-6])(?:\s+id="([^"]*)")?>(.*?)<\/h\1>/g;
                    var headerMatches = [];
                    var tempMatch;
                    var idCounter = 0;
                    while ((tempMatch = headerRegex.exec(htmlText)) !== null) {
                        var level = parseInt(tempMatch[1]);
                        var id = tempMatch[2] || 'toc-' + idCounter++;
                        var text = tempMatch[3];
                        headerMatches.push({
                            level: level, id: id, text: text, startIndex: tempMatch.index,
                            endIndex: tempMatch.index + tempMatch[0].length
                        });
                    }
                    var newHtml = htmlText;
                    for (var k = 0; k < headerMatches.length; k++) {
                        var item = headerMatches[k];
                        if (!item.id.startsWith('toc-')) continue;
                        var oldTag = htmlText.substring(item.startIndex, item.endIndex);
                        var newTag = oldTag.replace(/<h([1-6])>/, '<h$1 id="' + item.id + '">');
                        newHtml = newHtml.replace(oldTag, newTag);
                    }
                    var finalHeaderRegex = /<h([1-6])(?:\s+id="([^"]*)")?>(.*?)<\/h\1>/g;
                    var finalMatches = [];
                    var m;
                    while ((m = finalHeaderRegex.exec(newHtml)) !== null) {
                        finalMatches.push({ level: parseInt(m[1]), id: m[2] || 'toc-' + idCounter++, text: m[3] });
                    }
                    if (finalMatches.length === 0) return newHtml;
                    var tocHtml = '<div class="toc"><ul>';
                    var currentLevel = 0;
                    for (var i = 0; i < finalMatches.length; i++) {
                        var item = finalMatches[i];
                        var level = item.level;
                        var id = item.id;
                        var text = item.text;
                        if (level > currentLevel) {
                            for (var j = 0; j < level - currentLevel; j++) {
                                tocHtml += '<ul>';
                            }
                        } else if (level < currentLevel) {
                            for (var j = 0; j < currentLevel - level; j++) {
                                tocHtml += '</ul>';
                            }
                        }
                        tocHtml += '<li><a href="#' + id + '">' + text + '</a></li>';
                        currentLevel = level;
                    }
                    while (currentLevel > 1) {
                        tocHtml += '</ul>';
                        currentLevel--;
                    }
                    tocHtml += '</ul></div>';
                    newHtml = newHtml.replace(/\[\[TOC\]\]/g, tocHtml);
                    return newHtml;
                }
                html = generateTOC(html);

                html = html.replace(/%%MERMAID_(\d+)%%/g, function (match, idx) {
                    var code = mermaidBlocks[parseInt(idx)];
                    if (!code) return match;
                    return '<div class="mermaid">' + code + '</div>';
                });

                function renderLatex(text) {
                    if (!text) return '';
                    text = text.replace(/\$\$([\s\S]+?)\$\$/g, function (match, math) {
                        var realMath = math.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                        try {
                            return '<div style="text-align:center;margin:8px 0;">' + katex.renderToString(realMath, {
                                displayMode: true,
                                throwOnError: false
                            }) + '</div>';
                        } catch (e) { return match; }
                    });
                    text = text.replace(/\$([^$]+?)\$/g, function (match, math) {
                        var realMath = math.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                        try {
                            return katex.renderToString(realMath, { throwOnError: false });
                        } catch (e) { return match; }
                    });
                    return text;
                }

                function renderDetailsNode(node) {
                    var content = node.contentLines.join('\n');
                    content = renderLatex(content);
                    var renderedContent = md.render(content);
                    var title = renderLatex(node.title);
                    var renderedTitle = md.renderInline(title);
                    var childrenHtml = '';
                    for (var i = 0; i < node.children.length; i++) {
                        childrenHtml += renderDetailsNode(node.children[i]);
                    }
                    return '<details class="' + escapeHtmlAttr(node.type) + '"' + node.openAttr +
                        '><summary>' + renderedTitle + '</summary>' + renderedContent + childrenHtml + '</details>';
                }
                html = html.replace(/%%DETAILS_ROOT_(\d+)%%/g, function (match, idx) {
                    var node = detailRoots[parseInt(idx)];
                    if (!node) return match;
                    return renderDetailsNode(node);
                });

                html = html.replace(/%%ALIGN_CENTER%%([\s\S]*?)%%ALIGN_END%%/g, function (match, content) {
                    var rendered = md.render(content);
                    return '<div class="align-center">' + rendered + '</div>';
                });
                html = html.replace(/%%ALIGN_RIGHT%%([\s\S]*?)%%ALIGN_END%%/g, function (match, content) {
                    var rendered = md.render(content);
                    return '<div class="align-right">' + rendered + '</div>';
                });

                html = html.replace(/“/g, '"').replace(/”/g, '"');

                html = html.replace(/%%BLOCK(\d+)%%/g, function (match, idx) {
                    var block = blocks[parseInt(idx)];
                    if (!block) return '';
                    if (block.type === 'inline') {
                        return '<code>' + escapeHtml(block.content) + '</code>';
                    }
                    var lines = block.content.split('\n');
                    var firstLine = lines[0];
                    var lang = '',
                        showLineNumbers = false,
                        showHighlight = false,
                        highlightLines = null;
                    if (firstLine.startsWith('```')) {
                        var params = firstLine.slice(3).trim();
                        var parts = params.split(/\s+/);
                        lang = parts[0] || '';
                        if (params.includes('line-numbers')) showLineNumbers = true;
                        var linesMatch = params.match(/lines=(\d+)-(\d+)/);
                        if (linesMatch) {
                            showHighlight = true;
                            highlightLines = { start: parseInt(linesMatch[1]), end: parseInt(linesMatch[2]) };
                        }
                    }
                    var codeContent = lines.slice(1, -1).join('\n');
                    var titleHtml = '';
                    if (block.filename) {
                        titleHtml = '<div class="code-filename">' + escapeHtml(block.filename) + '</div>';
                    }
                    var codeHtml = '';
                    var codeLines = codeContent.split('\n');
                    if (codeLines.length > 0 && codeLines[codeLines.length - 1] === '') codeLines.pop();
                    var totalLines = codeLines.length;
                    var maxDigits = String(totalLines).length;
                    codeHtml = '<pre><code>';
                    for (var i = 0; i < totalLines; i++) {
                        var lineNum = i + 1;
                        var lineContent = codeLines[i] || ' ';
                        var lineClass = '';
                        if (showHighlight && highlightLines && lineNum >= highlightLines.start && lineNum <= highlightLines
                            .end) {
                            lineClass = ' code-highlight-line';
                        }
                        codeHtml += '<div class="code-line' + lineClass + '">';
                        if (showLineNumbers) {
                            codeHtml += '<span class="line-number" style="min-width:' + (maxDigits + 1) +
                                'ch;">' + lineNum + '</span>';
                        }
                        codeHtml += '<span class="code-text">' + escapeHtml(lineContent) + '</span>';
                        codeHtml += '</div>';
                    }
                    codeHtml += '</code></pre>';
                    return titleHtml +
                        '<div class="code-block-wrapper">' +
                        '<button class="copy-code-btn" data-copy-btn title="复制代码">' +
                        '<svg class="svg-icon" viewBox="0 0 448 512" aria-hidden="true" width="16" height="16">' +
                        '<path d="M192 0c-35.3 0-64 28.7-64 64l0 256c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-200.6c0-17.4-7.1-34.1-19.7-46.2L370.6 17.8C358.7 6.4 342.8 0 326.3 0L192 0zM64 128c-35.3 0-64 28.7-64 64L0 448c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-16-64 0 0 16-192 0 0-256 16 0 0-64-16 0z"/>' +
                        '</svg>' +
                        '</button>' +
                        codeHtml +
                        '</div>';
                });

                html = html.replace(/@([\u4e00-\u9fa5a-zA-Z0-9_.-]+)/g, function (match, username) {
                    var uid = mentionMap && mentionMap[username];
                    if (uid) return '@<a href="/user/' + uid +
                        '" class="mention-link" style="color:#e74c3c; text-decoration:none;">' + escapeHtmlAttr(username) +
                        '</a>';
                    return match;
                });

                html = html.replace(/<p><\/p>\s*$/, '').replace(/<br\s*\/?>\s*$/, '').trim();
                html = html.replace(/<p>\s*<\/p>/g, '').replace(/:\s*$/gm, '');

                return DOMPurify.sanitize(html, {
                    ADD_TAGS: ['iframe', 'section', 'ol', 'li', 'sup', 'sub', 'mark', 'ins', 'small', 'kbd', 'del',
                        'div', 'details', 'summary'
                    ],
                    ADD_ATTR: ['src', 'width', 'height', 'scrolling', 'border', 'frameborder', 'framespacing',
                        'allowfullscreen', 'style', 'id', 'class', 'href', 'open'
                    ]
                });
            }

            // ================================================================
            // 7. 复制功能（与主页完全一致）
            // ================================================================
            function showCopyToast() {
                var toast = document.querySelector('.swal2-toast-copy');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.className = 'swal2-toast-copy';
                    toast.innerHTML =
                        '<svg class="success-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#a5dc86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg><h2 class="swal2-title-copy">Contents copied!</h2>';
                    document.body.appendChild(toast);
                } else {
                    toast.classList.remove('show');
                    void toast.offsetWidth;
                }
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(function () {
                    toast.classList.remove('show');
                }, 2000);
            }

            function copyCode(btn) {
                var wrapper = btn.closest('.code-block-wrapper');
                if (!wrapper) return;
                var pre = wrapper.querySelector('pre');
                if (!pre) return;
                var codeTexts = pre.querySelectorAll('.code-text');
                var code = '';
                codeTexts.forEach(function (el) {
                    code += el.textContent + '\n';
                });
                code = code.replace(/\n$/, '');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(code).then(function () {
                        showCopyToast();
                    }).catch(function () {
                        fallbackCopy(code);
                    });
                } else {
                    fallbackCopy(code);
                }
            }

            function fallbackCopy(text) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showCopyToast();
                } catch (e) {
                    alert('复制失败，请手动复制');
                }
                document.body.removeChild(textarea);
            }

            document.addEventListener('click', function (e) {
                var btn = e.target.closest('.copy-code-btn');
                if (btn) {
                    e.preventDefault();
                    copyCode(btn);
                }
            });

            // ================================================================
            // 8. 详情页业务逻辑
            // ================================================================
            var currentProfile = null;
            var currentUser = null;
            var detailContainer = document.getElementById('benbenDetailContent');

            function getBenbenId() {
                var path = window.location.pathname;
                var match = path.match(/\/benben\/feed\/(\d+)/);
                if (match) return parseInt(match[1]);
                var urlParams = new URLSearchParams(window.location.search);
                var idParam = urlParams.get('id');
                if (idParam) return parseInt(idParam);
                return null;
            }

            function formatTime(timestamp) {
                var date = new Date(timestamp);
                var year = date.getFullYear();
                var month = String(date.getMonth() + 1).padStart(2, '0');
                var day = String(date.getDate()).padStart(2, '0');
                var hours = String(date.getHours()).padStart(2, '0');
                var minutes = String(date.getMinutes()).padStart(2, '0');
                return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
            }

            async function getProfile(userId) {
                var { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username, is_admin, special_privilege, username_color, user_tag')
                    .eq('id', userId)
                    .single();
                if (error) return null;
                return data;
            }

            async function buildMentionMap(contents) {
                var mentionSet = new Set();
                contents.forEach(function (text) {
                    var matches = text.match(/@([\u4e00-\u9fa5a-zA-Z0-9_.-]+)/g);
                    if (matches) {
                        matches.forEach(function (m) {
                            mentionSet.add(m.slice(1));
                        });
                    }
                });
                if (mentionSet.size === 0) return {};
                var usernames = Array.from(mentionSet);
                var { data, error } = await supabase
                    .from('profiles')
                    .select('username, user_number')
                    .in('username', usernames);
                if (error || !data) return {};
                var map = {};
                data.forEach(function (u) { map[u.username] = u.user_number; });
                return map;
            }

            // 未读消息计数
            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    var { count, error } = await supabase
                        .from('notifications')
                        .select('*', { count: 'exact', head: true })
                        .eq('user_number', currentProfile.user_number)
                        .eq('read', false);
                    if (!error && count !== null) {
                        var badge = document.getElementById('bell-badge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count > 99 ? '99+' : count;
                                badge.style.display = 'inline-flex';
                            } else {
                                badge.style.display = 'none';
                            }
                        }
                    }
                } catch (err) { console.error(err); }
            }

            // ================================================================
            // 9. 核心：渲染详情（使用与主页一致的风格）
            // ================================================================
            async function loadBenbenDetail() {
                var id = getBenbenId();
                if (!id) {
                    detailContainer.innerHTML = '<div class="empty-message">❌ 无效的犇犇链接</div>';
                    return;
                }

                try {
                    var { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        currentProfile = await getProfile(session.user.id);
                        currentUser = session.user;
                        updateTopbarAndBell();
                    } else {
                        currentProfile = null;
                        currentUser = null;
                        updateTopbarAndBell();
                    }

                    var { data: benben, error: benbenError } = await supabase
                        .from('benben')
                        .select('*, profiles:user_number (username, is_admin, username_color, user_tag)')
                        .eq('id', id)
                        .eq('is_deleted', false)
                        .single();

                    if (benbenError || !benben) {
                        detailContainer.innerHTML = '<div class="empty-message">😕 该犇犇不存在或已被删除</div>';
                        return;
                    }

                    var { data: replies, error: repliesError } = await supabase
                        .from('benben')
                        .select('*, profiles:user_number (username, is_admin, username_color, user_tag)')
                        .eq('reply_to', id)
                        .eq('is_deleted', false)
                        .order('created_at', { ascending: true });

                    if (repliesError) console.error('加载回复失败:', repliesError);

                    var allContents = [benben.content];
                    if (replies) {
                        replies.forEach(function (r) { allContents.push(r.content); });
                    }
                    var mentionMap = await buildMentionMap(allContents);

                    renderBenbenDetail(benben, replies || [], mentionMap);

                    if (typeof mermaid !== 'undefined') {
                        mermaid.initialize({
                            theme: 'default',
                            themeVariables: {
                                background: '#ffffff',
                                primaryColor: '#e74c3c',
                                primaryTextColor: '#333',
                                primaryBorderColor: '#ccc',
                                lineColor: '#666',
                                secondaryColor: '#f0f2f5',
                                tertiaryColor: '#f9f9f9'
                            },
                            startOnLoad: false
                        });
                        setTimeout(function () {
                            mermaid.run({
                                nodes: document.querySelectorAll('.mermaid')
                            }).catch(function (err) {
                                console.warn('Mermaid 渲染失败:', err);
                            });
                        }, 80);
                    }

                } catch (err) {
                    console.error(err);
                    detailContainer.innerHTML = '<div class="empty-message">💥 加载失败，请刷新重试</div>';
                }
            }

            // ================================================================
            // 10. 渲染详情（使用与主页一致的 HTML 结构和样式）
            // ================================================================
            function renderBenbenDetail(benben, replies, mentionMap) {

                var userNumber = benben.user_number;
                var timeStr = formatTime(benben.created_at);
                var hasSpecial = currentProfile?.special_privilege || false;
                var currentUsername = currentProfile?.username || '用户';

                var prof = benben.profiles || {};
                var isAdmin = prof.is_admin || false;
                var userTag = prof.user_tag || '';
                var color = prof.username_color || (isAdmin ? '#9b59b6' : '#333');

                // 标签
                var labelHtml = '';
                if (userTag) {
                    labelHtml = '<span class="user-tag-display" style="background-color: ' + color + ';">' + escapeHtml(
                        userTag) + '</span>';

                    labelHtml = '<span class="user-tag-display" style="background-color: ' + color + ';">管理员</span>';
                }

                // 主犇犇内容
                var contentHtml = renderContent(benben.content, mentionMap, hasSpecial, currentUsername);

                // 构建主犇犇 HTML（与主页 .benben-item 结构一致）
                var mainHtml =
                    '<div class="benben-item">' +
                    '<div class="benben-avatar">' +
                    '<a href="/user/' + userNumber + '">' +
                    '<img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 fill=%22%23e74c3c%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2216%22%3E' +
                    (username[0] || 'U').toUpperCase() +
                    '%3C/text%3E%3C/svg%3E" alt="' + escapeHtmlAttr(username) + '">' +
                    '</a>' +
                    '</div>' +
                    '<div class="benben-content">' +

                    '<div class="benben-user-info">' +

                    escapeHtml(username) + '</a>' +
                    labelHtml +
                    '<span class="benben-time">' + timeStr + '</span>' +
                    '</div>' +
                    '<div class="benben-actions">' +
                    '<button class="benben-report-btn" data-id="' + benben.id + '">举报</button>' +
                    (currentProfile && currentProfile.user_number === userNumber ?

                    '</div>' +
                    '</div>' +
                    '<div class="benben-text" data-raw="' + escapeHtmlAttr(benben.content) + '" data-mention-map=\'' +
                    escapeHtmlAttr(JSON.stringify(mentionMap)) + '\'>' +

                    '</div>' +
                    '</div>' +
                    '</div>';

                // ---- 回复列表 ----
                var repliesHtml = '';
                if (replies.length > 0) {
                    var replyItems = replies.map(function (reply) {

                            rLabelHtml = '<span class="user-tag-display" style="background-color: ' + rColor +
                                ';">管理员</span>';
