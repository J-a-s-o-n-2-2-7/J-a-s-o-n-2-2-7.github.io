<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>页面跳转中...</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: system-ui;
            text-align: center;
            padding: 50px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        (function () {
            var path = window.location.pathname;

            // 1. 犇犇永久链接：/benben/feed/数字
            var benbenMatch = path.match(/^\/benben\/feed\/(\d+)/);
            if (benbenMatch) {
                fetch('/benben/feed/index.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载犇犇详情页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', path);
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法获取犇犇详情页，请稍后再试。</p>';
                    });
                return;
            }

            // 2. 用户主页：/user/数字
            var userMatch = path.match(/^\/user\/(\d+)/);
            if (userMatch) {
                var userId = userMatch[1];
                fetch('/user/index.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载用户主页模板');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/user/' + userId);
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法获取用户主页，请稍后再试。</p>';
                    });
                return;
            }

            // 2.5 帖子详情：/discuss/数字 → /post-detail.html
            var discussMatch = path.match(/^\/discuss\/(\d+)/);
            if (discussMatch) {
                var postId = discussMatch[1];
                // 跳转到根目录下的帖子详情页，并带上 ID 参数
                window.location.href = '/post.html?id=' + postId;
                return;
            }

            // ===== 新增：帮助文档路由（管理后台） =====

            // 3. 编辑帮助文档：/admin/help/数字/edit
            var helpEditMatch = path.match(/^\/admin\/help\/(\d+)\/edit$/);
            if (helpEditMatch) {
                var helpId = helpEditMatch[1];
                fetch('/edit.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载编辑页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/admin/help/' + helpId + '/edit');
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载编辑页，请稍后再试。</p>';
                    });
                return;
            }

            // 4. 新建帮助文档：/admin/help/new
            if (path === '/admin/help/new') {
                fetch('/edit.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载编辑页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/admin/help/new');
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载编辑页，请稍后再试。</p>';
                    });
                return;
            }

            // 5. 帮助列表：/admin/help
            if (path === '/admin/help') {
                fetch('/index.html')
                    .then(function (response) {
                        if (!response.ok) throw new Error('无法加载列表页');
                        return response.text();
                    })
                    .then(function (html) {
                        document.open();
                        document.write(html);
                        document.close();
                        history.replaceState({}, '', '/admin/help');
                    })
                    .catch(function (error) {
                        console.error(error);
                        document.body.innerHTML = '<h1>加载失败</h1><p>无法加载列表页，请稍后再试。</p>';
                    });
                return;
            }

            // 6. 其他路径显示 404
            document.body.innerHTML = `
                <h1>404 - 页面未找到</h1>
                <p>您访问的页面不存在，请检查网址。</p>
                <p><a href="/">返回首页</a></p>
            `;
        })();
    </script>
</head>

<body>
    <div class="loader"></div>
    <p>正在加载...</p>
</body>

</html>
