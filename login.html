<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 28px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 16px;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 8px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .footer-links a {
            color: #667eea;
            text-decoration: none;
        }

        .turnstile-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>欢迎回来</h1>
        <div class="sub">登录以访问更多内容</div>
        <div class="input-group">
            <input type="email" id="loginEmail" placeholder="邮箱" autocomplete="email">
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password">
        </div>
        <div class="turnstile-wrapper">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADcNcP2JrYuEkEhx" data-theme="light"></div>
        </div>
        <button id="loginBtn">登录</button>
        <div id="loginMsg" class="message"></div>
        <div class="footer-links">
            还没有账号？ <a href="register.html">立即注册</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginBtn = document.getElementById('loginBtn');
        const loginMsg = document.getElementById('loginMsg');

        // 检查是否已登录，若已登录则跳转回主页
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                window.location.href = '/';
            }
        })();

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                loginMsg.innerHTML = '<div class="message error">请填写邮箱和密码</div>';
                return;
            }
            const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!captchaToken) {
                loginMsg.innerHTML = '<div class="message error">请完成验证码验证</div>';
                return;
            }
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            const { error } = await sb.auth.signInWithPassword({
                email, password,
                options: { captchaToken }
            });
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
            if (error) {
                loginMsg.innerHTML = `<div class="message error">${error.message}</div>`;
            } else {
                loginMsg.innerHTML = '<div class="message success">登录成功！正在跳转...</div>';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            }
        }
        loginBtn.addEventListener('click', handleLogin);
    </script>
</body>

</html>
