<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason227 · 个人主页</title>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #1e2a3e;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 2rem;
            border-left: 4px solid #e74c3c;
            padding-left: 1rem;
        }

        /* 两列布局 */
        .flex-row {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .auth-section {
            flex: 1;
            min-width: 260px;
        }

        .content-section {
            flex: 2;
            min-width: 260px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231,76,60,0.2);
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        button:hover {
            background: #c0392b;
        }

        .logout-btn {
            background: #7f8c8d;
            margin-top: 1rem;
        }

        .logout-btn:hover {
            background: #5d6e7e;
        }

        .message {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        hr {
            margin: 1.5rem 0;
            border: 0;
            height: 1px;
            background: #e2e8f0;
        }

        .user-info {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: #7f8c8d;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>✨ Jason227 的个人空间</h1>
        <div class="sub">算法竞赛 · 前端开发 · 技术随笔</div>

        <div class="flex-row">
            <!-- 左侧：登录/注册面板（默认显示） -->
            <div class="auth-section" id="authPanel">
                <h3>🔐 注册 / 登录</h3>
                <!-- 注册表单 -->
                <div class="form-group">
                    <input type="email" id="signupEmail" placeholder="邮箱 (例如: user@example.com)">
                </div>
                <div class="form-group">
                    <input type="password" id="signupPassword" placeholder="密码 (至少6位)">
                </div>
                <button id="signupBtn">注册新账号</button>
                <div id="signupMessage" class="message"></div>

                <hr>

                <!-- 登录表单 -->
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="邮箱">
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="密码">
                </div>
                <button id="loginBtn">登录</button>
                <div id="loginMessage" class="message"></div>
            </div>

            <!-- 右侧：用户信息及登出（登录后显示） -->
            <div class="content-section" id="userPanel" style="display: none;">
                <div class="user-info" id="userInfo">
                    <p>🎉 欢迎回来，<strong id="userEmail"></strong>！</p>
                    <p>✨ 你已经成功登录，可以开始自由探索～</p>
                </div>
                <button id="logoutBtn" class="logout-btn">🚪 登出</button>
                <!-- 这里可以放你的网站主要内容，比如文章列表、项目展示等 -->
                <div style="margin-top: 2rem;">
                    <h3>📝 近期文章</h3>
                    <ul>
                        <li>《从零搭建 GitHub Pages 全记录》</li>
                        <li>《动态规划入门：线性DP详解》</li>
                        <li>《如何用 Jekyll 打造个人博客》</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <footer>
        © 2026 Jason227 · 由 Supabase 提供认证服务 · <a href="#" style="color:#e74c3c;">关于本站</a>
    </footer>
</div>

<script>
    // ======================== 请将以下两行替换为你自己的信息 ========================
    const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';     // 你的 Project URL
    const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'; // 你的 Publishable key
    // ===========================================================================

    // 初始化 Supabase 客户端
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM 元素
    const authPanel = document.getElementById('authPanel');
    const userPanel = document.getElementById('userPanel');
    const userEmailSpan = document.getElementById('userEmail');

    // 辅助显示消息
    function showMessage(elementId, message, isError = true) {
        const msgDiv = document.getElementById(elementId);
        msgDiv.textContent = message;
        msgDiv.className = `message ${isError ? 'error' : 'success'}`;
        setTimeout(() => {
            msgDiv.textContent = '';
            msgDiv.className = 'message';
        }, 4000);
    }

    // 更新 UI：根据登录状态显示不同面板
    async function updateUI() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            // 已登录
            authPanel.style.display = 'none';
            userPanel.style.display = 'block';
            userEmailSpan.textContent = session.user.email;
        } else {
            // 未登录
            authPanel.style.display = 'block';
            userPanel.style.display = 'none';
        }
    }

    // 注册
    async function signUp() {
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        if (!email || !password) {
            showMessage('signupMessage', '请填写邮箱和密码', true);
            return;
        }
        if (password.length < 6) {
            showMessage('signupMessage', '密码长度至少6位', true);
            return;
        }

        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
        });

        if (error) {
            showMessage('signupMessage', error.message, true);
        } else {
            showMessage('signupMessage', '注册成功！请查收确认邮件（可能被归类为垃圾箱）。确认后即可登录。', false);
            // 清空密码框
            document.getElementById('signupPassword').value = '';
        }
    }

    // 登录
    async function signIn() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) {
            showMessage('loginMessage', '请填写邮箱和密码', true);
            return;
        }

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            showMessage('loginMessage', error.message, true);
        } else {
            showMessage('loginMessage', '登录成功！正在跳转...', false);
            setTimeout(() => {
                updateUI();
                // 清空登录框密码
                document.getElementById('loginPassword').value = '';
            }, 1000);
        }
    }

    // 登出
    async function signOut() {
        const { error } = await supabase.auth.signOut();
        if (error) {
            alert('登出失败：' + error.message);
        } else {
            updateUI();
        }
    }

    // 绑定按钮事件
    document.getElementById('signupBtn').addEventListener('click', signUp);
    document.getElementById('loginBtn').addEventListener('click', signIn);
    document.getElementById('logoutBtn').addEventListener('click', signOut);

    // 监听认证状态变化（例如邮箱确认后自动切换）
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN') {
            updateUI();
        } else if (event === 'SIGNED_OUT') {
            updateUI();
        } else if (event === 'USER_UPDATED') {
            updateUI();
        }
    });

    // 初始加载检查登录状态
    updateUI();
</script>
</body>
</html>
