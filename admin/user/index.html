<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户管理 - ✨ Jason227</title>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <!-- markdown-it -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.0.2/dist/markdown-it-emoji.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@1.0.4/dist/markdown-it-abbr.min.js">
    </script>
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js">
    </script>
    <!-- DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js">
    </script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
            cursor: pointer;
        }

        .logo:hover {
            color: #c0392b;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #c0392b;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .auth-btn.logout:hover {
            background: #5a6268;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color 0.2s;
        }

        .bell-icon:hover {
            color: #e74c3c;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        /* ========== 主布局 ========== */
        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            position: relative;
            min-height: 100vh;
        }

        /* ========== 侧边栏 ========== */
        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: white;
            border-radius: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
            /* 移除阴影凸出感 */
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            cursor: default;
        }

        .nav-group .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .group-title {
            font-weight: 600;
            margin-top: 8px;
        }

        .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        .nav-item.active {
            background: #f0f2f5;
            color: #e74c3c;
        }

        /* ========== 内容区域 ========== */
        .content-wrapper {
            margin-left: 64px;
            padding-top: 20px;
        }

        .main-content {
            max-width: 100%;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .card-header {
            font-size: 1.25rem;
            font-weight: 600;
            border-left: 4px solid #e74c3c;
            padding-left: 12px;
            margin-bottom: 20px;
        }

        /* ===== 管理后台专用样式 ===== */
        .search-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border .2s;
        }

        .search-bar input:focus {
            border-color: #e74c3c;
        }

        .search-bar .result-count {
            font-size: 13px;
            color: #999;
            white-space: nowrap;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        th {
            background: #f8f9fc;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th:first-child,
        td:first-child {
            padding-left: 8px;
        }

        th.check-col,
        td.check-col {
            width: 40px;
            text-align: center;
        }

        th.check-col input,
        td.check-col input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .role-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .role-tag.user {
            background: #e9ecef;
            color: #333;
        }

        .role-tag.admin {
            background: #8E44AD;
            color: #fff;
        }

        .action-link {
            text-decoration: none;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-link.green {
            color: #2ECC71;
            font-weight: 500;
        }

        .action-link.red {
            color: #E74C3C;
            font-weight: 500;
        }

        .action-link.green:hover {
            background: #eafaf1;
        }

        .action-link.red:hover {
            background: #fdedec;
        }

        .action-link.disabled {
            cursor: default;
            opacity: 0.6;
        }

        .action-link.disabled:hover {
            background: transparent;
        }

        .editable-field {
            cursor: default;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .editable-field:hover {
            background: #f0f2f5;
        }

        .editable-field-input {
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 14px;
            width: 100%;
            min-width: 80px;
            outline: none;
        }

        .username-display {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
            transition: background 0.15s;
        }

        .username-display:hover {
            background: #f0f2f5;
        }

        .user-tag-display {
            display: inline-block;
            border-radius: 2px;
            padding: 2px 9px;
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            margin: 0 0 0 4px;
            cursor: default;
            transition: filter 0.15s;
            background-color: #8e44ad;
        }

        .user-tag-display:hover {
            filter: brightness(0.9);
        }

        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin: 2px;
        }

        .btn-sm.grant {
            background: #2ECC71;
            color: #fff;
        }

        .btn-sm.revoke {
            background: #E74C3C;
            color: #fff;
        }

        .btn-sm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-sm.batch {
            background: #3498DB;
            color: #fff;
            padding: 6px 16px;
            font-size: 13px;
        }

        .batch-bar {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f8f9fc;
            border-radius: 8px;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .batch-bar.show {
            display: flex;
        }

        .batch-bar .info {
            font-size: 14px;
            color: #2c3e50;
            margin-right: 8px;
        }

        .batch-bar .btn-sm {
            font-size: 12px;
            padding: 4px 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .loading-text {
            color: #999;
            text-align: center;
            padding: 40px;
        }

        /* 颜色选择器 */
        .color-picker-wrap {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            margin-left: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 1px 2px;
            background: #fafafa;
        }

        .color-picker-wrap select {
            border: none;
            background: transparent;
            font-size: 12px;
            padding: 2px 4px;
            cursor: pointer;
            outline: none;
            color: #333;
            max-width: 70px;
        }

        .color-picker-wrap .color-swatch {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid #ccc;
            flex-shrink: 0;
        }

        .brown-name-badge {
            display: inline-block;
            background: #8d6e63;
            color: #fff;
            font-size: 10px;
            padding: 0 6px;
            border-radius: 10px;
            margin-left: 4px;
            font-weight: 600;
        }

        @media (max-width:800px) {

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead tr {
                display: none;
            }

            tr {
                border: 1px solid #eee;
                margin-bottom: 10px;
                padding: 10px;
            }

            td {
                border: none;
                padding: 6px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #333;
                margin-right: 10px;
                flex-shrink: 0;
            }

            td.check-col {
                display: flex;
                justify-content: flex-start;
            }

            td.check-col::before {
                content: '';
                display: none;
            }

            .batch-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .editable-field-input {
                width: auto;
            }
        }

        /* ========== 响应式：侧边栏（与主页一致） ========== */
        @media (max-width: 900px) {
            .main-layout {
                padding: 0 16px 16px 16px;
            }

            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                border-radius: 0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                margin-bottom: 20px;
                padding: 12px 0;
                transition: none;
                overflow: visible;
                white-space: normal;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .nav-item,
            .group-title {
                padding: 8px 14px;
                font-size: 13px;
                gap: 8px;
                border-radius: 6px;
                background: #f8f9fc;
            }

            .nav-item:hover,
            .group-title:hover {
                background: #f0f2f5;
                color: #e74c3c;
                text-decoration: none;
            }

            .nav-sidebar a:hover {
                text-decoration: none;
                background: #f0f2f5;
                color: #e74c3c;
            }

            .nav-icon {
                font-size: 16px;
                width: 20px;
            }

            .group-title {
                grid-column: 1 / -1;
                background: #e9ecef;
                margin-top: 0;
                border-top: none;
            }

            .divider {
                display: none;
            }

            .nav-sidebar::-webkit-scrollbar {
                width: 0;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .card {
                padding: 16px 18px;
            }

            .auth-buttons .auth-btn {
                padding: 4px 14px;
                font-size: 12px;
            }

            .user-email {
                font-size: 12px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 8px;
            }

            .nav-item,
            .group-title {
                padding: 6px 10px;
                font-size: 12px;
            }

            .nav-icon {
                font-size: 14px;
                width: 18px;
            }
        }

        @media (max-width: 400px) {
            .auth-buttons .auth-btn {
                padding: 4px 10px;
                font-size: 11px;
            }

            .user-email {
                font-size: 11px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 6px;
            }

            .nav-item,
            .group-title {
                padding: 4px 8px;
                font-size: 11px;
            }

            .nav-icon {
                font-size: 12px;
                width: 16px;
            }
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2">
    </script>
</head>

<body>
    <!-- ===== 顶栏 ===== -->
    <div class="topbar">
        <a href="/" class="logo">✨ Jason227</a>
        <div class="auth-buttons" id="authButtons">
            <a href="/user/notification" class="bell-icon" id="bellLink">
                <svg viewBox="0 0 448 512" width="20" height="20">
                    <path fill="currentColor"

                </svg>
                <sup id="bell-badge" style="display:none;">0</sup>
            </a>
            <span class="user-email" id="userDisplay">加载中...</span>
            <button id="logoutBtn" class="auth-btn logout">登出</button>
        </div>
    </div>

    <!-- ===== 主布局 ===== -->
    <div class="main-layout">
        <!-- ===== 侧边栏（与主页完全一致） ===== -->
        <div class="nav-sidebar">
            <div class="nav-group">
                <ul>
                    <li><a class="nav-item" href="/"><span class="nav-icon"><svg viewBox="0 0 576 512" width="20"
                                    height="20" fill="currentColor">
                                    <path
                                        d="M240 6.1c9.1-8.2 22.9-8.2 32 0l232 208c9.9 8.8 10.7 24 1.8 33.9s-24 10.7-33.9 1.8l-8-7.2 0 205.3c0 35.3-28.7 64-64 64l-288 0c-35.3 0-64-28.7-64-64l0-205.3-8 7.2c-9.9 8.8-25 8-33.9-1.8s-8-25 1.8-33.9L240 6.1zm16 50.1L96 199.7 96 448c0 8.8 7.2 16 16 16l48 0 0-104c0-39.8 32.2-72 72-72l48 0c39.8 0 72 32.2 72 72l0 104 48 0c8.8 0 16-7.2 16-16l0-248.3-160-143.4zM208 464l96 0 0-104c0-13.3-10.7-24-24-24l-48 0c-13.3 0-24 10.7-24 24l0 104z" />
                                </svg></span><span class="nav-text">主页</span></a></li>
                    <li><a class="nav-item" href="/problems"><span class="nav-icon"><svg viewBox="0 0 448 512"
                                    width="20" height="20" fill="currentColor">
                                    <path
                                        d="M88 0C39.4 0 0 39.4 0 88L0 432c0 44.2 35.8 80 80 80l344 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-8 0 0-76.1C435.3 375 448 353 448 328l0-256c0-39.8-32.2-72-72-72L88 0zM368 400l0 64-288 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l288 0zM80 352c-11.4 0-22.2 2.4-32 6.7L48 88c0-22.1 17.9-40 40-40l288 0c13.3 0 24 10.7 24 24l0 256c0 13.3-10.7 24-24 24L80 352zm48-200c0 13.3 10.7 24 24 24l176 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-176 0c-13.3 0-24 10.7-24 24zm24 72c-13.3 0-24 10.7-24 24s10.7 24 24 24l176 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-176 0z" />
                                </svg></span><span class="nav-text">题库</span></a></li>
                    <li><a class="nav-item" href="/courses"><span class="nav-icon"><svg viewBox="0 0 576 512" width="20"

            // ================================================================

            async function checkAccess() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = '/login';
                        return false;

                    const { data: profile, error } = await supabase
                        .from('profiles')
                        .select('can_manage_users, user_number')
                        .eq('id', session.user.id)
                        .single();

                    if (error || !profile) {
                        console.error('获取用户信息失败', error);
                        window.location.href = '/';
                        return false;
                    }

                    if (profile.can_manage_users === true || profile.user_number === 4) {
                        return true;
                    } else {
                        window.location.href = '/';
                        return false;

            // ================================================================

                '橙': '#e67e22',
                '绿': '#2ecc71',
                '蓝': '#3498db',

            // ---------- 工具函数 ----------
            function escapeHtmlAttr(s) { if (!s) return ''; return s.replace(/[&<>"]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m; }); }
            function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
            function formatTime(iso) { if (!iso) return '未知'; try { return new Date(iso).toLocaleString('zh-CN'); } catch { return iso; } }

            function showError(text) { msgDiv.innerHTML = `<div class="message error">${text}</div>`; setTimeout(() => msgDiv.innerHTML = '', 5000); }
            function showSuccess(text) { msgDiv.innerHTML = `<div class="message success">${text}</div>`; setTimeout(() => msgDiv.innerHTML = '', 5000); }

            function getColorName(hex) {
                if (!hex) return '灰';
                const lower = hex.toLowerCase();
                for (const [name, value] of Object.entries(COLOR_PALETTE)) {
                    if (value.toLowerCase() === lower) return name;
                }
                return '灰';
            }

            function isBrownColor(hex) {
                if (!hex) return false;
                return hex.toLowerCase() === '#8d6e63';
            }

            // ---------- 日志：只有棕名记录陶片放逐 (强制原因) ----------
            async function insertOstrakonLog(adminId, targetUserId, actionType, actionDetail, reason) {
                if (!reason || reason.trim() === '') {
                    console.error('陶片放逐必须提供原因');
                    return;
                }
                try {
                    const { error } = await supabase
                        .from('judgement_logs')
                        .insert({
                            admin_id: adminId,
                            target_user_id: targetUserId,
                            action_type: actionType,
                            action_detail: actionDetail,
                            reason: reason,
                        });
                    if (error) console.error('记录陶片日志失败:', error);
                    else console.log('陶片放逐记录成功');
                } catch (err) { console.error('陶片日志异常:', err); }
            }

            // 普通日志 (非棕名，不记录)
            async function insertCommonLog(adminId, targetUserId, actionType, actionDetail, reason) {
                // 非棕名不记录任何日志（完全静默）
                return;
            }

            // 智能日志：只有棕名才记录陶片
            async function insertSmartLog(adminId, targetUserId, actionType, actionDetail, reason, isBrown) {
                if (isBrown) {
                    if (!reason || reason.trim() === '') {
                        console.error('棕名操作必须提供原因');
                        return;
                    }
                    await insertOstrakonLog(adminId, targetUserId, actionType, actionDetail, reason);
                } else {
                    await insertCommonLog(adminId, targetUserId, actionType, actionDetail, reason);
                }
            }

            // 获取当前管理员ID
            async function getCurrentAdminId() {
                if (currentUser) return currentUser.id;
                const { data: { user } } = await supabase.auth.getUser();
                if (user) return user.id;
                return null;
            }

            // 强制原因输入 (用于棕名惩罚)
            async function promptBrownReason() {
                const { value: reason } = await Swal.fire({
                    title: '⚠️ 棕名惩罚 · 陶片放逐',
                    html: '请输入 <strong>作弊惩罚</strong> 的详细原因：<br><small style="color:#8d6e63;">示例：因学术不端而棕名惩罚：原因………………</small>',
                    input: 'textarea',
                    inputPlaceholder: '请详细说明惩罚原因 (必填)',
                    showCancelButton: true,
                    confirmButtonText: '确认棕名惩罚',
                    cancelButtonText: '取消',
                    inputValidator: (value) => {
                        if (!value || value.trim() === '') {
                            return '原因不能为空！';
                        }
                        return null;
                    }
                });
                return reason;
            }

            // 普通原因输入 (非棕名，但实际不会记录)
            async function promptCommonReason(operationName) {
                const { value: reason } = await Swal.fire({
                    title: `请输入 ${operationName} 的原因`,
                    input: 'textarea',
                    inputPlaceholder: '详细说明操作原因...',
                    showCancelButton: true,
                    confirmButtonText: '确认操作',
                    cancelButtonText: '取消',
                    inputValidator: (value) => {
                        if (!value || value.trim() === '') {
                            return '原因不能为空！';
                        }
                    }
                });
                return reason;
            }

            // ---------- 通用更新 ----------
            async function updateUserField(userNumber, updateData) {
                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .update(updateData)
                        .eq('user_number', userNumber)
                        .select();
                    if (error) throw error;
                    if (data && data.length > 0) {
                        const target = allUsers.find(u => u.user_number === userNumber);
                        if (target) Object.assign(target, data[0]);
                    }
                } catch (err) {
                    console.error('更新失败:', err);
                    showError('操作失败：' + err.message);
                    throw err;
                }
            }

            // ================================================================
            //  核心：颜色变更 (棕名自动添加"作弊者"标签)
            // ================================================================
            async function changeUserColor(userNumber, newColor) {
                try {
                    const targetUser = allUsers.find(u => u.user_number === userNumber);
                    if (!targetUser) { showError('用户不存在'); return; }

                    const oldColor = targetUser.username_color || '#95a5a6';
                    const isNowBrown = isBrownColor(newColor);
                    const wasBrown = isBrownColor(oldColor);

                    let reason = '';
                    if (isNowBrown && !wasBrown) {
                        reason = await promptBrownReason();
                        if (!reason) {
                            showError('棕名惩罚已取消');
                            return;
                        }
                    } else {
                        const actionName = isNowBrown ? '设为棕名' : '修改颜色';
                        reason = await promptCommonReason(actionName);
                        if (!reason) return;
                    }

                    let updateData = { username_color: newColor };
                    if (isNowBrown) {
                        updateData.user_tag = '作弊者';
                    } else {
                        if (targetUser.user_tag === '作弊者') {
                            updateData.user_tag = null;
                        }
                    }

                    await updateUserField(userNumber, updateData);

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        if (isNowBrown && !wasBrown) {
                            const detail = { action: 'brown_penalty', color: newColor, tag: '作弊者' };
                            await insertOstrakonLog(
                                adminId,
                                targetUser.id,
                                'brown_penalty',
                                detail,
                                `因学术不端而棕名惩罚：原因${reason}`
                            );
                        }
                        // 从棕变非棕不记录日志
                    }

                    await loadUsers();
                    showSuccess(`颜色已更新${isNowBrown ? '，已记录陶片放逐，添加"作弊者"标签' : ''}`);
                } catch (err) {
                    showError('颜色更新失败：' + err.message);
                }
            }

            // ================================================================
            //  权限操作 (只有棕名才记录陶片)
            // ================================================================
            async function toggleAdmin(userNumber) {
                try {
                    const targetUser = allUsers.find(u => u.user_number === userNumber);
                    if (!targetUser) { showError('用户不存在'); return; }

                    const { data: u, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('is_admin, user_tag, username_color')
                        .eq('user_number', userNumber)
                        .single();
                    if (fetchErr) throw new Error('查询失败: ' + fetchErr.message);

                    const newAdmin = !u.is_admin;
                    const actionName = newAdmin ? '授予管理员权限' : '撤销管理员权限';
                    const reason = await promptCommonReason(actionName);
                    if (!reason) return;

                    let newTag = u.user_tag || '';
                    if (newAdmin) {
                        if (!newTag) newTag = '管理员';
                    } else {
                        if (newTag === '管理员') newTag = null;
                    }
                    const color = newAdmin ? '#9b59b6' : '#95a5a6';

                    await updateUserField(userNumber, {
                        is_admin: newAdmin,
                        user_tag: newTag,
                        username_color: color
                    });

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        const isBrown = isBrownColor(u.username_color || '#95a5a6');
                        if (isBrown) {
                            await insertOstrakonLog(
                                adminId,
                                targetUser.id,
                                newAdmin ? 'grant_perm' : 'revoke_perm',
                                { permission: 'is_admin', new_value: newAdmin },
                                reason
                            );
                        }
                    }
                    await loadUsers();
                } catch (err) {
                    showError('操作失败：' + err.message);
                }
            }

            // ================================================================
            //  批量操作 (只有棕名才记录陶片)
            // ================================================================
            async function batchAction(actionName, updateObj) {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptCommonReason(actionName);
                if (!reason) return;

                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id, username_color')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;

                    const { error } = await supabase.from('profiles').update(updateObj).in('user_number', ids);
                    if (error) throw error;

                    for (const uid of ids) {
                        const target = allUsers.find(u => u.user_number === uid);
                        if (target) Object.assign(target, updateObj);
                    }

                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        let actionType = 'grant_perm';
                        let field = Object.keys(updateObj)[0];
                        let newValue = updateObj[field];
                        if (field === 'is_banned') {
                            actionType = newValue ? 'ban' : 'unban';
                        } else {
                            actionType = newValue ? 'grant_perm' : 'revoke_perm';
                        }
                        for (const user of users) {
                            const isBrown = isBrownColor(user.username_color || '#95a5a6');
                            if (isBrown) {
                                await insertOstrakonLog(
                                    adminId,
                                    user.id,
                                    actionType,
                                    { permission: field, new_value: newValue },
                                    reason
                                );
                            }
                        }
                    }

                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) {
                    showError(`批量${actionName}失败：` + err.message);
                }
            }

            // ---------- 通知未读数 ----------
            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    const { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        if (count > 0) {
                            bellBadge.textContent = count > 99 ? '99+' : count;
                            bellBadge.style.display = 'inline-flex';
                        } else { bellBadge.style.display = 'none'; }
                    }
                } catch (err) { console.error(err); }
            }

            // ---------- 初始化 ----------
            async function init() {
                const hasAccess = await checkAccess();
                if (!hasAccess) return;

                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = '/login'; return; }
                    currentUser = session.user;
                    const { data: profile, error: profileError } = await supabase.from('profiles').select(
                        'user_number,username,can_manage_users').eq('id', currentUser.id).single();
                    if (profileError || !profile) { window.location.href = '/'; return; }
                    currentProfile = profile;
                    const displayName = profile.username || currentUser.email;
                    userDisplay.textContent = displayName;
                    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                        await supabase.auth.signOut();
                        window.location.href = '/';
                    });
                    await loadUsers();
                    searchInput.addEventListener('input', function () { filterUsers(this.value.trim()); });
                    await fetchUnreadCount();
                    setInterval(fetchUnreadCount, 30000);
                } catch (err) {
                    console.error(err);
                    window.location.href = '/';
                }
            }

            // ---------- 加载用户 ----------
            async function loadUsers() {
                try {
                    const { data, error } = await supabase.from('profiles')
                        .select(
                            'id, user_number, username, is_admin, created_at, can_speak, is_banned, remark, can_manage_users, can_manage_posts, username_color, user_tag, special_privilege'
                        )
                        .order('user_number');
                    if (error) throw error;
                    allUsers = data;
                    filterUsers(searchInput.value.trim());
                } catch (err) { userList.innerHTML = `<div class="error">加载用户失败：${err.message}</div>`; }
            }

            // ---------- 精确搜索 ----------
            function filterUsers(keyword) {
                if (!keyword) {
                    filteredUsers = [...allUsers];
                    renderUserList();
                    return;
                }
                const trimmed = keyword.trim();
                const lower = trimmed.toLowerCase();
                const isNumber = /^\d+$/.test(trimmed);

                filteredUsers = allUsers.filter(user => {
                    const isAdmin = user.is_admin;
                    const roleLabel = isAdmin ? '管理员' : '普通用户';
                    const remark = user.remark || '';
                    const tag = user.user_tag || '';
                    const username = user.username || '';
                    const userNumber = String(user.user_number);

                    if (isNumber && userNumber === trimmed) return true;
                    if (username.toLowerCase() === lower) return true;
                    if (remark.toLowerCase() === lower) return true;
                    if (roleLabel === trimmed) return true;
                    if (tag.toLowerCase() === lower) return true;
                    if (trimmed === '用户管理' && user.can_manage_users) return true;
                    if (trimmed === '秩序管理' && user.can_manage_posts) return true;

                    return false;
                });
                renderUserList();
            }

            // ================================================================
            //  渲染用户列表
            // ================================================================
            function renderUserList() {
                if (!filteredUsers || filteredUsers.length === 0) {
                    userList.innerHTML = '<div class="loading-text">没有找到匹配的用户</div>';
                    resultCount.textContent = '共 0 位用户';
                    batchBar.classList.remove('show');
                    return;
                }
                resultCount.textContent = `共 ${filteredUsers.length} 位用户`;
                let html = `
                            <table>
                                <thead>
                                    <tr>
                                        <th class="check-col"><input type="checkbox" id="selectAll" title="全选"></th>
                                        <th>注册时间</th>
                                        <th>用户编号</th>
                                        <th>用户名</th>
                                        <th>备注名</th>
                                        <th>用户类型</th>
                                        <th>权限</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                for (const user of filteredUsers) {
                    const isSelf = currentProfile.user_number === user.user_number;
                    const isAdmin = user.is_admin;
                    const roleClass = isAdmin ? 'admin' : 'user';
                    const roleLabel = isAdmin ? '管理员' : '普通用户';

                    let currentColor = user.username_color || (isAdmin ? '#9b59b6' : '#95a5a6');
                    const colorName = getColorName(currentColor);
                    const fixedColor = COLOR_PALETTE[colorName] || '#95a5a6';

                    const userNameColor = fixedColor;
                    const isBrown = isBrownColor(userNameColor);

                    let brownBadge = '';
                    if (isBrown) {
                        brownBadge = `<span class="brown-name-badge">陶片</span>`;
                    }

                    let tagDisplay = user.user_tag || '';
                    if (isBrown && tagDisplay !== '作弊者') {
                        tagDisplay = '作弊者';
                    }
                    let tagHtml = '';
                    if (tagDisplay) {
                        tagHtml =
                            `<span class="user-tag-display" data-user="${user.user_number}" data-current="${escapeHtmlAttr(tagDisplay)}" style="background-color:${userNameColor};">${escapeHtmlAttr(tagDisplay)}</span>`;
                    }

                    const remarkDisplay = user.remark || '';

                    let userMgmtHtml, postMgmtHtml;
                    const mgmtStatus = user.can_manage_users;
                    const postStatus = user.can_manage_posts;
                    if (isSelf) {
                        userMgmtHtml =
                            `<span class="action-link ${mgmtStatus ? 'green' : 'red'} disabled" style="cursor:default;">用户管理</span>`;
                        postMgmtHtml =
                            `<span class="action-link ${postStatus ? 'green' : 'red'} disabled" style="cursor:default;">秩序管理</span>`;
                    } else {
                        userMgmtHtml =
                            `<span class="action-link ${mgmtStatus ? 'green' : 'red'}" style="cursor:pointer;" data-action="toggle-perm" data-user="${user.user_number}" data-field="can_manage_users" data-current="${mgmtStatus}">用户管理</span>`;
                        postMgmtHtml =
                            `<span class="action-link ${postStatus ? 'green' : 'red'}" style="cursor:pointer;" data-action="toggle-perm" data-user="${user.user_number}" data-field="can_manage_posts" data-current="${postStatus}">秩序管理</span>`;
                    }

                    const isBanned = user.is_banned || false;
                    const banColor = isBanned ? 'red' : 'green';
                    const banAction =
                        `<span class="action-link ${banColor} ${isSelf ? 'disabled' : ''}" style="${isSelf ? 'cursor:default;' : 'cursor:pointer;'}" data-action="${isSelf ? '' : 'toggle-ban'}" data-user="${user.user_number}">进入主站</span>`;

                    const canSpeak = user.can_speak !== false;
                    const speakColor = canSpeak ? 'green' : 'red';
                    const speakAction =
                        `<span class="action-link ${speakColor} ${isSelf ? 'disabled' : ''}" style="${isSelf ? 'cursor:default;' : 'cursor:pointer;'}" data-action="${isSelf ? '' : 'toggle-speak'}" data-user="${user.user_number}">自由发言</span>`;

                    const adminColor = isAdmin ? 'green' : 'red';
                    const adminAction =
                        `<span class="action-link ${adminColor} ${isSelf ? 'disabled' : ''}" style="${isSelf ? 'cursor:default;' : 'cursor:pointer;'}" data-action="${isSelf ? '' : 'toggle-admin'}" data-user="${user.user_number}">进入后台</span>`;

                    const specialPrivilege = user.special_privilege || false;
                    const spColor = specialPrivilege ? 'green' : 'red';
                    const spAction =
                        `<span class="action-link ${spColor} ${isSelf ? 'disabled' : ''}" style="${isSelf ? 'cursor:default;' : 'cursor:pointer;'}" data-action="${isSelf ? '' : 'toggle-special'}" data-user="${user.user_number}" data-current="${specialPrivilege}">特殊权益</span>`;

                    const actionHtml = `${banAction} | ${speakAction} | ${adminAction}`;

                    // ---- 七色选择器 ----
                    let colorPickerHtml = '';
                    if (!isSelf) {
                        const currentName = getColorName(userNameColor);
                        let optionsHtml = COLOR_NAMES.map(name => {
                            const val = COLOR_PALETTE[name];
                            const selected = name === currentName ? 'selected' : '';
                            return `<option value="${val}" ${selected}>${name}</option>`;
                        }).join('');
                        colorPickerHtml = `
                            <span class="color-picker-wrap" title="修改用户名颜色 (紫/红/橙/绿/蓝/灰/棕)">
                                <span class="color-swatch" style="background-color:${userNameColor};"></span>
                                <select data-user="${user.user_number}" class="user-color-select">
                                    ${optionsHtml}
                                </select>
                            </span>
                        `;
                    }

                    const userNameHtml = `
                                <span class="username-display" data-user="${user.user_number}" data-current="${escapeHtmlAttr(user.username || '未命名')}" style="color:${userNameColor};font-weight:500;">${escapeHtmlAttr(user.username || '未命名')}</span>
                                ${tagHtml}
                                ${brownBadge}
                                ${colorPickerHtml}
                            `;

                    html += `
                                <tr>
                                    <td class="check-col" data-label="选择"><input type="checkbox" class="row-checkbox" data-user="${user.user_number}" ${isSelf ? 'disabled' : ''}></td>
                                    <td data-label="注册时间">${formatTime(user.created_at)}</td>
                                    <td data-label="用户编号">${user.user_number}</td>
                                    <td data-label="用户名">${userNameHtml}</td>
                                    <td data-label="备注名"><span class="editable-field" data-field="remark" data-user="${user.user_number}" data-value="${escapeHtmlAttr(remarkDisplay)}">${escapeHtmlAttr(remarkDisplay) || '-'}</span></td>
                                    <td data-label="用户类型">${roleLabel}</td>
                                    <td data-label="权限">${userMgmtHtml} | ${postMgmtHtml} | ${spAction}</td>
                                    <td data-label="操作">${actionHtml}</td>
                                </tr>
                            `;
                }
                html += `</tbody></table>`;
                userList.innerHTML = html;

                // ---- 颜色下拉事件 ----
                document.querySelectorAll('.user-color-select').forEach(select => {
                    select.addEventListener('change', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const newColor = this.value;
                        const isBrownNow = isBrownColor(newColor);

                        // 先更新UI预览
                        const row = this.closest('tr');
                        const swatch = row.querySelector('.color-swatch');
                        if (swatch) swatch.style.backgroundColor = newColor;
                        const usernameSpan = row.querySelector('.username-display');
                        if (usernameSpan) usernameSpan.style.color = newColor;
                        const tagSpan = row.querySelector('.user-tag-display');
                        if (tagSpan) {
                            tagSpan.style.backgroundColor = newColor;
                            if (isBrownNow) {
                                tagSpan.textContent = '作弊者';
                                tagSpan.dataset.current = '作弊者';
                            }
                        }

                        let badgeSpan = row.querySelector('.brown-name-badge');
                        if (isBrownNow) {
                            if (!badgeSpan) {
                                const container = row.querySelector('.username-display').parentNode;
                                const newBadge = document.createElement('span');
                                newBadge.className = 'brown-name-badge';
                                newBadge.textContent = '陶片';
                                container.appendChild(newBadge);
                            }
                            if (tagSpan) {
                                tagSpan.textContent = '作弊者';
                                tagSpan.dataset.current = '作弊者';
                            }
                        } else {
                            if (badgeSpan) badgeSpan.remove();
                            if (tagSpan && tagSpan.textContent === '作弊者') {
                                tagSpan.textContent = '';
                                tagSpan.dataset.current = '';
                            }
                        }

                        await changeUserColor(uid, newColor);
                    });
                });

                // ---- 用户名双击编辑 ----
                document.querySelectorAll('.username-display').forEach(el => {
                    let clickCount = 0,
                        timer = null;
                    el.addEventListener('click', function (e) {
                        e.stopPropagation();
                        clickCount++;
                        if (timer) clearTimeout(timer);
                        timer = setTimeout(() => {
                            if (clickCount === 2) enterEditMode(this);
                            else if (clickCount >= 3) {
                                const uid = parseInt(this.dataset.user);
                                window.open('/user/' + uid, '_blank');
                            }
                            clickCount = 0;
                            timer = null;
                        }, 300);
                    });

                    async function enterEditMode(el) {
                        const uid = parseInt(el.dataset.user);
                        const current = el.dataset.current || el.textContent.trim();
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'editable-field-input';
                        input.value = current;
                        input.placeholder = '输入新用户名';
                        el.innerHTML = '';
                        el.appendChild(input);
                        input.focus();
                        input.select();
                        const save = async () => {
                            const val = input.value.trim();
                            if (val === current) {
                                el.textContent = current;
                                el.dataset.current = current; return;
                            }
                            if (!val) {
                                showError('用户名不能为空');
                                el.textContent = current;
                                el.dataset.current = current; return;
                            }
                            try {
                                await updateUserField(uid, { username: val });
                                await loadUsers();
                            } catch (err) {
                                showError('更新失败：' + err.message);
                                el.textContent = current;
                                el.dataset.current = current;
                            }
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                input.blur();
                            }
                            if (e.key === 'Escape') {
                                el.textContent = current;
                                el.dataset.current = current;
                            }
                        });
                    }
                });

                // 备注名双击编辑
                document.querySelectorAll('.editable-field[data-field="remark"]').forEach(el => {
                    el.addEventListener('dblclick', function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const cur = this.dataset.value || '';
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'editable-field-input';
                        input.value = cur;
                        input.placeholder = '输入备注名';
                        this.innerHTML = '';
                        this.appendChild(input);
                        input.focus();
                        input.select();
                        const save = async () => {
                            const val = input.value.trim();
                            if (val === cur) {
                                this.textContent = cur || '-';
                                this.dataset.value = cur; return;
                            }
                            try {
                                await updateUserField(uid, { remark: val });
                                await loadUsers();
                            } catch (err) {
                                showError('更新失败：' + err.message);
                                this.textContent = cur || '-';
                                this.dataset.value = cur;
                            }
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                input.blur();
                            }
                            if (e.key === 'Escape') {
                                const p = this.parentNode;
                                p.textContent = cur || '-';
                                p.dataset.value = cur;
                            }
                        });
                    });
                });

                // 标签双击编辑 (但棕名自动锁定为"作弊者")
                document.querySelectorAll('.user-tag-display').forEach(el => {
                    el.addEventListener('dblclick', function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const user = allUsers.find(u => u.user_number === uid);
                        if (!user) return;
                        const isBrown = isBrownColor(user.username_color || '#95a5a6');
                        if (isBrown) {
                            showError('棕名用户标签已锁定为"作弊者"，不可修改');
                            return;
                        }
                        const cur = this.dataset.current || this.textContent.trim();
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'editable-field-input';
                        input.value = cur;
                        input.placeholder = '输入用户标签（留空恢复默认）';
                        this.innerHTML = '';
                        this.appendChild(input);
                        input.focus();
                        input.select();
                        const save = async () => {
                            const val = input.value.trim();
                            const user = allUsers.find(u => u.user_number === uid);
                            const isAdmin = user ? user.is_admin : false;
                            let final = val ? val : (isAdmin ? '管理员' : null);
                            if (final === cur) {
                                this.textContent = cur;
                                this.dataset.current = cur; return;
                            }
                            try {
                                await updateUserField(uid, { user_tag: final });
                                await loadUsers();
                            } catch (err) {
                                showError('更新失败：' + err.message);
                                this.textContent = cur;
                                this.dataset.current = cur;
                            }
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                input.blur();
                            }
                            if (e.key === 'Escape') {
                                const p = this.parentNode;
                                p.textContent = cur;
                                p.dataset.current = cur;
                            }
                        });
                    });
                });

                // ---- 权限操作 ----
                document.querySelectorAll('[data-action="toggle-admin"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await toggleAdmin(uid);
                    });
                });

                document.querySelectorAll('[data-action="toggle-perm"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const field = this.dataset.field;
                        const current = this.dataset.current === 'true';
                        await togglePermission(uid, field, current);
                    });
                });

                document.querySelectorAll('[data-action="toggle-ban"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        await toggleBan(uid);
                    });
                });

                document.querySelectorAll('[data-action="toggle-speak"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const targetUser = allUsers.find(u => u.user_number === uid);
                        if (!targetUser) { showError('用户不存在'); return; }
                        const current = targetUser.can_speak !== false;
                        await togglePermission(uid, 'can_speak', current);
                    });
                });

                document.querySelectorAll('[data-action="toggle-special"]').forEach(el => {
                    el.addEventListener('click', async function (e) {
                        e.stopPropagation();
                        const uid = parseInt(this.dataset.user);
                        const current = this.dataset.current === 'true';
                        await toggleSpecialPrivilege(uid, current);
                    });
                });

                // ---- 全选 ----
                const selectAll = document.getElementById('selectAll');
                if (selectAll) {
                    selectAll.addEventListener('change', function () {
                        document.querySelectorAll('.row-checkbox:not(:disabled)').forEach(cb => cb.checked = this
                            .checked);
                        updateBatchBar();
                    });
                }
                document.querySelectorAll('.row-checkbox').forEach(cb => cb.addEventListener('change', updateBatchBar));
                updateBatchBar();
            }

            // ---------- 批量操作栏状态 ----------
            function updateBatchBar() {
                const checked = document.querySelectorAll('.row-checkbox:checked:not(:disabled)');
                const count = checked.length;
                if (count === 0) { batchBar.classList.remove('show'); return; }
                batchBar.classList.add('show');
                batchInfo.textContent = `已选 ${count} 位用户`;
                const ids = Array.from(checked).map(cb => parseInt(cb.dataset.user));
                batchBar.dataset.selected = JSON.stringify(ids);
            }

            // ---------- 批量按钮事件 ----------
            document.getElementById('batchGrantEnterSite').addEventListener('click', () => batchAction('授予进入主站权限', { is_banned: false }));
            document.getElementById('batchRevokeEnterSite').addEventListener('click', () => batchAction('撤销进入主站权限', { is_banned: true }));
            document.getElementById('batchGrantSpeak').addEventListener('click', () => batchAction('授予自由发言权限', { can_speak: true }));
            document.getElementById('batchRevokeSpeak').addEventListener('click', () => batchAction('撤销自由发言权限', { can_speak: false }));
            document.getElementById('batchGrantAdmin').addEventListener('click', async () => {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptCommonReason('批量授予进入后台权限');
                if (!reason) return;
                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id, username_color')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;
                    for (const u of users) {
                        let tag = u.user_tag || '';
                        if (!tag) tag = '管理员';
                        await supabase.from('profiles')
                            .update({ is_admin: true, user_tag: tag, username_color: '#9b59b6' })
                            .eq('user_number', u.user_number);
                        const target = allUsers.find(t => t.user_number === u.user_number);
                        if (target) {
                            target.is_admin = true;
                            target.user_tag = tag;
                            target.username_color = '#9b59b6';
                        }
                    }
                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        for (const u of users) {
                            const isBrown = isBrownColor(u.username_color || '#95a5a6');
                            if (isBrown) {
                                await insertOstrakonLog(
                                    adminId,
                                    u.id,
                                    'grant_perm',
                                    { permission: 'is_admin', new_value: true },
                                    reason
                                );
                            }
                        }
                    }
                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) { showError('批量授予进入后台失败：' + err.message); }
            });
            document.getElementById('batchRevokeAdmin').addEventListener('click', async () => {
                const ids = JSON.parse(batchBar.dataset.selected || '[]');
                if (ids.length === 0) { showError('请先选择用户'); return; }
                const reason = await promptCommonReason('批量撤销进入后台权限');
                if (!reason) return;
                try {
                    const { data: users, error: fetchErr } = await supabase
                        .from('profiles')
                        .select('user_number, id, username_color')
                        .in('user_number', ids);
                    if (fetchErr) throw fetchErr;
                    for (const u of users) {
                        let tag = u.user_tag || '';
                        if (tag === '管理员') tag = null;
                        await supabase.from('profiles')
                            .update({ is_admin: false, user_tag: tag, username_color: '#95a5a6' })
                            .eq('user_number', u.user_number);
                        const target = allUsers.find(t => t.user_number === u.user_number);
                        if (target) {
                            target.is_admin = false;
                            target.user_tag = tag;
                            target.username_color = '#95a5a6';
                        }
                    }
                    const adminId = await getCurrentAdminId();
                    if (adminId) {
                        for (const u of users) {
                            const isBrown = isBrownColor(u.username_color || '#95a5a6');
                            if (isBrown) {
                                await insertOstrakonLog(
                                    adminId,
                                    u.id,
                                    'revoke_perm',
                                    { permission: 'is_admin', new_value: false },
                                    reason
                                );
                            }
                        }
                    }
                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                    await loadUsers();
                } catch (err) { showError('批量撤销进入后台失败：' + err.message); }
            });
            document.getElementById('batchGrantUserMgmt').addEventListener('click', () => batchAction('授予用户管理权限', { can_manage_users: true }));
            document.getElementById('batchRevokeUserMgmt').addEventListener('click', () => batchAction('撤销用户管理权限', { can_manage_users: false }));
            document.getElementById('batchGrantPostMgmt').addEventListener('click', () => batchAction('授予秩序管理权限', { can_manage_posts: true }));
            document.getElementById('batchRevokePostMgmt').addEventListener('click', () => batchAction('撤销秩序管理权限', { can_manage_posts: false }));
            document.getElementById('batchGrantSpecial').addEventListener('click', () => batchAction('授予特殊权益', { special_privilege: true }));
            document.getElementById('batchRevokeSpecial').addEventListener('click', () => batchAction('撤销特殊权益', { special_privilege: false }));

            // ---------- 启动 ----------
            init();
        })();
    </script>
</body>

</html>
