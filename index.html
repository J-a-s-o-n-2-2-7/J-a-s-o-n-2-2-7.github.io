            // ================================================================
            async function renderBenbenList(data, reset, mentionMap = {}) {
                if (!benbenList) return;
                if (reset) benbenList.innerHTML = '';
                const mentionMapJson = JSON.stringify(mentionMap);
                for (const item of data) {
                    const isOwner = currentProfile && currentProfile.user_number === item.user_number;
                    const fullContentEncoded = encodeURIComponent(item.content);
                    const username = escapeHtmlAttr(item.profiles?.username || '用户');
                    const timeStr = new Date(item.created_at).toLocaleString('zh-CN');
                    const rawContent = item.content;

                    const prof = item.profiles || {};
                    const avatarUrl = prof.avatar_url || '';
                    const color = getUserDisplayColor(prof);
                    const tagText = getUserTagDisplay(prof);

                    let labelHtml = '';
                    if (tagText) {
                        labelHtml = `<span class="user-tag-display" style="background-color: ${color};">${escapeHtml(tagText)}</span>`;
                    }

                    // 用户名链接颜色直接使用 color
                    let userHtml = `<span class="benben-user"><a href="/user/${item.user_number}" class="benben-username" style="color: ${color};">${username}</a>`;
                    if (labelHtml) userHtml += labelHtml;
                    userHtml += `</span>`;

                    const benbenHtml = `
                        <div class="benben-item" data-id="${item.id}">
                            <div class="benben-avatar"><a href="/user/${item.user_number}"><img src="${avatarUrl || letterAvatar(item.profiles?.username || '用户')}" alt="${username}" onerror="this.onerror=null;this.src='${letterAvatar(item.profiles?.username || '用户')}'"></a></div>
                            <div class="benben-content">
                                <div class="benben-item-header">
                                    <div class="post-author">
                                        ${userHtml}
                                        <span class="benben-time">${timeStr}</span>
                                    </div>
                                    <div class="benben-actions">
                                        <button class="benben-report-btn" data-id="${item.id}">举报</button>
                                        <button class="benben-reply-btn" data-replyto-id="${item.id}" data-username="${username}" data-fullcontent="${fullContentEncoded}">回复</button>
                                        ${isOwner ? `<button class="benben-delete" data-id="${item.id}">删除</button>` : ''}
                                    </div>
                                </div>
                                <div class="benben-text" data-raw="${escapeHtmlAttr(rawContent)}" data-mention-map='${escapeHtmlAttr(mentionMapJson)}'></div>
                            </div>
                        </div>
                    `;
                    benbenList.insertAdjacentHTML('beforeend', benbenHtml);
                    // ===== 新增：只渲染刚插入的这一条（不动旧的） =====
                    const newItem = benbenList.lastElementChild;
                    const textEl = newItem.querySelector('.benben-text');
                    if (textEl) {
                        const rawEncoded = textEl.getAttribute('data-raw');
                        const mentionMapStr = textEl.getAttribute('data-mention-map');
                        if (rawEncoded) {
                            let map = {};
                            try { map = JSON.parse(mentionMapStr || '{}'); } catch (e) { }
                            textEl.innerHTML = renderContent(
                                rawEncoded,
                                map,
                                currentProfile?.is_admin || false,   // 改为 is_admin
                                currentProfile?.username || '用户',
                                'benben-' + item.id
                            );
                        }
                    }
                }
                document.querySelectorAll('.benben-delete').forEach(btn => btn.addEventListener('click', async (e) => {
                    e
                        .stopPropagation();
                    await deleteBenben(btn.dataset.id);
                }));
                document.querySelectorAll('.benben-reply-btn').forEach(btn => btn.addEventListener('click', () => {
                    const replyToId = btn.dataset.replytoId;
                    const username = btn.dataset.username;
                    const fullContent = decodeURIComponent(btn.dataset.fullcontent)

            async function deleteBenben(id) {
                try {
                    const { error } = await supabase.from('benben').update({ is_deleted: true }).eq('id', id);
                    if (error) throw error;
                    loadBenbenList(true);
                } catch (error) {
                    console.error(error);
                    alert('删除失败：' + error.message);
                }
            }

            async function postBenben() {
                let content = benbenContent?.value.trim();
                if (!content) { alert('内容不能为空'); return; }
                if (!currentProfile) { window.location.href = '/auth/login'; return; }

                if (currentProfile.can_speak === false) {
                    alert('你已被禁言，无法发布犇犇');
                    return;
                }

                let finalReplyToId = null;
                if (currentReplyingId && currentReplyUsername) {
                    const trimmed = content.trimStart();
                    const prefix = `|| @${currentReplyUsername} :`;
                    if (trimmed.startsWith(prefix)) {
                        finalReplyToId = currentReplyingId;
                    } else {
                        currentReplyingId = null;
                        currentReplyUsername = null;
                    }
                }

                let finalContent = currentProfile.is_admin ? content : content.substring(0, MAX_LENGTH);
                // 不再转义尖括号，由 renderContent 全局处理
                const insertData = {
                    user_number: currentProfile.user_number, content: finalContent,
                    is_deleted: false
                };
                if (finalReplyToId) {
                    insertData.reply_to = finalReplyToId;
                }

                try {
                    const { data: newBenben, error: insertError } = await supabase.from('benben').insert(insertData)
                        .select().single();
                    if (insertError) throw insertError;
                    const newBenbenId = newBenben.id;

                    if (finalReplyToId) {
                        const { data: originalBenben } = await supabase.from('benben').select('user_number').eq('id',
                            finalReplyToId).single();
                        if (originalBenben && originalBenben.user_number !== currentProfile.user_number) {
                            await supabase.from('notifications').insert({
                                user_number: originalBenben.user_number,
                                from_user_number: currentProfile.user_number,
                                type: 'reply',
                                benben_id: newBenbenId,
                                content: '回复了你的犇犇'
                            });
                        }
                    }

                    const mentionRegex = /@([\u4e00-\u9fa5a-zA-Z0-9_.\- ]+)/g;
                    let match;
                    const mentionedSet = new Set();
                    while ((match = mentionRegex.exec(content)) !== null) mentionedSet.add(match[1]);
                    if (mentionedSet.size > 0) {
                        const usernames = Array.from(mentionedSet);
                        const { data: userData } = await supabase.from('profiles').select('user_number, username')
                            .in('username', usernames);
                        if (userData) {
                            const notifications = [];
                            for (const user of userData) {
                                if (user.user_number !== currentProfile.user_number) {
                                    notifications.push({
                                        user_number: user.user_number,
                                        from_user_number: currentProfile.user_number,
                                        type: 'mention',
                                        benben_id: newBenbenId,
                                        content: '在犇犇中提到了你'
                                    });
                                }
                            }
                            if (notifications.length > 0) await supabase.from('notifications').insert(
                                notifications);
                        }
                    }

                    if (benbenContent) benbenContent.value = '';
                    currentReplyingId = null;
                    currentReplyUsername = null;
                    loadBenbenList(true);
                    fetchUnreadCount();
                } catch (error) {
                    console.error(error);
                    alert('发布失败：' + (error.message || '未知错误'));
                }
            }

            function switchMode(mode) {
                feedMode = mode;

            function setupInfiniteScroll() {

                        loadBenbenList(false);

                observer.observe(loadingSentinel);

            // ===== 加载近期讨论（含管理员双击修改数量） =====
            async function loadRecentPosts() {
                const container = document.getElementById('recentPostsList');
                if (!container) return;

                try {
                    // 1. 读取显示数量
                    const limit = parseInt(await getSiteSetting('recent_posts_limit', '20'));

                    // 2. 更新卡片标题（仅管理员可见数字）
                    const cardHeader = document.querySelector('#recentPostsCard .card-header');
                    if (cardHeader) {
                        const isAdmin = currentProfile && currentProfile.can_manage_posts === true;
                        let headerHtml = '近期讨论';
                        if (isAdmin) {
                            headerHtml += ` <span id="recentPostsCountDisplay" style="font-size:14px; color:#999; cursor:pointer; margin-left:8px; font-weight:400; border-bottom:1px dashed #ddd; padding-bottom:1px;" title="双击修改显示数量">(${limit})</span>`;
                        }
                        cardHeader.innerHTML = headerHtml;
                    }

                    // 3. ★ 事件委托（绑定在卡片容器上，确保双击永远生效）
                    const card = document.getElementById('recentPostsCard');
                    if (card) {
                        card.removeEventListener('dblclick', handleRecentPostsDblClick);
                        card.addEventListener('dblclick', handleRecentPostsDblClick);
                    }

                    // 4. 查询帖子
                    const { data: posts, error } = await supabase
                        .from('posts')
                        .select('id, title, forum, created_at, author_id')
                        .order('created_at', { ascending: false })
                        .limit(limit);

                    if (error) throw error;
                    if (!posts || posts.length === 0) {
                        container.innerHTML = '<div class="empty-state">没有更多讨论了</div>';
                        return;
                    }

                    // 5. 获取作者信息
                    const authorIds = [...new Set(posts.map(p => p.author_id).filter(id => id))];
                    let userMap = {};
                    if (authorIds.length > 0) {
                        const { data: users, error: userError } = await supabase
                            .from('profiles')
                            .select('id, username, user_number, username_color, user_tag, is_admin, is_cheater, avatar_url')
                            .in('id', authorIds);
                        if (!userError && users) {
                            users.forEach(u => { userMap[u.id] = u; });
                        }
                    }

                    // 6. 版块映射（请根据你的实际论坛配置修改）
                    const forumMap = {
                        siteaffairs: '站务版',
                        problem: '题目总版',
                        academics: '学术版'

                    // 7. 生成 HTML
                    let html = '';
                    posts.forEach(post => {
                        const prof = userMap[post.author_id] || {};
                        const username = prof.username || '匿名';
                        const userNumber = prof.user_number || '';
                        const color = getUserDisplayColor(prof);
                        const tagText = getUserTagDisplay(prof);

                        let labelHtml = '';
                        if (tagText) {
                            labelHtml = `<span class="user-tag-display" style="background-color: ${color};">${escapeHtml(tagText)}</span>`;
                        }
                        let userHtml = `<a href="/user/${userNumber}" class="benben-username" style="color: ${color};">${escapeHtml(username)}</a>`;
                        if (labelHtml) userHtml += labelHtml;

                        const forumName = forumMap[post.forum] || post.forum;
                        const forumLink = post.forum;

                        const date = new Date(post.created_at);
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        const hours = String(date.getHours()).padStart(2, '0');
                        const minutes = String(date.getMinutes()).padStart(2, '0');
                        const timeStr = `${month}-${day} ${hours}:${minutes}`;

                        html += `
                <section class="post-card">
                    <div class="post-card-body">
                        <div class="post-avatar">
                            <a href="/user/${userNumber}">
                                <img src="${prof.avatar_url || letterAvatar(username)}" alt="${escapeHtmlAttr(username)}" onerror="this.onerror=null;this.src='${letterAvatar(username)}'">
                            </a>
                        </div>
                        <div class="post-info">
                            <a href="/discuss/${post.id}" class="post-title-link">
                                ${escapeHtml(post.title)}
                            </a>
                            <div class="post-meta-line">
                                <div class="post-meta-row1">
                                    <span class="post-author-forum">${userHtml} In <a href="/discuss?forum=${forumLink}" class="forum-link"><span class="forum-name">${escapeHtml(forumName)}</span></a></span>
                                </div>
                                <div class="post-meta-row2">
                                    <span class="post-time-reply">@ ${timeStr} 0回复</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `;
                    });

                    container.innerHTML = html;

                    // 移除旧的底部控件（避免重复）
                    const oldControl = document.getElementById('recentPostsAdminControl');
                    if (oldControl) oldControl.remove();

                } catch (err) {
                    console.error('加载近期讨论失败:', err);
                    container.innerHTML = `<div class="empty-state" style="color:#e74c3c;">加载失败：${err.message || '未知错误'}</div>`;
                }
            }

            // ===== 事件委托处理函数（双击数字触发修改） =====
            function handleRecentPostsDblClick(e) {
                const target = e.target;
                const display = target.closest('#recentPostsCountDisplay');
                if (display) {
                    e.stopPropagation(); // 防止冒泡到父级
                    handleCountDblClick({ currentTarget: display });
                }
            }

            // ===== 修改显示数量（原地编辑，无箭头，无弹窗） =====
            async function handleCountDblClick(e) {
                const el = e.currentTarget;
                const current = parseInt(el.textContent.replace(/[()]/g, ''));

                const input = document.createElement('input');
                input.type = 'text';            // 改为 text，从根本上避免箭头
                input.inputMode = 'numeric';    // 移动端调出数字键盘
                input.pattern = '[0-9]*';       // 只允许数字
                input.value = current;
                input.className = 'editable-field-input';
                input.style.width = '60px';
                input.style.padding = '2px 6px';
                input.style.fontSize = '14px';
                input.style.border = '1px solid #e74c3c';
                input.style.borderRadius = '4px';
                input.style.outline = 'none';
                input.style.textAlign = 'center';
                // 移除所有 appearance 相关样式（已不需要）

                el.innerHTML = '';
                el.appendChild(input);
                input.focus();
                input.select();

                const save = async () => {
                    const raw = input.value.trim();
                    if (raw === '') {
                        el.textContent = `(${current})`;
                        return;
                    }
                    const val = parseInt(raw);
                    if (isNaN(val) || val < 1 || val > 200) {
                        el.textContent = `(${current})`;
                        return;
                    }
                    try {
                        await updateSiteSetting('recent_posts_limit', val);
                        await loadRecentPosts();
                    } catch (err) {
                        console.error('更新失败:', err);
                        el.textContent = `(${current})`;
                    }
                };

                const cancel = () => {
                    el.textContent = `(${current})`;
                };

                input.addEventListener('blur', save);
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        input.blur();
                    }
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        cancel();
                    }
                });
            }

                    console.error(err);
                    authButtons.innerHTML =
                        `<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>`;
                    // ★★★ 出错时也隐藏犇犇模块，避免显示异常内容
                    const benbenModule = document.getElementById('benbenModule');
                    if (benbenModule) benbenModule.style.display = 'none';
                    // 出错时也尝试渲染打卡卡片
                    renderPunchCard();
                }
                // 页面加载后修正初始锚点
                if (window.location.hash) {
                    setTimeout(() => {
                        const target = document.querySelector(window.location.hash);
                        if (target) {
                            const topbarHeight = document.querySelector('.topbar')?.offsetHeight || 80;
                            const targetRect = target.getBoundingClientRect();
                            window.scrollTo({ top: window.pageYOffset + targetRect.top - topbarHeight - 10 });
                        }
                    }, 300);
                }
            }

            function bindBenbenEvents() {
                if (benbenSubmit) benbenSubmit.addEventListener('click', postBenben);
                document.querySelectorAll('.benben-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        const mode = tab.dataset.mode;
                        if (mode === 'all' || mode === 'my') switchMode(mode);
                    });
                });
            }

            updateUI();
            bindBenbenEvents();
        })();
    </script>

        (function () {

            }
            var me = null;
            var mo = new MutationObserver(ensure);
            mo.observe(authBtns, { childList: true });
            function ensure() {
                if (!me || !authBtns.querySelector('.auth-btn.logout')) return;
                mo.disconnect();
                try {
                    var ue = authBtns.querySelector('.user-email');
                    if (ue && ue.parentNode) ue.parentNode.removeChild(ue);

                        var img = document.createElement('img');
                        img.alt = '头像';
                        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
                        img.onerror = function () { this.onerror = null; this.src = letterAvatar(me.username); };
                        img.src = me.avatar_url || letterAvatar(me.username);
                        av.appendChild(img);
                        wrap.appendChild(av);
                        var menu = document.createElement('div');
                        menu.id = 'topAvatarMenu';
                        menu.className = 'top-avatar-menu';
                        wrap.appendChild(menu);
                        authBtns.appendChild(wrap);
                    }
                    // 把页面渲染的"登出"按钮移进头像下拉菜单（保留原点击事件）
                    var menu = document.getElementById('topAvatarMenu');
                    var logoutEl = authBtns.querySelector('.auth-btn.logout');

                        var el = authBtns.querySelector(sel);

                } finally { mo.observe(authBtns, { childList: true }); }

            }).then(function (rr) { if (rr && rr.data) { me = rr.data; ensure(); } }).catch(function () { });
        })();
    </script>
