<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
        }

        .admin-badge {
            background: #e74c3c;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .logout-btn {
            float: right;
            background: #7f8c8d;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container" id="app">
        <button class="logout-btn" id="logoutBtn">登出</button>
        <h1>👥 用户管理</h1>
        <div class="sub">这里可以查看所有用户，并授予或撤销其他用户的管理员权限。</div>
        <div id="content">
            <div class="loading">加载中...</div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let isCurrentUserAdmin = false;

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login';
                return null;
            }
            currentUser = session.user;
            const { data, error } = await supabase
                .from('profiles')
                .select('is_admin')
                .eq('id', currentUser.id)
                .single();
            if (error || !data) {
                isCurrentUserAdmin = false;
            } else {
                isCurrentUserAdmin = data.is_admin === true;
            }
            if (!isCurrentUserAdmin) {
                document.getElementById('content').innerHTML = '<div class="error">⛔ 你没有管理员权限，无法访问此页面。</div>';
                return null;
            }
            return session;
        }

        async function loadUsers() {
            const { data: users, error } = await supabase
                .from('profiles')
                .select('id, username, email, is_admin')
                .order('created_at', { ascending: true });
            if (error) {
                document.getElementById('content').innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
                return;
            }
            renderUserTable(users);
        }

        function renderUserTable(users) {
            const html = `
            <table>
                <thead>
                    <tr><th>用户名</th><th>邮箱</th><th>管理员</th><th>操作</th></tr>
                </thead>
                <tbody>
                    ${users.map(user => `
                        <tr>
                            <td>${escapeHtml(user.username)}</td>
                            <td>${escapeHtml(user.email)}</td>
                            <td>${user.is_admin ? '<span class="admin-badge">是</span>' : '否'}</td>
                            <td>${user.id === currentUser.id ?
                    '（自己）' :
                    `<button onclick="toggleAdmin('${user.id}', ${user.is_admin})">${user.is_admin ? '撤销管理员' : '设为管理员'}</button>`
                }</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
            document.getElementById('content').innerHTML = html;
        }

        async function toggleAdmin(userId, currentIsAdmin) {
            if (!confirm(`确定要${currentIsAdmin ? '撤销' : '授予'}该用户管理员权限吗？`)) return;
            const { error } = await supabase
                .from('profiles')
                .update({ is_admin: !currentIsAdmin })
                .eq('id', userId);
            if (error) {
                alert('操作失败: ' + error.message);
            } else {
                alert('操作成功');
                loadUsers(); // 刷新列表
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = '/';
        });

        (async () => {
            const session = await checkAuth();
            if (session && isCurrentUserAdmin) {
                await loadUsers();
            }
        })();
    </script>
</body>

</html>
