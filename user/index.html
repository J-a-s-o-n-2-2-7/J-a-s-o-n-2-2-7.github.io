<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #e74c3c;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .banned {
            color: #e74c3c;
            margin-top: 20px;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .info {
            color: #5b6e8c;
            margin: 10px 0;
        }

        .button-group {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 24px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            background: #7f8c8d;
        }
    </style>
</head>

<body>
    <div class="profile-card" id="profile">
        <div class="avatar">👤</div>
        <p>加载中...</p>
    </div>
    <script>
        (async function () {
            const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const path = window.location.pathname;
            const match = path.match(/^\/user\/(\d+)/);
            const userNumber = match ? match[1] : null;
            const profileDiv = document.getElementById('profile');

            if (!userNumber) {
                profileDiv.innerHTML = '<div class="error">❌ 无效的用户编号，正确格式: /user/数字</div>';
                return;
            }

            try {
                // 获取当前登录用户信息
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw new Error(`获取登录状态失败: ${sessionError.message}`);
                const currentUserId = session?.user?.id || null;

                // 调用 RPC 获取目标用户数据（现在包含 id）
                const { data: user, error: rpcError } = await supabase.rpc('get_user_by_number', { p_user_number: parseInt(userNumber) });
                if (rpcError) throw new Error(`RPC 调用失败: ${rpcError.message}`);
                if (!user) throw new Error('用户不存在');

                // 直接比较用户 id
                const isOwner = currentUserId && user.id && currentUserId === user.id;

                document.title = `${user.username} 的个人主页 - Jason227`;
                const bannedUntil = user.banned_until ? new Date(user.banned_until) : null;
                const now = new Date();

                let html = '';
                if (bannedUntil && bannedUntil > now) {
                    html = `
                    <div class="avatar">⛔</div>
                    <h1>该用户已被封禁</h1>
                    <p class="banned">封禁至：${bannedUntil.toLocaleString()}</p>
                    <p class="info">编号 #${user.user_number}</p>
                `;
                } else {
                    html = `
                    <div class="avatar">${escapeHtml(user.username.charAt(0).toUpperCase())}</div>
                    <h1>${escapeHtml(user.username)}</h1>
                    <p class="info">编号 #${user.user_number}</p>
                    <p class="info">注册时间：${new Date(user.created_at).toLocaleDateString()}</p>
                    ${user.banned_until ? '<p class="info">⚠️ 曾封禁已解封</p>' : ''}
                `;
                    if (isOwner) {
                        html += `<div class="button-group">
                        <a href="/profile.html" class="btn">个人设置</a>
                    </div>`;
                    }
                }
                profileDiv.innerHTML = html;
            } catch (err) {
                console.error('加载出错：', err);
                profileDiv.innerHTML = `<div class="error">❌ 加载失败: ${err.message}<br>请确认编号 ${userNumber} 存在，且 RPC 函数已返回 id 字段。</div>`;
            }
        })();

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>

</html>
