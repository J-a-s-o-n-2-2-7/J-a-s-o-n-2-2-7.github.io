<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全设置 - Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .sub {
            color: #5b6e8c;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-group div {
            margin-bottom: 8px;
        }

        .info-label {
            font-weight: 600;
            color: #2c3e50;
            width: 130px;
            display: inline-block;
        }

        .info-value {
            color: #4a5b7a;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
        }

        .debug {
            background: #f0f0f0;
            padding: 10px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            text-align: left;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <h1>🔐 安全设置</h1>
        <div class="sub">修改你的用户名</div>
        <div id="content">加载中...</div>
    </div>

    <script>
        (async function () {
            // 显示错误信息的辅助函数
            function showError(msg, detail = '') {
                const container = document.getElementById('content');
                container.innerHTML = `
                <div class="error">❌ ${msg}</div>
                ${detail ? `<div class="debug">📋 详情：<br>${escapeHtml(detail)}</div>` : ''}
                <div class="back-link" style="display:block; margin-top:20px;"><a href="/">返回首页</a></div>
            `;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
            }

            try {
                // 1. 初始化 Supabase 客户端
                const SUPABASE_URL = 'https://nosikdfacxkuaxfrmoqn.supabase.co';
                const SUPABASE_ANON_KEY = 'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-';
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // 2. 获取 session
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw new Error(`会话获取失败: ${sessionError.message}`);
                if (!session) {
                    showError('请先登录', '<a href="/login">点击登录</a>');
                    return;
                }

                // 3. 查询 profiles 表
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('username, email, user_number, username_last_modified, is_super_admin, is_admin')
                    .eq('id', session.user.id)
                    .single();

                if (profileError) {
                    throw new Error(`查询 profiles 失败: ${profileError.message} (code: ${profileError.code})`);
                }
                if (!profile) throw new Error('未找到用户资料');

                // 4. 渲染页面（正常流程）
                const isSuperAdmin = profile.is_super_admin === true;
                const lastModified = profile.username_last_modified ? new Date(profile.username_last_modified) : new Date();
                const remainingDays = (function () {
                    if (!lastModified) return 0;
                    const next = new Date(lastModified);
                    next.setMonth(next.getMonth() + 4);
                    const diffMs = next - new Date();
                    return diffMs <= 0 ? 0 : Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                })();
                const canModify = isSuperAdmin || remainingDays <= 0;
                const nextAllowedText = isSuperAdmin ? '站长无限制' : (remainingDays <= 0 ? '现在即可修改' : `${remainingDays}天后`);
                const roleText = isSuperAdmin ? '👑 站长' : (profile.is_admin ? '管理员' : '普通用户');

                const container = document.getElementById('content');
                container.innerHTML = `
                <div class="info-group">
                    <div><span class="info-label">当前用户名：</span><span class="info-value">${escapeHtml(profile.username)}</span></div>
                    <div><span class="info-label">邮箱：</span><span class="info-value">${escapeHtml(profile.email)}</span></div>
                    <div><span class="info-label">上次修改：</span><span class="info-value">${lastModified.toLocaleDateString()}</span></div>
                    <div><span class="info-label">下次可改：</span><span class="info-value">${nextAllowedText}</span></div>
                    <div><span class="info-label">身份：</span><span class="info-value">${roleText}</span></div>
                </div>
                <div class="input-group">
                    <label>新用户名（6-16位字母/数字/下划线，不能以数字开头）</label>
                    <input type="text" id="newUsername" placeholder="输入新用户名" autocomplete="off">
                </div>
                <button id="updateBtn" ${!canModify ? 'disabled' : ''}>修改用户名</button>
                <div id="msg"></div>
                <div>
                    <a href="/" class="back-link">← 返回首页</a>
                    ${profile.user_number ? `<a href="/user/${profile.user_number}" class="back-link" style="margin-left:20px;">👤 我的主页</a>` : ''}
                </div>
            `;

                if (canModify) {
                    document.getElementById('updateBtn').addEventListener('click', () => updateUsername(profile.username, isSuperAdmin, lastModified));
                } else {
                    const btn = document.getElementById('updateBtn');
                    btn.title = `还需等待 ${remainingDays} 天才能修改用户名`;
                }

                // 修改用户名函数
                async function updateUsername(oldUsername, isSuperAdmin, lastModified) {
                    const newUsername = document.getElementById('newUsername').value.trim();
                    const msgDiv = document.getElementById('msg');
                    if (!newUsername) {
                        showMsg('请输入新用户名', 'error', msgDiv);
                        return;
                    }
                    if (!/^[a-zA-Z_][a-zA-Z0-9_]{5,15}$/.test(newUsername)) {
                        showMsg('用户名格式：6-16位字母/数字/下划线，不能以数字开头', 'error', msgDiv);
                        return;
                    }
                    if (newUsername === oldUsername) {
                        showMsg('新用户名与当前相同，无需修改', 'warning', msgDiv);
                        return;
                    }
                    const { data: existing } = await supabase
                        .from('profiles')
                        .select('username')
                        .eq('username', newUsername)
                        .maybeSingle();
                    if (existing) {
                        showMsg('用户名已被占用，请换一个', 'error', msgDiv);
                        return;
                    }
                    if (!isSuperAdmin) {
                        const next = new Date(lastModified);
                        next.setMonth(next.getMonth() + 4);
                        if (new Date() < next) {
                            const days = Math.ceil((next - new Date()) / (1000 * 60 * 60 * 24));
                            showMsg(`距离上次修改不足4个月，还需等待 ${days} 天`, 'error', msgDiv);
                            return;
                        }
                    }

                    const btn = document.getElementById('updateBtn');
                    btn.disabled = true;
                    btn.textContent = '提交中...';
                    const { error } = await supabase
                        .from('profiles')
                        .update({
                            username: newUsername,
                            username_last_modified: new Date().toISOString()
                        })
                        .eq('id', session.user.id);
                    btn.disabled = false;
                    btn.textContent = '修改用户名';
                    if (error) {
                        showMsg('修改失败: ' + error.message, 'error', msgDiv);
                    } else {
                        showMsg('修改成功！页面即将刷新...', 'success', msgDiv);
                        setTimeout(() => location.reload(), 1500);
                    }
                }

                function showMsg(msg, type, msgDiv) {
                    msgDiv.innerHTML = `<div class="message ${type}">${escapeHtml(msg)}</div>`;
                    setTimeout(() => { if (msgDiv) msgDiv.innerHTML = ''; }, 4000);
                }

            } catch (err) {
                console.error('加载失败:', err);
                showError(err.message, err.stack || '');
            }
        })();
    </script>
</body>

</html>
