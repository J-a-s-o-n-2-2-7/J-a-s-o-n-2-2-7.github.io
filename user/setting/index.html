<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户设置 - ✨ Jason227</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2">
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color 0.2s;
        }

        .bell-icon:hover {
            color: #e74c3c;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            min-height: 100vh;
        }

        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: white;
            border-radius: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            cursor: default;
        }

        .nav-group .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        .content-wrapper {
            margin-left: 64px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 20px;
        }

        .main-content {
            flex: 2;
            min-width: 260px;
            max-width: 1500px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 28px 32px 0 32px;
            margin-bottom: 24px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card-top .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-top h1 {
            color: #e74c3c;
            font-size: 24px;
            margin: 0;
        }

        .setting-nav {
            display: flex;
            gap: 40px;
            padding-bottom: 0;
        }

        .setting-nav .nav-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .setting-nav .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #d0d7de;
            transition: all 0.25s ease;
            transform: translateX(-50%);
        }

        .setting-nav .nav-btn:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            transform: translateX(0);
        }

        .setting-nav .nav-btn.active {
            color: #e74c3c;
            cursor: default;
        }

        .setting-nav .nav-btn.active::after {
            background: #e74c3c;
            width: 100%;
            left: 0;
            transform: translateX(0);
            height: 2px;
        }

        .setting-nav .nav-btn.active:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            height: 2px;
        }

        .form-row {
            display: flex;
            align-items: flex-start;
            gap: 32px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f2f5;
        }

        .form-row:last-of-type {
            border-bottom: none;
        }

        .form-label {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 64px;
            flex-shrink: 0;
        }

        .form-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            width: 100%;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #e9ecef;
            display: block;
        }

        .avatar-upload-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            width: auto;
        }

        .avatar-upload-btn:hover {
            background: #c0392b;
        }

        .avatar-upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .avatar-caption {
            font-size: 13px;
            color: #8a9aa8;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .avatar-caption strong {
            color: #2c3e50;
            font-weight: 600;
        }

        /* ===== 洛谷绑定卡片 ===== */
        .bind-card {
            background: white;
            border: 2px solid #e6e1da;
            border-radius: 12px;
            padding: 20px 24px;
            transition: border-color 0.3s;
            margin: 4px 0;
            width: 100%;
        }

        .bind-card.bound {
            border-color: #a5d6a7;
            background: #f9fdf9;
        }

        .bind-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bind-card .card-type {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .bind-card .card-status {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .bind-card .card-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #f5f5f5;
            color: #999;
        }

        .bind-card .card-badge.bound {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .bind-card .card-badge.unbound {
            background: #f5f5f5;
            color: #999;
        }

        .bind-card .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
        }

        .bind-card .btn:active {
            transform: scale(0.96);
        }

        .bind-card .btn-primary {
            background: #6b8a74;
            color: #fff;
        }

        .bind-card .btn-primary:hover {
            background: #55735e;
        }

        .bind-card .btn-danger {
            background: #d9534f;
            color: #fff;
        }

        .bind-card .btn-danger:hover {
            background: #c0392b;
        }

        .bind-card .btn-secondary {
            background: #7f8c8d;
            color: #fff;
        }

        .bind-card .btn-secondary:hover {
            background: #5a6a72;
        }

        .bind-card .btn-check {
            background: #d4a24e;
            color: #fff;
        }

        .bind-card .btn-check:hover {
            background: #b8893a;
        }

        .bind-card .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .bind-card .bind-detail {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f0ece6;
            display: none;
        }

        .bind-card .bind-detail.active {
            display: block;
        }

        .bind-card .bind-detail .hint {
            font-size: 13px;
            color: #7a736b;
            margin-bottom: 8px;
        }

        .bind-card .bind-detail .challenge-code {
            font-family: 'Consolas', monospace;
            font-size: 18px;
            font-weight: 700;
            background: #fce4ec;
            padding: 6px 14px;
            border-radius: 6px;
            border: 2px dashed #ef9a9a;
            cursor: pointer;
            user-select: all;
            display: inline-block;
            margin: 4px 0;
        }

        .bind-card .bind-detail .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .bind-card .bind-detail .input-group .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bind-card .bind-detail .input-group input {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            border: 1.5px solid #e6e1da;
            border-radius: 6px;
            font-size: 14px;
            background: #fdfdfc;
            outline: none;
        }

        .bind-card .bind-detail .input-group input:focus {
            border-color: #6b8a74;
            box-shadow: 0 0 0 3px rgba(107, 138, 116, 0.08);
        }

        .bind-card .bind-detail .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .bind-card .bind-msg {
            margin-top: 10px;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            display: none;
        }

        .bind-card .bind-msg.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .bind-card .bind-msg.error {
            display: block;
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .bind-card .bind-msg.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #90caf9;
        }

        .message {
            margin-top: 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            width: 100%;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 900px) {
            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .card {
                padding: 20px 18px;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .form-row {
                flex-direction: column;
                gap: 8px;
                padding: 12px 0;
            }

            .form-label {
                min-width: auto;
                padding-top: 0;
            }

            .avatar-preview {
                width: 96px;
                height: 96px;
            }

            .setting-nav {
                gap: 12px;
                flex-wrap: wrap;
            }

            .bind-card {
                padding: 16px;
            }

            .bind-card .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .bind-card .card-status {
                width: 100%;
                justify-content: space-between;
            }

            .bind-card .bind-detail .input-group .row {
                flex-direction: column;
            }
        }
    </style>
</head>

    <footer style="text-align:center; padding:24px; color:#7f8c8d; font-size:13px;">© 2026 ✨ Jason227</footer>

    <script>
        (function () {
            // ==============================================================
            // 1. Supabase 客户端
            // ==============================================================
            const supabase = window._supabaseClient || window.supabase.createClient(
                'https://nosikdfacxkuaxfrmoqn.supabase.co',
                'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
            );
            if (!window._supabaseClient) window._supabaseClient = supabase;

            let currentUser = null;
            let currentProfile = null;
            let unreadTimer = null;
            let luoguBindState = {
                challenge: '',
                expiresAt: '',
                isVerifying: false,
                isGenerating: false
            };

            // ==============================================================
            // 2. 头像逻辑（保持不变）
            // ==============================================================
            const avatarImg = document.getElementById('avatarImg');
            const avatarInput = document.getElementById('avatarInput');
            const uploadBtn = document.getElementById('uploadAvatarBtn');
            const msgDiv = document.getElementById('profileMsg');

            function showMessage(text, type) {
                type = type || 'success';
                msgDiv.innerHTML = '<div class="message ' + type + '">' + text + '</div>';
            }

            function clearMessage() { msgDiv.innerHTML = ''; }

            async function loadAvatarData() {
                if (!currentUser) {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = '/login'; return; }
                    currentUser = session.user;
                }
                const { data, error } = await supabase
                    .from('profiles')
                    .select('avatar_url')
                    .eq('id', currentUser.id)
                    .single();
                if (!error && data && data.avatar_url) {
                    avatarImg.src = data.avatar_url;
                } else {
                    avatarImg.src = 'https://placehold.co/120';
                }
            }

            async function uploadAvatar(file) {
                const fileExt = file.name.split('.').pop();
                const filePath = currentUser.id + '/avatar_' + Date.now() + '.' + fileExt;
                const { error: uploadError } = await supabase.storage
                    .from('avatars')
                    .upload(filePath, file, { upsert: true });
                if (uploadError) throw new Error('上传失败: ' + uploadError.message);
                const { data: { publicUrl } } = supabase.storage
                    .from('avatars')
                    .getPublicUrl(filePath);
                const { error: updateError } = await supabase
                    .from('profiles')
                    .update({ avatar_url: publicUrl })
                    .eq('id', currentUser.id);
                if (updateError) throw new Error('更新头像URL失败: ' + updateError.message);
                return publicUrl;
            }

            uploadBtn.addEventListener('click', function () { avatarInput.click(); });
            avatarInput.addEventListener('change', async function (e) {
                var file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件');
                    return;
                }
                uploadBtn.disabled = true;
                uploadBtn.textContent = '上传中…';
                try {
                    var url = await uploadAvatar(file);
                    avatarImg.src = url;
                    showMessage('头像更新成功！请强制刷新查看。', 'success');
                    setTimeout(clearMessage, 4000);
                } catch (err) {
                    showMessage(err.message, 'error');
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '选择头像';
                    avatarInput.value = '';
                }
            });

            // ==============================================================
            // 3. 顶部栏 & 侧边栏逻辑
            // ==============================================================
            const authButtons = document.getElementById('authButtons');

            function escapeHtmlAttr(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            async function getProfile(userId) {
                var { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username, is_admin, special_privilege, can_speak, can_manage_users, avatar_url, luogu_uid, luogu_username, luogu_bind_time')
                    .eq('id', userId)
                    .single();
                if (error) return null;
                return data;
            }

            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    var { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        var badge = document.getElementById('bell-badge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count > 99 ? '99+' : count;
                                badge.style.display = 'inline-flex';
                            } else { badge.style.display = 'none'; }
                        }
                    }
                } catch (err) { console.error(err); }
            }

            function startUnreadPolling() {
                if (unreadTimer) clearInterval(unreadTimer);
                unreadTimer = setInterval(function () {
                    if (currentProfile && document.visibilityState === 'visible') {
                        fetchUnreadCount();
                    }
                }, 30000);
            }

            async function updateUI() {
                try {
                    var { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        currentUser = session.user;
                        currentProfile = await getProfile(session.user.id);
                        if (currentProfile) {
                            var { data: banData, error: banErr } = await supabase
                                .from('profiles')
                                .select('is_banned')
                                .eq('id', session.user.id)
                                .single();
                            if (!banErr && banData && banData.is_banned === true) {
                                await supabase.auth.signOut();
                                location.reload();
                                return;
                            }
                        }

                        var displayName = currentProfile?.username || session.user.email || '用户';
                        var html = '';
                        if (currentProfile?.user_number) {
                            html += '<a href="/user/' + currentProfile.user_number + '" class="user-email">' +
                                escapeHtmlAttr(displayName) + '</a>';
                        } else {
                            html += '<span class="user-email">' + escapeHtmlAttr(displayName) + '</span>';
                        }
                        html +=
                            '<a href="/user/notification" class="bell-icon" style="color:#666;"><svg class="svg-inline--fa fa-bell" viewBox="0 0 448 512" width="20" height="20"><path fill="currentColor" d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z"></path></svg><sup id="bell-badge" style="background-color:#e74c3c; display:none;">0</sup></a>';
                        html += '<button id="logoutBtn" class="auth-btn logout">登出</button>';
                        authButtons.innerHTML = html;
                        document.getElementById('logoutBtn')?.addEventListener('click', async function () {
                            await supabase.auth.signOut();
                            location.reload();
                        });

                        await loadAvatarData();
                        await fetchUnreadCount();
                        startUnreadPolling();

                        // 渲染洛谷绑定状态
                        renderLuoguBind();
                    } else {
                        window.location.href = '/login';
                        return;
                    }
                } catch (err) {
                    console.error(err);
                    authButtons.innerHTML =
                        '<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>';
                }
            }

            // ==============================================================
            // 4. 洛谷绑定（只输入 UID，从个人签名提取）
            // ==============================================================
            const luoguBindCard = document.getElementById('luoguBindCard');
            const luoguBindStatus = document.getElementById('luoguBindStatus');
            const luoguBindDetail = document.getElementById('luoguBindDetail');
            const challengeCodeDisplay = document.getElementById('challengeCodeDisplay');
            const copyChallengeBtn = document.getElementById('copyChallengeBtn');
            const luoguUidInput = document.getElementById('luoguUidInput');
            const verifyBindBtn = document.getElementById('verifyBindBtn');
            const cancelBindBtn = document.getElementById('cancelBindBtn');
            const luoguBindMsg = document.getElementById('luoguBindMsg');

            function getLuoguBindInfo() {
                // 优先从 localStorage 读取缓存
                const cached = localStorage.getItem('luogu_bind_status');
                if (cached) {
                    try {
                        const data = JSON.parse(cached);
                        if (data.bind_time) {
                            return {
                                uid: currentProfile?.luogu_uid || '',
                                username: data.username || '',
                                bindTime: data.bind_time,
                                isBound: true
                            };
                        }
                    } catch (_) { }
                }

                if (!currentProfile) return null;
                return {
                    uid: currentProfile.luogu_uid || null,
                    username: currentProfile.luogu_username || null,
                    bindTime: currentProfile.luogu_bind_time || null,
                    isBound: !!currentProfile.luogu_bind_time
                };
            }

            function renderLuoguBind() {
                const info = getLuoguBindInfo();
                if (info && info.isBound) {
                    luoguBindCard.classList.add('bound');
                    const displayName = info.username || '已绑定';
                    luoguBindStatus.innerHTML = `
                        <span style="font-size:13px; color:#2c3e50;">已绑定：<strong style="color:#6b8a74;">${escapeHtmlAttr(displayName)}</strong></span>
                        <span class="card-badge bound">已绑定</span>
                        <button id="unbindLuoguBtn" class="btn btn-danger">解绑</button>
                    `;
                    luoguBindDetail.classList.remove('active');
                    luoguBindMsg.className = 'bind-msg';
                    luoguBindMsg.textContent = '';
                } else {
                    luoguBindCard.classList.remove('bound');
                    luoguBindStatus.innerHTML = `
                        <span style="font-size:13px; color:#2c3e50;">未绑定</span>
                        <span class="card-badge unbound">—</span>
                        <button id="startBindBtn" class="btn btn-primary">绑定洛谷账号</button>
                    `;
                    luoguBindDetail.classList.remove('active');
                    luoguBindMsg.className = 'bind-msg';
                    luoguBindMsg.textContent = '';
                }
            }

            function showLuoguMsg(text, type) {
                luoguBindMsg.textContent = text;
                luoguBindMsg.className = 'bind-msg ' + (type || 'info');
                if (type) {
                    luoguBindMsg.style.display = 'block';
                } else {
                    luoguBindMsg.style.display = 'none';
                }
            }

            // 开始绑定流程（生成挑战码）
            async function startBindProcess() {
                if (luoguBindState.isGenerating) return;
                luoguBindState.isGenerating = true;
                const startBtn = document.getElementById('startBindBtn');
                if (startBtn) startBtn.disabled = true;
                showLuoguMsg('正在生成挑战码...', 'info');

                try {
                    const token = (await supabase.auth.getSession()).data.session?.access_token;
                    if (!token) throw new Error('未登录');
                    const res = await fetch(
                        'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-luogu/generate', {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json',
                        }
                    }
                    );
                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.error || '生成挑战码失败');
                    }
                    const data = await res.json();
                    luoguBindState.challenge = data.challenge;
                    luoguBindState.expiresAt = data.expires_at;
                    challengeCodeDisplay.textContent = data.challenge;
                    luoguBindDetail.classList.add('active');
                    luoguBindMsg.className = 'bind-msg';
                    luoguBindMsg.textContent = '';
                    luoguUidInput.value = '';
                    verifyBindBtn.disabled = false;
                } catch (err) {
                    showLuoguMsg('错误: ' + err.message, 'error');
                } finally {
                    luoguBindState.isGenerating = false;
                    if (startBtn) startBtn.disabled = false;
                }
            }

            // 复制挑战码
            copyChallengeBtn.addEventListener('click', function () {
                const code = challengeCodeDisplay.textContent;
                if (code && code !== '等待生成') {
                    const fullText = `Jason227_${code}`;
                    navigator.clipboard.writeText(fullText).then(() => {
                        showLuoguMsg('已复制：' + fullText, 'success');
                        setTimeout(() => {
                            if (!luoguBindState.isVerifying) {
                                luoguBindMsg.className = 'bind-msg';
                                luoguBindMsg.textContent = '';
                            }
                        }, 2000);
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = fullText;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        showLuoguMsg('已复制：' + fullText, 'success');
                        setTimeout(() => {
                            if (!luoguBindState.isVerifying) {
                                luoguBindMsg.className = 'bind-msg';
                                luoguBindMsg.textContent = '';
                            }
                        }, 2000);
                    });
                }
            });

            // 验证绑定（只传 UID）
            verifyBindBtn.addEventListener('click', async function () {
                const uid = luoguUidInput.value.trim();

                if (!uid) {
                    showLuoguMsg('请输入洛谷 UID', 'error');
                    return;
                }
                if (!luoguBindState.challenge) {
                    showLuoguMsg('请先生成挑战码', 'error');
                    return;
                }
                if (luoguBindState.isVerifying) return;

                luoguBindState.isVerifying = true;
                verifyBindBtn.disabled = true;
                showLuoguMsg('验证中...', 'info');

                try {
                    const token = (await supabase.auth.getSession()).data.session?.access_token;
                    if (!token) throw new Error('未登录');
                    const res = await fetch(
                        'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-luogu/verify', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            luogu_uid: uid
                        })
                    }
                    );
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.error || '验证失败');
                    }
                    // 更新 currentProfile
                    if (data.profile) {
                        currentProfile = { ...currentProfile, ...data.profile };
                    } else {
                        currentProfile = await getProfile(currentUser.id);
                    }
                    const bindTime = currentProfile.luogu_bind_time || new Date().toISOString();
                    const username = currentProfile.luogu_username || '';
                    currentProfile.luogu_bind_time = bindTime;
                    localStorage.setItem('luogu_bind_status', JSON.stringify({
                        bind_time: bindTime,
                        username: username
                    }));
                    renderLuoguBind();
                    luoguBindDetail.classList.remove('active');
                    showLuoguMsg('✅ ' + (data.message || '绑定成功！'), 'success');
                } catch (err) {
                    showLuoguMsg('❌ ' + err.message, 'error');
                } finally {
                    luoguBindState.isVerifying = false;
                    verifyBindBtn.disabled = false;
                }
            });

            // 取消绑定
            cancelBindBtn.addEventListener('click', function () {
                luoguBindDetail.classList.remove('active');
                luoguBindMsg.className = 'bind-msg';
                luoguBindMsg.textContent = '';
                luoguUidInput.value = '';
                luoguBindState.challenge = '';
                renderLuoguBind();
            });

            // ==============================================================
            // 5. 事件委托（处理动态按钮）
            // ==============================================================
            const statusContainer = document.getElementById('luoguBindStatus');
            if (statusContainer) {
                statusContainer.addEventListener('click', function (e) {
                    const target = e.target;
                    if (target.id === 'startBindBtn') {
                        startBindProcess();
                    } else if (target.id === 'unbindLuoguBtn') {
                        if (!confirm('确定要解绑洛谷账号吗？')) return;
                        (async function () {
                            try {
                                const { error } = await supabase
                                    .from('profiles')
                                    .update({ luogu_uid: null, luogu_username: null, luogu_bind_time: null })
                                    .eq('id', currentUser.id);
                                if (error) throw error;
                                localStorage.removeItem('luogu_bind_status');
                                currentProfile = await getProfile(currentUser.id);
                                renderLuoguBind();
                                showLuoguMsg('已解绑', 'success');
                            } catch (err) {
                                showLuoguMsg('解绑失败: ' + err.message, 'error');
                            }
                        })();
                    }
                });
            }

            // ==============================================================
            // 6. 侧边栏滚动重置
            // ==============================================================
            const sidebar = document.querySelector('.nav-sidebar');
            if (sidebar) {
                sidebar.addEventListener('mouseleave', function () {
                    if (window.innerWidth > 900) {
                        this.scrollTop = 0;
                    }
                });
            }

            // ==============================================================
            // 7. 启动
            // ==============================================================
            updateUI();

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible' && currentProfile) {
                    fetchUnreadCount();
                }
            });

        })();
    </script>

</body>

</html>
