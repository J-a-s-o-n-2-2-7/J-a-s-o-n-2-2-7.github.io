<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>用户设置 - ✨ Jason227</title>

    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">

    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        a {
            color: #e74c3c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ========== 顶部栏 ========== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
        }

        .logo:hover {
            text-decoration: none;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color 0.2s;
        }

        .bell-icon:hover {
            color: #e74c3c;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        /* ========== 主布局 ========== */
        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            position: relative;
            min-height: 100vh;
        }

        /* ========== 侧边栏 ========== */
        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: white;
            border-radius: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            cursor: default;
        }

        .nav-group .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        /* ========== 内容区域 ========== */
        .content-wrapper {
            margin-left: 64px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 20px;
        }

        .main-content {
            flex: 2;
            min-width: 260px;
            max-width: 1500px;
        }

        /* ===== 卡片通用样式 ===== */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 28px 32px 0 32px;
            margin-bottom: 24px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card-top .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-top h1 {
            color: #e74c3c;
            font-size: 24px;
            margin: 0;
        }

        .card-bottom {
            padding-bottom: 28px;
        }

        /* ===== 导航样式 ===== */
        .setting-nav {
            display: flex;
            gap: 40px;
            padding-bottom: 0;
        }

        .setting-nav .nav-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .setting-nav .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #d0d7de;
            transition: all 0.25s ease;
            transform: translateX(-50%);
        }

        .setting-nav .nav-btn:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            transform: translateX(0);
        }

        .setting-nav .nav-btn.active {
            color: #e74c3c;
            cursor: default;
        }

        .setting-nav .nav-btn.active::after {
            background: #e74c3c;
            width: 100%;
            left: 0;
            transform: translateX(0);
            height: 2px;
        }

        .setting-nav .nav-btn.active:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            height: 2px;
        }

        #prize-detail {
            width: 100%;
            align-self: flex-start;
        }

        /* ============================================================
           奖项选择卡片样式
           ============================================================ */
        .prize-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 12px 0;
        }

        .prize-selector .selector-title {
            font-size: 25px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 28px;
            text-align: center;
        }

        .prize-cards {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 32px auto;
        }

        .prize-card {
            width: 200px;
            height: 170px;
            min-width: 170px;
            max-width: 260px;
            background: #FEFEFE;
            border-radius: 5px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }

        .prize-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.7);
        }

        .prize-card:active {
            transform: scale(0.96);
        }

        .prize-card .card-icon svg .secondary {
            transition: fill 0.25s ease;
        }

        .prize-card .card-icon svg .primary {
            transition: fill 0.25s ease;
        }

        .prize-card#oiCard:hover .card-icon svg .secondary {
            fill: #e74c3c;
        }

        .prize-card#oiCard:hover .card-icon svg .primary {
            fill: #F5B7B1;
        }

        .prize-card#icpcCard:hover .card-icon svg .secondary {
            fill: #F5B7B1;
        }

        .prize-card#icpcCard:hover .card-icon svg .primary {
            fill: #e74c3c;
        }

        .prize-card .card-icon {
            font-size: 48px;
            color: #e74c3c;
            line-height: 1;
        }

        .prize-card h2 {
            font-size: 25px;
            font-weight: 500;
            color: #404040;
            margin: 0;
        }

        /* ===== 表单行 ===== */
        .form-row {
            display: flex;
            align-items: flex-start;
            gap: 32px;
            width: 100%;
        }

        .form-row:last-of-type {
            border-bottom: none;
        }

        .form-label {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 64px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .form-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .avatar-caption {
            font-size: 13px;
            color: #808080;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .message {
            margin-top: 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            width: 100%;
            padding: 8px 16px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        /* ===== 切换按钮（模仿洛谷绑定） ===== */
        .toggle-badge-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.2s, transform 0.1s;
            white-space: nowrap;
            font-family: inherit;
            line-height: 1.4;
            color: #fff;
            margin-left: 12px;
            background: #E74C3C;
        }

        .toggle-badge-btn:hover {
            filter: brightness(1.1);
        }

        .toggle-badge-btn:active {
            transform: scale(0.96);
        }

        .toggle-badge-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 彩虹动画（与首页一致） ===== */
        @keyframes rainbow-fill {
            0% {
                fill: #e74c3c;
            }

            14.28% {
                fill: #e67e22;
            }

            28.57% {
                fill: #f1c40f;
            }

            42.85% {
                fill: #2ecc71;
            }

            57.14% {
                fill: #3498db;
            }

            71.42% {
                fill: #9b59b6;
            }

            85.71% {
                fill: #8e44ad;
            }

            100% {
                fill: #e74c3c;
            }
        }

        .rainbow-badge path {
            animation: rainbow-fill 5s linear infinite;
        }

        .rainbow-badge .fa-secondary {
            animation: rainbow-fill 3s linear infinite;
        }

        .rainbow-badge .fa-primary {
            fill: #ffffff !important;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .main-layout {
                padding: 0 16px 16px 16px;
            }

            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                border-radius: 0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                margin-bottom: 20px;
                padding: 12px 0;
                transition: none;
                overflow: visible;
                white-space: normal;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .card {
                padding: 20px 18px;
            }

            .card-top .title-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .prize-cards {
                gap: 20px;
            }

            .prize-card {
                flex: 1 1 160px;
                min-width: 140px;
                padding: 24px 16px 20px 16px;
            }

            .prize-card .card-icon {
                font-size: 38px;
            }

            .form-row {
                flex-direction: column;
                gap: 8px;
                padding: 12px 0;
            }

            .form-label {
                min-width: auto;
                padding-top: 0;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .setting-nav {
                gap: 20px;
                flex-wrap: wrap;
            }

            .setting-nav .nav-btn {
                font-size: 14px;
            }

            .auth-buttons .auth-btn {
                padding: 4px 14px;
                font-size: 12px;
            }

            .user-email {
                font-size: 12px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 8px;
            }

            .card {
                padding: 16px 14px;
            }

            .prize-selector .selector-title {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .prize-cards {
                gap: 14px;
            }

            .prize-card {
                flex: 1 1 130px;
                min-width: 110px;
                padding: 18px 12px 16px 12px;
            }

            .prize-card .card-icon {
                font-size: 32px;
            }

            .prize-card h2 {
                font-size: 15px;
            }

            .toggle-badge-btn {
                font-size: 12px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 12px 10px;
            }

            .setting-nav {
                gap: 12px;
            }

            .setting-nav .nav-btn {
                font-size: 12px;
                padding: 6px 0;
            }

            .auth-buttons .auth-btn {
                padding: 4px 10px;
                font-size: 11px;
            }

            .user-email {
                font-size: 11px;
            }

            .nav-sidebar {
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 6px;
            }

            .prize-card {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
    </style>
</head>

                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';

            function getXcpcBalloonHtml(level) {
                if (!level || level < 1) return '';

                if (level >= 1 && level <= 5) color = '#52C41A';
                else if (level >= 6 && level <= 7) color = '#3498DB';
                else if (level >= 8 && level <= 10) color = '#FFC116';

            // ==============================================================
            // 4. 渲染函数
            // ==============================================================
            function renderOiBadge(level) {
                const el = document.getElementById('oiLevelText');
                if (!el) return;
                let label = '暂无奖项';
                let badgeHtml = '';
                let buttonHtml = '';
                if (level >= 1) {
                    label = `OI 认证等级：${level}`;
                    badgeHtml = getCcfBadgeHtml(level);
                    const show = currentProfile?.show_ccf_badge !== false;
                    const btnText = show ? '设为隐藏' : '设为展示';
                    const btnClass = show ? 'btn-hide' : 'btn-show';
                    buttonHtml = `<button class="toggle-badge-btn ${btnClass}" data-field="show_ccf_badge">${btnText}</button>`;
                }
                el.innerHTML = label + '&nbsp;&nbsp;&nbsp;' + badgeHtml + buttonHtml;
            }

            function renderIcpcBadge(level) {
                const el = document.getElementById('icpcLevelText');
                if (!el) return;
                let label = '暂无奖项';
                let badgeHtml = '';
                let buttonHtml = '';
                if (level >= 1) {
                    label = `ICPC 认证等级：${level}`;
                    badgeHtml = getXcpcBalloonHtml(level);
                    const show = currentProfile?.show_xcpc_badge !== false;
                    const btnText = show ? '设为隐藏' : '设为展示';
                    const btnClass = show ? 'btn-hide' : 'btn-show';
                    buttonHtml = `<button class="toggle-badge-btn ${btnClass}" data-field="show_xcpc_badge">${btnText}</button>`;
                }
                el.innerHTML = label + '&nbsp;&nbsp;&nbsp;' + badgeHtml + buttonHtml;
            }

            // ==============================================================
            // 5. 切换字段函数（不改变本页徽章显示）
            // ==============================================================
            async function toggleBadgeVisibility(field) {
                if (!currentUser || !currentProfile) {
                    alert('请先登录');
                    return;
                }
                try {
                    const newValue = !currentProfile[field];
                    const { error } = await supabase
                        .from('profiles')
                        .update({ [field]: newValue })
                        .eq('id', currentUser.id);
                    if (error) throw error;
                    currentProfile[field] = newValue;
                    // 重新渲染两个奖项（徽章不变，按钮文字变化）
                    renderOiBadge(currentProfile?.ccf_level ?? 0);
                    renderIcpcBadge(currentProfile?.xcpc_level ?? 0);
                } catch (err) {
                    alert('切换失败：' + err.message);
                }
            }

            // 事件委托绑定切换按钮
            document.addEventListener('click', function (e) {
                const target = e.target.closest('.toggle-badge-btn');
                if (!target) return;
                e.stopPropagation();
                toggleBadgeVisibility(target.dataset.field);
            });

            // ==============================================================
            // 6. 顶部栏认证逻辑
            // ==============================================================
            const authButtons = document.getElementById('authButtons');

            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    var { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        var badge = document.getElementById('bell-badge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count > 99 ? '99+' : count;
                                badge.style.display = 'inline-flex';
                            } else { badge.style.display = 'none'; }
                        }
                    }
                } catch (err) { console.error(err); }
            }

            function startUnreadPolling() {
                if (unreadTimer) clearInterval(unreadTimer);
                unreadTimer = setInterval(function () {
                    if (currentProfile && document.visibilityState === 'visible') {
                        fetchUnreadCount();
                    }
                }, 30000);
            }

            async function updateTopbar() {
                try {
                    var { data: { session } } = await supabase.auth.getSession();

                    if (session) {
                        currentUser = session.user;
                        currentProfile = await getProfile(session.user.id);

                        if (currentProfile) {
                            var { data: banData, error: banErr } = await supabase
                                .from('profiles')
                                .select('is_banned')
                                .eq('id', session.user.id)
                                .single();
                            if (!banErr && banData && banData.is_banned === true) {
                                await supabase.auth.signOut();
                                location.reload();
                                return;
                            }
                        }

                        var displayName = currentProfile?.username || session.user.email || '用户';
                        var html = '';
                        if (currentProfile?.user_number) {
                            html += '<a href="/user/' + currentProfile.user_number + '" class="user-email">' +
                                escapeHtmlAttr(displayName) + '</a>';
                        } else {
                            html += '<span class="user-email">' + escapeHtmlAttr(displayName) + '</span>';
                        }
                        html +=
                            '<a href="/user/notification" class="bell-icon" style="color:#666;"><svg class="svg-inline--fa fa-bell" viewBox="0 0 448 512" width="20" height="20"><path fill="currentColor" d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z"></path></svg><sup id="bell-badge" style="background-color:#e74c3c; display:none;">0</sup></a>';
                        html += '<button id="logoutBtn" class="auth-btn logout">登出</button>';
                        authButtons.innerHTML = html;
                        document.getElementById('logoutBtn')?.addEventListener('click', async function () {
                            await supabase.auth.signOut();
                            location.reload();
                        });

                        await fetchUnreadCount();
                        startUnreadPolling();

                        // 加载数据并渲染两个奖项
                        const ccfLevel = currentProfile?.ccf_level ?? 0;
                        const xcpcLevel = currentProfile?.xcpc_level ?? 0;
                        renderOiBadge(ccfLevel);
                        renderIcpcBadge(xcpcLevel);

                        var userManageItem = document.getElementById('userManageItem');
                        if (userManageItem) {
                            if (currentProfile && currentProfile.can_manage_users === true) {
                                userManageItem.style.display = 'flex';
                            } else {
                                userManageItem.style.display = 'none';
                            }
                        }

                    } else {
                        window.location.href = '/login';
                        return;
                    }
                } catch (err) {
                    console.error(err);
                    authButtons.innerHTML =
                        '<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>';
                }
            }

            // ==============================================================
            // 7. 奖项卡片点击
            // ==============================================================
            function setupPrizeCards() {
                const oiCard = document.getElementById('oiCard');
                const icpcCard = document.getElementById('icpcCard');
                const selection = document.getElementById('prize-selection');
                const detail = document.getElementById('prize-detail');
                const oiDetail = document.getElementById('oi-detail');
                const icpcDetail = document.getElementById('icpc-detail');

                function showDetail(type) {
                    selection.style.display = 'none';
                    detail.style.display = 'block';
                    if (type === 'oi') {
                        oiDetail.style.display = 'flex';
                        icpcDetail.style.display = 'none';
                    } else {
                        oiDetail.style.display = 'none';
                        icpcDetail.style.display = 'flex';
                    }
                    // 重新渲染（确保数据最新）
                    const ccfLevel = currentProfile?.ccf_level ?? 0;
                    const xcpcLevel = currentProfile?.xcpc_level ?? 0;
                    renderOiBadge(ccfLevel);
                    renderIcpcBadge(xcpcLevel);
                }

                if (oiCard) {
                    oiCard.addEventListener('click', function () {
                        showDetail('oi');
                    });
                }
                if (icpcCard) {
                    icpcCard.addEventListener('click', function () {
                        showDetail('icpc');
                    });
                }
            }

            // ==============================================================
            // 8. 侧边栏滚动复位
            // ==============================================================
            const sidebar = document.querySelector('.nav-sidebar');
            if (sidebar) {
                sidebar.addEventListener('mouseleave', function () {
                    if (window.innerWidth > 900) {
                        this.scrollTop = 0;
                    }
                });
            }

            // ==============================================================
            // 9. 启动
            // ==============================================================
            (async function init() {
                await updateTopbar();
                setupPrizeCards();
            })();

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible' && currentProfile) {
                    fetchUnreadCount();
                }
            });

        })();
    </script>

</body>

</html>
