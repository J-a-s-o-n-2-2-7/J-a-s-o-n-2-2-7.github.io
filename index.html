            // ---------- 业务函数 ----------
            async function fetchUnreadCount() {
                if (!currentProfile) return;
                try {
                    const { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        const badge = document.getElementById('bell-badge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count > 99 ? '99+' : count;
                                badge.style.display = 'inline-flex';
                            } else { badge.style.display = 'none'; }
                        }
                    }
                } catch (err) { console.error(err); }
            }

            function startUnreadPolling() {
                if (unreadTimer) clearInterval(unreadTimer);
                unreadTimer = setInterval(() => {
                    if (currentProfile && document.visibilityState === 'visible') {
                        fetchUnreadCount();
                    }
                }, 30000);
            }

            function stopUnreadPolling() {
                if (unreadTimer) {
                    clearInterval(unreadTimer);
                    unreadTimer = null;
                }
            }

            async function loadBenbenList(reset = true) {
                if (isLoading) return;
                if (reset) {
                    hasMore = true;
                    lastId = null;
                    if (benbenList) benbenList.innerHTML = '';
                    const existing = document.querySelector('.no-more-message');
                    if (existing) existing.remove();
                    // 重置时，显示加载提示
                    if (loadingSentinel) {
                        loadingSentinel.style.display = 'block';
                        loadingSentinel.textContent = '滚动加载更多...';
                    }
                }
                if (!hasMore) {
                    if (loadingSentinel) {
                        loadingSentinel.style.display = 'block';
                        loadingSentinel.textContent = '没有更多动态了';
                    }
                    return;
                }
                isLoading = true;
                if (loadingSentinel) {
                    loadingSentinel.style.display = 'block';
                    loadingSentinel.textContent = '加载中...';
                }
                try {
                    let query = supabase.from('benben')
                        .select(`
                *, 
                profiles:user_number (
                    username,
                    is_admin,
                    is_cheater,
                    username_color,
                    user_tag,
                    avatar_url
                )
            `)
                        .eq('is_deleted', false)
                        .order('created_at', { ascending: false })
                        .limit(20);
                    if (lastId) query = query.lt('id', lastId);
                    if (feedMode === 'my' && currentProfile) {
                        query = query.eq('user_number', currentProfile.user_number);
                    }
                    const { data, error } = await query;
                    if (error) throw error;

                    // 处理提及
                    const mentionSet = new Set();
                    data?.forEach(item => {
                        const matches = item.content.match(/@([\u4e00-\u9fa5a-zA-Z0-9_.-]+)/g);
                        if (matches) matches.forEach(m => mentionSet.add(m.slice(1)));
                    });
                    let mentionMap = {};
                    if (mentionSet.size > 0) {
                        const usernames = Array.from(mentionSet);
                        const { data: userData, error: userError } = await supabase.from('profiles')
                            .select('username, user_number')
                            .in('username', usernames);
                        if (!userError && userData) {
                            userData.forEach(u => { mentionMap[u.username] = u.user_number; });
                        }
                    }

                    if (data && data.length > 0) {
                        await renderBenbenList(data, reset, mentionMap);
                        lastId = data[data.length - 1].id;
                        if (data.length < 20) {
                            hasMore = false;
                            if (loadingSentinel) {
                                loadingSentinel.style.display = 'block';
                                loadingSentinel.textContent = '没有更多动态了';
                            }
                        } else {
                            hasMore = true;
                            if (loadingSentinel) {
                                loadingSentinel.style.display = 'block';
                                loadingSentinel.textContent = '滚动加载更多...';
                            }
                        }
                    } else {
                        hasMore = false;
                        if (reset) {
                            benbenList.innerHTML = '<div class="benben-empty">没有更多动态了</div>';
                        }
                        if (loadingSentinel) {
                            loadingSentinel.style.display = 'block';
                            loadingSentinel.textContent = '没有更多动态了';
                        }
                    }
                } catch (error) {
                    console.error(error);
                    if (reset && benbenList && benbenList.children.length === 0) {
                        benbenList.innerHTML = '<div class="benben-empty">加载失败，请刷新重试</div>';
                    }
                    // 出错时也显示哨兵
                    if (loadingSentinel) {
                        loadingSentinel.style.display = 'block';
                        loadingSentinel.textContent = '加载出错，请刷新';
                    }
                } finally {
                    isLoading = false;
                    // 注意：这里不再隐藏 loadingSentinel！
                }
            }

            function renderMermaid() {
                if (typeof mermaid === 'undefined') return;
                mermaid.initialize({
                    theme: 'default',
                    startOnLoad: false,
                    // 其他配置...
                });
                // 使用 requestAnimationFrame 或 setTimeout 确保 DOM 已渲染
                requestAnimationFrame(() => {
                    mermaid.run({
                        nodes: document.querySelectorAll('.mermaid')
                    }).catch(err => console.warn('Mermaid 渲染失败:', err));
                });
            }

            // ================================================================
            // ★★★ 修改 renderBenbenList：颜色逻辑调整 ★★★
            // ================================================================
            async function renderBenbenList(data, reset, mentionMap = {}) {
                if (!benbenList) return;
                if (reset) benbenList.innerHTML = '';
                const mentionMapJson = JSON.stringify(mentionMap);
                for (const item of data) {
                    const isOwner = currentProfile && currentProfile.user_number === item.user_number;
                    const fullContentEncoded = encodeURIComponent(item.content);
                    const username = escapeHtmlAttr(item.profiles?.username || '用户');
                    const timeStr = new Date(item.created_at).toLocaleString('zh-CN');
                    const rawContent = item.content;

                    const prof = item.profiles || {};
                    const avatarUrl = prof.avatar_url || '';
                    const isAdmin = prof.is_admin || false;
                    const userTag = prof.user_tag || '';
                    // 棕名以 is_cheater 为唯一真源；否则用 username_color，空则按 isAdmin 给默认值
                    const color = prof.is_cheater ? '#AD8B00' : (isAdmin ? '#9D3DCF' : (prof.username_color || '#333'));

                    // 生成用户标签（如果有自定义标签或管理员身份）
                    let labelHtml = '';
                    if (userTag) {
                        // 自定义标签，背景色跟随 color
                        labelHtml =
                            `<span class="user-tag-display" style="background-color: ${color};">${escapeHtml(userTag)}</span>`;
                    } else if (isAdmin) {
                        // 管理员身份且无自定义标签，显示“管理员”标签，背景色同样跟随
                        labelHtml =
                            `<span class="user-tag-display" style="background-color: ${color};">管理员</span>`;
                    }

                    // 用户名颜色直接使用 color
                    let userHtml = `<span class="benben-user"><a href="/user/${item.user_number}" class="benben-username" style="color: ${color};">${username}</a>`;
                    if (labelHtml) {
                        userHtml += labelHtml;
                    }
                    userHtml += `</span>`;

                    const benbenHtml = `
                        <div class="benben-item" data-id="${item.id}">
                            <div class="benben-avatar"><a href="/user/${item.user_number}"><img src="${avatarUrl || letterAvatar(item.profiles?.username || '用户')}" alt="${username}" onerror="this.onerror=null;this.src='${letterAvatar(item.profiles?.username || '用户')}'"></a></div>
                            <div class="benben-content">
                                <div class="benben-item-header">
                                    <div class="post-author">
                                        ${userHtml}
                                        <span class="benben-time">${timeStr}</span>
                                    </div>
                                    <div class="benben-actions">
                                        <button class="benben-report-btn" data-id="${item.id}">举报</button>
                                        <button class="benben-reply-btn" data-replyto-id="${item.id}" data-username="${username}" data-fullcontent="${fullContentEncoded}">回复</button>
                                        ${isOwner ? `<button class="benben-delete" data-id="${item.id}">删除</button>` : ''}
                                    </div>
                                </div>
                                <div class="benben-text" data-raw="${escapeHtmlAttr(rawContent)}" data-mention-map='${escapeHtmlAttr(mentionMapJson)}'></div>
                            </div>
                        </div>
                    `;
                    benbenList.insertAdjacentHTML('beforeend', benbenHtml);
                    // ===== 新增：只渲染刚插入的这一条（不动旧的） =====
                    const newItem = benbenList.lastElementChild;
                    const textEl = newItem.querySelector('.benben-text');
                    if (textEl) {
                        const rawEncoded = textEl.getAttribute('data-raw');
                        const mentionMapStr = textEl.getAttribute('data-mention-map');
                        if (rawEncoded) {
                            let map = {};
                            try { map = JSON.parse(mentionMapStr || '{}'); } catch (e) { }
                            textEl.innerHTML = renderContent(
                                rawEncoded,
                                map,
                                currentProfile?.special_privilege || false,
                                currentProfile?.username || '用户',
                                'benben-' + item.id   // ← 新增唯一前缀
                            );
                        }
                    }
                }
                document.querySelectorAll('.benben-delete').forEach(btn => btn.addEventListener('click', async (e) => {
                    e
                        .stopPropagation();
                    await deleteBenben(btn.dataset.id);
                }));
                document.querySelectorAll('.benben-reply-btn').forEach(btn => btn.addEventListener('click', () => {
                    const replyToId = btn.dataset.replytoId;
                    const username = btn.dataset.username;
                    const fullContent = decodeURIComponent(btn.dataset.fullcontent)
                        .replace(/&lt;/g, '<')
                        .replace(/&gt;/g, '>');
                    currentReplyingId = replyToId;
                    currentReplyUsername = username;
                    const replyText = ` || @${username} : ${fullContent}`;
                    if (benbenContent) {
                        benbenContent.value = replyText;
                        benbenContent.focus();
                        benbenContent.setSelectionRange(0, 0);
                    }
                }));
                // 渲染刚插入的 Mermaid 图表
                renderMermaid();
                document.querySelectorAll('.benben-report-btn').forEach(btn => btn.addEventListener('click', () =>
                    alert('举报功能暂未开放，请联系管理员。')));
                // renderAllBenbenTexts();
            }

            async function deleteBenben(id) {
                try {
                    const { error } = await supabase.from('benben').update({ is_deleted: true }).eq('id', id);
                    if (error) throw error;
                    loadBenbenList(true);
                } catch (error) {
                    console.error(error);
                    alert('删除失败：' + error.message);
                }
            }

            async function postBenben() {
                let content = benbenContent?.value.trim();
                if (!content) { alert('内容不能为空'); return; }
                if (!currentProfile) { window.location.href = '/auth/login'; return; }

                if (currentProfile.can_speak === false) {
                    alert('你已被禁言，无法发布犇犇');
                    return;
                }

                let finalReplyToId = null;
                if (currentReplyingId && currentReplyUsername) {
                    const trimmed = content.trimStart();
                    const prefix = `|| @${currentReplyUsername} :`;
                    if (trimmed.startsWith(prefix)) {
                        finalReplyToId = currentReplyingId;
                    } else {
                        currentReplyingId = null;
                        currentReplyUsername = null;
                    }
                }

                let finalContent = currentProfile.is_admin ? content : content.substring(0, MAX_LENGTH);
                // 不再转义尖括号，由 renderContent 全局处理
                const insertData = {
                    user_number: currentProfile.user_number, content: finalContent,
                    is_deleted: false
                };
                if (finalReplyToId) {
                    insertData.reply_to = finalReplyToId;
                }

                try {
                    const { data: newBenben, error: insertError } = await supabase.from('benben').insert(insertData)
                        .select().single();
                    if (insertError) throw insertError;
                    const newBenbenId = newBenben.id;

                    if (finalReplyToId) {
                        const { data: originalBenben } = await supabase.from('benben').select('user_number').eq('id',
                            finalReplyToId).single();
                        if (originalBenben && originalBenben.user_number !== currentProfile.user_number) {
                            await supabase.from('notifications').insert({
                                user_number: originalBenben.user_number,
                                from_user_number: currentProfile.user_number,
                                type: 'reply',
                                benben_id: newBenbenId,
                                content: '回复了你的犇犇'
                            });
                        }
                    }

                    const mentionRegex = /@([\u4e00-\u9fa5a-zA-Z0-9_.\- ]+)/g;
                    let match;
                    const mentionedSet = new Set();
                    while ((match = mentionRegex.exec(content)) !== null) mentionedSet.add(match[1]);
                    if (mentionedSet.size > 0) {
                        const usernames = Array.from(mentionedSet);
                        const { data: userData } = await supabase.from('profiles').select('user_number, username')
                            .in('username', usernames);
                        if (userData) {
                            const notifications = [];
                            for (const user of userData) {
                                if (user.user_number !== currentProfile.user_number) {
                                    notifications.push({
                                        user_number: user.user_number,
                                        from_user_number: currentProfile.user_number,
                                        type: 'mention',
                                        benben_id: newBenbenId,
                                        content: '在犇犇中提到了你'
                                    });
                                }
                            }
                            if (notifications.length > 0) await supabase.from('notifications').insert(
                                notifications);
                        }
                    }

                    if (benbenContent) benbenContent.value = '';
                    currentReplyingId = null;
                    currentReplyUsername = null;
                    loadBenbenList(true);
                    fetchUnreadCount();
                } catch (error) {
                    console.error(error);
                    alert('发布失败：' + (error.message || '未知错误'));
                }
            }

            function switchMode(mode) {
                feedMode = mode;
                lastId = null;
                hasMore = true;
                currentReplyingId = null;
                loadBenbenList(true);
                document.querySelectorAll('.benben-tab').forEach(tab => {
                    if (tab.dataset.mode === mode) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
            }

            function setupInfiniteScroll() {
                if (!loadingSentinel) return;
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && !isLoading && hasMore && currentProfile) {
                        loadBenbenList(false);
                    }
                }, { threshold: 0.1 });
                observer.observe(loadingSentinel);
            }

            async function getProfile(userId) {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username, is_admin, special_privilege, can_speak, can_manage_users') // ← 增加此项
                    .eq('id', userId)
                    .single();
                if (error) return null;
                return data;
            }

            async function loadRecentPosts() {

                try {

                        .from('posts')

                    let userMap = {};

                            .from('profiles')
                            .select('id, username, user_number, username_color, user_tag, is_admin, is_cheater, avatar_url')
                            .in('id', authorIds);

                            if (target) {
                                e.preventDefault();
                                const topbarHeight = document.querySelector('.topbar')?.offsetHeight || 80;
                                const targetRect = target.getBoundingClientRect();
                                const scrollTop = window.pageYOffset + targetRect.top - topbarHeight - 10;
                                window.scrollTo({ top: scrollTop, behavior: 'smooth' });
                            }
                        }, { passive: false });

                        // ★ 新增：用户管理按钮控制
                        const userManageItem = document.getElementById('userManageItem');
                        if (userManageItem) {
                            if (currentProfile && currentProfile.can_manage_users === true) {
                                userManageItem.style.display = 'flex';
                            } else {
                                userManageItem.style.display = 'none';
                            }
                        }

                    } else {
                        // ======== 未登录 ========
                        // ★★★ 隐藏整个犇犇模块（包括标题、编辑器、导航、列表）
                        if (benbenModule) benbenModule.style.display = 'none';

                        currentUser = null;
                        currentProfile = null;
                        authButtons.innerHTML =
                            `<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>`;

                        // ★★★ 未登录：不加载犇犇列表，不设置无限滚动（模块已隐藏）
                        // 原有代码中的 loadBenbenList(true) 和 setupInfiniteScroll 已被移除

                        stopUnreadPolling();
                        loadRecentPosts();
                    }
                } catch (err) {
                    console.error(err);
                    authButtons.innerHTML =
                        `<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>`;
                    // ★★★ 出错时也隐藏犇犇模块，避免显示异常内容
                    const benbenModule = document.getElementById('benbenModule');
                    if (benbenModule) benbenModule.style.display = 'none';
                }
                // 页面加载后修正初始锚点
                if (window.location.hash) {
                    setTimeout(() => {
                        const target = document.querySelector(window.location.hash);
                        if (target) {
                            const topbarHeight = document.querySelector('.topbar')?.offsetHeight || 80;
                            const targetRect = target.getBoundingClientRect();
                            window.scrollTo({ top: window.pageYOffset + targetRect.top - topbarHeight - 10 });
                        }
                    }, 300);
                }
            }

            function bindBenbenEvents() {
                if (benbenSubmit) benbenSubmit.addEventListener('click', postBenben);
                document.querySelectorAll('.benben-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        const mode = tab.dataset.mode;
                        if (mode === 'all' || mode === 'my') switchMode(mode);
                    });
                });
            }

            updateUI();
            bindBenbenEvents();
        })();
    </script>
