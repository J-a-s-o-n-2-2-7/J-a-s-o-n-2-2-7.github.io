    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户设置 - ✨ Jason227</title>

    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        a{
            color: #e74c3c;
            text-decoration: none;
        }

        a:hover{
            text-decoration: underline;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
        }

        .logo:hover {
            text-decoration: none;
        }

        .auth-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .auth-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .auth-btn.logout {
            background: #7f8c8d;
        }

        .user-email {
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
        }

        .user-email:hover {
            text-decoration: underline;
        }

        .bell-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: color 0.2s;
        }

        .bell-icon:hover {
            color: #e74c3c;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }

        .bell-icon sup {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            min-height: 100vh;
        }

        .nav-sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            width: 64px;
            background: white;
            border-radius: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: nowrap;
            z-index: 150;
        }

        .nav-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .nav-sidebar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .nav-sidebar:hover {
            width: 260px;
        }

        .nav-item,
        .group-title {
            padding: 10px 16px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-item:hover,
        .group-title:hover {
            background: #f0f2f5;
            color: #e74c3c;
            text-decoration: none;
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-group .group-title {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            cursor: default;
        }

        .nav-group .group-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .nav-sidebar:hover .nav-text {
            opacity: 1;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 8px 0;
        }

        .content-wrapper {
            margin-left: 64px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 20px;
        }

        .main-content {
            flex: 2;
            min-width: 260px;
            max-width: 1500px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 28px 32px 0 32px;
            margin-bottom: 24px;
        }

        .card-bottom {
            padding-bottom: 28px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card-top .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-top h1 {
            color: #e74c3c;
            font-size: 24px;
            margin: 0;
        }

        .setting-nav {
            display: flex;
            gap: 40px;
            padding-bottom: 0;
        }

        .setting-nav .nav-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #6c7a8e;
            padding: 8px 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .setting-nav .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #d0d7de;
            transition: all 0.25s ease;
            transform: translateX(-50%);
        }

        .setting-nav .nav-btn:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            transform: translateX(0);
        }

        .setting-nav .nav-btn.active {
            color: #e74c3c;
            cursor: default;
        }

        .setting-nav .nav-btn.active::after {
            background: #e74c3c;
            width: 100%;
            left: 0;
            transform: translateX(0);
            height: 2px;
        }

        .setting-nav .nav-btn.active:hover::after {
            width: calc(100% + 20px);
            left: -10px;
            height: 2px;
        }

        .form-row {
            display: flex;
            align-items: flex-start;
            gap: 32px;
        }

        .form-row:last-of-type {
            border-bottom: none;
        }

        .form-label {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 64px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .form-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            width: 100%;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #e9ecef;
            display: block;
        }

        /* ============================================
           选择头像按钮 ———— 模仿解绑按钮样式
           ============================================ */
        .avatar-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            white-space: nowrap;
            font-family: inherit;
            line-height: 1.4;
            background: #E74C3C;
            color: #fff;
            width: auto;
        }

        .avatar-upload-btn:hover {
            filter: brightness(1.1);
        }

        .avatar-upload-btn:active {
            transform: scale(0.96);
        }

        .avatar-upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .avatar-caption {
            font-size: 13px;
            color: #808080;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .avatar-caption strong {
            font-weight: 600;
        }

        /* ============================================
           洛谷绑定 ———— 扁平化，仿 Codeforces 风格
           ============================================ */
        .bind-card {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            gap: 12px 18px;
        }

        /* 状态 + 按钮 容器，靠右对齐 */
        .bind-card .card-status {
            display: flex;
            align-items: center;
            gap: 64px;
            flex-wrap: wrap;
        }

        /* 状态文本 */
        .bind-card .status-text {
            font-size: 15px;
            color: #808080;
            white-space: nowrap;
            line-height: 1.4;
        }

        .bind-card .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.2s, transform 0.1s;
            white-space: nowrap;
            font-family: inherit;
            line-height: 1.4;
            background: #13C2C2;
            color: #fff;
        }

        .bind-card .btn:hover {
            filter: brightness(1.1);
        }

        .bind-card .btn:active {
            transform: scale(0.96);
        }

        .bind-card .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .bind-card .btn-danger {
            background: #E74C3C;
        }

        /* ===== 验证码代码块样式（仿 markdown-renderer） ===== */
        .challenge-code-wrapper {
            position: relative;
            margin: 12px 0;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            padding: 16px 20px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .challenge-code-wrapper .code-text {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #c62828;
            text-align: center;
            flex: 1;
            user-select: all;
            cursor: pointer;
        }

        .challenge-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
            width: 30px;
            height: 30px;
        }

        .challenge-code-wrapper:hover .challenge-copy-btn {
            opacity: 1;
        }

        .challenge-copy-btn:hover {
            background: #ddd;
        }

        .challenge-copy-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        #luoguLink {
            color: #E74C3C;
            text-decoration: none;
            font-weight: 500;
        }

        #luoguLink:hover {
            text-decoration: underline;
        }

        /* 防止洛谷绑定加载时卡片高度跳动 */
        #luoguBindStatus {
            min-height: 36px;      /* 与加载后（文本+按钮）的高度相匹配 */
            display: flex;
            align-items: center;   /* 让内容垂直居中，避免偏上 */
        }

        /* ===== 右上角 Toast 通知（仿 markdown-renderer） ===== */
        .swal2-toast-copy {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 9999;
            opacity: 0;
            transform: scale(0.8) translateY(-20px);
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-width: 200px;
            box-sizing: border-box;
        }
        .swal2-toast-copy.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .swal2-toast-copy .success-icon {
            flex-shrink: 0;
        }
        .swal2-toast-copy .toast-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            line-height: 1.4;
        }

        .message {
            margin-top: 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            width: 100%;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .nav-sidebar {
                position: relative;
                top: auto;
                left: auto;
                height: auto;
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
            }

            .nav-sidebar:hover {
                width: 100%;
            }

            .nav-text {
                opacity: 1;
            }

            .content-wrapper {
                margin-left: 0;
                padding-top: 0;
            }

            .card {
                padding: 20px 18px;
            }

            .bind-card .card-status {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .form-row {
                flex-direction: column;
                gap: 8px;
                padding: 12px 0;
            }

            .form-label {
                min-width: auto;
                padding-top: 0;
            }

            .avatar-preview {
                width: 96px;
                height: 96px;
            }

            .setting-nav {
                gap: 12px;
                flex-wrap: wrap;
            }

            .bind-card {
                gap: 8px;
            }

            .bind-card .card-status {
                flex-wrap: wrap;
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        (function () {
            // ==============================================================

            const supabase = window._supabaseClient || window.supabase.createClient(
                'https://nosikdfacxkuaxfrmoqn.supabase.co',
                'sb_publishable_oKXNXCWRhkho-OQPXE9LwA_74bqI5h-'
            );
            if (!window._supabaseClient) window._supabaseClient = supabase;

            let currentUser = null;
            let currentProfile = null;
            let unreadTimer = null;

            // ==============================================================
            // 2. 头像逻辑
            // ==============================================================
            const avatarImg = document.getElementById('avatarImg');
            const avatarInput = document.getElementById('avatarInput');
            const uploadBtn = document.getElementById('uploadAvatarBtn');
            const msgDiv = document.getElementById('profileMsg');

            function showMessage(text, type) {
                type = type || 'success';
                msgDiv.innerHTML = '<div class="message ' + type + '">' + text + '</div>';
            }

            function clearMessage() { msgDiv.innerHTML = ''; }

            async function loadAvatarData() {
                if (!currentUser) {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = '/login'; return; }
                    currentUser = session.user;
                }
                const { data, error } = await supabase
                    .from('profiles')
                    .select('avatar_url')
                    .eq('id', currentUser.id)
                    .single();
                if (!error && data && data.avatar_url) {
                    avatarImg.src = data.avatar_url;
                } else {
                    avatarImg.src = 'https://placehold.co/120';
                }
            }

            async function uploadAvatar(file) {
                const fileExt = file.name.split('.').pop();
                const filePath = currentUser.id + '/avatar_' + Date.now() + '.' + fileExt;
                const { error: uploadError } = await supabase.storage
                    .from('avatars')
                    .upload(filePath, file, { upsert: true });
                if (uploadError) throw new Error('上传失败: ' + uploadError.message);
                const { data: { publicUrl } } = supabase.storage
                    .from('avatars')
                    .getPublicUrl(filePath);
                const { error: updateError } = await supabase
                    .from('profiles')
                    .update({ avatar_url: publicUrl })
                    .eq('id', currentUser.id);
                if (updateError) throw new Error('更新头像URL失败: ' + updateError.message);
                return publicUrl;
            }

            uploadBtn.addEventListener('click', function () { avatarInput.click(); });
            avatarInput.addEventListener('change', async function (e) {
                var file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件');
                    return;
                }
                uploadBtn.disabled = true;
                uploadBtn.textContent = '上传中…';
                try {
                    var url = await uploadAvatar(file);
                    avatarImg.src = url;
                    showMessage('头像更新成功！请强制刷新查看。', 'success');
                    setTimeout(clearMessage, 4000);
                } catch (err) {
                    showMessage(err.message, 'error');
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '选择头像';
                    avatarInput.value = '';
                }
            });

            // ==============================================================
            // 3. 顶部栏 & 侧边栏逻辑
            // ==============================================================
            const authButtons = document.getElementById('authButtons');

            function escapeHtmlAttr(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            async function getProfile(userId) {
                var { data, error } = await supabase
                    .from('profiles')
                    .select('user_number, username, is_admin, can_speak, can_manage_users, avatar_url, luogu_uid, luogu_username, luogu_bind_time')
                    .eq('id', userId)
                    .single();
                if (error) return null;
                return data;
            }

            async function fetchUnreadCount() {
                if (!currentProfile) return;

                    var { count, error } = await supabase.from('notifications').select('*', {
                        count: 'exact',
                        head: true
                    }).eq('user_number', currentProfile.user_number).eq('read', false);
                    if (!error && count !== null) {
                        var badge = document.getElementById('bell-badge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count > 99 ? '99+' : count;
                                badge.style.display = 'inline-flex';
                            } else { badge.style.display = 'none'; }
                        }
                    }
                } catch (err) { console.error(err); }
            }

            function startUnreadPolling() {
                if (unreadTimer) clearInterval(unreadTimer);
                unreadTimer = setInterval(function () {
                    if (currentProfile && document.visibilityState === 'visible') {
                        fetchUnreadCount();
                    }
                }, 30000);
            }

            // ==============================================================
            // 4. 洛谷绑定渲染
            // ==============================================================
            function getLuoguBindInfo() {
                if (!currentProfile) return null;
                return {
                    uid: currentProfile.luogu_uid || null,
                    username: currentProfile.luogu_username || null,
                    bindTime: currentProfile.luogu_bind_time || null,
                    isBound: !!currentProfile.luogu_bind_time
                };
            }

            function renderLuoguBind() {
                const info = getLuoguBindInfo();
                const statusContainer = document.getElementById('luoguBindStatus');
                if (!statusContainer) return;

                if (info && info.isBound) {
                    const displayName = info.username || '已绑定';
                    statusContainer.innerHTML = `
                        <span class="status-text bound"><strong>${escapeHtmlAttr(displayName)}</strong></span>
                        <button id="unbindLuoguBtn" class="btn btn-danger">解绑</button>
                    `;
                } else {
                    statusContainer.innerHTML = `
                        <span class="status-text unbound">从未绑定</span>
                        <button id="startBindBtn" class="btn">绑定</button>
                    `;
                }

            // ==================== 洛谷绑定三步向导 ====================
            let wizardData = {
                challenge: '',
                uid: '',
                captcha: ''

            // 生成图形验证码（模仿注册页面样式）
            function generateCaptcha() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
                let code = '';
                for (let i = 0; i < 5; i++) {
                    code += chars[Math.floor(Math.random() * chars.length)];
                }
                return code.toUpperCase();  // 返回大写，方便比较
            }

            function drawCaptcha(canvas, code) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                // 清空并设置背景色（#f9fafb）
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#f9fafb';
                ctx.fillRect(0, 0, w, h);

                // 干扰线（10条）
                for (let i = 0; i < 10; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * w, Math.random() * h);
                    ctx.lineTo(Math.random() * w, Math.random() * h);
                    ctx.strokeStyle = `rgba(100,100,100,${0.2 + Math.random() * 0.5})`;
                    ctx.stroke();
                }

                // 噪点（100个）
                for (let i = 0; i < 100; i++) {
                    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
                    ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
                }

                // 绘制验证码字符
                for (let i = 0; i < code.length; i++) {
                    const fontSize = 24 + Math.floor(Math.random() * 6);
                    ctx.font = `${fontSize}px "Courier New", monospace`;
                    ctx.fillStyle = `rgb(${50 + Math.random() * 100}, ${30 + Math.random() * 80}, ${20 + Math.random() * 70})`;
                    const x = 12 + i * 20 + Math.random() * 6;
                    const y = 30 + Math.random() * 8;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate((Math.random() - 0.5) * 0.4);
                    ctx.fillText(code[i], 0, 0);
                    ctx.restore();
                }
            }

            function showCopyToast() {
                let toast = document.querySelector('.swal2-toast-copy');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.className = 'swal2-toast-copy';
                    toast.innerHTML = `
            <svg class="success-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#a5dc86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            <h2 class="toast-title">已复制</h2>
        `;
                    document.body.appendChild(toast);
                } else {
                    toast.classList.remove('show');
                    void toast.offsetWidth;
                }
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);

            // 启动向导
            async function startBindWizard() {

                    },

                    // ========== 第 3 步：验证码 ==========
                    {
                        title: '验证码',
                        html: `
        <style>

        </style>
        <div>
            将以下验证码复制到你的洛谷个人签名中（<a id="luoguLink" href="#" target="_blank">点击前往</a>）
            <div class="challenge-code-wrapper">
                <span class="code-text" id="challengeDisplay">生成中...</span>
                <button class="challenge-copy-btn" id="challengeCopyBtn">
                    <svg viewBox="0 0 448 512" aria-hidden="true">
                        <path d="M192 0c-35.3 0-64 28.7-64 64l0 256c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-200.6c0-17.4-7.1-34.1-19.7-46.2L370.6 17.8C358.7 6.4 342.8 0 326.3 0L192 0zM64 128c-35.3 0-64 28.7-64 64L0 448c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-16-64 0 0 16-192 0 0-256 16 0 0-64-16 0z"/>
                    </svg>
                </button>
            </div>
        </div>
    `,
                        confirmText: '下一步',
                        cancelText: '取消',
                        didOpen: async (popup) => {
                            // 1. 更新链接到用户主页
                            const link = popup.querySelector('#luoguLink');
                            if (link && wizardData.uid) {
                                link.href = `https://www.luogu.com.cn/user/${wizardData.uid}`;
                                link.textContent = `前往 ${wizardData.uid} 的个人中心`;
                            }

                            // 2. 生成验证码
                            try {
                                const token = (await supabase.auth.getSession()).data.session?.access_token;
                                if (!token) throw new Error('未登录');
                                const res = await fetch(
                                    'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-luogu/generate',
                                    {
                                        method: 'GET',
                                        headers: { 'Authorization': 'Bearer ' + token }
                                    }
                                );
                                if (!res.ok) {
                                    const errData = await res.json();
                                    throw new Error(errData.error || '生成验证码失败');
                                }
                                const data = await res.json();
                                wizardData.challenge = data.challenge;

                                const display = popup.querySelector('#challengeDisplay');
                                if (display) {
                                    display.textContent = `Jason227_${data.challenge}`;
                                }

                                // 3. 【仅保留】点击复制按钮复制 → 使用 Toast
                                const copyBtn = popup.querySelector('#challengeCopyBtn');
                                if (copyBtn) {
                                    copyBtn.onclick = (e) => {
                                        e.stopPropagation();
                                        const code = display?.textContent;
                                        if (code && code !== '⏳ 生成中...') {
                                            navigator.clipboard?.writeText(code)
                                                .then(() => showCopyToast())
                                                .catch(() => {
                                                    const range = document.createRange();
                                                    range.selectNode(display);
                                                    window.getSelection().removeAllRanges();
                                                    window.getSelection().addRange(range);
                                                    document.execCommand('copy');
                                                    showCopyToast();
                                                });
                                        }
                                    };
                                }
                            } catch (err) {
                                Swal.showValidationMessage('生成验证码失败: ' + err.message);
                            }
                        },
                        preConfirm: () => {
                            if (!wizardData.challenge) {
                                Swal.showValidationMessage('验证码尚未生成，请稍后重试');
                                return false;
                            }
                            return true;
                        }
                    },

                    // ========== 第 4 步：图形验证码 ==========
                    {
                        title: '图形验证码',
                        html: `
        <div>
            <div style="display:flex; align-items:center; justify-content:center;">
                <canvas id="captchaCanvas" width="120" height="44" style="border:1px solid #ddd; border-radius:6px; background:#f9fafb; cursor:pointer;"></canvas>
            </div>
        </div>
    `,
                        input: 'text',
                        didOpen: (popup) => {
                            const canvas = popup.querySelector('#captchaCanvas');

                            function refresh() {
                                captchaCode = generateCaptcha();
                                if (canvas) drawCaptcha(canvas, captchaCode);
                            }

                            refresh();

                            // 点击图片刷新
                            if (canvas) {
                                canvas.addEventListener('click', refresh);
                            }
                        },
                        preConfirm: () => {
                            const input = Swal.getInput();
                            if (!input) {
                                Swal.showValidationMessage('请输入图形验证码');
                                return false;
                            }
                            const value = input.value.trim().toUpperCase();
                            if (!value) {
                                Swal.showValidationMessage('请输入图形验证码');
                                return false;
                            }
                            if (value !== captchaCode) {
                                Swal.showValidationMessage('图形验证码错误');
                                const canvas = document.getElementById('captchaCanvas');
                                if (canvas) {
                                    captchaCode = generateCaptcha();
                                    drawCaptcha(canvas, captchaCode);
                                }
                                if (input) input.value = '';
                                return false;
                            }
                            return true;
                        }
                    }
                ];

                // 递归显示步骤
                function showStep(stepIndex) {
                    if (stepIndex >= steps.length) {
                        performBind();
                        return;
                    }

                    const step = steps[stepIndex];

                    // 构建配置对象
                    const config = {
                        title: step.title,
                        showCancelButton: true,
                        confirmButtonText: step.confirmText || '下一步',
                        cancelButtonText: step.cancelText || '取消',
                        confirmButtonColor: '#E74C3C',
                        cancelButtonColor: '#BFBFBF',
                        progressSteps: ['1', '2', '3', '4'],
                        currentProgressStep: stepIndex,
                        preConfirm: step.preConfirm || (() => true),
                        allowOutsideClick: false,
                        allowEscapeKey: false
                    };

                    // 条件添加参数
                    if (step.html) config.html = step.html;
                    if (step.text) config.text = step.text;
                    if (step.input) {
                        config.input = step.input;
                        if (step.inputPlaceholder) config.inputPlaceholder = step.inputPlaceholder;
                        if (step.inputAttributes) config.inputAttributes = step.inputAttributes;
                    }
                    if (step.didOpen) config.didOpen = step.didOpen;

                    Swal.fire(config).then((result) => {
                        if (result.isConfirmed) {
                            showStep(stepIndex + 1);
                        }
                    });
                }

                // 执行最终绑定（和第 3 步时一样，保持不变）
                async function performBind() {
                    try {
                        const token = (await supabase.auth.getSession()).data.session?.access_token;
                        if (!token) throw new Error('未登录');

                        const res = await fetch(
                            'https://nosikdfacxkuaxfrmoqn.supabase.co/functions/v1/verify-luogu/verify',
                            {
                                method: 'POST',
                                headers: {
                                    'Authorization': 'Bearer ' + token,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    luogu_uid: wizardData.uid
                                })
                            }
                        );
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || '绑定失败');

                        if (data.profile) {
                            currentProfile = { ...currentProfile, ...data.profile };
                        } else {
                            currentProfile = await getProfile(currentUser.id);
                        }
                        renderLuoguBind();

                        Swal.fire({
                            icon: 'success',
                            title: '绑定成功',
                            showConfirmButton: false,
                            timer: 1000
                        });
                    } catch (err) {
                        Swal.fire({
                            icon: 'error',
                            title: err.message,
                            confirmButtonColor: '#E74C3C',
                            confirmButtonText: '确定',
                        });
                    }
                }

                showStep(0);
            }

            // ==============================================================
            // 5. 事件委托（动态按钮）
            // ==============================================================
            const statusContainer = document.getElementById('luoguBindStatus');
            if (statusContainer) {
                statusContainer.addEventListener('click', function (e) {
                    const target = e.target;
                    if (target.id === 'startBindBtn') {
                        startBindWizard();
                    } else if (target.id === 'unbindLuoguBtn') {
                        // 使用 SweetAlert2 确认弹窗
                        Swal.fire({
                            title: '真的要解绑洛谷的账号吗？',
                            icon: 'info',
                            showCancelButton: true,
                            confirmButtonColor: '#E74C3C',
                            cancelButtonColor: '#BFBFBF',
                            confirmButtonText: '要！',
                            cancelButtonText: '算了'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                // 执行解绑
                                (async function () {
                                    try {
                                        const { error } = await supabase
                                            .from('profiles')
                                            .update({ luogu_uid: null, luogu_username: null, luogu_bind_time: null })
                                            .eq('id', currentUser.id);
                                        if (error) throw error;
                                        currentProfile = await getProfile(currentUser.id);
                                        renderLuoguBind();
                                        // 解绑成功提示
                                        Swal.fire({
                                            icon: 'success',
                                            title: '解绑成功',
                                            showConfirmButton: false,
                                            timer: 1000
                                        });
                                    } catch (err) {
                                        // 解绑失败提示
                                        Swal.fire({
                                            icon: 'error',
                                            title: err.message,
                                            confirmButtonColor: '#E74C3C',
                                            confirmButtonText: '确定',
                                        });
                                    }
                                })();
                            }
                        });
                    }
                });
            }

            // ==============================================================
            // 6. 更新 UI
            // ==============================================================
            async function updateUI() {
                try {
                    var { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        currentUser = session.user;
                        localStorage.removeItem('luogu_bind_status');

                        currentProfile = await getProfile(session.user.id);
                        if (currentProfile) {
                            var { data: banData, error: banErr } = await supabase
                                .from('profiles')
                                .select('is_banned')
                                .eq('id', session.user.id)
                                .single();
                            if (!banErr && banData && banData.is_banned === true) {
                                await supabase.auth.signOut();
                                location.reload();
                                return;
                            }
                        }

                        var displayName = currentProfile?.username || session.user.email || '用户';
                        var html = '';
                        if (currentProfile?.user_number) {
                            html += '<a href="/user/' + currentProfile.user_number + '" class="user-email">' +
                                escapeHtmlAttr(displayName) + '</a>';
                        } else {
                            html += '<span class="user-email">' + escapeHtmlAttr(displayName) + '</span>';
                        }
                        html +=
                            '<a href="/user/notification" class="bell-icon" style="color:#666;"><svg class="svg-inline--fa fa-bell" viewBox="0 0 448 512" width="20" height="20"><path fill="currentColor" d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z"></path></svg><sup id="bell-badge" style="background-color:#e74c3c; display:none;">0</sup></a>';
                        html += '<button id="logoutBtn" class="auth-btn logout">登出</button>';
                        authButtons.innerHTML = html;
                        document.getElementById('logoutBtn')?.addEventListener('click', async function () {
                            await supabase.auth.signOut();
                            location.reload();
                        });

                        await loadAvatarData();
                        await fetchUnreadCount();
                        startUnreadPolling();

                        renderLuoguBind();
                    } else {
                        window.location.href = '/login';
                        return;
                    }
                } catch (err) {
                    console.error(err);
                    authButtons.innerHTML =
                        '<a href="/auth/login" class="auth-btn">登录</a><a href="/auth/register" class="auth-btn">注册</a>';
                }
            }

            // ==============================================================
            // 7. 侧边栏滚动重置
            // ==============================================================
            const sidebar = document.querySelector('.nav-sidebar');
            if (sidebar) {
                sidebar.addEventListener('mouseleave', function () {
                    if (window.innerWidth > 900) {
                        this.scrollTop = 0;
                    }
                });
            }

            // ==============================================================
            // 8. 启动
            // ==============================================================
            updateUI();

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible' && currentProfile) {
                    fetchUnreadCount();
                }
            });

        })();
    </script>

</body>
